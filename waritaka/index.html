        debtors.sort(function (a, b) { return b.amount - a.amount; });

        const creditor = creditors[0];
        const debtor = debtors[0];
        const amount = Math.min(creditor.amount, debtor.amount);

        if (amount > 0) {
          plan.push({ fromId: debtor.id, toId: creditor.id, amount: amount });
        }

        creditor.amount -= amount;
        debtor.amount -= amount;

        // 精算し切った側をリストから除外する。
        if (creditor.amount === 0) creditors.shift();
        if (debtor.amount === 0) debtors.shift();
      }

      return plan;
    }

    // 競合解決（Expense 単位の後着優先 / キー単位マージ）。要件 6.4, 6.5。
    // 同期バックエンドは expenses/{id} をキー単位で書き込み後着優先（LWW）を実現するが、
    // その「後着優先かつキー単位で両立する」マージ規則自体を純粋関数として切り出し、
    // 決定的・副作用なしで検証・再利用できるようにする（design.md「競合解決」）。
    // - 同一 id を持つ複数版がある場合、updatedAt が大きい（後着の）版を採用する（要件 6.4）。
    //   updatedAt が同値のときは後から与えられた版（incoming 側）を採用する（決定的な同着規則）。
    // - 異なる id の更新はいずれも保持する（要件 6.5）。
    // 入力の配列自体は変更しない（採用された Expense の参照をそのまま返す）。
    // 戻り値: Expense[]（id ごとに 1 件、入力に現れた順序を保持）
    function mergeExpenses(baseExpenses, incomingExpenses) {
      const byId = new Map();
      function consider(e) {
        if (!e || typeof e.id !== 'string' || e.id.length === 0) return;
        const at = (typeof e.updatedAt === 'number') ? e.updatedAt : 0;
        const existing = byId.get(e.id);
        if (existing === undefined) {
          byId.set(e.id, e);
          return;
        }
        const existingAt = (typeof existing.updatedAt === 'number') ? existing.updatedAt : 0;
        // 後から与えられた版が同着以上なら置き換える（後着優先・要件 6.4）。
        if (at >= existingAt) byId.set(e.id, e);
      }
      (Array.isArray(baseExpenses) ? baseExpenses : []).forEach(consider);
      (Array.isArray(incomingExpenses) ? incomingExpenses : []).forEach(consider);
      return Array.from(byId.values());
    }

    // 1 件の Line（立替）入力の検証。戻り値: { valid: boolean, errors: string[] }
    // 要件 3.2, 3.3, 4.3, 4.6。line は amount/participants/splitMethod/splitConfig を持つ。
    function validateLine(line, group) {
      const errors = [];
      const data = line || {};

      // 金額: 正の整数（最小通貨単位）であること（要件 3.2）。
      const amount = data.amount;
      if (!Number.isFinite(amount) || Math.round(amount) !== amount || amount <= 0) {
        errors.push('金額は正の数で入力してください。');
      }

      // Participant: 1 名以上であること（要件 3.3）。
      const participants = Array.isArray(data.participants) ? data.participants : [];
      if (participants.length === 0) {
        errors.push('対象者を 1 名以上選んでください。');
      }

      const config = data.splitConfig || {};

      // パーセンテージ割: 参加者の比率合計が 100% であること（要件 4.3）。
      if (data.splitMethod === 'percentage' && participants.length > 0) {
        const percents = config.percents || {};
        let sum = 0;
        participants.forEach(function (id) {
          const p = percents[id];
          if (Number.isFinite(p)) sum += p;
        });
        if (sum !== 100) {
          errors.push('比率の合計を 100% にしてください。');
        }
      }

      // 金額指定割: 参加者の指定額合計が金額と一致すること（要件 4.6）。
      if (data.splitMethod === 'amount' && participants.length > 0) {
        const amounts = config.amounts || {};
        let sum = 0;
        participants.forEach(function (id) {
          const a = amounts[id];
          if (Number.isFinite(a)) sum += Math.round(a);
        });
        if (Number.isFinite(amount) && Math.round(amount) === amount && amount > 0 && sum !== amount) {
          errors.push('金額の合計を立替額に一致させてください。');
        }
      }

      return { valid: errors.length === 0, errors: errors };
    }

    // Expense（題目）入力の検証。戻り値: { valid: boolean, errors: string[] }
    // - title は任意（空可）。
    // - currency は指定される場合は CURRENCIES に存在すること（未指定は既定補完に委ねる・要件 20.2）。
    // - lines は 1 件以上。各 line を validateLine で検証し、1 件でも無効なら valid=false・errors 集約。
    function validateExpense(input, group) {
      const errors = [];
      const data = input || {};

      // Currency: 指定される場合は CURRENCIES に存在すること（要件 20.2）。
      if (data.currency != null && data.currency !== '') {
        if (typeof data.currency !== 'string' || !CURRENCIES[data.currency]) {
          errors.push('通貨が不正です。');
        }
      }

      // lines は 1 件以上（変更2）。
      const lines = Array.isArray(data.lines) ? data.lines : [];
      if (lines.length === 0) {
        errors.push('立替を 1 件以上入力してください。');
      }

      // 各 line を検証し、エラーを集約する（重複メッセージは 1 つにまとめる）。
      const seen = Object.create(null);
      lines.forEach(function (line) {
        const r = validateLine(line, group);
        if (!r.valid) {
          r.errors.forEach(function (msg) {
            if (!seen[msg]) { seen[msg] = true; errors.push(msg); }
          });
        }
      });

      return { valid: errors.length === 0, errors: errors };
    }

    // Member 追加の検証（空名・重複名）。戻り値: { valid, errors[] }（要件 1.4）
    function validateNewMember(name, group) {
      const errors = [];
      const trimmed = (name == null ? '' : String(name)).trim();

      // 空名の禁止。
      if (trimmed === '') {
        errors.push('名前を入力してください。');
      } else {
        // 同一 Group 内での名前重複の禁止（要件 1.4）。
        const members = group && Array.isArray(group.members) ? group.members : [];
        const duplicate = members.some(function (m) {
          return m && m.name != null && String(m.name).trim() === trimmed;
        });
        if (duplicate) {
          errors.push('その名前は既に使われています。');
        }
      }

      return { valid: errors.length === 0, errors: errors };
    }

    // 指定 Member がいずれかの Expense の Payer または Participant として使われているかを
    // 判定する純粋関数（副作用なし・決定的、要件 1.6）。true の場合は削除できない。
    // removeMember（SECTION 6）の削除可否判定はこの関数に委譲する（挙動不変）。
    function isMemberInUse(group, memberId) {
      if (!group || memberId == null) return false;
      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      return expenses.some(function (expense) {
        if (!expense) return false;
        const lines = Array.isArray(expense.lines) ? expense.lines : [];
        return lines.some(function (line) {
          if (!line) return false;
          if (line.payerId === memberId) return true;
          return Array.isArray(line.participants)
            && line.participants.indexOf(memberId) !== -1;
        });
      });
    }

    // メンバー名の集合（順序非依存）を表す正規化キーを返す純粋関数（要件 17.1）。
    // 空名を除き、同一構成内の重複名を先勝ちで 1 つにまとめ、集合として比較できるよう
    // ソートして連結する。重複メンバー構成の検出に用いる。副作用なし・決定的。
    function memberSetKey(names) {
      const list = Array.isArray(names) ? names : [];
      const seen = Object.create(null);
      const cleaned = [];
      list.forEach(function (n) {
        const name = (n == null ? '' : String(n)).trim();
        if (name === '') return;
        if (seen[name]) return;
        seen[name] = true;
        cleaned.push(name);
      });
      // 集合として同一なら順序に依らず一致させるためソートして連結（区切りは NUL）。
      return cleaned.slice().sort().join('\u0000');
    }

    // メンバー再利用候補（Member_Template）を正規化して重複構成を 1 件にまとめる純粋関数（要件 17.1）。
    // 入力: Array<{ id, members:string[], source }> 相当。各要素につき
    //   - メンバー名を trim し、空名を除外、同一構成内の重複名は先勝ちで 1 つにまとめる、
    //   - メンバーが 1 名以上のものだけを候補にする、
    //   - 同一メンバー集合（順序非依存）は最初に現れた 1 件へまとめる（重複提示を避ける）。
    // 副作用なし・決定的。戻り値: Array<{ id, members:string[], source }>
    function normalizeMemberTemplates(sources) {
      const list = Array.isArray(sources) ? sources : [];
      const out = [];
      const seenKeys = Object.create(null);
      list.forEach(function (src, index) {
        if (!src || typeof src !== 'object') return;
        const rawMembers = Array.isArray(src.members) ? src.members : [];
        const members = [];
        const seenNames = Object.create(null);
        rawMembers.forEach(function (n) {
          const name = (n == null ? '' : String(n)).trim();
          if (name === '') return;                 // 空名は除外（要件 17.4）
          if (seenNames[name]) return;             // 同一構成内の重複名は先勝ち（要件 17.4）
          seenNames[name] = true;
          members.push(name);
        });
        if (members.length === 0) return;          // 実質空の構成は候補にしない
        const key = memberSetKey(members);
        if (seenKeys[key]) return;                 // 同一メンバー集合は重複提示しない（要件 17.1）
        seenKeys[key] = true;
        out.push({
          id: (typeof src.id === 'string' && src.id.length > 0) ? src.id : ('tpl-' + index),
          members: members,
          source: typeof src.source === 'string' ? src.source : '',
        });
      });
      return out;
    }

    // 特定 Member の内訳（要件 7.5）。戻り値: { paid, owed, balance }
    // paid=立替総額, owed=負担総額, balance=paid-owed。computeSplit を再利用する。
    function memberSummary(group, memberId) {
      let paid = 0;
      let owed = 0;
      if (!group || memberId == null) {
        return { paid: 0, owed: 0, balance: 0 };
      }

      // 多通貨 Group では Base_Currency 建てで内訳を集計する（要件 20.4）。
      // 単一通貨・換算不要時は金額が変わらないため従来と同じ結果になる。
      const baseGroup = toBaseCurrencyGroup(group);
      const expenses = Array.isArray(baseGroup.expenses) ? baseGroup.expenses : [];
      expenses.forEach(function (expense) {
        if (!expense) return;
        const lines = Array.isArray(expense.lines) ? expense.lines : [];
        lines.forEach(function (line) {
          if (!line) return;

          const shares = computeSplit(line);

          // 立替: この Member が line の Payer の場合、配分合計（＝line 額）を立て替えている。
          if (line.payerId === memberId) {
            shares.forEach(function (amount) { paid += amount; });
          }

          // 負担: この Member への配分額を負担総額に加算する。
          if (shares.has(memberId)) {
            owed += shares.get(memberId);
          }
        });
      });

      return { paid: paid, owed: owed, balance: paid - owed };
    }

    // Category ごとの合計と総額（要件 7.4）。戻り値: { total, byCategory: Map }
    // category が null/未指定の場合は 'その他' キーで集計する。
    function totals(group) {
      let total = 0;
      const byCategory = new Map();
      if (!group) return { total: 0, byCategory: byCategory };

      // 多通貨 Group では Base_Currency 建てで総額・Category 別合計を集計する（要件 20.4）。
      // 単一通貨・換算不要時は金額が変わらないため従来と同じ結果になる。
      const baseGroup = toBaseCurrencyGroup(group);
      const expenses = Array.isArray(baseGroup.expenses) ? baseGroup.expenses : [];
      expenses.forEach(function (expense) {
        if (!expense) return;
        // Expense（題目）の金額は全 line の合計（変更2）。
        const lines = Array.isArray(expense.lines) ? expense.lines : [];
        let amount = 0;
        lines.forEach(function (line) {
          if (line && Number.isFinite(line.amount)) amount += Math.round(line.amount);
        });
        total += amount;

        // Category は Expense（題目）単位。
        const category = (expense.category == null || expense.category === '')
          ? 'その他'
          : expense.category;
        byCategory.set(category, (byCategory.get(category) || 0) + amount);
      });

      return { total: total, byCategory: byCategory };
    }

    // --- 多通貨・為替換算（要件 20.2, 20.3, 20.4, 20.6・すべて純粋関数） ---
    // 金額は各 Expense の Currency の最小通貨単位整数で保持し、換算は精算計算時にのみ
    // Base_Currency の最小通貨単位整数へ丸める（design.md「金額の扱い / 為替換算の丸め方針」）。

    // Group から Base_Currency コードを決定する（既定は currency → DEFAULT_CURRENCY）。
    function baseCurrencyOf(group) {
      if (group && typeof group.baseCurrency === 'string' && group.baseCurrency.length > 0) {
        return group.baseCurrency;
      }
      if (group && typeof group.currency === 'string' && group.currency.length > 0) {
        return group.currency;
      }
      return DEFAULT_CURRENCY;
    }

    // from 通貨の最小通貨単位整数 amount を Base_Currency の最小通貨単位整数へ換算する。
    // rate は「1 単位の from 通貨 = rate 単位の Base 通貨」（表示単位ベースの実数）。
    // 丸め方針: amount を表示単位へ戻し rate を掛け、Base の最小単位整数へ四捨五入（決定的）。
    // from === base のときはレート不要でそのまま返す。
    // 戻り値: { ok:true, amount:int } | { ok:false, reason:'missing_rate' }
    function convertAmount(amount, fromCurrency, baseCurrency, exchangeRates) {
      const value = Number.isFinite(amount) ? Math.round(amount) : 0;
      if (fromCurrency === baseCurrency) {
        return { ok: true, amount: value };
      }
      const rates = (exchangeRates && typeof exchangeRates === 'object') ? exchangeRates : {};
      const rate = rates[fromCurrency];
      if (!Number.isFinite(rate) || rate <= 0) {
        return { ok: false, reason: 'missing_rate' };
      }
      const fromMinor = currencyOf(fromCurrency).minorUnit;
      const baseMinor = currencyOf(baseCurrency).minorUnit;
      // 表示単位（value / fromMinor）へ戻して rate を掛け、Base の最小単位整数へ丸める。
      const converted = Math.round((value / fromMinor) * rate * baseMinor);
      return { ok: true, amount: converted };
    }

    // Expense を Base_Currency 建ての金額へ換算した複製を返す（要件 20.3）。
    // 各 line の amount と金額指定割（splitConfig.amounts）の各値を換算する（変更2）。
    // from === base の場合は換算不要（currency のみ Base へ正規化した複製を返す）。
    // 戻り値: { ok:true, expense } | { ok:false, missing:[currency,...] }
    function convertExpenseToBase(expense, group) {
      if (!expense) return { ok: false, missing: [] };

      const baseCurrency = baseCurrencyOf(group);
      const fromCurrency = (typeof expense.currency === 'string' && expense.currency.length > 0)
        ? expense.currency
        : baseCurrency;
      const exchangeRates = (group && group.exchangeRates && typeof group.exchangeRates === 'object')
        ? group.exchangeRates : {};
      const lines = Array.isArray(expense.lines) ? expense.lines : [];

      // 同一通貨: 換算不要。currency のみ Base へ正規化した複製を返す。
      if (fromCurrency === baseCurrency) {
        return { ok: true, expense: Object.assign({}, expense, { currency: baseCurrency }) };
      }

      const missing = [];
      const addMissing = function (c) { if (missing.indexOf(c) === -1) missing.push(c); };

      // 各 line の amount と splitConfig.amounts を換算する。
      const convertedLines = lines.map(function (line) {
        if (!line) return line;
        const amtConv = convertAmount(line.amount, fromCurrency, baseCurrency, exchangeRates);
        if (!amtConv.ok) addMissing(fromCurrency);

        let newSplitConfig = line.splitConfig;
        const config = (line.splitConfig && typeof line.splitConfig === 'object')
          ? line.splitConfig : null;
        if (config && config.amounts && typeof config.amounts === 'object') {
          const newAmounts = {};
          Object.keys(config.amounts).forEach(function (id) {
            const conv = convertAmount(config.amounts[id], fromCurrency, baseCurrency, exchangeRates);
            if (conv.ok) {
              newAmounts[id] = conv.amount;
            } else {
              newAmounts[id] = config.amounts[id];
              addMissing(fromCurrency);
            }
          });
          newSplitConfig = Object.assign({}, config, { amounts: newAmounts });
        }

        return Object.assign({}, line, {
          amount: amtConv.ok ? amtConv.amount : line.amount,
          splitConfig: newSplitConfig,
        });
      });

      if (missing.length > 0) {
        return { ok: false, missing: missing };
      }

      const converted = Object.assign({}, expense, {
        currency: baseCurrency,
        lines: convertedLines,
      });
      return { ok: true, expense: converted };
    }

    // Group の全 Expense を Base_Currency へ換算してから既存 computeBalances を適用する（要件 20.4）。
    // 換算に必要な Exchange_Rate が 1 つでも欠ける場合は精算を確定せず不足通貨を返す（要件 20.6）。
    // 戻り値: { ok:true, balances:Map } | { ok:false, missing:[currency,...] }
    function computeBalancesInBase(group) {
      if (!group) return { ok: true, balances: new Map() };

      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const missing = [];
      const convertedExpenses = [];
      expenses.forEach(function (e) {
        const r = convertExpenseToBase(e, group);
        if (r.ok) {
          convertedExpenses.push(r.expense);
        } else {
          (r.missing || []).forEach(function (c) {
            if (missing.indexOf(c) === -1) missing.push(c);
          });
        }
      });

      if (missing.length > 0) {
        return { ok: false, missing: missing };
      }

      const baseGroup = Object.assign({}, group, { expenses: convertedExpenses });
      return { ok: true, balances: computeBalances(baseGroup) };
    }

    // Group の全 Expense を可能な範囲で Base_Currency 建てへ換算した複製 Group を返す（集計用）。
    // 換算に必要なレートが無い Expense は元の金額のまま残す（best-effort）。
    // 単一通貨・換算不要時は金額が変わらないため、memberSummary/totals は従来通りの結果になる。
    function toBaseCurrencyGroup(group) {
      if (!group) return group;
      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const converted = expenses.map(function (e) {
        const r = convertExpenseToBase(e, group);
        return r.ok ? r.expense : e;
      });
      return Object.assign({}, group, { expenses: converted });
    }

    // --- 検索・並べ替え（要件 19.2, 19.4, 7.2・すべて純粋関数・表示上のみ） ---
    // これらは表示用リストの導出にのみ用い、永続データ（元配列）は変更しない（要件 19.7）。

    // query（内容 description または Payer 名）に部分一致する Expense のみを返す（要件 19.2）。
    // - 大文字小文字を無視して部分一致で判定する。
    // - query が空文字（前後空白のみ含む）・null・undefined の場合は全件を返す。
    // - 元配列は変更せず、常に新しい配列を返す（要件 19.7）。
    // group は Payer 名の解決（payerId -> name）に用いる。
    function filterExpenses(expenses, query, group) {
      const list = Array.isArray(expenses) ? expenses : [];

      // query が空/null なら全件（新配列）を返す。
      const q = (query == null ? '' : String(query)).trim().toLowerCase();
      if (q === '') return list.slice();

      // payerId -> name の索引を作る（純粋・group 非破壊）。
      const nameById = {};
      const members = (group && Array.isArray(group.members)) ? group.members : [];
      members.forEach(function (m) {
        if (m && m.id != null) nameById[m.id] = m.name;
      });

      return list.filter(function (expense) {
        if (!expense) return false;
        // 題目（title）に部分一致するか。
        const title = (expense.title == null ? '' : String(expense.title)).toLowerCase();
        if (title.indexOf(q) !== -1) return true;
        // いずれかの line の Payer 名に部分一致するか（変更2）。
        const lines = Array.isArray(expense.lines) ? expense.lines : [];
        return lines.some(function (line) {
          if (!line) return false;
          const payerName = (nameById[line.payerId] == null ? '' : String(nameById[line.payerId])).toLowerCase();
          return payerName.indexOf(q) !== -1;
        });
      });
    }

    // sortOrder（SORT_ORDERS のいずれか）で安定ソートした新配列を返す（要件 19.4, 7.2）。
    // - 'date_desc'（既定）: 発生日時 createdAt の降順（新しい順、要件 7.2）。
    // - 'date_asc': 発生日時 createdAt の昇順。
    // - 'amount_desc' / 'amount_asc': 金額 amount の降順 / 昇順。
    // - 未知の sortOrder は既定（date_desc）にフォールバックする。
    // 元配列は変更せず、常に新しい配列を返す。同値は元の並び順を保持する（安定ソート）。
    function sortExpenses(expenses, sortOrder) {
      const list = Array.isArray(expenses) ? expenses : [];
      const order = (SORT_ORDERS.indexOf(sortOrder) !== -1) ? sortOrder : 'date_desc';

      const dateOf = function (e) { return (e && Number.isFinite(e.createdAt)) ? e.createdAt : 0; };
      // 金額は Expense（題目）の全 line 合計で比較する（変更2）。
      const amountOf = function (e) {
        const lines = (e && Array.isArray(e.lines)) ? e.lines : [];
        let sum = 0;
        lines.forEach(function (line) {
          if (line && Number.isFinite(line.amount)) sum += line.amount;
        });
        return sum;
      };

      // index を添えて比較し、同値時は元の並び順（index 昇順）を保持することで安定性を保証する。
      const decorated = list.map(function (e, i) { return { e: e, i: i }; });
      decorated.sort(function (a, b) {
        let diff = 0;
        switch (order) {
          case 'date_asc': diff = dateOf(a.e) - dateOf(b.e); break;
          case 'amount_desc': diff = amountOf(b.e) - amountOf(a.e); break;
          case 'amount_asc': diff = amountOf(a.e) - amountOf(b.e); break;
          case 'date_desc':
          default: diff = dateOf(b.e) - dateOf(a.e); break;
        }
        if (diff !== 0) return diff;
        return a.i - b.i; // 安定ソート: 同値は元順を維持
      });

      return decorated.map(function (d) { return d.e; });
    }

    /* 「まとめて入力」モード撤去（変更4）に伴い applyCommonToBulk / buildBulkExpenses を削除。
       領収書 OCR 撤去（変更1）に伴い parseReceiptText を削除。 */


    // selectedIds（Set | 配列 | null | undefined）を id の Set へ正規化する内部ヘルパー。
    // Set はそのまま返す（読み取り専用に用いる）。配列は新しい Set 化。それ以外は空集合。
    function toIdSet(selectedIds) {
      if (selectedIds instanceof Set) return selectedIds;
      if (Array.isArray(selectedIds)) return new Set(selectedIds);
      return new Set();
    }

    // 選択集合（Expense id の Set または配列）に含まれる Expense を除去した新しい配列を返す
    // 純粋関数（要件 14.2 / design.md Property 20）。副作用なし・入力配列や要素を変更しない。
    // 非選択の Expense は同一参照のまま入力順を保って保持する。selectedIds が空/未指定なら
    // 元と同一内容の新しい配列を返す。
    function removeSelectedExpenses(expenses, selectedIds) {
      const list = Array.isArray(expenses) ? expenses : [];
      const selected = toIdSet(selectedIds);
      const result = [];
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        const id = e ? e.id : undefined;
        if (selected.has(id)) continue;
        result.push(e);
      }
      return result;
    }

    // 選択集合の Expense に共通項目（Category / Payer / Split_Method）を適用した新しい配列を
    // 返す純粋関数（要件 14.5 / design.md Property 21）。副作用なし・入力配列や要素を変更しない。
    // - field: 'category' | 'payerId' | 'splitMethod' のいずれか。それ以外は無視し、元と同一内容
    //   の新しい配列を返す。
    // - 選択された Expense は当該フィールドのみを value に差し替えた「新しい Expense オブジェクト」
    //   に置換する。非選択は同一参照のまま入力順を保って保持する。
    // 新モデル（変更2）では field により適用先が異なる:
    // - 'category' は Expense（題目）直下を差し替える。
    // - 'payerId' / 'splitMethod' は Expense の全 line に適用する（各 line を新オブジェクトに置換）。
    function applyCommonEditToExpenses(expenses, selectedIds, field, value) {
      const list = Array.isArray(expenses) ? expenses : [];
      const EDITABLE = ['category', 'payerId', 'splitMethod'];
      if (EDITABLE.indexOf(field) === -1) {
        return list.slice();
      }
      const selected = toIdSet(selectedIds);
      return list.map(function (e) {
        if (!e || !selected.has(e.id)) return e;
        if (field === 'category') {
          return Object.assign({}, e, { category: value });
        }
        // payerId / splitMethod は全 line に適用する。
        const lines = (Array.isArray(e.lines) ? e.lines : []).map(function (line) {
          const copy = Object.assign({}, line);
          copy[field] = value;
          return copy;
        });
        return Object.assign({}, e, { lines: lines });
      });
    }

    // ---- 支払済みチェック（要件 16・design.md Property 24, 25） ----

    // Settlement_Transfer の同定キー（送金元・送金先・金額）を生成する純粋関数（要件 16.8）。
    // Settlement_Plan は Balance から毎回再計算される派生値のため、Payment_Status は送金内容を
    // キーに group.settlements へ保存し、再計算後も同一送金へ再適用する。
    // 戻り値: `${fromId}|${toId}|${amount}` 形式の文字列。
    function transferKey(transfer) {
      const t = transfer || {};
      return String(t.fromId) + '|' + String(t.toId) + '|' + String(t.amount);
    }

    // 再計算後の Settlement_Plan に、保存済み settlements の Payment_Status を再適用する
    // 純粋関数（要件 16.1, 16.8 / design.md Property 24）。副作用なし・入力を変更しない。
    // - plan: Array<{ fromId, toId, amount }>（computeSettlement の結果など）。
    // - savedSettlements: { [transferKey]: 'unpaid' | 'paid' }。空/未指定なら全送金が unpaid。
    // - 各 transfer に key と status を付与した「新しい配列」を返す（元の各 transfer は変更しない）。
    //   保存値が PAYMENT_STATUS 以外・キー未登録の場合は unpaid とする。
    function reconcilePaymentStatus(plan, savedSettlements) {
      const list = Array.isArray(plan) ? plan : [];
      const saved = (savedSettlements && typeof savedSettlements === 'object') ? savedSettlements : {};
      return list.map(function (transfer) {
        const key = transferKey(transfer);
        const savedStatus = saved[key];
        const status = (savedStatus === PAYMENT_STATUS.PAID) ? PAYMENT_STATUS.PAID : PAYMENT_STATUS.UNPAID;
        return Object.assign({}, transfer, { key: key, status: status });
      });
    }

    // 支払状態付き Settlement_Plan から Payment_Status が paid の送金を除いた Remaining_Settlement を
    // 返す純粋関数（要件 16.4 / design.md Property 25）。副作用なし・入力を変更しない。
    // - reconciledPlan: reconcilePaymentStatus の結果（status を持つ transfer 配列）。
    // - status が paid のものを除いた「新しい配列」を返す（残りは unpaid のみ）。
    function remainingSettlement(reconciledPlan) {
      const list = Array.isArray(reconciledPlan) ? reconciledPlan : [];
      return list.filter(function (transfer) {
        return !(transfer && transfer.status === PAYMENT_STATUS.PAID);
      });
    }

    // Settlement_Plan を人間可読な平文テキスト（Settlement_Share_Text）へ整形する純粋関数
    // （要件 18.1, 18.4, 18.5 / design.md Property 26）。副作用なし・決定的（同一入力→同一出力）。
    // - group: メンバー名解決（id→name）と Base_Currency（baseCurrencyOf）に用いる。
    // - reconciledPlan: reconcilePaymentStatus の結果（{ fromId, toId, amount, key, status }）を想定。
    //   status を持たない素の plan（{ fromId, toId, amount }）も unpaid として防御的に扱う。
    // 出力仕様:
    //   - 各送金行に「送金元名 → 送金先名: 金額」を含める（要件 18.1）。金額は Base_Currency で整形。
    //   - 送金が 1 件も無い場合は「送金は不要です。」を含める（要件 18.4）。
    //   - 支払済み（paid）の送金が 1 件以上存在する場合は、未払い（Remaining_Settlement）と
    //     支払済みを見出しで区別して列挙する（要件 18.5）。paid が無い場合は単純な一覧にする。
    function formatSettlementShareText(group, reconciledPlan) {
      // id→name の索引を CORE 内で自己完結的に構築する（DOM 非依存・純粋）。
      const nameById = {};
      const members = Array.isArray(group && group.members) ? group.members : [];
      members.forEach(function (m) {
        if (m && m.id != null) nameById[m.id] = (typeof m.name === 'string' ? m.name : String(m.name));
      });
      const nameOf = function (id) {
        const n = nameById[id];
        return (typeof n === 'string' && n.length > 0) ? n : '不明';
      };

      const currency = baseCurrencyOf(group);
      const groupName = (group && typeof group.name === 'string' && group.name.length > 0)
        ? group.name : '';
      const header = (groupName.length > 0 ? groupName + ' の精算結果' : '精算結果');

      const list = Array.isArray(reconciledPlan) ? reconciledPlan : [];

      // 送金が存在しない場合は「送金不要」を明示する（要件 18.4）。
      if (list.length === 0) {
        return header + '\n\n送金は不要です。';
      }

      const lineOf = function (t) {
        const from = nameOf(t && t.fromId);
        const to = nameOf(t && t.toId);
        const amt = formatAmount(t && t.amount, currency);
        return '・' + from + ' → ' + to + ': ' + amt;
      };

      // status を持たない素の transfer は unpaid とみなす（防御的）。
      const paidList = list.filter(function (t) { return t && t.status === PAYMENT_STATUS.PAID; });
      const unpaidList = list.filter(function (t) { return !(t && t.status === PAYMENT_STATUS.PAID); });

      // 支払済みが存在しない場合は単純な送金一覧を出力する。
      if (paidList.length === 0) {
        return header + '\n\n' + list.map(lineOf).join('\n');
      }

      // 支払済みが存在する場合は、未払い（Remaining_Settlement）と支払済みを区別して整形する（要件 18.5）。
      const parts = [header, ''];
      parts.push('未払い（残り' + unpaidList.length + '件）');
      if (unpaidList.length === 0) {
        parts.push('・なし');
      } else {
        unpaidList.forEach(function (t) { parts.push(lineOf(t)); });
      }
      parts.push('');
      parts.push('支払済み（' + paidList.length + '件）');
      paidList.forEach(function (t) { parts.push(lineOf(t)); });
      return parts.join('\n');
    }


    /* =====================================================================
     * SECTION 5: RENDER（描画層）
     * design.md「Render 層」準拠。state を読んで #screen 等へ innerHTML 出力。
     * ===================================================================== */

    // ユーザー入力（グループ名・メンバー名など）を innerHTML へ埋め込む際の
    // HTML インジェクション対策。&, <, >, ", ' をエスケープする。
    function escapeHtml(value) {
      const s = value == null ? '' : String(value);
      return s.replace(/[&<>"']/g, function (ch) {
        switch (ch) {
          case '&': return '&amp;';
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '"': return '&quot;';
          case "'": return '&#39;';
          default: return ch;
        }
      });
    }

    // #screen へ HTML を差し込むヘルパー（描画ターゲットの一元化）。
    function setScreen(html) {
      const screen = document.getElementById('screen');
      if (screen) screen.innerHTML = html;
    }

    // #action-bar を空にする（一覧・作成・not-found 画面では主要 CTA を出さない）。
    function clearActionBar() {
      const bar = document.getElementById('action-bar');
      if (bar) {
        bar.classList.remove('tab-bar');
        bar.innerHTML = '';
      }
    }

    // 現在の state に応じて適切な画面を描画するルート描画関数。
    // 優先順: notFound → 経費画面（currentGroupId）→ 一覧（groupOrder 非空）→ 作成フォーム。
    function render() {
      // オフラインバナーの表示状態を反映する（要件 8.4）。
      renderOfflineBanner();

      if (state.notFound) {
        clearActionBar();
        renderGroupNotFound();
        return;
      }

      if (state.currentGroupId) {
        // 経費画面は task 7.2 で実装（本タスクではディスパッチのみ）。
        renderExpenseScreen();
        return;
      }

      const hasGroups = Array.isArray(state.groupOrder) && state.groupOrder.length > 0;
      if (hasGroups && !state.showCreate) {
        clearActionBar();
        renderGroupList();
        return;
      }

      clearActionBar();
      renderCreateGroup();
    }

    // 参加/作成した Group 一覧（要件 2.5）。
    // state.groupOrder の順で各 Group を表示し、項目クリックで経費画面へ遷移する。
    function renderGroupList() {
      const order = Array.isArray(state.groupOrder) ? state.groupOrder : [];

      const items = order.map(function (id) {
        const group = state.groups[id];
        if (!group) return '';
        const memberCount = Array.isArray(group.members) ? group.members.length : 0;
        // onclick で経費画面へ遷移（location.hash 経由・要件 2.5）。id は UUID なので安全。
        return (
          '<li class="group-list-item card" role="button" tabindex="0"' +
          ' onclick="goToGroup(\'' + escapeHtml(id) + '\')"' +
          ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();goToGroup(\'' + escapeHtml(id) + '\');}">' +
          '<span class="group-list-main">' +
          '<span class="group-list-name">' + escapeHtml(group.name) + '</span>' +
          '<span class="group-list-meta"><i class="fa-solid fa-user-group" aria-hidden="true"></i> ' +
          'メンバー ' + memberCount + ' 人</span>' +
          '</span>' +
          '<button class="btn btn--ghost group-list-leave" type="button"' +
          ' aria-label="このグループを一覧から消す"' +
          ' onclick="event.stopPropagation(); leaveGroup(\'' + escapeHtml(id) + '\')">' +
          '<i class="fa-solid fa-xmark" aria-hidden="true"></i></button>' +
          '</li>'
        );
      }).join('');

      const listHtml = items
        ? '<ul class="group-list">' + items + '</ul>'
        : '<p class="empty-note">表示できるグループがありません。</p>';

      setScreen(
        '<section class="fade-in">' +
        '<h2 class="screen-title">グループ一覧</h2>' +
        listHtml +
        '<button class="btn btn--primary create-cta" onclick="showCreateForm()">' +
        '<i class="fa-solid fa-plus" aria-hidden="true"></i> 新しいグループを作成</button>' +
        '</section>'
      );
    }

    // グループ作成フォーム（要件 1.1, 1.2）。
    // グループ名入力 + 複数メンバー名入力（最低 1 名）。送信で createGroup を呼ぶ。
    function renderCreateGroup() {
      const hasGroups = Array.isArray(state.groupOrder) && state.groupOrder.length > 0;

      // 一覧が存在する場合のみ「一覧へ戻る」導線を出す。
      const backLink = hasGroups
        ? '<button class="btn btn--ghost" onclick="backToList()">' +
          '<i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 一覧へ戻る</button>'
        : '';

      setScreen(
        '<section class="fade-in">' +
        '<h2 class="screen-title">新しいグループ</h2>' +
        '<div class="card">' +

        // グループ名（必須・要件 1.2 のエラー表示領域を用意）
        '<div class="field">' +
        '<label for="cg-name">グループ名</label>' +
        '<input id="cg-name" type="text" autocomplete="off" placeholder="例: 沖縄旅行" />' +
        '<div class="field-error" id="cg-name-error" role="alert"></div>' +
        '</div>' +

        // メンバーテンプレートの提示先（renderMemberTemplatePicker が埋める・0 件なら空・要件 17.1, 17.5）
        '<div id="cg-template-picker"></div>' +

        // メンバー名（複数入力・最低 1 名）
        '<div class="field">' +
        '<label>メンバー（最低 1 名）</label>' +
        '<div id="cg-members">' + memberRowHtml() + '</div>' +
        '<button class="btn btn--ghost add-member" type="button" onclick="addMemberRow()">' +
        '<i class="fa-solid fa-user-plus" aria-hidden="true"></i> メンバーを追加</button>' +
        '<div class="field-error" id="cg-members-error" role="alert"></div>' +
        '</div>' +

        '<button class="btn btn--primary" type="button" onclick="handleCreateGroupSubmit()">' +
        '<i class="fa-solid fa-check" aria-hidden="true"></i> グループを作成</button>' +
        '</div>' +
        backLink +
        '</section>'
      );

      // メンバーテンプレートを提示する（0 件なら何も描画せず通常入力を継続・要件 17.1, 17.5）。
      renderMemberTemplatePicker();
    }

    // 作成フォームにメンバーテンプレート（Member_Template）を提示する（要件 17.1, 17.5）。
    // listMemberTemplates() が 0 件を返すときはコンテナを空にして通常入力を継続する。
    // 1 件以上のときは各テンプレートを選択ボタンとして描画し、タップで applyMemberTemplate を呼ぶ。
    function renderMemberTemplatePicker() {
      const container = document.getElementById('cg-template-picker');
      if (!container) return;

      const templates = listMemberTemplates();
      if (!templates || templates.length === 0) {
        container.innerHTML = ''; // 提示しない（要件 17.5）
        return;
      }

      const items = templates.map(function (t) {
        const preview = t.members.map(escapeHtml).join('、');
        const count = t.members.length;
        return (
          '<button type="button" class="btn btn--ghost member-template-item"' +
          ' onclick="applyMemberTemplate(\'' + escapeHtml(t.id) + '\')">' +
          '<span class="member-template-names">' + preview + '</span>' +
          '<span class="member-template-count"><i class="fa-solid fa-user-group" aria-hidden="true"></i> ' +
          count + ' 人</span>' +
          '</button>'
        );
      }).join('');

      container.innerHTML =
        '<div class="field member-template-picker">' +
        '<label>前回のメンバー構成を使う</label>' +
        '<p class="member-template-hint">タップすると下のメンバー欄に反映します。反映後も追加・削除できます。</p>' +
        '<div class="member-template-list">' + items + '</div>' +
        '</div>';
    }

    // 作成フォームのメンバー入力行 1 行分の HTML を返す。
    // value を渡すと初期値を埋める（Member_Template の反映に使う・要件 17.2）。
    function memberRowHtml(value) {
      const v = value == null ? '' : escapeHtml(String(value));
      return (
        '<div class="cg-member-row">' +
        '<input type="text" class="cg-member" autocomplete="off" placeholder="メンバー名" value="' + v + '" />' +
        '<button class="btn btn--ghost remove-member" type="button" aria-label="このメンバーを削除"' +
        ' onclick="removeMemberRow(this)"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>' +
        '</div>'
      );
    }

    // グループが見つからない画面（要件 2.3）＋一覧へ戻るリンク。
    function renderGroupNotFound() {
      setScreen(
        '<section class="fade-in not-found">' +
        '<div class="card">' +
        '<p class="not-found-icon"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></p>' +
        '<h2 class="screen-title">グループが見つかりません</h2>' +
        '<p class="not-found-desc">この URL のグループは存在しないか、削除された可能性があります。</p>' +
        '<a class="btn btn--primary" href="#/">' +
        '<i class="fa-solid fa-list" aria-hidden="true"></i> 一覧へ戻る</a>' +
        '</div>' +
        '</section>'
      );
    }

    // Split_Method の表示ラベル（UI 用）。config 定数 SPLIT_METHODS の各値に対応する。
    function splitMethodLabel(method) {
      switch (method) {
        case 'equal': return '均等割';
        case 'percentage': return 'パーセンテージ割（％）';
        case 'shares': return '口数割';
        case 'amount': return '金額指定割';
        default: return String(method || '');
      }
    }

    // 編集中の Expense の id（新規追加時は null）。UI 専用の状態のため、
    // 永続化対象の state ではなくモジュール変数で保持する（要件 3.4 の編集モード）。
    let editingExpenseId = null;

    // 費用フォームの「立替（line）」入力の作業状態（変更3）。UI 専用・永続化しない。
    // 各要素: { id, payerId, amountText, participants:[id...], splitMethod, configText:{ [id]:string } }
    let expenseFormLines = [];

    // 最小通貨単位の整数 amount を、フォームの金額入力欄へ復元するための素の文字列へ変換する。
    // 記号・桁区切りを含めず、parseAmount で元の整数へ戻せる形にする（例: 1050/USD => '10.50'）。
    function amountToInputValue(amount, currencyCode) {
      const cur = currencyOf(currencyCode);
      const minorUnit = cur.minorUnit;
      const digits = minorUnitDigits(minorUnit);
      const value = (typeof amount === 'number' && Number.isFinite(amount)) ? Math.round(amount) : 0;
      if (digits <= 0) return String(value);
      const sign = value < 0 ? '-' : '';
      const abs = Math.abs(value);
      const major = Math.floor(abs / minorUnit);
      const minor = abs % minorUnit;
      return sign + major + '.' + String(minor).padStart(digits, '0');
    }

    // 新しい空の立替（line）作業状態を生成する（対象者は既定で全メンバー・変更3）。
    function makeExpenseLine(members) {
      const list = Array.isArray(members) ? members : [];
      return {
        id: generateId(),
        payerId: list.length > 0 ? list[0].id : '',
        amountText: '',
        participants: list.map(function (m) { return m.id; }),
        splitMethod: 'equal',
        configText: {},
      };
    }

    // 既存 Expense の line を、フォームの作業状態（configText は文字列）へ変換する（編集プレフィル）。
    function lineToWorkingState(line, currency) {
      const method = line.splitMethod || 'equal';
      const cfg = line.splitConfig || {};
      const participants = Array.isArray(line.participants) ? line.participants.slice() : [];
      const configText = {};
      participants.forEach(function (id) {
        if (method === 'percentage' && cfg.percents && Number.isFinite(cfg.percents[id])) {
          configText[id] = String(cfg.percents[id]);
        } else if (method === 'shares' && cfg.shares && Number.isFinite(cfg.shares[id])) {
          configText[id] = String(cfg.shares[id]);
        } else if (method === 'amount' && cfg.amounts && Number.isFinite(cfg.amounts[id])) {
          configText[id] = amountToInputValue(cfg.amounts[id], currency);
        }
      });
      return {
        id: (typeof line.id === 'string' && line.id.length > 0) ? line.id : generateId(),
        payerId: line.payerId,
        amountText: amountToInputValue(line.amount, currency),
        participants: participants,
        splitMethod: method,
        configText: configText,
      };
    }

    // 費用フォームの立替（line）作業状態を初期化する（編集時は全 line をプレフィル、新規は 1 行）。
    function buildExpenseFormLines(editing, members, currency) {
      if (editing && Array.isArray(editing.lines) && editing.lines.length > 0) {
        return editing.lines.map(function (line) { return lineToWorkingState(line, currency); });
      }
      return [makeExpenseLine(members)];
    }

    // 費用入力フォームの HTML を組み立てる（members が 1 名以上ある前提で呼ぶ）。
    // 構成: 題目(title) / カテゴリ(任意) / 通貨 / 「立替」行のリスト（#ef-lines）（変更3）。
    // 各立替行 = 立て替えた人・金額・対象者・分割方式+個別入力（renderExpenseLines が埋める）。
    // editingExpenseId が設定されていれば題目・全 line をプレフィルする（要件 3.4）。
    // 送信は #action-bar の CTA もしくは Enter キーから handleAddExpenseSubmit を呼ぶ。
    function expenseFormHtml(group) {
      const members = Array.isArray(group.members) ? group.members : [];
      const baseCurrency = baseCurrencyOf(group);

      // 編集モードなら対象 Expense を取得する（要件 3.4）。
      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const editing = editingExpenseId
        ? expenses.find(function (e) { return e && e.id === editingExpenseId; })
        : null;
      const isEditing = !!editing;

      // この Expense（題目）の Currency（要件 20.2）。編集時は既存通貨、新規は基準通貨。
      const currency = (editing && typeof editing.currency === 'string' && CURRENCIES[editing.currency])
        ? editing.currency
        : baseCurrency;

      // 立替（line）の作業状態を初期化する（renderExpenseLines が #ef-lines を描画する）。
      expenseFormLines = buildExpenseFormLines(editing, members, currency);

      // Currency 選択肢（題目単位・要件 20.2）。
      const currencyOptions = Object.keys(CURRENCIES).map(function (code) {
        const c = CURRENCIES[code];
        const sel = (code === currency) ? ' selected' : '';
        return '<option value="' + escapeHtml(code) + '"' + sel + '>' +
          escapeHtml(c.symbol) + ' ' + escapeHtml(code) + '（' + escapeHtml(c.name) + '）</option>';
      }).join('');

      const titleValue = editing ? escapeHtml(editing.title || '') : '';
      const catValue = (editing && editing.category != null) ? escapeHtml(editing.category) : '';
      const formTitle = isEditing ? '記録を編集' : '費用を記録';
      const titleIcon = isEditing ? 'fa-pen' : 'fa-circle-plus';

      return (
        '<form id="expense-form" class="card" onsubmit="return handleAddExpenseSubmit(event);">' +
        '<h3 class="panel-title"><i class="fa-solid ' + titleIcon + '" aria-hidden="true"></i> ' + formTitle + '</h3>' +

        // 題目（title・任意）
        '<div class="field">' +
        '<label for="ef-title">題目（任意・空ならカテゴリ名）</label>' +
        '<input id="ef-title" type="text" autocomplete="off" placeholder="例: ラーメン屋" value="' + titleValue + '" />' +
        '</div>' +

        // Category（任意・要件 3.6）
        '<div class="field">' +
        '<label for="ef-category">カテゴリ</label>' +
        '<select id="ef-category">' + (function () {
          const cur = (editing && editing.category != null) ? String(editing.category) : '';
          const list = EXPENSE_CATEGORIES.slice();
          if (cur && list.indexOf(cur) === -1) list.push(cur);
          return '<option value=""' + (cur ? '' : ' selected') + '>選ばない</option>' + list.map(function (c) {
            return '<option value="' + escapeHtml(c) + '"' + (c === cur ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
          }).join('');
        })() + '</select>' +
        '</div>' +

        // 通貨（題目単位・要件 20.2）。変更で各立替の金額記号・金額指定割の単位を更新する。
        '<div class="field">' +
        '<label for="ef-currency">通貨</label>' +
        '<select id="ef-currency" onchange="onExpenseCurrencyChange()">' + currencyOptions + '</select>' +
        '</div>' +

        // 立替（line）のリスト（変更3）。renderExpenseLines が #ef-lines を埋める。
        '<div class="field" style="margin-bottom:var(--space-2)">' +
        '<label>立替（1件以上）</label>' +
        '<div id="ef-lines"></div>' +
        '<div class="ef-lines-actions">' +
        '<button type="button" class="btn btn--ghost" onclick="addExpenseLine()">' +
        '<i class="fa-solid fa-plus" aria-hidden="true"></i> ' + escapeHtml(L('addLine')) + '</button>' +
        '</div>' +
        '</div>' +

        // エラー表示領域（addExpense / editExpense がフォーム値を保持したまま表示・要件 3.2, 3.3）
        '<div class="field-error" id="ef-error" role="alert"></div>' +

        // 送信 CTA（タブ内に常設・変更4）。編集時はラベルを「更新する」にする。
        '<button type="submit" class="btn btn--primary ef-submit">' +
        (isEditing
          ? '<i class="fa-solid fa-check" aria-hidden="true"></i> ' + escapeHtml(L('updateExpense'))
          : '<i class="fa-solid fa-circle-plus" aria-hidden="true"></i> ' + escapeHtml(L('addExpense'))) +
        '</button>' +

        // 編集モード時のみ「編集をやめる」操作を提示する。
        (isEditing
          ? '<button type="button" class="btn btn--ghost cancel-edit" onclick="cancelEditExpense()">' +
            '<i class="fa-solid fa-xmark" aria-hidden="true"></i> 編集をやめる</button>'
          : '') +
        '</form>'
      );
    }

    // #ef-lines に立替（line）行を描画する（変更3）。expenseFormLines の作業状態を反映する。
    function renderExpenseLines() {
      const container = document.getElementById('ef-lines');
      if (!container) return;
      const group = state.groups[state.currentGroupId];
      if (!group) { container.innerHTML = ''; return; }
      const members = Array.isArray(group.members) ? group.members : [];
      const currency = currentExpenseFormCurrency();
      const lines = Array.isArray(expenseFormLines) ? expenseFormLines : [];
      container.innerHTML = lines.map(function (line, i) {
        return lineRowHtml(group, members, line, i, currency);
      }).join('');
    }

    // 1 件の立替（line）行の HTML（立て替えた人 / 金額 / 対象者 / 分割方式 + 個別入力）。
    function lineRowHtml(group, members, line, i, currency) {
      const l = line || {};
      const canRemove = (Array.isArray(expenseFormLines) ? expenseFormLines.length : 1) > 1;

      const payerOptions = members.map(function (m) {
        const sel = (m.id === l.payerId) ? ' selected' : '';
        return '<option value="' + escapeHtml(m.id) + '"' + sel + '>' + escapeHtml(m.name) + '</option>';
      }).join('');

      const methodOptions = SPLIT_METHODS.map(function (mth) {
        const sel = (l.splitMethod === mth) ? ' selected' : '';
        return '<option value="' + escapeHtml(mth) + '"' + sel + '>' + escapeHtml(splitMethodLabel(mth)) + '</option>';
      }).join('');

      const parts = Array.isArray(l.participants) ? l.participants : [];
      const participantChecks = members.map(function (m) {
        const checked = (parts.indexOf(m.id) !== -1) ? ' checked' : '';
        return '<label class="participant-check">' +
          '<input type="checkbox" class="ef-line-participant" value="' + escapeHtml(m.id) + '"' + checked +
          ' onchange="onLineParticipantsChange(' + i + ')" />' +
          '<span>' + escapeHtml(m.name) + '</span></label>';
      }).join('');

      const amountText = (l.amountText != null) ? escapeHtml(String(l.amountText)) : '';
      const sym = escapeHtml(currencyOf(currency).symbol);
      const removeBtn = canRemove
        ? '<button class="btn btn--ghost ef-line-remove" type="button" aria-label="' + escapeHtml(L('removeLine')) + '" onclick="removeExpenseLine(' + i + ')">' +
          '<i class="fa-solid fa-xmark" aria-hidden="true"></i></button>'
        : '';

      return (
        '<div class="ef-line" data-line-id="' + escapeHtml(l.id) + '">' +
        '<div class="ef-line-header">' +
        '<span class="ef-line-index"><i class="fa-solid fa-hand-holding-dollar" aria-hidden="true"></i> 立替 ' + (i + 1) + '</span>' +
        removeBtn +
        '</div>' +
        '<div class="field"><label>立て替えた人</label><select class="ef-line-payer">' + payerOptions + '</select></div>' +
        '<div class="field"><label>金額（' + sym + '）</label>' +
        '<input class="ef-line-amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="' + amountText + '" /></div>' +
        '<div class="field"><label>立て替えた相手（対象者）</label>' +
        '<div class="participants-grid">' + participantChecks + '</div></div>' +
        '<div class="field" style="margin-bottom:0"><label>分割方式</label>' +
        '<select class="ef-line-method" onchange="onLineMethodChange(' + i + ')">' + methodOptions + '</select></div>' +
        '<div class="ef-line-split-config">' + lineSplitConfigHtml(l, members, currency) + '</div>' +
        '</div>'
      );
    }

    // 立替行の分割方式に応じた個別入力（％/口数/金額指定）を組み立てる。均等割は入力不要。
    function lineSplitConfigHtml(line, members, currency) {
      const method = (line && line.splitMethod) || 'equal';
      if (method === 'equal') {
        return '<p class="split-config-note empty-note">対象者で均等に分割します。</p>';
      }
      const parts = (line && Array.isArray(line.participants)) ? line.participants : [];
      if (parts.length === 0) {
        return '<p class="split-config-note empty-note">対象者を選ぶと入力欄が表示されます。</p>';
      }
      const nameById = {};
      (Array.isArray(members) ? members : []).forEach(function (m) { if (m) nameById[m.id] = m.name; });
      const configText = (line && line.configText) || {};

      let unitLabel, placeholder, hint;
      if (method === 'percentage') {
        unitLabel = '％'; placeholder = '0'; hint = '比率の合計を 100％ にしてください。';
      } else if (method === 'shares') {
        unitLabel = '口'; placeholder = '1'; hint = '各対象者の口数を入力してください。';
      } else {
        unitLabel = currencyOf(currency).symbol; placeholder = '0'; hint = '金額の合計を立替額に一致させてください。';
      }

      const rows = parts.map(function (id) {
        const val = escapeHtml(configText[id] != null ? String(configText[id]) : '');
        return '<div class="split-config-row">' +
          '<span class="split-config-name">' + escapeHtml(nameById[id] || '') + '</span>' +
          '<span class="split-config-input">' +
          '<input type="text" class="ef-line-config" data-member="' + escapeHtml(id) + '" inputmode="numeric" autocomplete="off" placeholder="' + escapeHtml(placeholder) + '" value="' + val + '" />' +
          '<span class="split-config-unit">' + escapeHtml(unitLabel) + '</span>' +
          '</span></div>';
      }).join('');

      return '<div class="split-config"><p class="split-config-hint empty-note">' + escapeHtml(hint) + '</p>' + rows + '</div>';
    }

    // #ef-lines の各行入力を expenseFormLines へ取り込む（再描画で入力値を失わないため）。
    function readExpenseLinesFromDom() {
      const container = document.getElementById('ef-lines');
      if (!container) return;
      const rows = container.querySelectorAll('.ef-line');
      const lines = [];
      rows.forEach(function (el) {
        const id = el.getAttribute('data-line-id');
        const payer = el.querySelector('.ef-line-payer');
        const amount = el.querySelector('.ef-line-amount');
        const method = el.querySelector('.ef-line-method');
        const participants = [];
        el.querySelectorAll('.ef-line-participant:checked').forEach(function (c) { participants.push(c.value); });
        const configText = {};
        el.querySelectorAll('.ef-line-config').forEach(function (c) {
          configText[c.getAttribute('data-member')] = c.value;
        });
        lines.push({
          id: id || generateId(),
          payerId: payer ? payer.value : '',
          amountText: amount ? (amount.value || '') : '',
          participants: participants,
          splitMethod: method ? method.value : 'equal',
          configText: configText,
        });
      });
      expenseFormLines = lines;
    }

    // メイン経費画面（要件 3.1, 7.2, 7.3, 9.8）。
    // 現在の Group を取得し、ヘッダー（グループ名・戻るリンク）、費用入力フォーム、
    // 支出一覧、Balance/精算/集計/共有の各コンテナを配置する。
    // Group が 0 メンバー（URL 経由で開いたが同期前など）でも安全に描画する。
    function renderExpenseScreen() {
      const group = state.groups[state.currentGroupId];

      // 購読直後などでキャッシュ未取得の場合は読み込み中を表示する（要件 8.2）。
      if (!group) {
        clearActionBar();
        setScreen(
          '<section class="fade-in expense-screen">' +
          '<div class="expense-header">' +
          '<a class="back-link" href="#/" aria-label="一覧へ戻る"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>' +
          '<h2 class="expense-title">グループ</h2>' +
          '</div>' +
          '<p class="empty-note">読み込み中…</p>' +
          '</section>'
        );
        return;
      }

      const members = Array.isArray(group.members) ? group.members : [];
      const hasMembers = members.length > 0;

      // 現在の下部タブ（変更4）。未知値は既定 'history' にフォールバックする。
      const tab = (TAB_IDS.indexOf(state.activeTab) !== -1) ? state.activeTab : 'history';

      // ヘッダー: 戻るリンク（href="#/"）＋グループ名（ユーザー入力なのでエスケープ）。
      const headerHtml =
        '<div class="expense-header">' +
        '<a class="back-link" href="#/" aria-label="一覧へ戻る"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>' +
        '<h2 class="expense-title">' + escapeHtml(group.name) + '</h2>' +
        '</div>';

      // タブ内容は #tab-content に描画する（タブ切替時はここだけ再描画・同期/購読はそのまま）。
      setScreen(
        '<section class="fade-in expense-screen">' +
        headerHtml +
        '<div id="tab-content"></div>' +
        '</section>'
      );

      // アクティブなタブの内容を描画してから、下部固定タブバーを配置する（変更4）。
      renderTabContent(tab, group, hasMembers);
      renderTabBar(tab);
    }

    // アクティブなタブの内容を #tab-content へ描画する（変更4）。
    // 入力 / 履歴 / 精算 / 設定 の 4 タブ。各コンテナを差し込んでから対応する render* を呼ぶ。
    function renderTabContent(tab, group, hasMembers) {
      const host = document.getElementById('tab-content');
      if (!host) return;

      if (tab === 'input') {
        // 入力タブ: 題目フォーム（複数立替）。メンバー不在時は設定タブへ誘導する。
        host.innerHTML = hasMembers
          ? expenseFormHtml(group)
          : '<div class="card"><p class="empty-note">メンバーがいません。「設定」タブからメンバーを追加すると入力できます。</p></div>';
        if (hasMembers) renderExpenseLines();
        return;
      }

      if (tab === 'history') {
        // 履歴タブ: 検索・並べ替え＋題目のコンパクト一覧（一括選択 UI なし・変更4）。
        host.innerHTML =
          '<section class="panel">' +
          '<h3 class="panel-title"><i class="fa-solid fa-list" aria-hidden="true"></i> 履歴</h3>' +
          '<div id="search-sort-bar"></div>' +
          '<div id="expenses-panel"></div>' +
          '</section>';
        renderSearchSortBar();
        renderExpenseList();
        return;
      }

      if (tab === 'settle') {
        // 精算タブ: 収支（Base 換算）＋送金プラン＋支払済みトグル＋残件＋共有、集計。
        host.innerHTML =
          '<section id="balances-section" class="panel"></section>' +
          '<section id="settlement-section" class="panel"></section>' +
          '<section id="totals-section" class="panel"></section>';
        renderBalances();
        renderSettlement();
        renderTotals();
        return;
      }

      // 設定タブ: メンバー管理／基準通貨・為替レート／グループ共有／グループ退出（変更4, 変更5）。
      host.innerHTML =
        '<section id="members-panel" class="panel"></section>' +
        '<section id="currency-section" class="panel"></section>' +
        '<section id="share-section" class="panel"></section>' +
        '<button type="button" class="btn btn--danger settings-leave" onclick="leaveGroup(\'' +
        escapeHtml(state.currentGroupId) + '\')">' +
        '<i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> このグループを一覧から退出</button>';
      renderMemberPanel();
      renderCurrencyControls();
      renderShareBar();
    }

    // 下部固定タブバーを #action-bar へ描画する（変更4）。
    // アイコン＋ラベルの縦積みボタンを 4 つ並べ、押下で switchTab を呼ぶ。
    function renderTabBar(activeTab) {
      const bar = document.getElementById('action-bar');
      if (!bar) return;
      bar.classList.add('tab-bar');
      bar.innerHTML = TABS.map(function (t) {
        const isActive = (t.id === activeTab);
        return (
          '<button type="button" class="tab-btn' + (isActive ? ' is-active' : '') + '"' +
          ' aria-current="' + (isActive ? 'page' : 'false') + '"' +
          ' onclick="switchTab(\'' + t.id + '\')">' +
          '<i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' +
          '<span>' + escapeHtml(t.label) + '</span>' +
          '</button>'
        );
      }).join('');
    }

    // 下部タブを切り替える（変更4）。タブ内容とタブバーのみ再描画し、同期・購読はそのまま維持する。
    function switchTab(tab) {
      if (TAB_IDS.indexOf(tab) === -1) return;
      state.activeTab = tab;
      // 経費画面（#tab-content とタブバー）のみ再描画する。openGroup 等の購読には触れない。
      renderExpenseScreen();
    }

    // メンバー管理パネルを #members-panel へ描画する（後追いの追加/削除・変更6）。
    // 現メンバーをチップで一覧表示し、各メンバーに削除(x)ボタン（isMemberInUse が true の人は
    // removeMember 側でトースト表示し削除しない）。追加用の入力 + 「追加」ボタンで addMember を呼ぶ。
    function renderMemberPanel() {
      const section = document.getElementById('members-panel');
      if (!section) return;

      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) { section.innerHTML = ''; return; }

      const members = Array.isArray(group.members) ? group.members : [];

      const chips = members.map(function (m) {
        const safeId = escapeHtml(m.id);
        return (
          '<span class="member-chip">' +
          '<span class="member-chip-name">' + escapeHtml(m.name) + '</span>' +
          '<button type="button" class="member-chip-remove" aria-label="' +
          escapeHtml(m.name + ' を削除') + '" onclick="if(confirm(\'' + escapeHtml(m.name).replace(/'/g,'') + ' をメンバーから外しますか？\'))removeMember(\'' + safeId + '\')">' +
          '<i class="fa-solid fa-xmark" aria-hidden="true"></i></button>' +
          '</span>'
        );
      }).join('');

      const chipsHtml = members.length > 0
        ? '<div class="member-chips">' + chips + '</div>'
        : '<p class="empty-note">メンバーがいません。下の入力欄から追加してください。</p>';

      section.innerHTML =
        '<h3 class="panel-title"><i class="fa-solid fa-user-group" aria-hidden="true"></i> メンバー</h3>' +
        chipsHtml +
        '<div class="member-add-row">' +
        '<input id="member-add-input" type="text" autocomplete="off" placeholder="メンバー名を追加" ' +
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();handleAddMember();}" />' +
        '<button type="button" class="btn btn--primary" onclick="handleAddMember()">' +
        '<i class="fa-solid fa-user-plus" aria-hidden="true"></i> 追加</button>' +
        '</div>';
    }

    // 並べ替え順（SORT_ORDERS）の表示ラベル（要件 19.3）。
    const SORT_ORDER_LABELS = {
      date_desc: '日時（新しい順）',
      date_asc: '日時（古い順）',
      amount_desc: '金額（高い順）',
      amount_asc: '金額（安い順）',
    };

    // 検索入力 + 並べ替え select を #search-sort-bar へ描画する（要件 19.1, 19.3）。
    // - 検索: 内容または Payer への部分一致（filterExpenses が判定・要件 19.2）。
    // - 並べ替え: SORT_ORDERS（金額昇順/降順・発生日時昇順/降順・要件 19.4）。
    // このバーは一覧（#expenses-panel）とは別コンテナに描画するため、
    // setSearchQuery/setSortOrder による一覧のみの再描画では入力欄のフォーカスが保たれる。
    function renderSearchSortBar() {
      const bar = document.getElementById('search-sort-bar');
      if (!bar) return;

      const group = state.groups[state.currentGroupId];
      // メンバー・支出が無い間は検索/並べ替えを提示しない（操作対象が無いため）。
      if (!group || !Array.isArray(group.members) || group.members.length === 0) {
        bar.innerHTML = '';
        return;
      }

      const query = (state.searchQuery == null) ? '' : String(state.searchQuery);
      const order = (SORT_ORDERS.indexOf(state.sortOrder) !== -1) ? state.sortOrder : 'date_desc';

      const sortOpts = SORT_ORDERS.map(function (o) {
        const sel = (o === order) ? ' selected' : '';
        const label = SORT_ORDER_LABELS[o] || o;
        return '<option value="' + escapeHtml(o) + '"' + sel + '>' + escapeHtml(label) + '</option>';
      }).join('');

      bar.innerHTML =
        '<div class="search-sort-bar">' +
        '<div class="field search-field">' +
        '<label for="ess-search">支出を検索</label>' +
        '<input type="search" id="ess-search" inputmode="search" autocomplete="off" ' +
        'placeholder="内容・支払者で検索" value="' + escapeHtml(query) + '" ' +
        'oninput="setSearchQuery(this.value)" aria-label="内容または支払者で検索" />' +
        '</div>' +
        '<div class="field sort-field">' +
        '<label for="ess-sort">並べ替え</label>' +
        '<select id="ess-sort" onchange="setSortOrder(this.value)" aria-label="並べ替え順">' +
        sortOpts +
        '</select>' +
        '</div>' +
        '</div>';
    }

    // 支出一覧を #expenses-panel へ描画する。
    // 表示用リストは「検索（filterExpenses）→ Category 絞り込み → 並べ替え（sortExpenses）」
    // の順で導出する（要件 19.5）。既定の並びは発生日時の新しい順（要件 7.2, 19.4）。
    // state.categoryFilter が設定されていればその Category のみ表示する（要件 7.3）。
    // これらの条件は表示上のみへ適用し、永続データ（group.expenses）は変更しない（要件 19.7）。
    // Category 絞り込み UI（select）を用意し、onchange で setCategoryFilter を呼ぶ。
    function renderExpenseList() {
      const panel = document.getElementById('expenses-panel');
      if (!panel) return;

      const group = state.groups[state.currentGroupId];
      if (!group) { panel.innerHTML = ''; return; }

      // 各 Expense は登録時の Currency で金額表示する（要件 20.5）。基準通貨は換算額の併記に用いる。
      const baseCurrency = baseCurrencyOf(group);
      const exchangeRates = (group.exchangeRates && typeof group.exchangeRates === 'object')
        ? group.exchangeRates : {};
      const members = Array.isArray(group.members) ? group.members : [];
      const nameById = {};
      members.forEach(function (m) { if (m) nameById[m.id] = m.name; });

      const allExpenses = Array.isArray(group.expenses) ? group.expenses.slice() : [];

      // 絞り込み UI 用に、実在する Category を出現順に収集する（null/空は対象外）。
      const categorySet = [];
      allExpenses.forEach(function (e) {
        const c = (e && e.category != null && e.category !== '') ? e.category : null;
        if (c != null && categorySet.indexOf(c) === -1) categorySet.push(c);
      });

      const activeFilter = state.categoryFilter;
      const query = (state.searchQuery == null) ? '' : String(state.searchQuery);
      const hasQuery = query.trim() !== '';

      // 表示用リストの導出（要件 19.5）: 検索 → Category 絞り込み → 並べ替え。
      // いずれも純粋関数・非破壊で、永続データ（group.expenses）は変更しない（要件 19.7）。

      // 1) 検索（内容 or Payer 名の部分一致・要件 19.2）。空クエリなら全件。
      const searched = filterExpenses(allExpenses, query, group);

      // 2) Category 絞り込み（要件 7.3）。未設定なら全件。
      const categoryFiltered = searched.filter(function (e) {
        if (activeFilter == null || activeFilter === '') return true;
        const c = (e && e.category != null && e.category !== '') ? e.category : null;
        return c === activeFilter;
      });

      // 3) 並べ替え（発生日時/金額の昇順・降順・要件 19.4）。既定は発生日時降順（要件 7.2）。
      const filtered = sortExpenses(categoryFiltered, state.sortOrder);

      // Category 絞り込み UI（select）。Category が 1 つも無ければ表示しない。
      let filterHtml = '';
      if (categorySet.length > 0) {
        const opts = ['<option value="">すべてのカテゴリ</option>'].concat(
          categorySet.map(function (c) {
            const sel = (c === activeFilter) ? ' selected' : '';
            return '<option value="' + escapeHtml(c) + '"' + sel + '>' + escapeHtml(c) + '</option>';
          })
        ).join('');
        filterHtml =
          '<div class="category-filter field">' +
          '<label for="ef-filter">カテゴリ絞り込み</label>' +
          '<select id="ef-filter" onchange="setCategoryFilter(this.value)">' + opts + '</select>' +
          '</div>';
      }

      // 一覧本体。
      let listHtml;
      if (filtered.length === 0) {
        if (allExpenses.length === 0) {
          // そもそも記録が 1 件も無い。
          listHtml = '<p class="empty-note">まだ記録がありません。「入力」タブから登録してください。</p>';
        } else if (hasQuery) {
          // 検索クエリに一致する記録が無い（要件 19.6: 該当なし）。
          listHtml = '<p class="empty-note">「' + escapeHtml(query.trim()) + '」に一致する記録はありません。</p>';
        } else if (activeFilter != null && activeFilter !== '') {
          // Category 絞り込みに一致する記録が無い。
          listHtml = '<p class="empty-note">このカテゴリの記録はありません。</p>';
        } else {
          // 上記以外の該当なし。
          listHtml = '<p class="empty-note">該当する記録はありません。</p>';
        }
      } else {
        listHtml = '<ul class="expense-list">' + filtered.map(function (e) {
          return expenseItemHtml(e, nameById, baseCurrency, exchangeRates);
        }).join('') + '</ul>';
      }

      panel.innerHTML = filterHtml + listHtml;
    }

    // 1 件の Expense（題目）をコンパクトな折りたたみ行として描画する（変更4）。
    // 題目行 = 題目名＋合計金額（＋カテゴリ/通貨/日時タグ）。タップで展開し、詳細内に
    // 各立替「(payer) → (相手・payer除外) に立替: 金額」＋負担内訳、小さな編集/削除を置く。
    function expenseItemHtml(e, nameById, baseCurrency, exchangeRates) {
      const safeId = escapeHtml(e.id);
      // 題目が空なら「(無題)」と表示する（文言・制約）。
      const title = (e.title != null && String(e.title).trim() !== '') ? String(e.title) : '(無題)';

      // 金額は登録時の Currency で表示する（要件 20.5）。合計は全 line の合計（変更3）。
      const exCurrency = (typeof e.currency === 'string' && CURRENCIES[e.currency]) ? e.currency : baseCurrency;
      const total = expenseTotal(e);

      // カテゴリ / 通貨 / 換算 / 日時のメタタグ。
      const cat = (e.category != null && e.category !== '') ? e.category : null;
      const catHtml = cat
        ? '<span class="tag tag--category"><i class="fa-solid fa-tag" aria-hidden="true"></i> ' + escapeHtml(cat) + '</span>'
        : '';
      let baseEquivHtml = '';
      if (exCurrency !== baseCurrency) {
        const conv = convertAmount(total, exCurrency, baseCurrency, exchangeRates);
        baseEquivHtml = conv.ok
          ? '<span class="tag tag--fx">≈ ' + escapeHtml(formatAmount(conv.amount, baseCurrency)) + '</span>'
          : '<span class="tag tag--fx-missing"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> レート未設定</span>';
      }
      const currencyHtml = (exCurrency !== baseCurrency)
        ? '<span class="tag tag--currency">' + escapeHtml(exCurrency) + '</span>' : '';
      const dateStr = formatDateTime(e.createdAt);
      const dateHtml = dateStr
        ? '<span class="tag"><i class="fa-regular fa-clock" aria-hidden="true"></i> ' + escapeHtml(dateStr) + '</span>'
        : '';

      // 各立替（Line）行: 「(立替者) → (相手・立替者除外) に立替: 金額」＋負担内訳（変更4）。
      const lines = Array.isArray(e.lines) ? e.lines : [];
      const lineRows = lines.map(function (line) {
        const payerName = nameById[line.payerId] || '不明';
        const parts = Array.isArray(line.participants) ? line.participants : [];
        // 相手は participants から立替者本人を除外して名前で列挙する（人数表記は使わない）。
        const targetNames = parts
          .filter(function (pid) { return pid !== line.payerId; })
          .map(function (pid) { return escapeHtml(nameById[pid] || '不明'); });
        const targetsText = targetNames.length > 0 ? targetNames.join('・') : '自分のみ';

        const splitMap = computeLineSplit(line);
        const breakdown = parts.map(function (pid) {
          const owed = splitMap.has(pid) ? splitMap.get(pid) : 0;
          const isPayer = (pid === line.payerId);
          return (
            '<li class="expense-line-breakdown-row">' +
            '<span>' + escapeHtml(nameById[pid] || '不明') + (isPayer ? '（立替者）' : '') + '</span>' +
            '<span>' + escapeHtml(formatAmount(owed, exCurrency)) + '</span>' +
            '</li>'
          );
        }).join('');

        return (
          '<div class="expense-line-row">' +
          '<div class="expense-line-headline">' +
          '<span class="expense-line-parties">' +
          '<span class="expense-line-payer">' + escapeHtml(payerName) + '</span>' +
          '<i class="fa-solid fa-arrow-right expense-line-arrow" aria-hidden="true"></i>' +
          '<span class="expense-line-targets">' + targetsText + '</span> に立替' +
          '</span>' +
          '<span class="expense-line-amount">' + escapeHtml(formatAmount(line.amount, exCurrency)) + '</span>' +
          '</div>' +
          (breakdown ? '<ul class="expense-line-breakdown">' + breakdown + '</ul>' : '') +
          '</div>'
        );
      }).join('');

      return (
        '<li class="expense-item fade-in">' +
        '<details class="expense-details">' +
        '<summary class="expense-summary">' +
        '<i class="fa-solid fa-chevron-right expense-summary-chevron" aria-hidden="true"></i>' +
        '<span class="expense-summary-body">' +
        '<span class="expense-summary-top">' +
        '<span class="expense-summary-title">' + escapeHtml(title) + '</span>' +
        '<span class="expense-summary-amount">' + escapeHtml(formatAmount(total, exCurrency)) + '</span>' +
        '</span>' +
        '<span class="expense-summary-meta">' + catHtml + currencyHtml + baseEquivHtml + dateHtml + '</span>' +
        '</span>' +
        '</summary>' +
        '<div class="expense-body">' +
        lineRows +
        '<div class="expense-body-actions">' +
        '<button class="btn btn--ghost" type="button" onclick="editExpense(\'' + safeId + '\')">' +
        '<i class="fa-solid fa-pen" aria-hidden="true"></i> 編集</button>' +
        '<button class="btn btn--danger" type="button" onclick="deleteExpense(\'' + safeId + '\')">' +
        '<i class="fa-solid fa-trash" aria-hidden="true"></i> 削除</button>' +
        '</div>' +
        '</div>' +
        '</details>' +
        '</li>'
      );
    }

    // Balance 描画で現在インライン展開している Member（null なら全て折りたたみ）。
    // UI 専用の状態のため state（永続化対象）ではなくモジュール変数で保持する。
    let expandedMemberId = null;

    // groupの members から memberId -> name の索引を作る小さなヘルパー。
    function memberNameIndex(group) {
      const nameById = {};
      (Array.isArray(group && group.members) ? group.members : []).forEach(function (m) {
        if (m && m.id != null) nameById[m.id] = m.name;
      });
      return nameById;
    }

    // Balance を「受取（正）/支払（負）/中立（0）」の視覚表現へ整形する（要件 9.2）。
    // 戻り値: { cls, label, text }（cls は色クラス、label は受取/支払、text は整形済み金額）。
    function balanceView(balance, currency) {
      if (balance > 0) {
        return { cls: 'balance--positive', label: '受取', text: formatAmount(balance, currency) };
      }
      if (balance < 0) {
        // 支払は絶対値で表示する（マイナス記号は「支払」ラベルで表現する）。
        return { cls: 'balance--negative', label: '支払', text: formatAmount(-balance, currency) };
      }
      return { cls: 'balance--zero', label: '精算済み', text: formatAmount(0, currency) };
    }

    // Member 名クリックで内訳（memberSummary）のインライン展開をトグルする（要件 7.5）。
    // 同じ Member を再度押すと閉じる。Balance パネルのみ再描画する。
    function toggleMemberSummary(memberId) {
      expandedMemberId = (expandedMemberId === memberId) ? null : memberId;
      renderBalances();
    }

    // 各 Member の Balance を #balances-section へ描画する（要件 9.2, 7.5）。
    // 受取（正・green）/支払（負・red）/中立（0）を色で識別できるようにし、
    // Member 名クリックで memberSummary（立替総額・負担総額・Balance）をインライン展開する。
    function renderBalances() {
      const section = document.getElementById('balances-section');
      if (!section) return;

      const group = state.groups[state.currentGroupId];
      const members = Array.isArray(group && group.members) ? group.members : [];
      // Member が居ない場合は空にする（.panel:empty で非表示）。
      if (!group || members.length === 0) { section.innerHTML = ''; return; }

      // Balance は Base_Currency 建てで表示する（要件 20.4）。
      const currency = baseCurrencyOf(group);

      // 多通貨対応: 換算レート不足時は収支を確定できない旨を表示する（要件 20.6）。
      const baseResult = computeBalancesInBase(group);
      if (!baseResult.ok) {
        const missing = (baseResult.missing || []).map(function (c) {
          const cur = CURRENCIES[c];
          return cur ? (cur.symbol + ' ' + c) : c;
        }).join('、');
        section.innerHTML =
          '<h3 class="panel-title"><i class="fa-solid fa-scale-balanced" aria-hidden="true"></i> 収支（Balance）</h3>' +
          '<p class="field-error" role="alert">' +
          '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ' +
          '為替レートが不足しているため収支を確定できません（不足通貨: ' + escapeHtml(missing) + '）。</p>';
        return;
      }
      const balances = baseResult.balances;

      const items = members.map(function (m) {
        const balance = balances.get(m.id) || 0;
        const view = balanceView(balance, currency);
        const isOpen = (expandedMemberId === m.id);
        const safeId = escapeHtml(m.id);

        // Member 内訳（展開時のみ算出・表示）: 立替総額・負担総額・Balance（要件 7.5）。
        let detailHtml = '';
        if (isOpen) {
          const summary = memberSummary(group, m.id);
          const sv = balanceView(summary.balance, currency);
          detailHtml =
            '<dl class="balance-detail fade-in">' +
            '<div class="balance-detail-row"><dt>立替総額</dt><dd>' + escapeHtml(formatAmount(summary.paid, currency)) + '</dd></div>' +
            '<div class="balance-detail-row"><dt>負担総額</dt><dd>' + escapeHtml(formatAmount(summary.owed, currency)) + '</dd></div>' +
            '<div class="balance-detail-row"><dt>Balance</dt><dd class="' + sv.cls + '">' + escapeHtml(sv.label + ' ' + sv.text) + '</dd></div>' +
            '</dl>';
        }

        return (
          '<li class="balance-item">' +
          '<button type="button" class="balance-row" aria-expanded="' + (isOpen ? 'true' : 'false') + '" onclick="toggleMemberSummary(\'' + safeId + '\')">' +
          '<span class="balance-name"><i class="fa-solid fa-chevron-' + (isOpen ? 'down' : 'right') + '" aria-hidden="true"></i> ' + escapeHtml(m.name) + '</span>' +
          '<span class="balance-amount ' + view.cls + '">' + escapeHtml(view.label + ' ' + view.text) + '</span>' +
          '</button>' +
          detailHtml +
          '</li>'
        );
      }).join('');

      section.innerHTML =
        '<h3 class="panel-title"><i class="fa-solid fa-scale-balanced" aria-hidden="true"></i> 収支（Balance）</h3>' +
        '<ul class="balance-list fade-in">' + items + '</ul>';
    }

    // Settlement_Plan を #settlement-section へ描画する（要件 5.4〜5.7）。
    // - Expense が 0 件: 「精算不要」（要件 5.6）
    // - Expense はあるが全 Balance が 0: 「送金不要」＋各 Balance を表示（要件 5.7）
    // - それ以外: 送金件数最小の送金リスト（送金元→送金先: 金額）（要件 5.4, 5.5）
    function renderSettlement() {
      const section = document.getElementById('settlement-section');
      if (!section) return;

      const group = state.groups[state.currentGroupId];
      const members = Array.isArray(group && group.members) ? group.members : [];
      if (!group || members.length === 0) { section.innerHTML = ''; return; }

      // 精算・Balance は Base_Currency 建てで算出・表示する（要件 20.4）。
      const currency = baseCurrencyOf(group);
      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const titleHtml = '<h3 class="panel-title"><i class="fa-solid fa-money-bill-transfer" aria-hidden="true"></i> 精算</h3>';

      // Expense が 1 件も無い → 精算不要（要件 5.6）。
      if (expenses.length === 0) {
        section.innerHTML = titleHtml +
          '<p class="empty-note"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> 精算は不要です（支出がありません）。</p>';
        return;
      }

      // 多通貨対応: 全 Expense を Base_Currency へ換算して Balance を算出する（要件 20.3, 20.4）。
      // 換算レートが不足している場合は精算を確定せず、不足している通貨を表示する（要件 20.6）。
      const baseResult = computeBalancesInBase(group);
      if (!baseResult.ok) {
        const missing = (baseResult.missing || []).map(function (c) {
          const cur = CURRENCIES[c];
          return cur ? (cur.symbol + ' ' + c + '（' + cur.name + '）') : c;
        }).join('、');
        section.innerHTML = titleHtml +
          '<p class="field-error" role="alert">' +
          '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ' +
          '為替レートが不足しているため精算を確定できません。上の「通貨・為替レート」で次の通貨のレートを入力してください: ' +
          escapeHtml(missing) + '</p>';
        return;
      }

      const balances = baseResult.balances;
      const plan = computeSettlement(balances);

      // Expense はあるが送金不要（全 Balance が 0）→ その旨＋各 Balance を表示（要件 5.7）。
      if (plan.length === 0) {
        const balanceRows = members.map(function (m) {
          const view = balanceView(balances.get(m.id) || 0, currency);
          return (
            '<li class="settlement-balance-row">' +
            '<span class="settlement-name">' + escapeHtml(m.name) + '</span>' +
            '<span class="balance-amount ' + view.cls + '">' + escapeHtml(view.label + ' ' + view.text) + '</span>' +
            '</li>'
          );
        }).join('');
        section.innerHTML = titleHtml +
          '<p class="empty-note"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> 送金は不要です（全員の収支が釣り合っています）。</p>' +
          '<ul class="settlement-balance-list">' + balanceRows + '</ul>';
        return;
      }

      // 送金リスト（送金元 → 送金先: 金額）を支払済み/未払いの状態付きで描画する
      // （要件 5.4, 5.5, 16.4, 16.5）。保存済み Payment_Status を再適用して状態を維持する（要件 16.8）。
      section.innerHTML = titleHtml + renderPaymentStatus(group, plan, currency);
    }

    // Settlement_Plan の各 Settlement_Transfer を支払済み/未払いの視覚表現で描画する（要件 16.4, 16.5）。
    // - group.settlements の保存済み Payment_Status を reconcilePaymentStatus で再適用する（要件 16.8）。
    // - 支払状態は「色 + テキスト + アイコン」で識別できるようにする（色のみに依存しない・要件 15.3）。
    // - Remaining_Settlement（未払いの送金）の残件数をサマリーとして明示する（要件 16.5）。
    // - 各行に支払済み/取り消しのトグルボタンを設け、transferKey を onclick 引数へ安全に埋め込む。
    // 戻り値: #settlement-section の本文 HTML 文字列（renderSettlement から呼ぶ）。
    function renderPaymentStatus(group, plan, currency) {
      const nameById = memberNameIndex(group);
      const savedSettlements = (group && group.settlements && typeof group.settlements === 'object')
        ? group.settlements : {};
      const reconciled = reconcilePaymentStatus(plan, savedSettlements);
      const remaining = remainingSettlement(reconciled);

      const total = reconciled.length;
      const remainingCount = remaining.length;
      const paidCount = total - remainingCount;

      // 残りの精算（Remaining_Settlement）を識別できるサマリー（要件 16.5）。
      let summaryHtml;
      if (remainingCount === 0) {
        summaryHtml =
          '<p class="settlement-remaining-note settlement-remaining-note--done" role="status">' +
          '<i class="fa-solid fa-circle-check" aria-hidden="true"></i> ' +
          'すべての送金が支払済みです（全 ' + total + ' 件）。</p>';
      } else {
        summaryHtml =
          '<p class="settlement-remaining-note" role="status">' +
          '<i class="fa-solid fa-list-check" aria-hidden="true"></i> ' +
          '残りの精算: <strong>' + remainingCount + ' 件</strong>' +
          '（支払済み ' + paidCount + ' 件 / 全 ' + total + ' 件）</p>';
      }

      const rows = reconciled.map(function (t) {
        const fromName = nameById[t.fromId] || '不明';
        const toName = nameById[t.toId] || '不明';
        const isPaid = (t.status === PAYMENT_STATUS.PAID);

        // 支払状態バッジ: 色（クラス）に加えてアイコンとテキストでも識別できる（要件 15.3）。
        const statusHtml = isPaid
          ? '<span class="settlement-status settlement-status--paid">' +
            '<i class="fa-solid fa-circle-check" aria-hidden="true"></i> 支払済み</span>'
          : '<span class="settlement-status settlement-status--unpaid">' +
            '<i class="fa-regular fa-circle" aria-hidden="true"></i> 未払い</span>';

        // transferKey を onclick のシングルクォート文字列引数へ埋め込む。
        // キーは UUID・'|'・整数のみで構成されるため単引用符・バックスラッシュを含まないが、
        // 念のため escapeHtml で属性値として安全化する（キーはラウンドトリップする）。
        const safeKey = escapeHtml(t.key);
        const toggleHtml = isPaid
          ? '<button type="button" class="btn btn--ghost settlement-toggle" ' +
            'onclick="markTransferUnpaid(\'' + safeKey + '\')" ' +
            'aria-label="' + escapeHtml(fromName + 'から' + toName + 'への送金の支払済みを取り消す') + '">' +
            '<i class="fa-solid fa-rotate-left" aria-hidden="true"></i> 取り消す</button>'
          : '<button type="button" class="btn btn--primary settlement-toggle" ' +
            'onclick="markTransferPaid(\'' + safeKey + '\')" ' +
            'aria-label="' + escapeHtml(fromName + 'から' + toName + 'への送金を支払済みにする') + '">' +
            '<i class="fa-solid fa-check" aria-hidden="true"></i> 支払済みにする</button>';

        return (
          '<li class="settlement-item settlement-item--payable ' +
          (isPaid ? 'settlement-item--paid' : 'settlement-item--unpaid') + '">' +
          '<div class="settlement-main">' +
          '<span class="settlement-parties">' +
          '<span class="settlement-from">' + escapeHtml(fromName) + '</span>' +
          '<i class="fa-solid fa-arrow-right settlement-arrow" aria-hidden="true"></i>' +
          '<span class="settlement-to">' + escapeHtml(toName) + '</span>' +
          '</span>' +
          '<span class="settlement-amount">' + escapeHtml(formatAmount(t.amount, currency)) + '</span>' +
          '</div>' +
          '<div class="settlement-status-row">' +
          statusHtml +
          toggleHtml +
          '</div>' +
          '</li>'
        );
      }).join('');

      // 精算共有の操作要素（コピー / OS 共有）を提供する（要件 18.2, 18.3）。
      // 送金（Settlement_Transfer）が 1 件以上存在する場合のみ表示する。支払済みを含めた
      // 全送金があればコピーは有用なので total>0 を条件にする。共有ボタンは navigator.share 対応時のみ。
      let shareControlsHtml = '';
      if (total > 0) {
        const copyBtn =
          '<button type="button" class="btn btn--primary settlement-share-btn"' +
          ' onclick="copySettlementText()">' +
          '<i class="fa-solid fa-copy" aria-hidden="true"></i> ' +
          escapeHtml(L('settlementCopy')) + '</button>';
        const shareBtn = (typeof navigator !== 'undefined' && navigator.share)
          ? '<button type="button" class="btn btn--ghost settlement-share-btn"' +
            ' onclick="shareSettlementText()">' +
            '<i class="fa-solid fa-share-nodes" aria-hidden="true"></i> ' +
            escapeHtml(L('settlementShare')) + '</button>'
          : '';
        shareControlsHtml =
          '<div class="settlement-share-controls">' + copyBtn + shareBtn + '</div>';
      }

      return summaryHtml + '<ul class="settlement-list fade-in">' + rows + '</ul>' + shareControlsHtml;
    }

    // Group の総支出額と Category 別合計を #totals-section へ描画する（要件 7.4）。
    // 支出が無い場合は空にする（.panel:empty で非表示）。
    function renderTotals() {
      const section = document.getElementById('totals-section');
      if (!section) return;

      const group = state.groups[state.currentGroupId];
      if (!group) { section.innerHTML = ''; return; }

      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      if (expenses.length === 0) { section.innerHTML = ''; return; }

      // 集計は Base_Currency 建てで表示する（要件 20.4）。
      const currency = baseCurrencyOf(group);
