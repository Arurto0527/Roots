<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- モバイルファースト: 縦画面・端末幅基準 -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="description" content="ワリタカ - グループの共同支出を記録し、送金回数を最小化した精算案を自動計算するアプリ" />
  <title>ワリタカ 改善案</title>

  <!-- Font Awesome 6.5.0 (CDN・唯一の外部依存) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />

  <!-- ===================================================================
       テーマ: CSS カスタムプロパティ（--color-* / --font-* / レイアウト変数）
       steering 準拠: 色は var(--color-*) を優先し、ハードコード hex を避ける
       =================================================================== -->
  <style id="warikan-theme">
    :root {
      /* カラー: 明るいグラスモーフィズム（淡い水色グラデ背景 + すりガラス面） */
      --color-bg: #e9f1ff;               /* フォールバック背景 */
      --app-gradient: linear-gradient(165deg, #bcd8ff 0%, #d8e3ff 42%, #ecebff 72%, #fbf6f1 100%);
      --color-surface: rgba(255, 255, 255, 0.62);   /* すりガラス面 */
      --color-surface-2: rgba(255, 255, 255, 0.42);
      --color-border: rgba(120, 140, 180, 0.22);
      --glass-edge: rgba(255, 255, 255, 0.65);       /* ガラスの縁ハイライト */
      --glass-blur: blur(16px) saturate(150%);
      --color-text: #1f2a3a;
      --color-text-muted: #5b6676;
      --color-primary: #3f7fe0;          /* 明るいアズールブルー */
      --color-primary-strong: #6aa8f0;   /* グラデーション用の淡いブルー */
      --color-primary-contrast: #ffffff;
      --color-primary-weak: rgba(63, 127, 224, 0.14);
      --color-accent: #2bb3c0;           /* ティール */
      --color-success: #1f9d63;   /* 受取（プラス Balance） */
      --color-danger: #e0554e;    /* 支払（マイナス Balance）/ エラー */
      --color-warning: #cf9327;   /* オフライン等の注意 */

      /* タイポグラフィ */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", Meiryo, sans-serif;
      --font-size-sm: 0.8125rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.25rem;
      --font-size-xl: 1.5rem;

      /* レイアウト / 余白 */
      --content-max-width: 480px;  /* 要件 9.4: 最大コンテンツ幅 */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 6px 24px rgba(41, 74, 130, 0.12);
      --shadow-lg: 0 -6px 28px rgba(41, 74, 130, 0.12);

      /* タップ対象最小サイズ（要件 9.6） */
      --tap-min: 44px;

      /* アニメーション（要件 9.3） */
      --transition-fast: 120ms ease;
      --transition: 200ms ease;
    }

    /* 明るい透明感を保つため、ダークモード端末でも同じ明るいグラス配色を使う。 */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #e9f1ff;
        --color-surface: rgba(255, 255, 255, 0.62);
        --color-surface-2: rgba(255, 255, 255, 0.42);
        --color-border: rgba(120, 140, 180, 0.22);
        --glass-edge: rgba(255, 255, 255, 0.65);
        --color-text: #1f2a3a;
        --color-text-muted: #5b6676;
        --color-primary: #3f7fe0;
        --color-primary-strong: #6aa8f0;
        --color-primary-weak: rgba(63, 127, 224, 0.14);
        --color-accent: #2bb3c0;
        --color-success: #1f9d63;
        --color-danger: #e0554e;
        --color-warning: #cf9327;
        --shadow: 0 6px 24px rgba(41, 74, 130, 0.12);
        --shadow-lg: 0 -6px 28px rgba(41, 74, 130, 0.12);
      }
    }
  </style>

  <!-- ===================================================================
       コンポーネント CSS
       - モバイルファースト（縦画面 / max-width 480px / 中央寄せ）
       - タップ対象 min 44px（--tap-min）
       - 画面下部 sticky アクションバー（片手操作: 要件 9.7）
       - 375px 以上で操作可能なレスポンシブ土台（要件 9.5）
       =================================================================== -->
  <style id="warikan-components">
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-bg);
      background-image: var(--app-gradient);
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* --- ルートコンテナ: 縦画面基準・最大幅 480px・中央寄せ（要件 9.4） --- */
    #app {
      width: 100%;
      max-width: var(--content-max-width);
      min-height: 100vh;
      margin-inline: auto;
      background: transparent;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* スクロール領域: 下部 sticky バーと重ならないよう余白を確保 */
    #screen {
      flex: 1 1 auto;
      padding: var(--space-4);
      padding-bottom: calc(var(--space-6) + 72px);
    }

    /* --- ヘッダー --- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: var(--tap-min);
      padding: var(--space-3) var(--space-4);
      background: rgba(255, 255, 255, 0.55);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      color: var(--color-primary);
      border-bottom: 1px solid var(--glass-edge);
      box-shadow: 0 2px 12px rgba(41, 74, 130, 0.06);
    }

    .app-header .app-title {
      font-size: var(--font-size-lg);
      font-weight: 700;
      margin: 0;
    }

    /* --- オフラインバナー（要件 8.4） --- */
    #offline-banner {
      display: none;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--color-warning);
      color: #fff;
      font-size: var(--font-size-sm);
    }
    #offline-banner.is-visible {
      display: flex;
    }

    /* --- カード --- */
    .card {
      background: var(--color-surface);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-edge);
      border-radius: var(--radius);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      box-shadow: var(--shadow);
    }

    /* --- タップ対象の基底スタイル（最小 44px: 要件 9.6） --- */
    button,
    .btn,
    a.btn,
    input,
    select,
    textarea {
      min-height: var(--tap-min);
      font-family: inherit;
      font-size: var(--font-size-base);
    }

    .btn,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-width: var(--tap-min);
      padding: 0 var(--space-4);
      border: 1px solid var(--glass-edge);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      color: var(--color-text);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .btn:active,
    button:active {
      transform: scale(0.98);
    }
    .btn--primary {
      background: linear-gradient(135deg, var(--color-primary-strong), var(--color-primary));
      color: var(--color-primary-contrast);
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(63, 127, 224, 0.30);
    }
    .btn--danger {
      background: var(--color-danger);
      color: #fff;
    }
    .btn--ghost {
      background: rgba(255, 255, 255, 0.34);
      border-color: var(--glass-edge);
    }

    /* --- フォーム入力 --- */
    label {
      display: block;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-1);
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    .field {
      margin-bottom: var(--space-4);
    }
    .field-error {
      color: var(--color-danger);
      font-size: var(--font-size-sm);
      margin-top: var(--space-1);
    }

    /* --- Balance の受取/支払 視覚表現（要件 9.2） --- */
    .balance--positive {
      color: var(--color-success);
    }
    .balance--negative {
      color: var(--color-danger);
    }
    .balance--zero {
      color: var(--color-text-muted);
    }

    /* --- Balance パネル（受取/支払を色で識別・Member 内訳の展開: 要件 9.2, 7.5） --- */
    .balance-list,
    .settlement-list,
    .settlement-balance-list,
    .totals-category-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .balance-item {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      margin-bottom: var(--space-2);
      overflow: hidden;
    }
    /* Member 名クリックで内訳を展開する行（タップ対象 44px: 要件 9.6） */
    .balance-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-height: var(--tap-min);
      padding: var(--space-2) var(--space-3);
      border: none;
      border-radius: 0;
      background: transparent;
      text-align: left;
    }
    .balance-name {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .balance-name .fa-chevron-right,
    .balance-name .fa-chevron-down {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .balance-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    /* Member 内訳（立替総額・負担総額・Balance） */
    .balance-detail {
      margin: 0;
      padding: var(--space-2) var(--space-3) var(--space-3);
      border-top: 1px dashed var(--color-border);
      background: var(--color-surface-2);
    }
    .balance-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-1) 0;
    }
    .balance-detail-row dt {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .balance-detail-row dd {
      margin: 0;
      font-weight: 600;
      white-space: nowrap;
    }

    /* --- 精算（送金リスト / 送金不要時の Balance 一覧: 要件 5.4〜5.7） --- */
    .settlement-item,
    .settlement-balance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      margin-bottom: var(--space-2);
    }
    .settlement-parties {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      overflow-wrap: anywhere;
    }
    .settlement-from,
    .settlement-to {
      font-weight: 600;
    }
    .settlement-arrow {
      color: var(--color-primary);
    }
    .settlement-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    .settlement-name {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    /* --- 精算の支払済みチェック（要件 16.4, 16.5 / 色 + テキスト + アイコンで識別: 要件 15.3） --- */
    /* 支払状態を持つ送金行は縦積みにして、送金内容と状態/操作を分ける。 */
    .settlement-item--payable {
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-2);
    }
    .settlement-item--payable .settlement-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .settlement-item--payable .settlement-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    /* 未払い/支払済みで左ボーダーの色を変え、色以外（アイコン+テキスト）でも識別する。 */
    .settlement-item--unpaid {
      border-left: 4px solid var(--color-warning);
    }
    .settlement-item--paid {
      border-left: 4px solid var(--color-success);
      background: var(--color-surface-2);
    }
    /* 支払済みの送金内容は淡色＋打ち消し線で「済み」を強調する（色のみに依存しない）。 */
    .settlement-item--paid .settlement-main {
      opacity: 0.7;
    }
    .settlement-item--paid .settlement-amount {
      text-decoration: line-through;
    }
    .settlement-status {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-sm);
      font-weight: 600;
      white-space: nowrap;
    }
    .settlement-status--paid {
      color: var(--color-success);
    }
    .settlement-status--unpaid {
      color: var(--color-warning);
    }
    /* トグルボタンはタップ対象 44px 以上を確保する（要件 15.4）。 */
    .settlement-toggle {
      min-height: var(--tap-min);
      flex-shrink: 0;
    }
    /* 精算結果の共有操作（コピー / OS 共有）: 要件 18.2, 18.3。タップ対象 44px 以上。 */
    .settlement-share-controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .settlement-share-controls .btn {
      flex: 1 1 auto;
      min-height: var(--tap-min);
    }
    /* 残りの精算（Remaining_Settlement）のサマリー表示（要件 16.5）。 */
    .settlement-remaining-note {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin: 0 0 var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      background: var(--color-primary-weak);
      color: var(--color-text);
      font-size: var(--font-size-sm);
    }
    .settlement-remaining-note strong {
      color: var(--color-primary);
    }
    .settlement-remaining-note--done {
      background: transparent;
      color: var(--color-success);
    }

    /* --- 集計（総額・Category 別合計: 要件 7.4） --- */
    .totals-grand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      background: var(--color-primary-weak);
      color: var(--color-primary);
      margin-bottom: var(--space-3);
    }
    .totals-grand-label {
      font-weight: 600;
    }
    .totals-grand-amount {
      font-weight: 700;
      font-size: var(--font-size-lg);
      white-space: nowrap;
    }
    .totals-category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--color-border);
    }
    .totals-category-row:last-child {
      border-bottom: none;
    }
    .totals-category-name {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-muted);
      overflow-wrap: anywhere;
    }
    .totals-category-amount {
      font-weight: 600;
      white-space: nowrap;
    }

    /* --- 下部 sticky アクションバー（片手操作: 要件 9.7） --- */
    #action-bar {
      position: sticky;
      bottom: 0;
      z-index: 20;
      display: flex;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
      background: rgba(255, 255, 255, 0.6);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--glass-edge);
      box-shadow: var(--shadow-lg);
    }
    #action-bar .btn {
      flex: 1 1 auto;
    }
    #action-bar:empty {
      display: none;
    }

    /* --- 下部固定タブバー（グループ画面・変更4） --- */
    /* #action-bar をタブバーとして使う。各タブはアイコン＋ラベルの縦積み。 */
    #action-bar.tab-bar {
      gap: 0;
      padding: var(--space-1) var(--space-2);
      padding-bottom: calc(var(--space-1) + env(safe-area-inset-bottom, 0px));
    }
    .tab-btn {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      min-height: var(--tap-min);
      padding: var(--space-1) var(--space-2);
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      font-weight: 600;
    }
    .tab-btn i {
      font-size: 1.15rem;
      line-height: 1;
    }
    .tab-btn.is-active {
      color: var(--color-primary);
      background: var(--color-primary-weak);
    }

    /* 入力フォーム末尾の送信 CTA（タブ内に常設） */
    .ef-submit {
      width: 100%;
      margin-top: var(--space-2);
    }
    /* グループ退出ボタン（設定タブ末尾） */
    .settings-leave {
      width: 100%;
      margin-top: var(--space-2);
    }

    /* --- 精算導線（Settlement_Shortcut: 要件 13） --- */
    /* 費用追加/まとめて入力ボタンを潰さないよう、精算導線は固定幅の compact ボタンにする。
       画面下部の sticky アクションバー内に常設し、片手での到達性を確保する（要件 13.1, 13.3）。 */
    #action-bar .settlement-shortcut,
    #action-bar .share-shortcut {
      position: relative;
      flex: 0 0 auto;
      min-width: var(--tap-min);
      min-height: var(--tap-min);
      padding: 0 var(--space-3);
    }
    /* 送金件数バッジ（Remaining_Settlement の件数・要件 13.4）。色に加え数値テキストで識別可能。 */
    .settlement-shortcut-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--color-danger);
      color: var(--color-primary-contrast);
      font-size: var(--font-size-sm);
      font-weight: 700;
      line-height: 1;
      box-shadow: var(--shadow);
    }

    /* --- トースト（操作フィードバック: 要件 9.1） --- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(16px);
      max-width: calc(var(--content-max-width) - 32px);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      background: var(--color-text);
      color: var(--color-bg);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
      z-index: 100;
    }
    #toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.toast--success { background: var(--color-success); color: #fff; }
    #toast.toast--error { background: var(--color-danger); color: #fff; }

    /* --- 一覧・Balance 更新時の遷移アニメーション（要件 9.3） --- */
    .fade-in {
      animation: fadeIn var(--transition) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* --- 画面タイトル / 補助テキスト --- */
    .screen-title {
      font-size: var(--font-size-lg);
      margin: 0 0 var(--space-4);
    }
    .empty-note {
      color: var(--color-text-muted);
    }

    /* --- グループ一覧（要件 2.5） --- */
    .group-list {
      list-style: none;
      margin: 0 0 var(--space-4);
      padding: 0;
    }
    .group-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-height: var(--tap-min);
      cursor: pointer;
    }
    .group-list-item:active {
      transform: scale(0.99);
    }
    /* 名前+メタをまとめる左側ブロック（右端の退出ボタンと分離） */
    .group-list-main {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      min-width: 0;
      flex: 1 1 auto;
    }
    /* 一覧から消すボタン（自端末のみ・データは残る） */
    .group-list-leave {
      flex: 0 0 auto;
      min-width: var(--tap-min);
      padding: 0;
      color: var(--color-text-muted);
    }
    .group-list-name {
      font-weight: 600;
    }
    .group-list-meta {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      white-space: nowrap;
    }
    .create-cta {
      width: 100%;
    }

    /* --- 作成フォームのメンバー入力行 --- */
    .cg-member-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .cg-member-row .cg-member {
      flex: 1 1 auto;
    }
    .cg-member-row .remove-member {
      flex: 0 0 auto;
      min-width: var(--tap-min);
      padding: 0;
    }
    .add-member {
      margin-top: var(--space-1);
    }

    /* --- メンバーテンプレートの提示（renderMemberTemplatePicker: 要件 17.1, 17.2） --- */
    .member-template-hint {
      margin: 0 0 var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .member-template-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    /* 各テンプレートは 44px 以上のタップ対象。名前と人数を縦積みにして 375px 幅でも判読可能にする。 */
    .member-template-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-1);
      width: 100%;
      min-height: var(--tap-min);
      padding: var(--space-2) var(--space-3);
      text-align: left;
    }
    .member-template-names {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .member-template-count {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    /* --- not-found 画面（要件 2.3） --- */
    .not-found {
      text-align: center;
    }
    .not-found-icon {
      font-size: var(--font-size-xl);
      color: var(--color-text-muted);
      margin: 0 0 var(--space-2);
    }
    .not-found-desc {
      color: var(--color-text-muted);
      margin-bottom: var(--space-4);
    }

    /* --- 経費画面ヘッダー（戻るリンク + グループ名） --- */
    .expense-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--tap-min);
      min-height: var(--tap-min);
      color: var(--color-primary);
      text-decoration: none;
    }
    .expense-title {
      flex: 1 1 auto;
      margin: 0;
      font-size: var(--font-size-lg);
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    /* --- パネル（Balance/精算/集計/共有などの各セクション） --- */
    .panel {
      margin-bottom: var(--space-4);
    }
    .panel:empty {
      display: none;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin: 0 0 var(--space-3);
      font-size: var(--font-size-base);
      color: var(--color-text);
    }

    /* --- 共有バー（コピー / OS 共有 / QR: 要件 2.6〜2.9, 9.6） --- */
    .share-note {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      margin: 0 0 var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      background: var(--color-primary-weak);
      color: var(--color-text);
      font-size: var(--font-size-sm);
      line-height: 1.5;
    }
    .share-note i {
      margin-top: 2px;
      color: var(--color-warning);
    }
    .share-url {
      margin-bottom: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      word-break: break-all;
    }
    .share-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    /* 共有系ボタンは最小 44px のタップ対象を確保する（要件 9.6） */
    .share-actions .btn {
      flex: 1 1 auto;
      min-height: var(--tap-min);
    }
    /* QR 描画先。showQrCode（task 8.4）が hidden を外して表示する */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: #ffffff;
    }
    .qr-container[hidden] {
      display: none;
    }
    .qr-container canvas {
      width: 100%;
      max-width: 264px;
      height: auto;
      /* ドットを補間せず鮮明に拡大表示し、読み取り精度を保つ */
      image-rendering: pixelated;
    }
    .qr-caption {
      color: #6b6f85;
      font-size: var(--font-size-sm);
      text-align: center;
      word-break: break-all;
    }
    .qr-fallback {
      color: var(--color-danger);
      font-size: var(--font-size-sm);
      text-align: center;
    }

    /* --- 対象者（Participant）チェックボックス --- */
    .participants-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .participant-check {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--tap-min);
      margin: 0;
      padding: 0 var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: var(--font-size-base);
      cursor: pointer;
    }
    .participant-check input {
      width: auto;
      min-height: auto;
      margin: 0;
    }

    /* --- 分割方式の個別入力（％/口数/金額指定） --- */
    .split-config {
      margin-top: var(--space-2);
    }
    .split-config-hint,
    .split-config-note {
      margin: 0 0 var(--space-2);
      font-size: var(--font-size-sm);
    }
    .split-config-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .split-config-name {
      flex: 1 1 auto;
      overflow-wrap: anywhere;
    }
    .split-config-input {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      flex: 0 0 auto;
    }
    .split-config-input input {
      width: 96px;
      text-align: right;
    }
    .split-config-unit {
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    /* --- カテゴリ絞り込み --- */
    .category-filter {
      margin-bottom: var(--space-3);
    }

    /* --- 検索・並べ替えバー（renderSearchSortBar: 要件 19.1, 19.3） --- */
    .search-sort-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .search-sort-bar .search-field {
      flex: 1 1 180px;
      margin: 0;
    }
    .search-sort-bar .sort-field {
      flex: 1 1 140px;
      margin: 0;
    }

    /* --- 複数選択の操作バー（renderSelectionBar: 要件 14.1, 14.3〜14.6） --- */
    .selection-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
    }
    /* 1 件以上選択されている状態を色に加えて枠でも識別できるようにする（要件 15.3） */
    .selection-bar--active {
      border-color: var(--color-primary);
      background: var(--color-primary-weak);
    }
    .selection-bar-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex: 1 1 100%;
    }
    .selection-count {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text);
    }
    .selection-count--empty {
      font-weight: 500;
      color: var(--color-text-muted);
    }
    .selection-bar-actions {
      display: flex;
      gap: var(--space-2);
      flex: 0 0 auto;
    }
    .selection-bar-edit {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      flex: 1 1 100%;
    }
    .selection-edit-label {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    .selection-bar-edit .batch-edit-field {
      flex: 0 0 auto;
      min-height: var(--tap-min);
    }
    .selection-bar-edit .batch-edit-value {
      flex: 1 1 120px;
      min-height: var(--tap-min);
    }

    /* --- 支出一覧 --- */
    .expense-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .expense-item {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-2);
      box-shadow: var(--shadow);
    }
    /* 選択中の支出は色に加えて枠でも識別できるようにする（要件 15.3） */
    .expense-item--selected {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px var(--color-primary-weak);
    }
    /* 選択チェックボックス。タップ対象を一辺 44px 以上にする（要件 9.6, 14.1） */
    .expense-select {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tap-min);
      height: var(--tap-min);
      margin: 0;
      cursor: pointer;
    }
    .expense-select-input {
      width: 20px;
      height: 20px;
      accent-color: var(--color-primary);
      cursor: pointer;
    }
    .expense-item-main {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .expense-item-desc {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .expense-item-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    .expense-item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 2px var(--space-2);
      border-radius: 999px;
      background: var(--color-surface-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .tag--method {
      background: var(--color-primary-weak);
      color: var(--color-primary);
    }
    /* 通貨コード / 為替換算額のタグ（要件 20.5） */
    .tag--currency {
      background: var(--color-surface-2);
      color: var(--color-text);
      font-weight: 600;
    }
    .tag--fx {
      background: var(--color-primary-weak);
      color: var(--color-primary);
    }
    .tag--fx-missing {
      background: var(--color-surface-2);
      color: var(--color-warning);
    }

    /* --- 通貨・為替レート設定（renderCurrencyControls: 要件 20.1, 20.3） --- */
    .rate-list {
      margin-top: var(--space-2);
    }
    /* レート未設定の行を注意色で強調する（要件 20.6） */
    .split-config-row.rate-missing input {
      border-color: var(--color-warning);
    }
    /* 立替者ラベル（誰が立て替えたかを強調・要件 12.1） */
    .expense-item-payer {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-weight: 600;
      color: var(--color-text);
    }
    .expense-item-payer .fa-hand-holding-dollar {
      color: var(--color-primary);
    }
    /* 対象人数タグ（要件 12.1） */
    .tag--participants {
      background: var(--color-surface-2);
      color: var(--color-text-muted);
    }
    /* カテゴリタグ（要件 12.4） */
    .tag--category {
      background: var(--color-surface-2);
      color: var(--color-text);
    }
    /* 発生日時（要件 12.5） */
    .expense-item-date {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      margin-top: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    /* --- 負担額の内訳（折りたたみ・要件 12.2） --- */
    .expense-split {
      margin-top: var(--space-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      overflow: hidden;
    }
    .expense-split-summary {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--tap-min);
      padding: var(--space-2) var(--space-3);
      cursor: pointer;
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text);
      list-style: none;
    }
    .expense-split-summary::-webkit-details-marker {
      display: none;
    }
    .expense-split-summary .fa-people-arrows {
      color: var(--color-primary);
    }
    .expense-split-summary-text {
      overflow-wrap: anywhere;
    }
    .split-breakdown {
      list-style: none;
      margin: 0;
      padding: var(--space-1) var(--space-3) var(--space-3);
      border-top: 1px dashed var(--color-border);
    }
    .split-breakdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-2) 0;
      font-size: var(--font-size-sm);
    }
    .split-breakdown-row + .split-breakdown-row {
      border-top: 1px solid var(--color-border);
    }
    .split-breakdown-name {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text);
      overflow-wrap: anywhere;
    }
    .split-breakdown-row--payer .split-breakdown-name {
      font-weight: 600;
    }
    .split-breakdown-mark {
      padding: 1px var(--space-2);
      border-radius: 999px;
      background: var(--color-primary-weak);
      color: var(--color-primary);
      font-size: var(--font-size-sm);
      font-weight: 600;
      white-space: nowrap;
    }
    .split-breakdown-amount {
      font-weight: 700;
      white-space: nowrap;
      color: var(--color-text);
    }

    .expense-item-actions {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .expense-item-actions .btn {
      flex: 1 1 auto;
    }

    /* --- コンパクトな支出一覧（題目単位の折りたたみ・変更5） --- */
    /* 題目行は <details>/<summary> で折りたたむ。左側に選択チェックの余白を確保する。 */
    .expense-details {
      border: none;
      background: transparent;
    }
    .expense-summary {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: var(--tap-min);
      padding: var(--space-2) var(--space-2) var(--space-2) 0;
      cursor: pointer;
      list-style: none;
    }
    .expense-summary::-webkit-details-marker {
      display: none;
    }
    .expense-summary-chevron {
      flex: 0 0 auto;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      transition: transform var(--transition-fast);
    }
    .expense-details[open] .expense-summary-chevron {
      transform: rotate(90deg);
    }
    .expense-summary-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .expense-summary-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .expense-summary-title {
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .expense-summary-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    .expense-summary-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }
    .expense-body {
      padding: var(--space-2) 0 0;
      border-top: 1px dashed var(--color-border);
      margin-top: var(--space-2);
    }
    /* 各立替（Line）の行: 「(立替者) → (相手) : 金額」 */
    .expense-line-row {
      padding: var(--space-2) 0;
    }
    .expense-line-row + .expense-line-row {
      border-top: 1px solid var(--color-border);
    }
    .expense-line-headline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--font-size-sm);
    }
    .expense-line-parties {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: var(--space-1);
      overflow-wrap: anywhere;
    }
    .expense-line-payer {
      font-weight: 700;
      color: var(--color-text);
    }
    .expense-line-arrow {
      color: var(--color-primary);
    }
    .expense-line-targets {
      color: var(--color-text);
      overflow-wrap: anywhere;
    }
    .expense-line-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    /* 立替内の個別負担額の内訳 */
    .expense-line-breakdown {
      list-style: none;
      margin: var(--space-1) 0 0;
      padding: 0 0 0 var(--space-3);
    }
    .expense-line-breakdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: 2px 0;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }
    /* 展開内の小さな操作ボタン（編集/削除） */
    .expense-body-actions {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .expense-body-actions .btn {
      flex: 1 1 auto;
      min-height: 38px;
      font-size: var(--font-size-sm);
    }

    /* --- 立替（Line）入力行: 1 つの題目（Expense）に複数の立替を持たせる --- */
    .ef-line {
      position: relative;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-2);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .ef-line-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .ef-line-index {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-weight: 700;
      color: var(--color-text);
      font-size: var(--font-size-sm);
    }
    .ef-line-index .fa-hand-holding-dollar {
      color: var(--color-primary);
    }
    .ef-line-remove {
      flex: 0 0 auto;
      min-width: var(--tap-min);
      padding: 0;
      color: var(--color-text-muted);
    }
    .ef-line .field {
      margin-bottom: var(--space-3);
    }
    .ef-line .field:last-child {
      margin-bottom: 0;
    }
    .ef-lines-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }
    .ef-lines-actions .btn {
      flex: 1 1 auto;
    }

    /* --- メンバー管理パネル（後追いの追加/削除: 要件 6） --- */
    .member-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

<body>
  <!-- =====================================================================
       静的レイアウト（プレースホルダ）

  <div id="app">

      <!-- 各画面の主要 CTA を差し込む -->

  </div>

  <!-- トースト（操作フィードバック: 要件 9.1） -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- =====================================================================
       ★ グループ間データ共有の設定（Firebase Realtime Database）★

       この欄が未設定のままでも、アプリは各端末のブラウザ内だけで動作します
       （＝端末ごとに別々のデータ。他の人とは共有されません）。

       複数人・複数端末で費用をリアルタイム共有したい場合は、無料の Firebase
       Realtime Database を作成し、下の { ... } の中に自分の設定値を貼り付けて
       コメント（/* */）を外してください。詳しい手順は Kiro に聞いてください。

       セキュリティ注意: ここに書く apiKey 等はクライアントに露出します（Firebase
       の設計上、公開されても問題ない値です）。アクセス制御は「推測困難なグループ
       URL を知っていること」に依存します。DB のセキュリティルールで groups/ 配下
       のみに読み書きを限定し、機微情報は入力しない前提で運用してください。
       ===================================================================== -->
  <script>
    // グループ間データ共有（Firebase Realtime Database: プロジェクト "Waritaka"）。
    // databaseURL / projectId は取得済み。apiKey / authDomain / appId は
    // Firebase コンソール →「プロジェクトの設定」→「マイアプリ」で Web アプリ(</>)を
    // 登録すると表示される firebaseConfig の値を貼り付ける。
    window.WARIKAN_FIREBASE_CONFIG = {
      apiKey: "AIzaSyA00ybTc4R6_geVHk9vDI_3RAkRhHNAkyo",
      authDomain: "waritaka-d74aa.firebaseapp.com",
      databaseURL: "https://waritaka-d74aa-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "waritaka-d74aa",
      appId: "1:1026915837944:web:adbae229031f740616580d"
    };
  </script>

  <script>
    'use strict';

    /* =====================================================================
     * SECTION 1: CONFIG（設定定数）
     * design.md「設定定数（config）」準拠。ファイル先頭に定数を置く。
     * ===================================================================== */

    // localStorage キー。データ形状を変えたらサフィックスを上げる（steering 準拠）。
    // v3: 題目（Expense）＋複数立替（lines）モデルへ移行（変更2）。
    const STORAGE_KEY = 'warikan_v3';

    // 旧 localStorage キー。v3 データが無いとき、順に読み込んで v3 へ移行する
    // （warikan_v2 → warikan_v1 の順に試す・変更2 のマイグレーション）。
    const LEGACY_STORAGE_KEYS = ['warikan_v2', 'warikan_v1'];

    // 分割方式: 均等 / パーセンテージ / 口数 / 金額指定
    const SPLIT_METHODS = ['equal', 'percentage', 'shares', 'amount'];

    // 既定通貨（換算丸めの基準にも用いる）
    const DEFAULT_CURRENCY = 'JPY';

    // 保存のまとめ書き（デバウンス）間隔（ms）
    const SYNC_DEBOUNCE_MS = 300;

    // リアルタイム配信の目標遅延（要件 6.1 / 16.6: 5 秒以内）
    const SYNC_MAX_LATENCY_MS = 5000;

    // 支出一覧の並べ替え順（要件 19.3）。発生日時降順が既定。
    const SORT_ORDERS = ['date_desc', 'date_asc', 'amount_desc', 'amount_asc'];

    // 精算送金の支払状態（要件 16.1）。初期状態は UNPAID。
    const PAYMENT_STATUS = { UNPAID: 'unpaid', PAID: 'paid' };

    // グループ画面の下部タブ（変更4）。id と表示ラベル・アイコンを対応づける。
    const TABS = [
      { id: 'input', label: '入力', icon: 'fa-circle-plus' },
      { id: 'history', label: '履歴', icon: 'fa-list' },
      { id: 'settle', label: '精算', icon: 'fa-money-bill-transfer' },
      { id: 'settings', label: '設定', icon: 'fa-gear' },
    ];
    const TAB_IDS = TABS.map(function (t) { return t.id; });

    // 通貨定義: minorUnit=最小通貨単位（円=1, ドル=100=セント）, symbol=表示記号。
    // minorUnit は金額整数化と換算時の丸め基準に用いる。
    const CURRENCIES = {
      JPY: { minorUnit: 1, symbol: '¥', name: '日本円' },
      USD: { minorUnit: 100, symbol: '$', name: '米ドル' },
      EUR: { minorUnit: 100, symbol: '€', name: 'ユーロ' },
      KRW: { minorUnit: 1, symbol: '₩', name: '韓国ウォン' },
      TWD: { minorUnit: 1, symbol: 'NT$', name: '台湾ドル' },
      GBP: { minorUnit: 100, symbol: '£', name: '英ポンド' },
    };

    // UI 文言辞書（通常の自然な日本語で統一）。L('キー') で引く。
    // 文言変更はここだけ直せばよい。語尾装飾（ミーム口調）は使用しない。
    const LEXICON = {
      shareTitle: 'このグループを共有',
      shareCopy: 'URLをコピー',
      shareShare: '共有',
      shareQr: 'QRコードを表示',
      toastCopied: 'URLをコピーしました',
      toastCopyFailed: 'コピーできませんでした',
      settlementCopy: '精算結果をコピー',
      settlementShare: '共有',
      toastSettlementCopied: '精算結果をコピーしました',
      addExpense: '記録する',
      updateExpense: '更新する',
      toastExpenseAdded: '記録しました',
      toastExpenseUpdated: '更新しました',
      toastExpenseDeleted: '削除しました',
      confirmExpenseDelete: 'この記録を削除しますか？',
      addLine: '立替を追加',
      removeLine: 'この立替を削除',
      settlementShortcut: '精算', // 精算導線ボタンのラベル（要件 13.1）
    };


    /* =====================================================================
     * SECTION 2: STATE（アプリ状態・in-memory）
     * design.md「State + Cache 層」準拠。単一の state オブジェクトで保持。
     * ===================================================================== */

    // 単一の in-memory 状態。変更のたび saveData() で localStorage へミラーする。
    let state = {
      groups: {},          // { [groupId]: Group } 参加/作成した Group のキャッシュ
      groupOrder: [],      // string[] 一覧表示順（要件 2.5）
      memberTemplates: [], // Array<{ id, members:string[], source }> 再利用候補（要件 17.1）
      currentGroupId: null,// 現在開いている Group（null なら一覧/作成画面）
      categoryFilter: null,// 一覧の Category 絞り込み（要件 7.3）
      searchQuery: '',     // 一覧の検索クエリ（内容 or Payer・表示上のみ・要件 19.1, 19.2）
      sortOrder: 'date_desc', // 一覧の並べ替え順（SORT_ORDERS のいずれか・既定は発生日時降順・要件 19.3, 19.4）
      online: true,        // 接続状態（要件 8.4 バナー用）
      notFound: false,     // グループが見つからない状態（要件 2.3）
      showCreate: false,   // 一覧が非空でも作成フォームを表示するフラグ（要件 1.1）
      activeTab: 'history',// グループ画面の下部タブ（'input'|'history'|'settle'|'settings'・既定 'history'・変更4）
    };

    // 現在の SyncBackend 実装（init で選択）
    let syncBackend = null;

    // 現在の購読解除関数（openGroup で差し替え）
    let unsubscribe = null;


    /* =====================================================================
     * SECTION 3: DATA（永続化・ID 生成・SyncBackend）
     * design.md「State + Cache 層 / SyncBackend インターフェース」準拠。
     * ===================================================================== */

    // 初期データ形状を返す（要件 8.3 のフォールバック先）。
    function defaultData() {
      return { groups: {}, groupOrder: [], memberTemplates: [] };
    }

    // --- スキーマ検証ヘルパー（復元時に必須フィールド欠損を検出する） ---
    // localStorage は改竄・破損しうるため、復元データは信頼せず検証する（要件 8.3）。

    // Member が必須フィールド（id, name）を持つか。
    function isValidMember(m) {
      return !!m
        && typeof m.id === 'string' && m.id.length > 0
        && typeof m.name === 'string';
    }

    // Line（1 件の立替）が必須フィールド（payerId, amount, splitMethod, participants）を持つか。
    // id は sanitize 時に補完されるため必須にしない。
    function isValidLine(l) {
      return !!l
        && typeof l.payerId === 'string' && l.payerId.length > 0
        && typeof l.amount === 'number' && Number.isFinite(l.amount)
        && typeof l.splitMethod === 'string' && SPLIT_METHODS.indexOf(l.splitMethod) !== -1
        && Array.isArray(l.participants);
    }

    // Expense（題目）が有効か。新形状（lines[] を持ち、有効な line が 1 件以上）を要求する。
    // 旧形状（top-level に payerId/amount/splitMethod/participants を持つ）は移行対象として
    // 有効扱いにする（sanitizeExpense が単一 line へ変換する・変更2 のマイグレーション）。
    function isValidExpense(e) {
      if (!e || typeof e.id !== 'string' || e.id.length === 0) return false;
      // 新形状: lines 配列（Firebase 由来のオブジェクト形も許容）に有効 line が 1 件以上。
      if (Array.isArray(e.lines)) {
        return e.lines.some(isValidLine);
      }
      if (e.lines && typeof e.lines === 'object') {
        return Object.keys(e.lines).some(function (k) { return isValidLine(e.lines[k]); });
      }
      // 旧形状（v2/v1）: top-level の立替フィールドを持てば移行可能。
      return isValidLine(e);
    }

    // Group が必須フィールドを持つか（id, name, members[], expenses[]）。
    // members / expenses は配列であることのみ要求し、要素ごとの妥当性は
    // sanitizeGroup で個別に間引く（破損した要素だけを落とす）。
    function isValidGroup(g) {
      return !!g
        && typeof g.id === 'string' && g.id.length > 0
        && typeof g.name === 'string'
        && Array.isArray(g.members)
        && Array.isArray(g.expenses);
    }

    // 1 件の Line（立替）を安全な正規形へ整える。無効なら null（呼び出し側で間引く）。
    function sanitizeLine(l) {
      if (!isValidLine(l)) return null;
      return {
        id: (typeof l.id === 'string' && l.id.length > 0) ? l.id : generateId(),
        payerId: l.payerId,
        amount: Math.round(l.amount),
        participants: l.participants.filter(function (p) { return typeof p === 'string' && p.length > 0; }),
        splitMethod: l.splitMethod,
        splitConfig: (l.splitConfig && typeof l.splitConfig === 'object') ? l.splitConfig : {},
      };
    }

    // Expense（題目）を安全な新形状へ正規化する（変更2）。
    // - title は title を優先し、無ければ旧 description を流用（旧→新の題目改名）。
    // - currency が非空でなければ baseCurrency（無ければ DEFAULT_CURRENCY）を既定付与（要件 20.2）。
    // - lines は配列（Firebase 由来のオブジェクト形も許容）を検証・間引く。
    //   旧形状（top-level の立替フィールド）は単一 line へ変換する。
    // 破損 line は落とし、line が 0 件になった Expense は呼び出し側（sanitizeGroup）で除外する。
    function sanitizeExpense(e, baseCurrency) {
      const currency = (typeof e.currency === 'string' && e.currency.length > 0)
        ? e.currency
        : (baseCurrency || DEFAULT_CURRENCY);
      const id = (typeof e.id === 'string' && e.id.length > 0) ? e.id : generateId();
      const createdAt = typeof e.createdAt === 'number' ? e.createdAt : Date.now();
      const updatedAt = typeof e.updatedAt === 'number' ? e.updatedAt : createdAt;
      const category = (e.category == null || e.category === '') ? null : e.category;
      const title = (typeof e.title === 'string')
        ? e.title
        : (typeof e.description === 'string' ? e.description : '');

      // lines 抽出: 新形状（配列/オブジェクト）または旧形状（単一 line へ変換）。
      let rawLines;
      if (Array.isArray(e.lines)) {
        rawLines = e.lines;
      } else if (e.lines && typeof e.lines === 'object') {
        rawLines = Object.keys(e.lines).map(function (k) { return e.lines[k]; });
      } else {
        // 旧 Expense（v2/v1）を単一 line へ変換する。
        rawLines = [{
          id: generateId(),
          payerId: e.payerId,
          amount: e.amount,
          participants: e.participants,
          splitMethod: e.splitMethod,
          splitConfig: e.splitConfig,
        }];
      }

      const lines = rawLines
        .map(function (l) { return sanitizeLine(l); })
        .filter(function (l) { return l !== null; });

      return {
        id: id,
        title: title,
        category: category,
        currency: currency,
        createdAt: createdAt,
        updatedAt: updatedAt,
        lines: lines,
      };
    }

    // 為替レートマップ（{ [currency]: number }）を正規化する（要件 20.3）。
    // キーは非空文字列、値は正の有限数のみ採用し、破損エントリは間引く。
    function sanitizeExchangeRates(raw) {
      if (!raw || typeof raw !== 'object') return {};
      const out = {};
      Object.keys(raw).forEach(function (k) {
        const v = raw[k];
        if (typeof k === 'string' && k.length > 0
          && typeof v === 'number' && Number.isFinite(v) && v > 0) {
          out[k] = v;
        }
      });
      return out;
    }

    // 支払済み記録マップ（{ [transferKey]: 'unpaid' | 'paid' }）を正規化する（要件 16.7）。
    // キーは非空文字列、値は PAYMENT_STATUS のいずれかのみ採用し、破損エントリは間引く。
    function sanitizeSettlements(raw) {
      if (!raw || typeof raw !== 'object') return {};
      const out = {};
      const validStatuses = [PAYMENT_STATUS.UNPAID, PAYMENT_STATUS.PAID];
      Object.keys(raw).forEach(function (k) {
        const v = raw[k];
        if (typeof k === 'string' && k.length > 0 && validStatuses.indexOf(v) !== -1) {
          out[k] = v;
        }
      });
      return out;
    }

    // メンバーテンプレート配列（Array<{ id, members:string[], source }>）を正規化する（要件 17.1）。
    // 破損した要素・非文字列のメンバー名は間引く。配列でなければ空配列を返す。
    function sanitizeMemberTemplates(raw) {
      if (!Array.isArray(raw)) return [];
      const out = [];
      raw.forEach(function (t) {
        if (!t || typeof t !== 'object') return;
        if (typeof t.id !== 'string' || t.id.length === 0) return;
        if (!Array.isArray(t.members)) return;
        out.push({
          id: t.id,
          members: t.members.filter(function (n) { return typeof n === 'string'; }),
          source: typeof t.source === 'string' ? t.source : '',
        });
      });
      return out;
    }

    // 復元した Group を安全な形へ正規化する。
    // 必須フィールドを欠く Group は null（＝破損なので空扱い）、
    // 破損した Member / Expense 要素は間引いて返す（要件 8.3）。
    // 多通貨・支払済みの追加フィールド（baseCurrency / exchangeRates / settlements /
    // expense.currency）を既定補完・型検証する（warikan_v2 マイグレーション・要件 20.1, 20.2, 16.7）。
    function sanitizeGroup(g) {
      if (!isValidGroup(g)) return null;
      const currency = typeof g.currency === 'string' ? g.currency : DEFAULT_CURRENCY;
      // baseCurrency 既定は既存 currency（無ければ DEFAULT_CURRENCY）（要件 20.1）。
      const baseCurrency = (typeof g.baseCurrency === 'string' && g.baseCurrency.length > 0)
        ? g.baseCurrency
        : currency;
      return {
        id: g.id,
        name: g.name,
        currency: currency,
        baseCurrency: baseCurrency,
        exchangeRates: sanitizeExchangeRates(g.exchangeRates),
        members: g.members.filter(isValidMember),
        expenses: g.expenses.filter(isValidExpense).map(function (e) {
          return sanitizeExpense(e, baseCurrency);
        }).filter(function (e) {
          // line が 1 件も残らなかった Expense（全 line 破損）は落とす（変更2）。
          return Array.isArray(e.lines) && e.lines.length > 0;
        }),
        settlements: sanitizeSettlements(g.settlements),
        createdAt: typeof g.createdAt === 'number' ? g.createdAt : Date.now(),
        updatedAt: typeof g.updatedAt === 'number' ? g.updatedAt : Date.now(),
      };
    }

    // localStorage のペイロード文字列を検証・正規化する（共通処理）。
    // JSON パース失敗・トップレベル不整合なら null、妥当なら
    // { groups, groupOrder, memberTemplates } を返す。破損 Group / 要素は間引く（要件 8.3）。
    // warikan_v1 / warikan_v2 いずれの形状もここを通し、sanitizeGroup が追加フィールドを
    // 既定補完することで v1 → v2 マイグレーションを兼ねる（要件 20.1, 20.2, 16.7, 17.1）。
    function parseStoredPayload(raw) {
      if (!raw) return null;

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        // JSON パース失敗 → 破損扱い（要件 8.3）。
        return null;
      }

      // トップレベルのスキーマ不整合も破損扱いにする。
      if (!parsed || typeof parsed !== 'object' || typeof parsed.groups !== 'object' || parsed.groups === null) {
        return null;
      }

      // Group 単位で検証・正規化する。破損した Group は取り込まない。
      const groups = {};
      Object.keys(parsed.groups).forEach(function (groupId) {
        const clean = sanitizeGroup(parsed.groups[groupId]);
        // キーと Group.id の不整合も破損扱いとして取り除く。
        if (clean && clean.id === groupId) {
          groups[groupId] = clean;
        }
      });

      // groupOrder は配列であること、かつ実在する Group のみに揃える（要件 2.5）。
      let order = Array.isArray(parsed.groupOrder) ? parsed.groupOrder : [];
      order = order.filter(function (id) {
        return typeof id === 'string' && Object.prototype.hasOwnProperty.call(groups, id);
      });
      // groupOrder に含まれていない復元済み Group も末尾に補完する。
      Object.keys(groups).forEach(function (id) {
        if (order.indexOf(id) === -1) order.push(id);
      });

      return {
        groups: groups,
        groupOrder: order,
        memberTemplates: sanitizeMemberTemplates(parsed.memberTemplates),
      };
    }

    // 正規化済みデータを state へ反映する（loadData のフォールバック/移行で共用）。
    function applyLoadedData(data) {
      state.groups = data.groups || {};
      state.groupOrder = data.groupOrder || [];
      state.memberTemplates = data.memberTemplates || [];
    }

    // localStorage から安全に raw 文字列を取り出す（不可環境では null）。
    function readStorageRaw(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        // localStorage 自体が使えない環境（プライベートモード等）。
        return null;
      }
    }

    // localStorage から復元する。
    // JSON パース失敗・スキーマ不整合を検出したら例外を投げず defaultData に
    // フォールバックし、破損した Group は取り除く（＝空として扱う）（要件 8.2, 8.3）。
    // v2 データが無い場合は旧キー（warikan_v1）を読み込んで移行し、
    // 移行できたら新キー（warikan_v2）へ保存する（要件 8.2, 20.1, 20.2, 16.7, 17.1）。
    function loadData() {
      const fallback = defaultData();

      // まず現行キー（warikan_v2）を読む。
      const raw = readStorageRaw(STORAGE_KEY);
      if (raw) {
        const parsed = parseStoredPayload(raw);
        applyLoadedData(parsed || fallback);
        return;
      }

      // v3 データが無い → 旧キー（warikan_v2 → warikan_v1 の順）からの移行を試みる。
      for (let i = 0; i < LEGACY_STORAGE_KEYS.length; i++) {
        const legacyRaw = readStorageRaw(LEGACY_STORAGE_KEYS[i]);
        if (!legacyRaw) continue;
        const migrated = parseStoredPayload(legacyRaw);
        if (migrated) {
          applyLoadedData(migrated);
          // 移行後は新キー（warikan_v3）へ保存する。
          saveData();
          return;
        }
      }

      // v3 も旧キーも無い/破損 → 空データにフォールバック。
      applyLoadedData(fallback);
    }

    // 現在の state を localStorage へミラーする。
    // 変更後は必ず呼ぶ（steering 準拠、要件 8.1）。memberTemplates も併せて保存する（要件 17.1）。
    function saveData() {
      const payload = {
        groups: state.groups,
        groupOrder: state.groupOrder,
        memberTemplates: state.memberTemplates || [],
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        // 容量超過や localStorage 不可の環境では黙って握りつぶす
        // （永続化はできないが in-memory の state はそのまま動作する）。
      }
    }

    // 推測困難なランダム ID（Group/Member/Expense 共通）。
    // Group_ID は URL の一部かつアクセス制御の実質的な鍵となるため
    // UUID v4 の十分なエントロピーを用いる（design.md「ID 生成」）。
    function generateId() {
      return crypto.randomUUID();
    }

    // UI 文言を引く（文言辞書 LEXICON から）。未定義キーは空文字を返す。
    function L(key) {
      return Object.prototype.hasOwnProperty.call(LEXICON, key) ? LEXICON[key] : '';
    }

    // --- SyncBackend 抽象（実装は task 5 で差し替え可能に） ---
    //
    // SyncBackend はグループデータの共有・同期を隠蔽する抽象インターフェース。
    // アプリ本体は下記の契約にのみ依存し、Firebase 実装（createFirebaseSyncBackend）と
    // localStorage のみのフォールバック実装（createLocalSyncBackend）を差し替え可能にする
    // （design.md「SyncBackend インターフェース」）。
    //
    // SyncBackend の契約（すべての実装がこの形を満たす）:
    //
    /**
     * @typedef {Object} SyncBackend
     * @property {(groupId: string, callback: (group: Group) => void) => (function(): void)} subscribe
     *   groupId のデータ更新を購読する。更新のたびに callback(group) を呼ぶ。
     *   購読解除用の関数（unsubscribe）を返す（要件 6.2）。
     * @property {(groupId: string, group: Group) => Promise<void>} save
     *   group を永続化/配信する。完了を表す Promise を返す（要件 8.1）。
     * @property {(callback: (online: boolean) => void) => void} onConnectionChange
     *   接続状態の変化を通知する。callback には現在のオンライン状態（boolean）を渡す
     *   （online/offline バナー用・要件 8.4, 8.5）。
     * @property {(groupId: string) => Promise<boolean>} exists
     *   groupId のデータが存在するかを返す（要件 2.3「見つからない」判定用）。
     */

    // localStorage から groupId の Group を読み出して正規化する（無ければ null）。
    // LocalSyncBackend の subscribe / exists から共用する。破損データは null 扱い（要件 8.3）。
    function readGroupFromStorage(groupId) {
      let raw;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        return null;
      }
      if (!raw) return null;

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        return null;
      }
      if (!parsed || typeof parsed !== 'object' || !parsed.groups) return null;

      const clean = sanitizeGroup(parsed.groups[groupId]);
      return (clean && clean.id === groupId) ? clean : null;
    }

    // localStorage のみで動作するフォールバック実装（バックエンド未設定時）。
    // 同期は行わないが、別タブの変更は storage イベントで購読でき、単一端末アプリとして完全動作する。
    // 返り値は上記 SyncBackend 契約（subscribe / save / onConnectionChange / exists）を満たす。
    function createLocalSyncBackend() {
      return {
        // groupId の更新を購読する。別タブが localStorage を書き換えると storage イベントが発火し、
        // 当該 group を読み直して callback(group) を呼ぶ（別タブ同期・要件 6.2）。
        subscribe: function (groupId, callback) {
          function onStorage(e) {
            // STORAGE_KEY 以外の変更は無視（e.key===null は clear() のケース）。
            if (e.key !== null && e.key !== STORAGE_KEY) return;
            const group = readGroupFromStorage(groupId);
            if (group) callback(group);
          }
          window.addEventListener('storage', onStorage);
          // 購読解除関数を返す。
          return function unsubscribe() {
            window.removeEventListener('storage', onStorage);
          };
        },

        // state.groups[groupId] を localStorage へミラーする（saveData 経由・要件 8.1）。
        // ローカル実装のため即時完了の Promise を返す。
        save: function (groupId, group) {
          if (groupId && group) {
            state.groups[groupId] = group;
            if (state.groupOrder.indexOf(groupId) === -1) {
              state.groupOrder.push(groupId);
            }
          }
          saveData();
          return Promise.resolve();
        },

        // navigator.onLine と online/offline イベントで接続状態を通知する（要件 8.4, 8.5）。
        // 登録直後に現在のオンライン状態も即時通知する。
        onConnectionChange: function (callback) {
          function notify() {
            callback(navigator.onLine);
          }
          window.addEventListener('online', notify);
          window.addEventListener('offline', notify);
          notify();
        },

        // groupId の Group が localStorage 上に存在するか（要件 2.3）。
        exists: function (groupId) {
          return Promise.resolve(!!readGroupFromStorage(groupId));
        },
      };
    }

    // Firebase から動的 import する modular SDK のバージョン。
    // gstatic CDN の ES モジュールを直接読み込むためビルド不要（design.md「設計方針」）。
    const FIREBASE_VERSION = '10.12.0';

    // Firebase config が Realtime Database 接続に足る形かを検証する。
    // RTDB は databaseURL が必須、initializeApp は apiKey を要求する。
    // 未設定・欠損は「バックエンド未設定」とみなし、呼び出し側で即フォールバックする。
    function isValidFirebaseConfig(cfg) {
      return !!cfg
        && typeof cfg === 'object'
        && typeof cfg.apiKey === 'string' && cfg.apiKey.length > 0
        && typeof cfg.databaseURL === 'string' && cfg.databaseURL.length > 0;
    }

    // Firebase から受信した groups/{groupId} の生データを、アプリ内部の Group 形状へ正規化する。
    // - expenses は Firebase 上ではマップ（expenses/{id}）だが、内部では配列で扱うため変換する。
    // - members は配列だが、Firebase は疎な配列をオブジェクト化することがあるため両形式に対応する。
    // - 最終的に sanitizeGroup を通し、破損した要素の間引きと既定値の補完を行う（要件 8.3）。
    // 破損・欠損で正規化できない場合は null を返す。
    function normalizeFirebaseGroup(groupId, raw) {
      if (!raw || typeof raw !== 'object') return null;

      // expenses マップ（{id: expense}）を配列へ変換する。id が欠ければキーで補完する。
      const expenses = (raw.expenses && typeof raw.expenses === 'object')
        ? Object.keys(raw.expenses).map(function (key) {
            const e = raw.expenses[key];
            if (e && typeof e === 'object' && typeof e.id === 'string' && e.id.length > 0) {
              return e;
            }
            return Object.assign({}, e, { id: key });
          })
        : [];

      // members は配列想定だが、オブジェクト化されている場合は値配列へ戻す。
      const members = Array.isArray(raw.members)
        ? raw.members
        : (raw.members && typeof raw.members === 'object'
            ? Object.keys(raw.members).map(function (k) { return raw.members[k]; })
            : []);

      const candidate = {
        id: (typeof raw.id === 'string' && raw.id.length > 0) ? raw.id : groupId,
        name: raw.name,
        currency: raw.currency,
        // 多通貨・支払済みの追加フィールドも取り込む（要件 20.1, 20.2, 16.7）。
        // 既定補完・型検証は sanitizeGroup 側で行う（exchangeRates / settlements は
        // Firebase 上ではマップとして格納されるためそのまま渡す）。
        baseCurrency: raw.baseCurrency,
        exchangeRates: raw.exchangeRates,
        members: members,
        expenses: expenses,
        settlements: raw.settlements,
        createdAt: raw.createdAt,
        updatedAt: raw.updatedAt,
      };

      // 既存の正規化・検証ロジックを再利用する（要件 8.3）。
      return sanitizeGroup(candidate);
    }

    // Firebase Realtime DB 実装（CDN import・ビルド不要）。
    //
    // 動的 import のため非同期ファクトリ（Promise を返す）とする。
    // 返り値は SyncBackend 契約（subscribe / save / onConnectionChange / exists）を満たす。
    // config は省略可能で、省略時は window.WARIKAN_FIREBASE_CONFIG を参照する。
    // 未設定 / 無効 / import 失敗 / 初期化失敗のいずれでも createLocalSyncBackend() へ
    // フォールバックし、バックエンド無しでも単独動作を保証する（要件 8.4）。
    //
    // セキュリティ注記: Firebase の API キーはクライアントに露出する（Firebase の設計上許容）。
    // アクセス制御は推測困難な Group_ID を知っていることに依存する（design.md 参照）。
    // 機微情報を入れない前提のため、実際の認証情報はコードに埋め込まず設定から読み込む。
    async function createFirebaseSyncBackend(config) {
      // config 省略時はグローバル設定を参照する（未設定なら即フォールバック）。
      const cfg = config || (typeof window !== 'undefined' ? window.WARIKAN_FIREBASE_CONFIG : null);

      // バックエンド未設定 / 無効な config → ローカル実装へフォールバック。
      if (!isValidFirebaseConfig(cfg)) {
        return createLocalSyncBackend();
      }

      // Firebase modular SDK を CDN から動的 import する（ビルド不要）。
      let dbMod, db;
      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/firebase-app.js');
        dbMod = await import('https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/firebase-database.js');
        const app = appMod.initializeApp(cfg);
        db = dbMod.getDatabase(app);
      } catch (e) {
        // import 失敗 / 初期化失敗（オフライン・CDN 到達不可・config 不正）→ フォールバック。
        return createLocalSyncBackend();
      }

      // modular API を取り出す（以降のクロージャで再利用する）。
      const ref = dbMod.ref;
      const onValue = dbMod.onValue;
      const get = dbMod.get;
      const update = dbMod.update;

      // 直近に書き込んだ Expense の updatedAt を groupId 単位で記録する。
      // これを使って「変更のあった expenses/{id} のみ」を差分書き込みする。
      // groupId -> { expenses: { [expenseId]: updatedAt } }
      const lastSaved = new Map();

      return {
        // groups/{groupId} を onValue で購読し、更新のたびに正規化した Group で callback を呼ぶ。
        // onValue の戻り値（解除関数）をそのまま unsubscribe として返す（要件 6.1, 6.2, 6.3）。
        subscribe: function (groupId, callback) {
          const groupRef = ref(db, 'groups/' + groupId);
          const off = onValue(groupRef, function (snapshot) {
            const group = normalizeFirebaseGroup(groupId, snapshot.val());
            if (group) callback(group);
          });
          return function unsubscribe() { off(); };
        },

        // 変更のあった expenses/{id} とメタデータ（name, currency, members, updatedAt）のみを
        // マルチパス update で書き込む。Expense をキー単位で書くことで後着優先（LWW）を
        // Expense 単位で実現する（同一 Expense の同時更新は後着が残り、異なる Expense は両立）
        // （要件 6.4, 6.5, 8.1）。
        save: function (groupId, group) {
          if (!groupId || !group) return Promise.resolve();
          try {
            const prev = lastSaved.get(groupId) || { expenses: {} };
            const base = 'groups/' + groupId + '/';
            const updates = {};

            // メタデータは常に最新へ更新する。
            updates[base + 'id'] = group.id;
            updates[base + 'name'] = group.name;
            updates[base + 'currency'] = group.currency || DEFAULT_CURRENCY;
            // 多通貨のグループ設定も同期する（要件 20.1, 20.3）。
            updates[base + 'baseCurrency'] = group.baseCurrency || group.currency || DEFAULT_CURRENCY;
            updates[base + 'exchangeRates'] = (group.exchangeRates && typeof group.exchangeRates === 'object')
              ? group.exchangeRates : {};
            updates[base + 'members'] = Array.isArray(group.members) ? group.members : [];
            updates[base + 'updatedAt'] = (typeof group.updatedAt === 'number') ? group.updatedAt : Date.now();
            if (typeof group.createdAt === 'number') {
              updates[base + 'createdAt'] = group.createdAt;
            }

            // 支払済み記録（Payment_Status）を settlements/{transferKey} 単位で書き込む
            // （要件 16.6, 16.7）。キー単位で書くことで後着優先（LWW）をキー単位に保ち、
            // 異なる送金への同時更新は両立し、同一送金への更新は後着が残る。
            // transferKey は `${fromId}|${toId}|${amount}` 形式（'|'・UUID・整数のみで、
            // Firebase の禁止文字 . $ # [ ] / を含まないため、そのままパスキーに使える）。
            const settlements = (group.settlements && typeof group.settlements === 'object')
              ? group.settlements : {};
            Object.keys(settlements).forEach(function (k) {
              if (typeof k !== 'string' || k.length === 0) return;
              updates[base + 'settlements/' + k] = settlements[k];
            });

            // Expense は差分のみ書き込む（新規、または updatedAt が変化したもの）。
            const currentExpenses = Array.isArray(group.expenses) ? group.expenses : [];
            const nextUpdatedAt = {};
            currentExpenses.forEach(function (e) {
              if (!e || typeof e.id !== 'string' || e.id.length === 0) return;
              const cur = (typeof e.updatedAt === 'number') ? e.updatedAt : 0;
              nextUpdatedAt[e.id] = cur;
              const prevAt = prev.expenses[e.id];
              if (prevAt === undefined || prevAt !== cur) {
                updates[base + 'expenses/' + e.id] = e;
              }
            });

            // 前回存在したが今回消えた Expense は null をセットして削除する（要件 3.5）。
            Object.keys(prev.expenses).forEach(function (id) {
              if (!Object.prototype.hasOwnProperty.call(nextUpdatedAt, id)) {
                updates[base + 'expenses/' + id] = null;
              }
            });

            // 今回書き込んだスナップショットを記録して次回の差分基準にする。
            lastSaved.set(groupId, { expenses: nextUpdatedAt });

            return Promise.resolve(update(ref(db), updates));
          } catch (e) {
            return Promise.reject(e);
          }
        },

        // .info/connected を購読して接続状態（online/offline）を通知する（要件 8.4, 8.5）。
        // 監視自体に失敗した場合はオンライン扱いにフォールバックする。
        onConnectionChange: function (callback) {
          try {
            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, function (snap) {
              callback(snap.val() === true);
            });
          } catch (e) {
            callback(true);
          }
        },

        // groups/{groupId} の存在を get(ref) で確認する（要件 2.3「見つからない」判定）。
        exists: function (groupId) {
          const groupRef = ref(db, 'groups/' + groupId);
          return get(groupRef).then(function (snap) {
            return snap.exists();
          }).catch(function () {
            return false;
          });
        },
      };
    }

    // ===== 改善案: claude.ai のページの共有データベースで同期する =====
    // このページを開いた全員が、同じグループ一覧・同じ経費を見られる。
    const EXPENSE_CATEGORIES = ['朝食','昼食','夕食','カフェ・おやつ','お酒','コンビニ','スーパー・買い出し','ETC（高速代）','ガソリン代','車代（レンタカー）','駐車場','電車・バス','タクシー','宿泊','観光・入場料','お土産','その他'];
    // 修正1・2: 削除した支出・メンバーの id を覚えておき、本家からの取りこみで復活させない。
    const TOMBS = (function () {
      try { return JSON.parse(localStorage.getItem('waritaka-tombs') || '{}'); } catch (e) { return {}; }
    })();
    function tombsOf(gid) {
      if (!TOMBS[gid]) TOMBS[gid] = { e: [], m: [] };
      return TOMBS[gid];
    }
    function addTombs(gid, kind, ids) {
      const t = tombsOf(gid); let changed = false;
      ids.forEach(function (id) { if (id && t[kind].indexOf(id) === -1) { t[kind].push(id); changed = true; } });
      if (changed) { try { localStorage.setItem('waritaka-tombs', JSON.stringify(TOMBS)); } catch (e) {} }
      return changed;
    }
    // 修正4: 入力欄を操作中は、ほかの人の更新で画面を描き直さない（入力が消えるのを防ぐ）。
    let _deferredRender = false;
    function isTyping() {
      const a = document.activeElement;
      return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#tab-content'));
    }
    function safeRender() {
      if (isTyping()) { _deferredRender = true; return; }
      _deferredRender = false; render();
    }
    document.addEventListener('focusout', function () {
      setTimeout(function () { if (_deferredRender && !isTyping()) { _deferredRender = false; render(); } }, 0);
    });
    // 修正6: claude.ai のページの中では確認ダイアログ（confirm）が出ず、いつも「キャンセル」扱いになる。
    // そのため「もう一度押すと実行」に置きかえる（4秒以内に同じボタンをもう一度押すと実行）。
    (function () {
      let lastMsg = null, lastAt = 0;
      window.confirm = function (msg) {
        const now = Date.now();
        if (msg === lastMsg && now - lastAt < 4000) { lastMsg = null; return true; }
        lastMsg = msg; lastAt = now;
        const first = String(msg || '').split('\n')[0];

    // ===== 本家ワリタカ（Firebase）に書かれた内容をこちらへ取りこむ =====
    const WARITAKA_RTDB = 'https://waritaka-d74aa-default-rtdb.asia-southeast1.firebasedatabase.app';

    // --- 保存経路ヘルパー（Actions から使う） ---
    // Actions は「検証 → state 更新 → saveData → syncBackend.save → 再描画」の順で処理する。
    // persistGroup はそのうち「state 更新 → saveData → syncBackend.save」を担う（検証は呼び出し側の前提）。
    // localStorage ミラーは即時実行して永続化を保証し（要件 8.1）、
    // syncBackend.save は SYNC_DEBOUNCE_MS でまとめ書きして連続変更をバッチ化する。

    let _saveTimer = null;              // デバウンス用タイマー
    const _pendingSaves = new Map();    // groupId -> group（保留中の最新スナップショット）

    // 保留中の syncBackend.save をまとめて実行する（デバウンス flush）。

    // 検証済みの Group を保存する。state を更新し、localStorage へ即時ミラーし、

    /* =====================================================================
     * SECTION 4: CORE（純粋関数・計算層 / テスト対象）
     * design.md「Core 計算層」準拠。副作用なし・決定的。
     * ===================================================================== */

    // --- 金額ユーティリティ（最小通貨単位整数 <-> 表示文字列） ---
    // 金額はすべて「最小通貨単位の整数」で保持・計算する（design.md「金額の扱い」）。
    // 表示層でのみ Currency（minorUnit/symbol）に従いフォーマット/パースする。

    // minorUnit（例: 1, 100, 1000）に対応する小数桁数を返す（1→0, 100→2, 1000→3）。
    function minorUnitDigits(minorUnit) {
      let digits = 0;
      let u = minorUnit;
      while (u > 1) {
        u /= 10;
        digits++;
      }
      return digits;
    }

    // 通貨定義を取得（未知コードは既定通貨にフォールバック）。
    function currencyOf(currencyCode) {
      return CURRENCIES[currencyCode] || CURRENCIES[DEFAULT_CURRENCY];
    }

    // 最小通貨単位の整数 amount を、Currency に従って表示文字列へ整形する。
    // 例: formatAmount(1000, 'JPY') => '¥1,000' / formatAmount(1050, 'USD') => '$10.50'
    function formatAmount(amount, currencyCode) {
      const cur = currencyOf(currencyCode);
      const minorUnit = cur.minorUnit;
      const symbol = cur.symbol;
      const digits = minorUnitDigits(minorUnit);
      const value = typeof amount === 'number' && Number.isFinite(amount) ? Math.round(amount) : 0;
      const negative = value < 0;
      const abs = Math.abs(value);
      const major = Math.floor(abs / minorUnit);
      let numStr = major.toLocaleString('en-US');
      if (digits > 0) {
        const minor = abs % minorUnit;
        numStr += '.' + String(minor).padStart(digits, '0');
      }
      return (negative ? '-' : '') + symbol + numStr;
    }

    // 発生日時（epoch ミリ秒）を読みやすい日時文字列へ整形する（要件 12.5）。
    // 例: formatDateTime(1700000000000) => '2023/11/15 06:13'。無効値は空文字。
    function formatDateTime(ms) {
      if (!Number.isFinite(ms)) return '';
      const d = new Date(ms);
      if (isNaN(d.getTime())) return '';
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // 表示文字列（記号・桁区切りを含みうる）を最小通貨単位の整数へ変換する。
    // 解釈できない場合は null を返す。例: parseAmount('¥1,000', 'JPY') => 1000
    function parseAmount(text, currencyCode) {
      const cur = currencyOf(currencyCode);
      const minorUnit = cur.minorUnit;
      let s = typeof text === 'number' ? String(text) : text;
      if (typeof s !== 'string') return null;
      // 記号・空白・桁区切りカンマを除去し、数字・小数点・符号のみ残す
      s = s.trim().replace(/[,\s]/g, '').replace(/[^0-9.\-]/g, '');
      if (s === '' || s === '-' || s === '.' || s === '-.') return null;
      const value = Number(s);
      if (!Number.isFinite(value)) return null;
      return Math.round(value * minorUnit);
    }

    // 最大剰余法（largest remainder method）で total を重み付き整数配分する。
    // participants: memberId[] / weights: memberId -> 非負の重み。
    // 手順: (1) 各参加者に floor(total*w_i/ΣW) を割り当て、
    //       (2) 残余 = total - Σfloor を、剰余（整数）が大きい参加者から 1 単位ずつ配る。
    // 端数の同点は participants の並び順で決定的に処理する。
    // 戻り値: Map<memberId, integerAmount>（合計は必ず total に一致）。
    function allocateByLargestRemainder(total, participants, weights) {
      const result = new Map();
      const n = participants.length;
      if (n === 0) return result;

      let totalWeight = 0;
      const w = participants.map(function (id) {
        const wi = weights && Number.isFinite(weights[id]) && weights[id] > 0 ? weights[id] : 0;
        totalWeight += wi;
        return wi;
      });

      // 全重み 0（不正入力の保険）は均等割にフォールバックする。
      let effectiveWeights = w;
      let effectiveTotalWeight = totalWeight;
      if (totalWeight <= 0) {
        effectiveWeights = participants.map(function () { return 1; });
        effectiveTotalWeight = n;
      }

      // (1) 整数部と剰余を整数演算で求める（浮動小数点誤差を避ける）。
      let assigned = 0;
      const entries = participants.map(function (id, i) {
        const numerator = total * effectiveWeights[i];
        const floor = Math.floor(numerator / effectiveTotalWeight);
        const remainder = numerator - floor * effectiveTotalWeight; // [0, effectiveTotalWeight)
        assigned += floor;
        result.set(id, floor);
        return { id, index: i, remainder };
      });

      // (2) 残余を剰余の大きい順（同点は並び順）に 1 単位ずつ配る。
      let leftover = total - assigned;
      if (leftover > 0) {
        const ranked = entries.slice().sort(function (a, b) {
          if (b.remainder !== a.remainder) return b.remainder - a.remainder;
          return a.index - b.index;
        });
        for (let k = 0; k < leftover; k++) {
          const target = ranked[k % ranked.length];
          result.set(target.id, result.get(target.id) + 1);
        }
      }

      return result;
    }

    // 1 件の Line（立替）を参加者ごとの負担額（最小通貨単位整数）に配分する。
    // 端数は最大剰余法で調整し、合計 = line.amount を保証（要件 4.1,4.2,4.4,4.5,4.7）。
    // line は amount/participants/splitMethod/splitConfig を持つ（Expense の各 lines[] 要素）。
    // 戻り値: Map<memberId, integerAmount>
    function computeSplit(line) {
      const result = new Map();
      if (!line) return result;

      const amount = Number.isFinite(line.amount) ? Math.round(line.amount) : 0;
      const participants = Array.isArray(line.participants) ? line.participants : [];
      if (participants.length === 0) return result;

      const method = line.splitMethod;
      const config = line.splitConfig || {};

      switch (method) {
        case 'equal': {
          // 均等割: 全参加者の重みを 1 として最大剰余法で配分（要件 4.1）。
          const weights = {};
          participants.forEach(function (id) { weights[id] = 1; });
          return allocateByLargestRemainder(amount, participants, weights);
        }

        case 'percentage': {
          // パーセンテージ割: percents（合計 100）を重みとして配分（要件 4.2）。
          const percents = config.percents || {};
          return allocateByLargestRemainder(amount, participants, percents);
        }

        case 'shares': {
          // 人数（口数）割: shares（正の整数の口数）を重みとして配分（要件 4.4）。
          const shares = config.shares || {};
          return allocateByLargestRemainder(amount, participants, shares);
        }

        case 'amount': {
          // 金額指定割: 指定額をそのまま負担額とする（合計 = 総額は検証済み前提。要件 4.5）。
          const amounts = config.amounts || {};
          participants.forEach(function (id) {
            const a = Number.isFinite(amounts[id]) ? Math.round(amounts[id]) : 0;
            result.set(id, a);
          });
          return result;
        }

        default: {
          // 未知の方式は均等割として扱う（保険）。
          const weights = {};
          participants.forEach(function (id) { weights[id] = 1; });
          return allocateByLargestRemainder(amount, participants, weights);
        }
      }

    // 新 API 名（変更3）: computeLineSplit は 1 件の Line（立替）を配分する関数。
    // 旧名 computeSplit を line 対象へリネームした別名（ロジック不変・後方互換）。
    const computeLineSplit = computeSplit;

    // Expense（題目）の合計額を返す（全 line.amount の合計・expense.currency 建て・変更3）。
    // 副作用なし・決定的。金額は最小通貨単位の整数。
    function expenseTotal(expense) {
      if (!expense) return 0;
      const lines = Array.isArray(expense.lines) ? expense.lines : [];
      let sum = 0;
      lines.forEach(function (line) {
        if (line && Number.isFinite(line.amount)) sum += Math.round(line.amount);
      });
      return sum;
    }

    // Group 内の全 Expense から各 Member の Balance を算出（合計は必ず 0）。
    // Balance = 立替総額 - 負担総額（要件 5.1, 5.2）。
    // 戻り値: Map<memberId, integerBalance>
    function computeBalances(group) {
      const balances = new Map();
      if (!group) return balances;

      // 全 Member を 0 で初期化（Expense に登場しない Member も Balance 0 として扱う）。
      const members = Array.isArray(group.members) ? group.members : [];
      members.forEach(function (m) {
        if (m && m.id != null) balances.set(m.id, 0);
      });

      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      expenses.forEach(function (expense) {
        if (!expense) return;

        // 各 Expense（題目）は複数の Line（立替）を持つ。line ごとに配分する（変更2）。
        const lines = Array.isArray(expense.lines) ? expense.lines : [];
        lines.forEach(function (line) {
          if (!line) return;

          // 立替: この line の Payer は line 合計（＝負担配分の合計）を立て替えている。
          const shares = computeSplit(line);
          let total = 0;
          shares.forEach(function (amount) { total += amount; });

          const payerId = line.payerId;
          if (payerId != null) {
            balances.set(payerId, (balances.get(payerId) || 0) + total);
          }

          // 負担: 各 Participant の負担額を減算する。
          shares.forEach(function (amount, memberId) {
            balances.set(memberId, (balances.get(memberId) || 0) - amount);
          });
        });
      });

    }

    // Balance から送金件数を最小化する送金リストを生成（貪欲法）。
    // 戻り値: Array<{ fromId, toId, amount }>（要件 5.4）
    function computeSettlement(balances) {
      const plan = [];
      if (!balances) return plan;

      // 債権者（Balance > 0: 受取）と債務者（Balance < 0: 支払）に分ける。
      const creditors = [];
      const debtors = [];
      balances.forEach(function (amount, id) {
        if (amount > 0) creditors.push({ id: id, amount: amount });
        else if (amount < 0) debtors.push({ id: id, amount: -amount });
      });

      // 貪欲法: 毎回「最大債権者」と「最大債務者」を突き合わせ、送金件数を最小化する。
      while (creditors.length > 0 && debtors.length > 0) {
        // 残額の大きい順に並べ替え、それぞれの先頭（最大）を取り出す。
        creditors.sort(function (a, b) { return b.amount - a.amount; });
