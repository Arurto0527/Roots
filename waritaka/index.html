      // 換算レート不足時は総額・Category 別合計を基準通貨で確定できないため、その旨を表示する（要件 20.6）。
      const baseResult = computeBalancesInBase(group);
      if (!baseResult.ok) {
        const missing = (baseResult.missing || []).map(function (c) {
          const cur = CURRENCIES[c];
          return cur ? (cur.symbol + ' ' + c) : c;
        }).join('、');
        section.innerHTML =
          '<h3 class="panel-title"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i> 集計</h3>' +
          '<p class="field-error" role="alert">' +
          '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ' +
          '為替レートが不足しているため集計を確定できません（不足通貨: ' + escapeHtml(missing) + '）。</p>';
        return;
      }

      const t = totals(group);

      // Category 別合計（金額の大きい順に並べる）。
      const categoryRows = Array.from(t.byCategory.entries())

    // 通貨・為替レート設定を #currency-section へ描画する（要件 20.1, 20.3）。
    // - Base_Currency（精算の基準通貨）の選択（要件 20.1）
    // - 基準通貨と異なる通貨で登録された支出に対する Exchange_Rate 手入力（要件 20.3）
    // レートは「1 単位の当該通貨 = ? 単位の基準通貨」として入力する。
    function renderCurrencyControls() {
      const section = document.getElementById('currency-section');
      if (!section) return;

      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) { section.innerHTML = ''; return; }

      const baseCurrency = baseCurrencyOf(group);
      const baseSym = currencyOf(baseCurrency).symbol;
      const rates = (group.exchangeRates && typeof group.exchangeRates === 'object')
        ? group.exchangeRates : {};

      // Base_Currency 選択（要件 20.1）。onchange で setBaseCurrency を呼ぶ。
      const baseOptions = Object.keys(CURRENCIES).map(function (code) {
        const c = CURRENCIES[code];

        return '<option value="' + escapeHtml(code) + '"' + sel + '>' +
          escapeHtml(c.symbol) + ' ' + escapeHtml(code) + '（' + escapeHtml(c.name) + '）</option>';
      }).join('');
      const baseHtml =
        '<div class="field">' +
        '<label for="base-currency-select">基準通貨（精算に使う通貨）</label>' +
        '<select id="base-currency-select" onchange="setBaseCurrency(this.value)">' + baseOptions + '</select>' +
        '</div>';

      // 為替レート入力が必要な通貨を収集する: 支出で使われている非基準通貨 + 既に入力済みのレート通貨。
      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const foreign = [];
      const addForeign = function (code) {
        if (typeof code === 'string' && code.length > 0 && code !== baseCurrency
          && CURRENCIES[code] && foreign.indexOf(code) === -1) {

      expenses.forEach(function (e) { if (e) addForeign(e.currency); });
      Object.keys(rates).forEach(function (code) { addForeign(code); });

      let ratesHtml;
      if (foreign.length === 0) {
        ratesHtml = '';
      } else {
        const rows = foreign.map(function (code) {
          const sym = currencyOf(code).symbol;

            '<input type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="' + val + '"' +
            ' aria-label="' + escapeHtml(code + ' から ' + baseCurrency + ' への為替レート') + '"' +
            ' onchange="setExchangeRate(\'' + escapeHtml(code) + '\', this.value)" />' +
            '<span class="split-config-unit">' + escapeHtml(baseSym + ' ' + baseCurrency) + '</span>' +
            '</span></div>'

    /* ---------------------------------------------------------------------
     * 依存ゼロの QR コード生成（byte モード + Reed-Solomon 誤り訂正 / EC レベル M）
     *
     * design.md「QR_Code 生成方針」の第一選択（外部依存を追加しない自己完結実装）。
     * 単一 HTML 内で完結し、npm・バンドラー・CDN を必要としない。
     * ビット行列を生成し、renderQrCode が <canvas> のドットとして描画する。
     * バージョン 1〜10（EC レベル M）に対応し、Group_URL 程度の長さを十分カバーする。
     * アルゴリズムは JIS X 0510 / ISO/IEC 18004 に準拠する。
     * ------------------------------------------------------------------- */
    const QrGen = (function () {
      // --- GF(256) の指数 / 対数テーブル（原始多項式 0x11D, 生成元 2） ---
      const EXP = new Array(512);
      const LOG = new Array(256);
      (function initGaloisField() {
        let x = 1;
        for (let i = 0; i < 255; i++) {
          EXP[i] = x;
          LOG[x] = i;
          x <<= 1;
          if (x & 0x100) x ^= 0x11d;   // 8 ビットを超えたら原始多項式で還元
        }
        for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; // 加算オーバーフロー用に複製
      })();

      // GF(256) 上の乗算
      function gfMul(a, b) {
        if (a === 0 || b === 0) return 0;
        return EXP[LOG[a] + LOG[b]];
      }

      // EC レベル M の [1ブロックあたりEC符号語数, G1ブロック数, G1データ符号語, G2ブロック数, G2データ符号語]
      // 出典: ISO/IEC 18004 誤り訂正特性表（バージョン 1〜10）。
      const ECC_M = {
        1:  [10, 1, 16, 0, 0],
        2:  [16, 1, 28, 0, 0],
        3:  [26, 1, 44, 0, 0],
        4:  [18, 2, 32, 0, 0],
        5:  [24, 2, 43, 0, 0],
        6:  [16, 4, 27, 0, 0],
        7:  [18, 4, 31, 0, 0],
        8:  [22, 2, 38, 2, 39],
        9:  [22, 3, 36, 2, 37],
        10: [26, 4, 43, 1, 44],
      };

      // 総データ符号語数（= byte モードで格納できるおおよその容量算出に使う）
      function totalDataCodewords(version) {
        const e = ECC_M[version];
        return e[1] * e[2] + e[3] * e[4];
      }

      // 文字列を UTF-8 バイト列へ変換する
      function utf8Bytes(str) {
        const out = [];
        for (let i = 0; i < str.length; i++) {
          let code = str.charCodeAt(i);
          if (code >= 0xd800 && code <= 0xdbff && i + 1 < str.length) {
            // サロゲートペアを結合してコードポイントへ
            const next = str.charCodeAt(i + 1);
            if (next >= 0xdc00 && next <= 0xdfff) {
              code = 0x10000 + ((code - 0xd800) << 10) + (next - 0xdc00);
              i++;
            }
          }
          if (code < 0x80) {
            out.push(code);
          } else if (code < 0x800) {
            out.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
          } else if (code < 0x10000) {
            out.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
          } else {
            out.push(0xf0 | (code >> 18), 0x80 | ((code >> 12) & 0x3f),
                     0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
          }
        }
        return out;
      }

      // Reed-Solomon の除数（生成多項式）を計算する。長さ degree のモニック多項式係数。
      function rsComputeDivisor(degree) {
        const result = new Array(degree).fill(0);
        result[degree - 1] = 1;
        let root = 1;
        for (let i = 0; i < degree; i++) {
          for (let j = 0; j < result.length; j++) {
            result[j] = gfMul(result[j], root);
            if (j + 1 < result.length) result[j] ^= result[j + 1];
          }
          root = gfMul(root, 0x02);
        }
        return result;
      }

      // データ符号語列に対する EC 符号語（剰余）を計算する。
      function rsComputeRemainder(data, divisor) {
        const result = divisor.map(function () { return 0; });
        for (let d = 0; d < data.length; d++) {
          const factor = data[d] ^ result.shift();
          result.push(0);
          for (let i = 0; i < divisor.length; i++) {
            result[i] ^= gfMul(divisor[i], factor);
          }
        }
        return result;
      }

      // バージョン >= 2 のアライメントパターン中心座標を返す。
      function alignmentPatternPositions(version) {
        if (version === 1) return [];
        const size = version * 4 + 17;
        const numAlign = Math.floor(version / 7) + 2;
        const step = Math.ceil((version * 4 + 4) / (numAlign * 2 - 2)) * 2;
        const result = [6];
        for (let pos = size - 7; result.length < numAlign; pos -= step) {
          result.splice(1, 0, pos);
        }
        return result;
      }

      function getBit(value, i) {
        return ((value >>> i) & 1) !== 0;
      }

      // バージョンとデータ符号語列から QR 行列を組み立てる（最適マスクを自動選択）。
      function buildMatrix(version, dataCodewords) {
        const size = version * 4 + 17;
        const modules = [];       // true = 黒
        const isFunction = [];    // true = 機能パターン（マスク対象外）
        for (let i = 0; i < size; i++) {
          modules.push(new Array(size).fill(false));
          isFunction.push(new Array(size).fill(false));
        }

        function setFn(x, y, dark) {
          modules[y][x] = dark;
          isFunction[y][x] = true;
        }

        // ファインダパターン（7x7）＋分離パターン
        function drawFinder(cx, cy) {
          for (let dy = -4; dy <= 4; dy++) {
            for (let dx = -4; dx <= 4; dx++) {
              const dist = Math.max(Math.abs(dx), Math.abs(dy));
              const xx = cx + dx, yy = cy + dy;
              if (xx >= 0 && xx < size && yy >= 0 && yy < size) {
                setFn(xx, yy, dist !== 2 && dist !== 4);
              }
            }
          }
        }

        // アライメントパターン（5x5）
        function drawAlignment(cx, cy) {
          for (let dy = -2; dy <= 2; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              setFn(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
            }
          }
        }

        // フォーマット情報（15 ビット, EC レベル M = 0b00, マスク 3 ビット）を描画する。
        function drawFormatBits(mask) {
          const data = (0 << 3) | mask;    // EC レベル M のフォーマットビットは 0
          let rem = data;
          for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
          const bits = ((data << 10) | rem) ^ 0x5412;   // マスク定数で XOR

          for (let i = 0; i <= 5; i++) setFn(8, i, getBit(bits, i));
          setFn(8, 7, getBit(bits, 6));
          setFn(8, 8, getBit(bits, 7));
          setFn(7, 8, getBit(bits, 8));
          for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bits, i));

          for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bits, i));
          for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bits, i));
          setFn(8, size - 8, true);   // 常に黒のモジュール
        }

        // バージョン情報（18 ビット, バージョン 7 以上のみ）を描画する。
        function drawVersion() {
          if (version < 7) return;
          let rem = version;
          for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
          const bits = (version << 12) | rem;
          for (let i = 0; i < 18; i++) {
            const bit = getBit(bits, i);
            const a = size - 11 + (i % 3);
            const b = Math.floor(i / 3);
            setFn(a, b, bit);
            setFn(b, a, bit);
          }
        }

        // 機能パターン一式を配置する
        function drawFunctionPatterns() {
          // タイミングパターン
          for (let i = 0; i < size; i++) {
            setFn(6, i, i % 2 === 0);
            setFn(i, 6, i % 2 === 0);
          }
          drawFinder(3, 3);
          drawFinder(size - 4, 3);
          drawFinder(3, size - 4);

          const align = alignmentPatternPositions(version);
          for (let i = 0; i < align.length; i++) {
            for (let j = 0; j < align.length; j++) {
              // 3 隅のファインダと重なる位置には置かない
              if ((i === 0 && j === 0) ||
                  (i === 0 && j === align.length - 1) ||
                  (i === align.length - 1 && j === 0)) continue;
              drawAlignment(align[i], align[j]);
            }
          }

          drawFormatBits(0);   // 予約領域確保用のダミー（後で本値を上書き）
          drawVersion();
        }

        // データ符号語に EC を付与し、ブロックをインタリーブして全符号語列を作る。
        function addEccAndInterleave(data) {
          const e = ECC_M[version];
          const blockEccLen = e[0];
          const numBlocks = e[1] + e[3];
          const rawCodewords = data.length + numBlocks * blockEccLen;
          const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
          const shortBlockLen = Math.floor(rawCodewords / numBlocks);

          const blocks = [];
          const divisor = rsComputeDivisor(blockEccLen);
          for (let i = 0, k = 0; i < numBlocks; i++) {
            const datLen = shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1);
            const dat = data.slice(k, k + datLen);
            k += datLen;
            const ecc = rsComputeRemainder(dat, divisor);
            if (i < numShortBlocks) dat.push(0);   // 短ブロックの末尾を 0 でパディング
            blocks.push(dat.concat(ecc));
          }

          const result = [];
          for (let i = 0; i < blocks[0].length; i++) {
            for (let j = 0; j < blocks.length; j++) {
              // 短ブロックのパディング位置（データ部の最終列）はスキップする
              if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) {
                result.push(blocks[j][i]);
              }
            }
          }
          return result;
        }

        // 全符号語をジグザグ順にデータ領域へ配置する。
        function drawCodewords(allCodewords) {
          let i = 0;   // ビットインデックス
          for (let right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;   // タイミングパターン列を回避
            for (let vert = 0; vert < size; vert++) {
              for (let j = 0; j < 2; j++) {
                const x = right - j;
                const upward = ((right + 1) & 2) === 0;
                const y = upward ? size - 1 - vert : vert;
                if (!isFunction[y][x] && i < allCodewords.length * 8) {
                  modules[y][x] = getBit(allCodewords[i >>> 3], 7 - (i & 7));
                  i++;
                }
                // 残余ビット（i >= 総ビット数）は false のまま
              }
            }
          }
        }

        // マスクを適用（トグル）する。同じ mask を二度適用すると元に戻る。
        function applyMask(mask) {
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              if (isFunction[y][x]) continue;
              let invert;
              switch (mask) {
                case 0: invert = (x + y) % 2 === 0; break;
                case 1: invert = y % 2 === 0; break;
                case 2: invert = x % 3 === 0; break;
                case 3: invert = (x + y) % 3 === 0; break;
                case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
                case 5: invert = (x * y) % 2 + (x * y) % 3 === 0; break;
                case 6: invert = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
                case 7: invert = ((x + y) % 2 + (x * y) % 3) % 2 === 0; break;
                default: invert = false;
              }
              if (invert) modules[y][x] = !modules[y][x];
            }
          }
        }

        // マスク選択のためのペナルティ算出（ISO/IEC 18004 の 4 規則）。
        const N1 = 3, N2 = 3, N3 = 40, N4 = 10;

        function finderPenaltyCountPatterns(hist) {
          const n = hist[1];
          const core = n > 0 && hist[2] === n && hist[3] === n * 3 && hist[4] === n && hist[5] === n;
          return (core && hist[0] >= n * 4 && hist[6] >= n ? 1 : 0) +
                 (core && hist[6] >= n * 4 && hist[0] >= n ? 1 : 0);
        }
        function finderPenaltyAddHistory(runLen, hist) {
          if (hist[0] === 0) runLen += size;   // 初回ランに明色の境界を加える
          hist.pop();
          hist.unshift(runLen);
        }
        function finderPenaltyTerminate(color, runLen, hist) {
          if (color) { finderPenaltyAddHistory(runLen, hist); runLen = 0; }
          runLen += size;                        // 明色の境界を加える
          finderPenaltyAddHistory(runLen, hist);
          return finderPenaltyCountPatterns(hist);
        }

        function penaltyScore() {
          let result = 0;

          // 規則 1・3: 行方向
          for (let y = 0; y < size; y++) {
            let runColor = false, runLen = 0;
            const hist = [0, 0, 0, 0, 0, 0, 0];
            for (let x = 0; x < size; x++) {
              if (modules[y][x] === runColor) {
                runLen++;
                if (runLen === 5) result += N1;
                else if (runLen > 5) result++;
              } else {
                finderPenaltyAddHistory(runLen, hist);
                if (!runColor) result += finderPenaltyCountPatterns(hist) * N3;
                runColor = modules[y][x];
                runLen = 1;
              }
            }
            result += finderPenaltyTerminate(runColor, runLen, hist) * N3;
          }
          // 規則 1・3: 列方向
          for (let x = 0; x < size; x++) {
            let runColor = false, runLen = 0;
            const hist = [0, 0, 0, 0, 0, 0, 0];
            for (let y = 0; y < size; y++) {
              if (modules[y][x] === runColor) {
                runLen++;
                if (runLen === 5) result += N1;
                else if (runLen > 5) result++;
              } else {
                finderPenaltyAddHistory(runLen, hist);
                if (!runColor) result += finderPenaltyCountPatterns(hist) * N3;
                runColor = modules[y][x];
                runLen = 1;
              }
            }
            result += finderPenaltyTerminate(runColor, runLen, hist) * N3;
          }

          // 規則 2: 2x2 同色ブロック
          for (let y = 0; y < size - 1; y++) {
            for (let x = 0; x < size - 1; x++) {
              const c = modules[y][x];
              if (c === modules[y][x + 1] && c === modules[y + 1][x] && c === modules[y + 1][x + 1]) {
                result += N2;
              }
            }
          }

          // 規則 4: 黒モジュール比率の偏り
          let dark = 0;
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              if (modules[y][x]) dark++;
            }
          }
          const total = size * size;
          const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
          result += k * N4;

          return result;
        }

        // --- 組み立て ---
        drawFunctionPatterns();
        const allCodewords = addEccAndInterleave(dataCodewords);
        drawCodewords(allCodewords);

        // 8 種のマスクを試し、ペナルティ最小のものを採用する。
        let bestMask = 0;
        let minPenalty = Infinity;
        for (let mask = 0; mask < 8; mask++) {
          applyMask(mask);
          drawFormatBits(mask);
          const penalty = penaltyScore();
          if (penalty < minPenalty) { minPenalty = penalty; bestMask = mask; }
          applyMask(mask);   // 元に戻す（同じマスクの再適用でトグル解除）
        }
        applyMask(bestMask);
        drawFormatBits(bestMask);

        return { size: size, modules: modules, version: version, mask: bestMask };
      }

      // テキストを byte モードで符号化し、QR 行列を返す（EC レベル M, バージョン自動選択）。
      function encode(text) {
        const bytes = utf8Bytes(String(text));

        // 収まる最小バージョン（1〜10）を選ぶ
        let version = 0;
        for (let v = 1; v <= 10; v++) {
          const dc = totalDataCodewords(v);
          const ccBits = v <= 9 ? 8 : 16;               // 文字数指示子ビット長
          const capacity = Math.floor((dc * 8 - 4 - ccBits) / 8);
          if (bytes.length <= capacity) { version = v; break; }
        }
        if (version === 0) {
          throw new Error('QR: データが長すぎます（対応バージョンの上限を超過）');
        }

        // ビットバッファを構築する
        const bb = [];
        function appendBits(value, len) {
          for (let i = len - 1; i >= 0; i--) bb.push((value >>> i) & 1);
        }

        appendBits(0x4, 4);                             // byte モード指示子
        appendBits(bytes.length, version <= 9 ? 8 : 16); // 文字数指示子
        for (let i = 0; i < bytes.length; i++) appendBits(bytes[i], 8);

        const dc = totalDataCodewords(version);
        const capacityBits = dc * 8;
        appendBits(0, Math.min(4, capacityBits - bb.length));   // 終端子
        if (bb.length % 8 !== 0) appendBits(0, 8 - (bb.length % 8)); // バイト境界へ

        // 埋め草バイト（0xEC, 0x11 の交互）
        for (let pad = 0xec; bb.length < capacityBits; pad ^= 0xec ^ 0x11) {
          appendBits(pad, 8);
        }

        // ビット列をデータ符号語（バイト）へ
        const dataCodewords = new Array(dc).fill(0);
        for (let i = 0; i < bb.length; i++) {
          dataCodewords[i >>> 3] |= bb[i] << (7 - (i & 7));
        }

        return buildMatrix(version, dataCodewords);
      }

      return { encode: encode };
    })();

    // Group_URL の絶対 URL を符号化した QR_Code を、指定コンテナ（既定 #qr-container）へ
    // 描画する純粋な描画関数（要件 2.8）。依存ゼロの QrGen で行列を生成し <canvas> に出力する。
    // 生成に失敗した場合は URL テキストを表示して手動読み取りにフォールバックする。
    // containerId 省略時は 'qr-container'（renderShareBar が用意する領域）を対象とする。
    function renderQrCode(url, containerId) {
      const container = document.getElementById(containerId || 'qr-container');
      if (!container) return;
      container.innerHTML = '';

      const text = String(url == null ? '' : url);

      let qr;
      try {
        qr = QrGen.encode(text);
      } catch (e) {
        // 次善策としても CDN import は steering（依存を増やさない）に反するため、
        // ここでは URL テキスト表示にフォールバックし、手動での読み取り/コピーを促す。
        const fb = document.createElement('p');
        fb.className = 'qr-fallback';
        fb.textContent = 'QR コードを生成できませんでした。URL を直接ご利用ください: ' + text;
        container.appendChild(fb);
        return;
      }

      const quiet = 4;                       // 静粛領域（最低 4 モジュール）
      const dim = qr.size + quiet * 2;
      // 1 モジュールあたりのピクセル数。CSS 側で拡大表示するため描画は等倍で十分。
      const px = 4;

      const canvas = document.createElement('canvas');
      canvas.width = dim * px;
      canvas.height = dim * px;
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', 'グループ URL の QR コード');

      const ctx = canvas.getContext('2d');
      // 背景（静粛領域含む）を白で塗る
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // 黒モジュールを描画する
      ctx.fillStyle = '#000000';
      for (let y = 0; y < qr.size; y++) {
        for (let x = 0; x < qr.size; x++) {
          if (qr.modules[y][x]) {
            ctx.fillRect((x + quiet) * px, (y + quiet) * px, px, px);
          }
        }
      }

      container.appendChild(canvas);

      // 読み取り不能時の保険として URL テキストも併記する。
      const caption = document.createElement('p');
      caption.className = 'qr-caption';
      caption.textContent = text;
      container.appendChild(caption);
    }

    // トーストの自動非表示タイマー（連続呼び出し時に前のタイマーを打ち消す）。
    let toastTimer = null;

    // 操作フィードバックのトースト表示（要件 9.1, コピー完了 2.6）。
    // #toast にメッセージを表示し、type に応じてクラスを付与、数秒後に自動的に隠す。
    // 汎用実装: 追加/編集/削除の結果通知や URL コピー完了通知など全般で再利用する。
    // 連続呼び出しに耐える（前のタイマーをクリアしてから再表示する）。
    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      if (!toast) return;

      // 前回の自動非表示タイマーを解除（連続呼び出し対策）。
      if (toastTimer !== null) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }

      toast.textContent = msg == null ? '' : String(msg);

      // 種別クラスをリセットしてから、指定があれば付与する
      // （既存 CSS: .toast--success / .toast--error）。
      toast.classList.remove('toast--success', 'toast--error');
      if (type === 'success') {
        toast.classList.add('toast--success');
      } else if (type === 'error') {
        toast.classList.add('toast--error');
      }

      // 表示（既存 CSS: #toast.is-visible）。
      toast.classList.add('is-visible');

      // 数秒後に自動的に隠す。
      toastTimer = setTimeout(function () {
        toast.classList.remove('is-visible');
        toastTimer = null;
      }, 2600);
    }

    // --- 一覧 / 作成フォームの UI グルー（onclick グローバル関数・steering 慣習） ---

    // 一覧項目クリックで経費画面へ遷移する（location.hash → handleRoute が処理・要件 2.5）。
    function goToGroup(groupId) {
      if (!groupId) return;
      location.hash = '#/g/' + encodeURIComponent(groupId);
    }

    // 一覧が非空でも作成フォームを表示する（要件 1.1）。
    function showCreateForm() {
      state.showCreate = true;
      render();
    }

    // 作成フォームから一覧へ戻る。
    function backToList() {
      state.showCreate = false;
      render();
    }

    // 作成フォームにメンバー入力行を追加する（複数メンバー対応）。
    function addMemberRow() {
      const container = document.getElementById('cg-members');
      if (!container) return;
      container.insertAdjacentHTML('beforeend', memberRowHtml());
    }

    // 作成フォームのメンバー入力行を削除する（最低 1 行は残す）。
    function removeMemberRow(btn) {
      const container = document.getElementById('cg-members');
      if (!container || !btn) return;
      const rows = container.querySelectorAll('.cg-member-row');
      if (rows.length <= 1) return; // 最低 1 名は保持する
      const row = btn.closest('.cg-member-row');
      if (row) row.remove();
    }

    // 作成フォームの入力値を収集し createGroup を呼ぶ（要件 1.1）。
    // 実際の検証・エラー表示・遷移は createGroup（task 8.1）が担う。
    function handleCreateGroupSubmit() {
      const nameEl = document.getElementById('cg-name');
      const name = nameEl ? nameEl.value : '';
      const memberNames = [];
      const memberEls = document.querySelectorAll('#cg-members .cg-member');
      memberEls.forEach(function (el) {
        const v = (el.value || '').trim();
        if (v !== '') memberNames.push(v);
      });
      createGroup(name, memberNames);
    }

    // 再利用可能なメンバー構成（Member_Template）の候補配列を返す（要件 17.1）。副作用なし。
    // 集約元:
    //   1) 独立保存した state.memberTemplates（参加済み Group が一覧から消えても再利用可能）
    //   2) 作成/参加した Group（state.groupOrder の順）のメンバー構成
    // normalizeMemberTemplates（SECTION 4）で正規化し、重複メンバー構成は 1 件にまとめる。
    function listMemberTemplates() {
      const sources = [];

      // 1) 独立保存したテンプレートを先に積む（一覧から消えた構成も残す・要件 17.1）。
      const saved = Array.isArray(state.memberTemplates) ? state.memberTemplates : [];
      saved.forEach(function (t) {
        if (!t || typeof t !== 'object') return;
        sources.push({
          id: (typeof t.id === 'string' && t.id.length > 0) ? t.id : null,
          members: Array.isArray(t.members) ? t.members : [],
          source: typeof t.source === 'string' ? t.source : 'template',
        });
      });

      // 2) 作成/参加した Group のメンバー構成を集約する（表示順は groupOrder に従う）。
      const order = Array.isArray(state.groupOrder) && state.groupOrder.length > 0
        ? state.groupOrder
        : Object.keys(state.groups || {});
      order.forEach(function (gid) {
        const group = state.groups ? state.groups[gid] : null;
        if (!group || !Array.isArray(group.members)) return;
        sources.push({
          id: 'group:' + gid,
          members: group.members.map(function (m) {
            return m && m.name != null ? m.name : '';
          }),
          source: group.name || '',
        });
      });

      return normalizeMemberTemplates(sources);
    }

    // 選択された Member_Template のメンバー名を作成フォームの初期メンバーへ反映する（要件 17.2, 17.3）。
    // 反映後も #cg-members の各行は通常入力なので、追加/削除がそのまま可能。
    function applyMemberTemplate(id) {
      const templates = listMemberTemplates();
      const tpl = templates.find(function (t) { return t.id === id; });
      if (!tpl) return;

      const container = document.getElementById('cg-members');
      if (!container) return;

      // メンバー 1 名以上のテンプレートを、値入りの入力行として展開する（最低 1 行は維持）。
      const names = tpl.members.length > 0 ? tpl.members : [''];
      container.innerHTML = names.map(function (name) {
        return memberRowHtml(name);
      }).join('');

      // メンバー欄のエラー表示はクリアしておく。
      setCreateGroupError('cg-members-error', '');
      showToast('メンバーを反映しました', 'success');
    }

    // メンバー構成を再利用候補として独立保存する（Group が一覧から消えても残す・要件 17.1）。
    // 空名を除外し、同一メンバー集合が既に保存済みなら追加しない（重複を避ける）。
    // 呼び出し後は saveData() で永続化すること。
    function rememberMemberTemplate(memberNames, source) {
      const names = (Array.isArray(memberNames) ? memberNames : [])
        .map(function (n) { return (n == null ? '' : String(n)).trim(); })
        .filter(function (n) { return n !== ''; });
      if (names.length === 0) return;

      if (!Array.isArray(state.memberTemplates)) state.memberTemplates = [];
      const key = memberSetKey(names);
      const exists = state.memberTemplates.some(function (t) {
        return t && Array.isArray(t.members) && memberSetKey(t.members) === key;
      });
      if (exists) return;

      state.memberTemplates.push({
        id: generateId(),
        members: names,
        source: source == null ? '' : String(source),
      });
    }

    // --- 費用入力フォームの UI グルー（onclick/onchange グローバル関数・steering 慣習・変更3） ---

    // 費用フォームで現在選択中の Currency を返す（要件 20.2）。
    // #ef-currency の値が CURRENCIES に存在すればそれを、無ければ Group の基準通貨を返す。
    function currentExpenseFormCurrency() {
      const el = document.getElementById('ef-currency');
      if (el && typeof el.value === 'string' && CURRENCIES[el.value]) return el.value;
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      return baseCurrencyOf(group);
    }

    // 立替（line）を 1 件追加する（変更3）。現在の入力を保持したまま末尾へ空行を足す。
    function addExpenseLine() {
      readExpenseLinesFromDom();
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      const members = (group && Array.isArray(group.members)) ? group.members : [];
      if (!Array.isArray(expenseFormLines)) expenseFormLines = [];
      expenseFormLines.push(makeExpenseLine(members));
      renderExpenseLines();
    }

    // 指定インデックスの立替（line）を削除する（最低 1 件は残す・変更3）。
    function removeExpenseLine(i) {
      readExpenseLinesFromDom();
      if (!Array.isArray(expenseFormLines) || expenseFormLines.length <= 1) return;
      if (i < 0 || i >= expenseFormLines.length) return;
      expenseFormLines.splice(i, 1);
      renderExpenseLines();
    }

    // 立替行の分割方式変更時: 入力値を保持したまま個別入力欄を出し分けて再描画する（変更3）。
    function onLineMethodChange(i) {
      readExpenseLinesFromDom();
      renderExpenseLines();
    }

    // 立替行の対象者チェック変更時: 入力値を保持したまま個別入力欄を更新する（変更3）。
    function onLineParticipantsChange(i) {
      readExpenseLinesFromDom();
      renderExpenseLines();
    }

    // 費用フォームの通貨変更時: 各立替の金額記号・金額指定割の単位を更新する（要件 20.2）。
    // 入力値は保持したまま、通貨に依存する表示（記号・単位）のみを再描画する。
    function onExpenseCurrencyChange() {
      readExpenseLinesFromDom();
      renderExpenseLines();
    }

    // 立替行の作業状態（configText は文字列）を、保存用の line（splitConfig は数値）へ変換する（変更3）。
    // 金額は parseAmount で最小通貨単位整数へ、％/口数は数値へ変換する。解釈不能な金額は NaN（検証でエラー）。
    function workingLineToLine(l, currency) {
      const method = (l && l.splitMethod) || 'equal';
      const participants = (l && Array.isArray(l.participants)) ? l.participants.slice() : [];
      const parsedAmount = parseAmount(l ? l.amountText : '', currency);
      const amount = (parsedAmount == null) ? NaN : parsedAmount;
      const configText = (l && l.configText) || {};

      const splitConfig = {};
      if (method === 'percentage' || method === 'shares') {
        const weights = {};
        participants.forEach(function (id) {
          const v = parseFloat(String(configText[id] == null ? '' : configText[id]).replace(/[^0-9.\-]/g, ''));
          weights[id] = Number.isFinite(v) ? v : 0;
        });
        if (method === 'percentage') splitConfig.percents = weights;
        else splitConfig.shares = weights;
      } else if (method === 'amount') {
        const amounts = {};
        participants.forEach(function (id) {
          const a = parseAmount(configText[id], currency);
          amounts[id] = (a == null) ? 0 : a;
        });
        splitConfig.amounts = amounts;
      }

      return {
        id: (l && typeof l.id === 'string' && l.id.length > 0) ? l.id : generateId(),
        payerId: l ? l.payerId : '',
        amount: amount,
        participants: participants,
        splitMethod: method,
        splitConfig: splitConfig,
      };
    }

    // 費用入力フォームの値（題目＋複数立替）を収集して addExpense/editExpense を呼ぶ（変更3）。
    // 検証・エラー表示・フォーム値保持は addExpense/editExpense が担う（要件 3.2, 3.3）。
    function handleAddExpenseSubmit(event) {
      if (event && typeof event.preventDefault === 'function') event.preventDefault();

      const group = state.groups[state.currentGroupId];
      if (!group) return false;

      // 最新の立替入力を作業状態へ取り込む。
      readExpenseLinesFromDom();

      const currency = currentExpenseFormCurrency();
      const titleEl = document.getElementById('ef-title');
      const catEl = document.getElementById('ef-category');
      const catRaw = catEl ? (catEl.value || '').trim() : '';
      // 題目は任意。空ならカテゴリ名を題目にする（どちらも空なら「支出」）。
      const title = (titleEl ? (titleEl.value || '').trim() : '') || catRaw || '支出';
      const category = (catRaw === '') ? null : catRaw; // Category 未指定は null（要件 3.6）

      const lines = (Array.isArray(expenseFormLines) ? expenseFormLines : []).map(function (l) {
        return workingLineToLine(l, currency);
      });

      const input = { title: title, category: category, currency: currency, lines: lines };

      // 編集モードなら既存 Expense の更新へ、そうでなければ新規追加へ振り分ける（要件 3.1, 3.4）。
      if (editingExpenseId) {
        editExpense(editingExpenseId, input);
      } else {
        addExpense(input);
      }

      return false;
    }

    // 費用の編集モードを解除して、通常の入力フォームへ戻す（変更4）。
    function cancelEditExpense() {
      editingExpenseId = null;
      renderExpenseScreen();
    }


    /* =====================================================================
     * SECTION 6: ACTIONS（操作ハンドラ）
     * design.md「Actions 層」準拠。
     * 各 Action: 検証 → state 更新 → saveData → SyncBackend.save → 再描画。
     * ===================================================================== */

    // 作成フォームのエラー表示欄にメッセージを設定/クリアする（要件 1.2）。
    // id が存在しない環境（テスト等）でも安全に動作するようガードする。
    function setCreateGroupError(fieldId, message) {
      const el = document.getElementById(fieldId);
      if (!el) return;
      el.textContent = message == null ? '' : String(message);
    }

    // 新しい Group を生成する（要件 1.1, 1.2）。
    // - グループ名が空ならエラー表示のみ行い、Group は生成しない（要件 1.2）。
    // - 有効なら Member を生成（重複名は先勝ちで 1 つにまとめる。空名は除外）、
    //   Group を組み立てて persistGroup で保存し、経費画面へ遷移する（要件 1.1）。
    function createGroup(name, memberNames) {
      // 前回のエラー表示をクリアする。
      setCreateGroupError('cg-name-error', '');
      setCreateGroupError('cg-members-error', '');

      const trimmedName = (name == null ? '' : String(name)).trim();

      // グループ名は必須（要件 1.2）。空なら生成せずエラー表示のみ。
      if (trimmedName === '') {
        setCreateGroupError('cg-name-error', 'グループ名を入力してください。');
        return;
      }

      // メンバー名を整形する。要件 1 と同一の検証（空欄不可・同一 Group 内での名前重複不可）を
      // 既存の validateNewMember で適用し、無効な行（空名・重複名）は先勝ちでスキップする
      // （Member_Template から反映した名前も同じ検証を通す・要件 17.4, 1.4）。
      const rawNames = Array.isArray(memberNames) ? memberNames : [];
      const members = [];
      rawNames.forEach(function (raw) {
        // 検証コンテキストは「これまでに採用した members」。重複は先勝ちで弾かれる。
        const result = validateNewMember(raw, { members: members });
        if (!result.valid) return;
        members.push({ id: generateId(), name: String(raw).trim() });
      });

      // Group を組み立てる（メンバー 0 名も許容）。金額計算に関わる派生値は保持しない。
      const now = Date.now();
      const group = {
        id: generateId(),
        name: trimmedName,
        currency: DEFAULT_CURRENCY,
        // 多通貨・支払済みの追加フィールドを初期化する（要件 20.1, 20.3, 16.7）。
        baseCurrency: DEFAULT_CURRENCY,   // 精算の基準通貨（既定は DEFAULT_CURRENCY・要件 20.1）
        exchangeRates: {},                // 手入力の為替レート（要件 20.3）
        members: members,
        expenses: [],
        settlements: {},                  // 支払済み記録（要件 16.7）
        createdAt: now,
        updatedAt: now,
      };

      // メンバー構成を再利用候補として独立保存する（一覧から消えても再利用可能・要件 17.1）。
      rememberMemberTemplate(
        members.map(function (m) { return m.name; }),
        trimmedName
      );

      // 保存（state 更新・localStorage ミラー・syncBackend.save）。
      // persistGroup 内で saveData() が呼ばれ、memberTemplates も併せて永続化される。
      persistGroup(group);

      // 完了通知（要件 9.1）。
      showToast('グループを作成しました', 'success');

      // 経費画面へ遷移する（hashchange → handleRoute → openGroup が再描画・要件 1.1, 2.9）。
      location.hash = '#/g/' + encodeURIComponent(group.id);
    }

    // 設定タブのメンバー追加入力（#member-add-input）から addMember を呼ぶ UI グルー（変更5）。
    function handleAddMember() {
      const el = document.getElementById('member-add-input');
      const name = el ? el.value : '';
      addMember(name);
    }

    // 現在の Group に Member を追加する（要件 1.3, 1.4）。
    // validateNewMember で空名・重複名を検証し、無効ならエラー通知のみ行う。
    function addMember(name) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) return;

      // 空名・重複名の検証（要件 1.4）。
      const result = validateNewMember(name, group);
      if (!result.valid) {
        showToast(result.errors[0], 'error');
        return;
      }

      // Member を追加する（要件 1.3）。
      const trimmed = String(name).trim();
      if (!Array.isArray(group.members)) group.members = [];
      group.members.push({ id: generateId(), name: trimmed });

      persistGroup(group);
      render();
      showToast('メンバーを追加しました', 'success');
    }

    // 現在の Group から Member を削除する（要件 1.5, 1.6）。
    // その Member が既存 Expense の Payer または Participant なら削除不可（要件 1.6）。
    function removeMember(memberId) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group || memberId == null) return;

      const members = Array.isArray(group.members) ? group.members : [];
      const index = members.findIndex(function (m) { return m && m.id === memberId; });
      if (index === -1) return; // 存在しない Member は何もしない

      // 既存 Expense の Payer または Participant に含まれるかを確認する（要件 1.6）。
      // 判定は SECTION 4 の純粋関数 isMemberInUse に委譲する（挙動不変）。
      if (isMemberInUse(group, memberId)) {
        // 関連する支出があるため削除しない（要件 1.6）。
        showToast('このメンバーは支出に紐づいているため削除できません', 'error');
        return;
      }

      // 削除して保存・再描画する（要件 1.5）。
      members.splice(index, 1);
      group.members = members;

      persistGroup(group);
      render();
      showToast('メンバーを削除しました', 'success');
    }

    // 費用フォームのエラー表示欄（#ef-error）にメッセージを設定/クリアする（要件 3.2, 3.3, 4.3, 4.6）。
    // 再描画せずに DOM を直接更新するため、ユーザーが入力したフォーム値はそのまま保持される。
    function setExpenseFormError(message) {
      const el = document.getElementById('ef-error');
      if (!el) return;
      el.textContent = message == null ? '' : String(message);
    }

    // 新しい Expense を現在の Group へ追加する（要件 3.1〜3.3, 3.6, 4.3, 4.6, 5.3, 9.1）。
    // validateExpense で検証し、無効なら #ef-error にエラーメッセージ（複数は結合）を表示し、
    // 再描画しないことでフォーム値を保持したまま登録しない（要件 3.2, 3.3, 4.3, 4.6）。
    // 有効なら Expense を構築して group.expenses へ追加 → persistGroup → 再描画（Balance/
    // Settlement/Totals も再計算）→ 完了トースト（要件 3.1, 3.6, 5.3, 9.1）。
    function addExpense(input) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) return;

      // 検証（要件 3.2, 3.3, 4.3, 4.6）。
      const result = validateExpense(input, group);
      if (!result.valid) {
        // エラーは #ef-error に結合表示し、フォーム値は保持する（再描画しない）。
        setExpenseFormError(result.errors.join(' '));
        return;
      }

      // Expense（題目）を構築する（id=generateId、発生日時=now、複数立替 lines・変更2, 3）。
      const now = Date.now();
      const currency = (typeof input.currency === 'string' && input.currency.length > 0)
        ? input.currency
        : (group.baseCurrency || group.currency || DEFAULT_CURRENCY);
      const expense = {
        id: generateId(),
        title: (typeof input.title === 'string') ? input.title : '',
        category: input.category, // 未指定は null（要件 3.6）
        currency: currency,
        createdAt: now,
        updatedAt: now,
        lines: (Array.isArray(input.lines) ? input.lines : []).map(function (l) {
          return {
            id: (typeof l.id === 'string' && l.id.length > 0) ? l.id : generateId(),
            payerId: l.payerId,
            amount: l.amount,
            participants: Array.isArray(l.participants) ? l.participants.slice() : [],
            splitMethod: l.splitMethod,
            splitConfig: l.splitConfig || {},
          };
        }),
      };

      if (!Array.isArray(group.expenses)) group.expenses = [];
      group.expenses.push(expense);

      // 編集モードは解除し、履歴タブへ切り替えて登録結果を提示する（変更4）。
      editingExpenseId = null;
      state.activeTab = 'history';

      // 保存 → 再描画（Balance/Settlement/Totals を再計算・要件 5.3）。
      persistGroup(group);
      render();

      // 完了フィードバック（要件 9.1）。
      showToast(L('toastExpenseAdded'), 'success');
    }

    // 「まとめて入力（Bulk_Entry）」モードは撤去（変更4）。入力は「入力」タブの
    // 題目フォーム（複数立替）に一本化した。精算/共有への導線は下部タブが担う。

    // 既存の Expense を編集する（要件 3.4）。
    // - input 未指定（一覧の「編集」ボタン onclick から editExpense(id) のみ呼ばれる）: 対象 Expense の
    //   値を費用フォームへ読み込む編集モードに切り替える（プレフィル + 送信を editExpense へ振り分け）。
    // - input 指定: validateExpense で検証し、無効なら #ef-error に表示（フォーム値は保持）。
    //   有効なら既存 Expense を更新（updatedAt を更新、createdAt は保持）→ persistGroup →
    //   再計算・再描画（Balance/Settlement/Totals）。
    function editExpense(expenseId, input) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group || expenseId == null) return;

      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const target = expenses.find(function (e) { return e && e.id === expenseId; });
      if (!target) return; // 存在しない Expense は何もしない

      // input 未指定: 編集モードへ切り替えて入力タブでフォームにプレフィルする（変更4）。
      if (input === undefined) {
        editingExpenseId = expenseId;
        state.activeTab = 'input';
        renderExpenseScreen();
        // 入力しやすいようフォームを画面内へスクロールする（存在すれば）。
        const form = document.getElementById('expense-form');
        if (form && typeof form.scrollIntoView === 'function') {
          form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return;
      }

      // input 指定: 検証（要件 3.2, 3.3, 4.3, 4.6）。
      const result = validateExpense(input, group);
      if (!result.valid) {
        setExpenseFormError(result.errors.join(' '));
        return;
      }

      // 既存 Expense（題目）を更新する。createdAt は保持し、updatedAt を更新する（要件 3.4・変更2）。
      target.title = (typeof input.title === 'string') ? input.title : (target.title || '');
      target.category = input.category;
      // 通貨は入力指定があれば更新し、無ければ既存値を維持する（欠損時は基準通貨で補完・要件 20.2）。
      if (typeof input.currency === 'string' && input.currency.length > 0) {
        target.currency = input.currency;
      } else if (typeof target.currency !== 'string' || target.currency.length === 0) {
        target.currency = group.baseCurrency || group.currency || DEFAULT_CURRENCY;
      }
      // 立替（lines）を丸ごと入れ替える（変更2, 3）。
      target.lines = (Array.isArray(input.lines) ? input.lines : []).map(function (l) {
        return {
          id: (typeof l.id === 'string' && l.id.length > 0) ? l.id : generateId(),
          payerId: l.payerId,
          amount: l.amount,
          participants: Array.isArray(l.participants) ? l.participants.slice() : [],
          splitMethod: l.splitMethod,
          splitConfig: l.splitConfig || {},
        };
      });
      target.updatedAt = Date.now();

      // 編集モードを解除し、履歴タブへ戻して結果を提示する（変更4）。
      editingExpenseId = null;
      state.activeTab = 'history';

      // 保存 → 再描画（Balance/Settlement/Totals を再計算・要件 3.4, 5.3）。
      persistGroup(group);
      render();

      showToast(L('toastExpenseUpdated'), 'success');
    }

    // 既存の Expense を削除する（要件 3.5, 5.3, 9.1）。
    // confirm() で確認の上、group.expenses から除去 → persistGroup → 再計算・再描画 → 完了トースト。
    function deleteExpense(expenseId) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group || expenseId == null) return;

      const expenses = Array.isArray(group.expenses) ? group.expenses : [];
      const index = expenses.findIndex(function (e) { return e && e.id === expenseId; });
      if (index === -1) return; // 存在しない Expense は何もしない

      // 破壊的操作のため確認する（要件 3.5）。
      if (!confirm(L('confirmExpenseDelete'))) return;

      expenses.splice(index, 1);
      group.expenses = expenses;

      // 削除対象を編集中だった場合は編集モードを解除する。
      if (editingExpenseId === expenseId) editingExpenseId = null;

      // 保存 → 再描画（Balance/Settlement/Totals を再計算・要件 5.3）。
      persistGroup(group);
      render();

      showToast(L('toastExpenseDeleted'), 'success');
    }

    // 一括削除・一括編集の UI（複数選択バー）は撤去（変更4）。
    // 純粋関数 removeSelectedExpenses / applyCommonEditToExpenses は CORE に残し、テストから参照する。

    // グループを自端末の一覧から消す（ローカル退出）。
    // Firebase 上の groups/{groupId} データは削除しないため、他の参加者には影響しない。
    // URL を知っていれば再度開いて一覧に復帰できる。破壊的操作のため confirm で確認する。
    function leaveGroup(groupId) {
      if (typeof groupId !== 'string' || groupId.length === 0) return;
      if (!Object.prototype.hasOwnProperty.call(state.groups, groupId)) return;

      const group = state.groups[groupId];
      const name = group && typeof group.name === 'string' ? group.name : 'このグループ';
      // 誤操作防止の確認。データ自体は残ることも明示する。
      if (!confirm('「' + name + '」を一覧から削除しますか？\n（このスマホの一覧から消えるだけで、データは残ります）')) return;

      // state と groupOrder から取り除き、localStorage へミラーする。
      try { const l = leftGroupIds(); l.push(groupId); localStorage.setItem('waritaka-left', JSON.stringify(l)); } catch (e) {}
      delete state.groups[groupId];
      state.groupOrder = state.groupOrder.filter(function (id) { return id !== groupId; });
      saveData();

      render();
      showToast('グループを一覧から削除しました', 'success');
    }

    // Group の Base_Currency（精算の基準通貨）を設定する（要件 20.1, 20.4）。
    // CURRENCIES に存在するコードのみ受理し、無効・未知コードは無視する。
    // Balance/精算/集計の表示通貨（group.currency）も基準通貨に同期する（要件 20.4）。
    function setBaseCurrency(code) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) return;

      // CURRENCIES に定義されたコードのみ受理（無効なら何もしない）。
      if (typeof code !== 'string' || !Object.prototype.hasOwnProperty.call(CURRENCIES, code)) return;

      // 変化が無ければ再描画も保存も不要。
      if (group.baseCurrency === code && group.currency === code) return;

      group.baseCurrency = code;
      group.currency = code; // 集計・Balance・精算の表示通貨を基準通貨に合わせる（要件 20.4）

      // 保存（state 更新・localStorage ミラー・syncBackend.save）→ 再描画で金額表示に反映。
      persistGroup(group);
      render();
    }

    // 指定 Currency から Base_Currency への Exchange_Rate を手入力で設定する（要件 20.3）。
    // rate は「1 単位の currency = rate 単位の Base_Currency」。
    // 空欄・0 以下・非数値はレートの削除（未設定へ戻す）として扱う。
    function setExchangeRate(currency, rate) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) return;

      // CURRENCIES に定義された通貨コードのみ受理（無効なら何もしない）。
      if (typeof currency !== 'string' || !Object.prototype.hasOwnProperty.call(CURRENCIES, currency)) return;

      if (!group.exchangeRates || typeof group.exchangeRates !== 'object') group.exchangeRates = {};

      // 数値へ変換（記号・空白・カンマを除去）。
      const parsed = (typeof rate === 'number')
        ? rate
        : parseFloat(String(rate == null ? '' : rate).replace(/[,\s]/g, '').replace(/[^0-9.\-]/g, ''));

      if (!Number.isFinite(parsed) || parsed <= 0) {
        // 無効入力はレート削除（未設定へ戻す）。変化が無ければ何もしない。
        if (Object.prototype.hasOwnProperty.call(group.exchangeRates, currency)) {
          delete group.exchangeRates[currency];
        } else {
          return;
        }
      } else {
        if (group.exchangeRates[currency] === parsed) return; // 変化なし
        group.exchangeRates[currency] = parsed;
      }

      // 保存 → 再描画（Balance/精算/集計/一覧の換算表示へ反映）。
      persistGroup(group);
      render();
    }

    // Settlement_Transfer の Payment_Status を更新する内部ヘルパー（要件 16.2, 16.3）。
    // key は transferKey（`${fromId}|${toId}|${amount}`）。group.settlements[key] を更新し、
    // persistGroup で永続化＋ settlements/{transferKey} をキー単位で同期（要件 16.6, 16.7）、
    // その後 render() で支払済み表示・残件バッジを再描画する。
    function setTransferPaymentStatus(key, status) {
      const group = state.currentGroupId ? state.groups[state.currentGroupId] : null;
      if (!group) return;
      if (typeof key !== 'string' || key.length === 0) return;
      if (status !== PAYMENT_STATUS.PAID && status !== PAYMENT_STATUS.UNPAID) return;

      if (!group.settlements || typeof group.settlements !== 'object') group.settlements = {};
      // 変化が無ければ保存・再描画は不要。
      if (group.settlements[key] === status) return;

      // 未払い/支払済みのいずれも明示値として保存する。明示的に unpaid を持たせることで、
      // 支払済みの取り消しも他 Client_App へキー単位で配信される（要件 16.3, 16.6）。
      group.settlements[key] = status;

      persistGroup(group);
      render();
    }

    // ある Settlement_Transfer を支払済みとして記録する（要件 16.2）。
    function markTransferPaid(key) {
      setTransferPaymentStatus(key, PAYMENT_STATUS.PAID);
    }

    // ある Settlement_Transfer の支払済みを取り消して未払いに戻す（要件 16.3）。
    function markTransferUnpaid(key) {
      setTransferPaymentStatus(key, PAYMENT_STATUS.UNPAID);
    }

    // 一覧の Category 絞り込みを設定する（要件 7.3）。
    // 空文字（「すべて」）は null に正規化して全件表示にする。
    // state.categoryFilter を更新し、支出一覧のみ再描画する（画面全体の再描画は不要）。
    function setCategoryFilter(category) {
      // 空文字・null/undefined は「全件表示」を表す null に正規化する。
      const normalized = (typeof category === 'string' && category.length > 0) ? category : null;

      state.categoryFilter = normalized;

      // 支出一覧のみ再描画する（検索 → Category 絞り込み → 並べ替えを反映）。
      renderExpenseList();
    }

    // 一覧の検索クエリを設定する（内容 or Payer への部分一致・要件 19.1, 19.2）。
    // 検索は表示上のみへ適用し、永続データは変更しない（要件 19.7）。
    // 検索バー（#search-sort-bar）は再描画せず一覧（#expenses-panel）のみ再描画するため、
    // 入力欄のフォーカス・カーソル位置が保たれる（連続入力で途切れない）。
    function setSearchQuery(q) {
      state.searchQuery = (q == null) ? '' : String(q);
      renderExpenseList();
    }

    // 一覧の並べ替え順を設定する（SORT_ORDERS のいずれか・要件 19.3, 19.4）。
    // 未知の値は既定（date_desc）へフォールバックする。表示上のみへ適用する（要件 19.7）。
    function setSortOrder(order) {
      state.sortOrder = (SORT_ORDERS.indexOf(order) !== -1) ? order : 'date_desc';
      renderExpenseList();
    }

    // ルーティング / Guest_User 初回アクセス時の一覧自動追加（要件 6.6〜6.8）。
    // ログイン・登録・事前設定は一切要求しない（Guest_User 前提）。ゲートは追加しない。
    // 当該 Group がバックエンド/キャッシュに存在すると確認できたら、参加済み一覧
    // （state.groupOrder）へ自動追加して saveData() で永続化し、以後一覧経由で再アクセス可能にする。
    function openGroup(groupId) {
      if (!groupId) return;
      // 別 Group へ切り替わるときは複数選択をリセットする（他 Group の stale な id を残さない・要件 14.1）。
      // 同一 Group の再オープン（購読の再確立など）では選択を保持する。
      if (state.currentGroupId !== groupId && state.selection instanceof Set) state.selection.clear();
      state.currentGroupId = groupId;

      // 存在が確認できた Group を参加済み一覧へ登録する（重複追加はしない・要件 6.8）。
      // groupOrder に既にあれば何もしない。追加時のみ true を返し、呼び出し側で永続化する。
      function registerInOrder(id) {
        if (!id) return false;
        if (state.groupOrder.indexOf(id) !== -1) return false;
        state.groupOrder.push(id);
        return true;
      }

      // 前の購読を解除してから購読し直す（別 Group への遷移時のリーク防止・要件 6.2）。
      if (typeof unsubscribe === 'function') {
        try { unsubscribe(); } catch (e) { /* 解除失敗は無視 */ }
        unsubscribe = null;
      }

      // キャッシュがあれば「見つからない」状態を解除する（即時描画の前提・要件 8.2）。
      // キャッシュ済み＝存在が確認できているので、参加済み一覧へも登録する（要件 6.8）。
      const hasCache = !!state.groups[groupId];
      if (hasCache) {
        state.notFound = false;
        if (registerInOrder(groupId)) saveData();
      }

      // syncBackend 未初期化（init 前・生成失敗）の場合はキャッシュのみで判定する。
      if (!syncBackend) {
        state.notFound = !hasCache;
        render();
        return;
      }

      // 対象 Group を購読開始する。更新を受信するたびに state を置換して再描画する（要件 6.2）。
      try {
        unsubscribe = syncBackend.subscribe(groupId, function (group) {
          // 受信の遅延中に別 Group へ遷移していたら無視する。
          if (!group || state.currentGroupId !== groupId) return;
          // 受信データをキャッシュする際に参加済み一覧へも登録する（初回受信で一覧に現れる・要件 6.8）。
          state.groups[groupId] = group;
          registerInOrder(groupId);
          state.notFound = false;
          saveData();
          safeRender();
        });
      } catch (e) {
        unsubscribe = null;
      }

      // キャッシュを即時描画してから最新化する（体感速度・要件 8.2）。
      render();

      // バックエンドで存在確認する。バックエンドにもキャッシュにも無ければ notFound（要件 2.3）。
      Promise.resolve(syncBackend.exists(groupId)).then(function (exists) {
        // 存在確認中に別 Group へ遷移していたら破棄する。
        if (state.currentGroupId !== groupId) return;
        if (exists || state.groups[groupId]) {
          // 存在が確認できた Group は参加済み一覧へ自動追加して永続化する（要件 6.8）。
          // 存在しない Group（notFound）は追加しない。
          if (registerInOrder(groupId)) saveData();
        } else {
          state.notFound = true;
          render();
        }
      }).catch(function () {
        // 接続不可などで存在確認に失敗した場合は、キャッシュ表示を維持する（要件 8.4）。
      });
    }

    // Group_URL の絶対 URL を組み立てる（コピー / OS 共有 / QR から再利用・design.md 参照）。
    function buildGroupUrl(groupId) {
      // 今開いているページのURL（# より前）に、グループの番号を付けて返す。
      return location.href.split('#')[0] + '#/g/' + encodeURIComponent(groupId);
    }

    // 絶対 Group_URL をクリップボードへコピーする（要件 2.6）。
    // navigator.clipboard を最優先で使い、非対応・権限拒否時は document.execCommand('copy')
    // （一時 textarea 経由）にフォールバックする。それも不可なら URL を表示して手動コピーを促す。
    // Group_URL はアクセス鍵に相当するため、成功トーストでもその旨は renderShareBar の UI で明示済み。
    function copyGroupUrl(groupId) {
      if (!groupId) return;
      const url = buildGroupUrl(groupId);
      // 汎用コピー処理へ委譲する。成功トーストは URL 用文言、失敗時は URL を提示して手動コピーを促す。
      copyTextToClipboard(url, L('toastCopied'), function () {
        showToast(L('toastCopyFailed') + ' URL: ' + url, 'error');
      });
    }

    // 任意のテキストをクリップボードへコピーする汎用ヘルパー（要件 2.6, 18.2）。
    // navigator.clipboard を最優先で使い、非対応・権限拒否時は execCommand フォールバックへ。
    // - successMsg: コピー成功時に表示するトースト文言。
    // - onFail: コピー不能時に呼ぶコールバック（省略時は汎用の失敗トースト）。
    function copyTextToClipboard(text, successMsg, onFail) {
      const okMsg = successMsg || L('toastCopied');
      const failFn = (typeof onFail === 'function')
        ? onFail
        : function () { showToast(L('toastCopyFailed'), 'error'); };

      if (typeof navigator !== 'undefined' && navigator.clipboard &&
          typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).then(function () {
          showToast(okMsg, 'success');
        }).catch(function () {
          // 権限拒否・非セキュアコンテキストなどでは同期フォールバックを試みる。
          fallbackCopyText(text, okMsg, failFn);
        });
        return;
      }

      // Clipboard API 非対応環境。
      fallbackCopyText(text, okMsg, failFn);
    }

    // execCommand('copy') による同期フォールバック。一時 textarea を選択状態にしてコピーする。
    // 成功すれば完了トースト、失敗すれば onFail を呼ぶ（要件 2.6, 18.2）。
    function fallbackCopyText(text, successMsg, onFail) {
      let ok = false;
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        // 画面外へ逃がしつつ選択可能にする（スクロール移動を避ける）。
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        ok = document.execCommand('copy');
        document.body.removeChild(textarea);
      } catch (e) {
        ok = false;
      }

      if (ok) {
        showToast(successMsg || L('toastCopied'), 'success');
      } else if (typeof onFail === 'function') {
        onFail();
      }
    }

    // 後方互換: 既存呼び出し向けの薄いラッパー。汎用 fallbackCopyText へ委譲する。
    function fallbackCopyGroupUrl(url) {
      fallbackCopyText(url, L('toastCopied'), function () {
        showToast(L('toastCopyFailed') + ' URL: ' + url, 'error');
      });
    }

    // 現在の Group の精算共有テキスト（Settlement_Share_Text）を構築する（要件 18.1, 18.4, 18.5）。
    // 換算: computeBalancesInBase → computeSettlement で Base_Currency 建ての Settlement_Plan を作り、
    // reconcilePaymentStatus で保存済み Payment_Status を再適用してから formatSettlementShareText で整形する。
    // 戻り値: { ok:true, text } | { ok:false, missing:'<不足通貨の説明>' }（レート不足時は確定しない・要件 20.6）。
    function settlementShareTextForGroup(group) {
      if (!group) return { ok: false, missing: '' };

      const baseResult = computeBalancesInBase(group);
      if (!baseResult.ok) {
        const missing = (baseResult.missing || []).map(function (c) {
          const cur = CURRENCIES[c];
          return cur ? (c + '（' + cur.name + '）') : c;
        }).join('、');
        return { ok: false, missing: missing };
      }

      const plan = computeSettlement(baseResult.balances);
      const saved = (group.settlements && typeof group.settlements === 'object')
        ? group.settlements : {};
      const reconciled = reconcilePaymentStatus(plan, saved);
      return { ok: true, text: formatSettlementShareText(group, reconciled) };
    }

    // 精算結果テキストをクリップボードへコピーする（要件 18.2）。
    // レート不足で精算を確定できない場合はコピーせず、その旨を表示する（要件 20.6）。
    function copySettlementText() {
      const group = state.groups[state.currentGroupId];
      if (!group) return;

      const result = settlementShareTextForGroup(group);
      if (!result.ok) {
        showToast('為替レートが不足しているため精算を確定できません' +
          (result.missing ? '（不足: ' + result.missing + '）' : '') + '。', 'error');
        return;
      }

      copyTextToClipboard(result.text, L('toastSettlementCopied'), function () {
        showToast(L('toastCopyFailed'), 'error');
      });
    }

    // 精算結果テキストを OS 標準の共有シートで共有する（要件 18.3）。
    // navigator.share 対応時のみ利用可能。ユーザーのキャンセル（AbortError）は無視し、
    // 非対応・失敗時は copySettlementText（コピー）へフォールバックする。
    function shareSettlementText() {
      const group = state.groups[state.currentGroupId];
      if (!group) return;

      const result = settlementShareTextForGroup(group);
      if (!result.ok) {
        showToast('為替レートが不足しているため精算を確定できません' +
          (result.missing ? '（不足: ' + result.missing + '）' : '') + '。', 'error');
        return;
      }

      if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
        navigator.share({ text: result.text }).catch(function (err) {
          // ユーザーが共有シートを閉じた場合（AbortError）は正常操作なので無視する。
          if (err && err.name === 'AbortError') return;
          // それ以外の失敗はコピーにフォールバックする。
          copySettlementText();
        });
        return;
      }

      // navigator.share 非対応環境ではコピーにフォールバックする。
      copySettlementText();
    }

    // OS 標準の共有シートを起動する（要件 2.7）。navigator.share 対応時のみ利用可能。
    // ユーザーのキャンセル（AbortError）はエラー扱いしない。非対応環境では copyGroupUrl にフォールバック。
    function shareGroupUrl(groupId) {
      if (!groupId) return;
      const url = buildGroupUrl(groupId);
      const group = state.groups[groupId];
      const title = (group && group.name) ? group.name : 'ワリタカ';

      if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
        navigator.share({ title: title, url: url }).catch(function (err) {
          // ユーザーが共有シートを閉じた場合（AbortError）は正常操作なので無視する。
          if (err && err.name === 'AbortError') return;
          // それ以外の失敗はコピーにフォールバックする。
          copyGroupUrl(groupId);
        });
        return;
      }

      // navigator.share 非対応環境ではコピーにフォールバックする。
      copyGroupUrl(groupId);
    }

    // Group_URL の QR_Code を表示/非表示トグルする（要件 2.8）。
    // #qr-container の hidden を外して renderQrCode で描画する。既に表示中なら隠す。
    function showQrCode(groupId) {
      if (!groupId) return;
      const container = document.getElementById('qr-container');
      if (!container) return;

      // 既に表示中ならトグルで隠す（再タップで閉じられる）。
      if (!container.hidden) {
        container.hidden = true;
        container.innerHTML = '';
        return;
      }

      const url = buildGroupUrl(groupId);
      renderQrCode(url, 'qr-container');
      container.hidden = false;
    }

    // ハッシュ変更を解釈して state.currentGroupId 等を更新し再描画する。
    // #/g/{groupId} → 経費画面（openGroup へ委譲）、それ以外 → 一覧/作成画面（要件 2.2）。
    function handleRoute() {
      const hash = location.hash || '';
      // #/g/{groupId} 形式を抽出する。
      const match = hash.match(/^#\/g\/(.+)$/);

      if (match) {
        const groupId = decodeURIComponent(match[1]);
        state.currentGroupId = groupId;
        state.notFound = false;
        // 購読開始・キャッシュ即時描画・存在確認は openGroup が担う（内部で render を呼ぶ）。
        openGroup(groupId);
        return;
      }

      // 一覧 / 作成画面（#/ もしくはハッシュ無し）。
      state.currentGroupId = null;
      state.notFound = false;
      state.showCreate = false;
      // 経費画面を離れるので複数選択もリセットする（UI 専用・要件 14.1）。
      if (state.selection instanceof Set) state.selection.clear();
      // 経費画面の購読を解除する（一覧では Group を購読しない）。
      if (typeof unsubscribe === 'function') {
        try { unsubscribe(); } catch (e) { /* 解除失敗は無視 */ }
        unsubscribe = null;
      }
      render();
    }


    /* =====================================================================
     * SECTION 7: INIT（初期化・配線）
     * design.md「統合と配線（init）」準拠。
     * loadData → ルーティング解決 → SyncBackend 選択 → 購読 → 初回描画。
     * ===================================================================== */

    // 全体の配線と初期化（task 10.1・要件 6.1, 6.2, 6.3, 6.8, 2.9, 8.4, 8.5, 9.3）。
    // 非同期ファクトリ（createFirebaseSyncBackend）を await するため async とする。
    // syncBackend の用意を待つ間も、キャッシュから即時描画してモバイルでの体感速度を優先する
    // （design.md「オフラインとフォールバック: まずキャッシュから即時描画し、続いて購読で最新化」）。
    async function init() {
      // 1) 永続化データ（localStorage）を state へ復元する（要件 8.2）。
      //    破損時は空データにフォールバックする（loadData 内で処理済み・要件 8.3）。
      loadData();

      // 2) hashchange を handleRoute へ配線する。以後の URL 変更（一覧⇄経費画面の遷移、
      //    グループ作成完了後の #/g/{id} 遷移など）はすべて handleRoute が解決する（要件 2.2, 2.9）。
      window.addEventListener('hashchange', handleRoute);

      // 3) 初回ルート解決。現在の URL を解釈して初回描画する。
      //    syncBackend 未確定（null）でも openGroup にガードがあり、キャッシュから即時描画できる（要件 8.2）。
      handleRoute();

      // 4) SyncBackend を選択する。window.WARIKAN_FIREBASE_CONFIG があれば Firebase、
      //    なければ（無効・import 失敗含む）LocalSyncBackend へフォールバックする（要件 6.1, 8.4）。
      syncBackend = (await createClaudeDbSyncBackend()) || await createFirebaseSyncBackend();

      // 5) 接続状態変化を配線する。online 状態を state.online に反映して
      //    オフラインバナーを更新し（要件 8.4）、接続回復時（offline→online）は現在の Group を
      //    openGroup で再購読・最新化して再描画する（要件 8.5）。
      syncBackend.onConnectionChange(function (online) {
        const wasOnline = state.online;
        state.online = !!online;
        renderOfflineBanner();

        // 接続が回復したら（false→true）、開いている Group を再購読して最新データを取得する（要件 8.5）。
        if (!wasOnline && state.online && state.currentGroupId) {
          openGroup(state.currentGroupId);
        }
      });

      // 6) syncBackend 確定後、経費画面を開いていれば openGroup を呼び直して購読を確立する。
      //    初回 handleRoute 時点では syncBackend が null でキャッシュ描画のみだったため、
      //    ここで購読を張り直して他メンバーの変更受信（要件 6.1〜6.3）と存在確認（要件 2.3）を有効化する。
      //    Guest_User 初回アクセスの参加済み一覧への自動追加も openGroup 内で行われる（要件 6.8）。
      if (state.currentGroupId) {
        openGroup(state.currentGroupId);
      }
    }

    // DOM 準備後に初期化。
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }


    /* =====================================================================
     * SECTION 8: TEST EXPORTS（テスト用エクスポート・追加のみ / 挙動不変）
     * ---------------------------------------------------------------------
     * tests.html（プロパティテストページ）から SECTION 4 の純粋関数群と、
     * 永続化系の純粋関数・ジェネレータが必要とする設定定数を参照できるように、
     * window.WarikanCore へ「読み取り専用の参照」を公開する。
     *
     * 方針（design.md「Testing Strategy」/ ゼロビルド制約）:
     *   - 本体 index.html の SECTION 構成・既存の動作は一切変更しない。
     *     本ブロックは末尾に「追加するだけ」で、既存コードパス・state・描画・
     *     同期処理には影響しない（純粋関数と定数への参照を張るのみ）。
     *   - tests.html は本ファイルを非表示 iframe で読み込み、
     *     iframe.contentWindow.WarikanCore 経由で実出荷コードを直接テストする
     *     （関数の二重定義・コピーをしないため、テストが実装と乖離しない）。
     *   - const で宣言された設定定数はグローバルに露出しないため、ジェネレータ用に
     *     ここで明示的に公開する（SPLIT_METHODS / CURRENCIES など）。
     * ===================================================================== */
    window.WarikanCore = {
      // --- SECTION 4: 計算・検証の純粋関数（テスト対象の中核） ---
      allocateByLargestRemainder: allocateByLargestRemainder,
      computeLineSplit: computeLineSplit,
      computeSplit: computeSplit,
      expenseTotal: expenseTotal,
      computeBalances: computeBalances,
      computeSettlement: computeSettlement,
      mergeExpenses: mergeExpenses,
      validateExpense: validateExpense,
      validateNewMember: validateNewMember,
      isMemberInUse: isMemberInUse,
      memberSummary: memberSummary,
      totals: totals,

      // --- SECTION 4: メンバー再利用（Member_Template）の純粋関数（要件 17） ---
      memberSetKey: memberSetKey,
      normalizeMemberTemplates: normalizeMemberTemplates,

      // --- SECTION 4: 多通貨・為替換算の純粋関数（要件 20） ---
      baseCurrencyOf: baseCurrencyOf,
      convertAmount: convertAmount,
      convertExpenseToBase: convertExpenseToBase,
      computeBalancesInBase: computeBalancesInBase,
      toBaseCurrencyGroup: toBaseCurrencyGroup,

      // --- SECTION 4: 検索・並べ替えの純粋関数（要件 19, 7.2） ---
      filterExpenses: filterExpenses,
      sortExpenses: sortExpenses,

      // --- SECTION 4: 一括編集・一括削除の純粋関数（要件 14 / Property 20, 21） ---
      removeSelectedExpenses: removeSelectedExpenses,
      applyCommonEditToExpenses: applyCommonEditToExpenses,

      // --- SECTION 4: 支払済みチェックの純粋関数（要件 16 / Property 24, 25） ---
      transferKey: transferKey,
      reconcilePaymentStatus: reconcilePaymentStatus,
      remainingSettlement: remainingSettlement,

      // --- SECTION 4: 精算共有テキスト整形の純粋関数（要件 18 / Property 26） ---
      formatSettlementShareText: formatSettlementShareText,

      // --- 金額ユーティリティ（最小通貨単位整数 <-> 表示） ---
      minorUnitDigits: minorUnitDigits,
      currencyOf: currencyOf,
      formatAmount: formatAmount,
      parseAmount: parseAmount,

      // --- SECTION 3: 永続化系の純粋関数（round-trip / 頑健性テスト用） ---
      isValidMember: isValidMember,
      isValidExpense: isValidExpense,
      isValidGroup: isValidGroup,
      sanitizeExpense: sanitizeExpense,
      sanitizeExchangeRates: sanitizeExchangeRates,
      sanitizeSettlements: sanitizeSettlements,
      sanitizeMemberTemplates: sanitizeMemberTemplates,
      sanitizeGroup: sanitizeGroup,
      parseStoredPayload: parseStoredPayload,

      // --- SECTION 1: ジェネレータ／テストが参照する設定定数 ---
      constants: {
        STORAGE_KEY: STORAGE_KEY,
        SPLIT_METHODS: SPLIT_METHODS,
        DEFAULT_CURRENCY: DEFAULT_CURRENCY,
        CURRENCIES: CURRENCIES,
        SORT_ORDERS: SORT_ORDERS,
        PAYMENT_STATUS: PAYMENT_STATUS,
      },
    };
  </script>
</body>
