/* ============================================================
   授業用 Roots（先生がプロジェクター・電子黒板に映す版）
   単語データ・語源コラム・ピクトグラム・音声などは本体のものをそのまま使う
   ============================================================ */
const CLASS_KEY="roots.class.v1";        // 先生の設定（範囲・モードなど）
const LAST_KEY="roots.class.last.v1";    // 「続きから」用（どの単語のどこまで進んだか）
const MODES=[
  {key:"explain",label:"語源で解く",note:"単語 → 語源 → イメージ → 意味 → 例文 と、1段ずつめくって説明する"},
  {key:"quiz",label:"クラスクイズ",note:"単語を映して、考える時間のあとに答えを出す。全員で声に出して答える"},
  {key:"roots",label:"語根まとめ",note:"範囲に出てくる語根を選び、その語根を使う単語をまとめて見せる"},
  {key:"live",label:"みんなで四択",note:"生徒が QR コードからスマホで参加。四択に答えて、点数と上位5人を映す"},
];
const MODE_LABEL=Object.fromEntries(MODES.map(m=>[m.key,m.label]));
const LEAP_MAX=ALPHA_FROM-1;
const LESSONS=[...new Set(RAW_WORDS.filter(w=>w.lesson).map(w=>w.part))]
  .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
const WORD_BY_ID=new Map(RAW_WORDS.map(w=>[w.id,w]));
const WORD_BY_EN=new Map();
RAW_WORDS.forEach(w=>{const k=w.word.toLowerCase();if(!WORD_BY_EN.has(k))WORD_BY_EN.set(k,w);});
const SIZE_STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];
const DEFAULT_CLASS={mode:"explain",kind:"leap",from:1,to:10,lesson:LESSONS[0]||null,order:"seq",
  sec:5,liveSec:20,dir:"en",sound:true,autoSpeak:true,scale:1,dark:false};

function wordsFor(cfg){
  const lo=Math.min(cfg.from,cfg.to),hi=Math.max(cfg.from,cfg.to);
  let list=cfg.kind==="lesson"
    ?RAW_WORDS.filter(w=>w.part===cfg.lesson)
    :RAW_WORDS.filter(w=>!w.lesson&&w.id>=lo&&w.id<=hi&&w.id<=LEAP_MAX);
  list=[...list].sort((a,b)=>a.id-b.id);
  return cfg.order==="random"?shuffle(list):list;
}
function loadLast(){
  const l=lsGet(LAST_KEY);
  if(!l||!Array.isArray(l.ids)||!MODE_LABEL[l.mode])return null;
  /* 番号（id）と英単語の両方で確かめる。今後 LEAP の番号を入れ替えても、別の単語を指さないように */
  const list=l.ids.map((id,k)=>{
    const w=WORD_BY_ID.get(id),en=Array.isArray(l.words)?l.words[k]:null;
    if(w&&(!en||w.word===en))return w;
    return en?findWord(en):null;
  }).filter(Boolean);
  if(!list.length||(l.pos&&l.pos.done))return null;
  return {mode:l.mode,list,sec:l.sec??5,dir:l.dir||"en",pos:l.pos||null};
}

/* ---------- 単語データから表示用の文を作る ---------- */
const meaningsOf=w=>[...new Set((w.meanings||[]).map(m=>String(m).split("|").pop().trim()))].filter(m=>m&&m!==w.meaning);
const processQ=w=>{const s=String(w.etymologyProcess||"");const i=s.indexOf("→");return i>=0?s.slice(i+1).trim():"";};
const imageHidden=w=>imageryOf(w).replace(/＝[^＝]*$/,"＝？");
const wordSize=(base,word)=>Math.round(base*Math.min(1,11/Math.max(1,String(word).length)));
const noLabel=w=>w.lesson?partName(w.part):w.id>LEAP_MAX?"Part α":"No."+w.id;
const findWord=en=>WORD_BY_EN.get(String(en||"").toLowerCase())||null;

/* 1語の説明の段。データがない段は飛ばす */
const STEP_LABEL={word:"単語",roots:"語源",image:"イメージ",meaning:"意味",example:"例文",more:"関連語"};
function stepsOf(w){
  const s=["word"];
  if(parseRoots(w).length)s.push("roots");
  if(imageryOf(w).trim())s.push("image");
  s.push("meaning");
  if(w.example)s.push("example");
  if((w.relatedWords||[]).length||(w.usage||[]).length||(w.etymologyMore||[]).length)s.push("more");
  return s;
}

/* ============================================================
   共通のしくみ
   ============================================================ */
const AppCtx=React.createContext(null);
const useApp=()=>React.useContext(AppCtx);

/* キー操作（画面ごと）。入力欄で文字を打っているときは反応しない */
function useKeys(map){
  const ref=useRef(map);ref.current=map;
  useEffect(()=>{
    const h=e=>{
      if(e.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
      if(e.metaKey||e.ctrlKey||e.altKey||e.isComposing)return;
      const f=ref.current[e.key]||ref.current[e.key.toLowerCase()];
      if(f){e.preventDefault();f(e);}
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[]);
}
/* 重ねて開く画面（コラム・検索など）は、いちばん上のものだけがキーを受け取る */
const CAPTURE=[];
window.addEventListener("keydown",e=>{
  if(!CAPTURE.length)return;
  e.stopImmediatePropagation();
  if(e.isComposing)return;
  const typing=e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(typing&&e.key.length===1)return;            // 文字の入力はそのまま
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const map=CAPTURE[CAPTURE.length-1].current;
  const f=map[e.key]||map[e.key.toLowerCase()];
  if(f){e.preventDefault();f(e);}
},true);
function useCapture(map){
  const ref=useRef(map);ref.current=map;
  useEffect(()=>{
    CAPTURE.push(ref);
    return ()=>{const k=CAPTURE.indexOf(ref);if(k>=0)CAPTURE.splice(k,1);};
  },[]);
}
/* マウスでボタンを押したあと、Space キーでそのボタンがもう一度押されないようにする */
document.addEventListener("pointerup",()=>{
  setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName==="BUTTON")a.blur();},0);
});

/* 画面の大きさに合わせた倍率（1440×860 を 1 とする） */
function useViewportScale(){
  const get=()=>clamp(Math.min(window.innerWidth/1440,window.innerHeight/860),0.7,1.6);
  const [v,setV]=useState(get);
  useEffect(()=>{
    const h=()=>setV(get());
    window.addEventListener("resize",h);
    return ()=>window.removeEventListener("resize",h);
  },[]);
  return v;
}

/* 中身が画面に収まるように、自動で拡大・縮小する入れ物。
   プロジェクターの解像度（1024×768〜1920×1080）がまちまちでも、はみ出さずに最大の大きさで映す */
function Fit({children,scale=1,onClick,onSwipe,label}){
  const outer=useRef(null),inner=useRef(null);
  /* 電子黒板・タッチパネル：左右にスワイプすると次へ・戻る */
  const touch=useRef(null),swiped=useRef(false);
  const down=e=>{touch.current={x:e.clientX,y:e.clientY};swiped.current=false;};
  const up=e=>{
    const t=touch.current;touch.current=null;
    if(!t||!onSwipe)return;
    const dx=e.clientX-t.x,dy=e.clientY-t.y;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){swiped.current=true;onSwipe(dx<0?1:-1);}
  };
  const click=e=>{if(swiped.current){swiped.current=false;return;}onClick&&onClick(e);};
  const fit=useCallback(()=>{
    const o=outer.current,n=inner.current;
    if(!o||!n)return;
    const cw=o.clientWidth,ch=o.clientHeight;
    if(!cw||!ch)return;
    let s=scale;
    for(let k=0;k<5;k++){
      n.style.width=(cw/s)+"px";
      const ns=Math.min(scale,ch/(n.offsetHeight||1),cw/Math.max(n.scrollWidth,1));
      if(Math.abs(ns-s)<0.01){s=Math.min(s,ns);break;}
      s=ns;
    }
    n.style.width=(cw/s)+"px";
    s=Math.min(s,ch/(n.offsetHeight||1));
    n.style.transform="scale("+s+")";
    n.style.left=Math.max(0,(cw-n.offsetWidth*s)/2)+"px";
    n.style.top=Math.max(0,(ch-n.offsetHeight*s)/2)+"px";
  },[scale]);
  useLayoutEffect(fit);
  useEffect(()=>{
    if(!window.ResizeObserver)return;
    const ro=new ResizeObserver(()=>fit());
    ro.observe(outer.current);ro.observe(inner.current);
    return ()=>ro.disconnect();
  },[fit]);
  return (
    <div ref={outer} onClick={click} onPointerDown={down} onPointerUp={up} aria-label={label}
      style={{flex:1,minHeight:0,position:"relative",overflow:"hidden",cursor:onClick?"pointer":"default",touchAction:"pan-y",userSelect:"none"}}>
      <div ref={inner} style={{position:"absolute",left:0,top:0,transformOrigin:"0 0",containerType:"inline-size"}}>{children}</div>
    </div>
  );
}

/* ---------- ボタンなどの部品 ---------- */
const stop=e=>e.stopPropagation();

}
function Pill({active,children,onClick,disabled}){

}

}
const Ico=({d,size=24})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{d}</svg>
);
const I={
  search:<><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></>,
  sun:<><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></>,
  moon:<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>,
  full:<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>,
  unfull:<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>,
  speak:<><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></>,
};
function NumBox({value,onChange,min,max,label}){
  const {C}=useApp();
  const [t,setT]=useState(String(value));
  useEffect(()=>{setT(String(value));},[value]);
  return (
    <label style={{display:"flex",alignItems:"center",gap:10,fontSize:20,color:C.sub}}>
      {label}
      <input inputMode="numeric" value={t} className="num" aria-label={label||"番号"}
        onChange={e=>{
          const s=e.target.value.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,"");
          setT(s);
          const v=parseInt(s,10);
          if(!isNaN(v)&&v>=min&&v<=max)onChange(v);
        }}
        onBlur={()=>setT(String(value))}
        onFocus={e=>e.target.select()}
        onKeyDown={e=>{if(e.key==="Enter")e.target.blur();}}
        style={{width:120,minHeight:56,fontSize:26,fontWeight:700,textAlign:"center",borderRadius:12,
          border:"2px solid "+C.line,background:C.bg,color:C.text}}/>
    </label>
  );
}

/* 語源チップ（大画面用）。押すと語源コラムが開く */
function BigRoots({w,size=1}){
  const {C,openRoot}=useApp();
  const parts=parseRoots(w);
  if(!parts.length)return null;
  return (
    <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",justifyContent:"center",gap:18*size}}>
      {parts.map((r,i)=>{
        const col=rootColor(r.morph,C,i,parts.length,parts);
        const type=morphType(r.morph,i,parts.length,parts);
        return (
          <React.Fragment key={i}>
            {i>0&&<span aria-hidden="true" style={{fontSize:44*size,color:C.faint,fontWeight:700}}>＋</span>}
            <button className="riseIn press" onClick={e=>{stop(e);openRoot({morph:r.morph,gloss:r.gloss,type});}}
              aria-label={r.morph+"（"+(r.gloss||"")+"）の語源コラムを開く"}
              style={{animationDelay:(i*0.12)+"s",display:"inline-flex",flexDirection:"column",position:"relative",cursor:"pointer",
                alignItems:"center",border:"2px solid "+C.line,borderRadius:14,padding:(14*size)+"px "+(26*size)+"px",
                color:col.fg,background:"transparent",font:"inherit"}}>
              <span className="en" style={{fontSize:60*size,fontWeight:700,lineHeight:1.1}}>{r.morph}</span>
              {r.gloss&&<span style={{fontSize:28*size,marginTop:6}}>{r.gloss}</span>}
              {rootNote(r.morph)&&<span aria-hidden="true" style={{position:"absolute",top:8,right:9,width:10,height:10,
                borderRadius:"50%",background:col.fg,opacity:.75}}/>}
            </button>
          </React.Fragment>
        );
      })}
    </div>
  );
}
function BigWord({w,colored,size=130}){
  const {C}=useApp();
  /* 長い単語は折り返さずに、画面の幅に収まる大きさまで小さくする（cqw は Fit の幅に対する割合） */
  const fs="min("+wordSize(size,w.word)+"px, calc((100cqw - 260px) / "+(String(w.word).length*0.6).toFixed(2)+"))";
  return (
    <div className="en" style={{fontSize:fs,fontWeight:700,lineHeight:1.08,textAlign:"center",whiteSpace:"nowrap"}}>
      {colored?<ColoredWord C={C} word={w.word} parts={parseRoots(w)}/>:w.word}
    </div>
  );
}
/* 例文（見出し語に下線）。押すと読み上げ */

/* 単語検索（英語・日本語・番号） */
function searchWords(q){
  q=q.trim().toLowerCase().replace(/^no\.?\s*/,"");
  if(!q)return [];
  if(/^\d+$/.test(q)){const w=WORD_BY_ID.get(+q);return w?[w]:[];}
  const score=w=>{
    const en=w.word.toLowerCase();
    if(en===q)return 0;
    if(en.startsWith(q))return 1;
    if(String(w.meaning||"").includes(q))return 2;
    if(en.includes(q))return 3;
    if((w.meanings||[]).some(m=>m.includes(q)))return 4;
    return 9;
  };
  return RAW_WORDS.map(w=>[score(w),w]).filter(x=>x[0]<9)
    .sort((a,b)=>a[0]-b[0]||a[1].word.length-b[1].word.length||a[1].id-b[1].id).slice(0,40).map(x=>x[1]);
}

          <button key={w.id} onClick={()=>A.jumpWord(w)} onMouseEnter={()=>setK(i)} className="press"
            style={{display:"flex",alignItems:"baseline",gap:20,width:"100%",minHeight:64,padding:"10px 16px",border:"none",

    </Sheet>

function ExplainScreen({run,onBack,onRun}){
  const A=useApp();const {C,cfg}=A;
  const list=run.list;
  const p0=run.pos||{};
  const [i,setI]=useState(Math.min(p0.i||0,list.length-1));
  const [step,setStep]=useState(p0.step||0);
  const [end,setEnd]=useState(!!p0.done);
  const [why,setWhy]=useState(false);
  const [drawer,setDrawer]=useState(false);
  const w=list[i];
  const steps=useMemo(()=>stepsOf(w),[w]);
  const st=Math.min(step,steps.length-1);
  const key=steps[st];
  const at=k=>{const n=steps.indexOf(k);return n>=0&&n<=st;};
  useEffect(()=>{A.savePos(run,{i,step:st,done:end});},[i,st,end]);
  useEffect(()=>{if(!end&&st===0&&cfg.autoSpeak)speak(w.word);},[i,end]);
  const go=(ni,ns)=>{setI(ni);setStep(ns);setEnd(false);};
  const next=()=>{
    if(st<steps.length-1)setStep(st+1);
    else if(i<list.length-1)go(i+1,0);
    else{stopSpeak();setEnd(true);}
  };
  const prev=()=>{
    if(end){setEnd(false);return;}
    if(st>0)setStep(st-1);
    else if(i>0)go(i-1,stepsOf(list[i-1]).length-1);
  };
  const nextWord=()=>{if(i<list.length-1)go(i+1,0);else{stopSpeak();setEnd(true);}};
  const prevWord=()=>{if(i>0)go(i-1,0);};
  const jump=n=>{if(n<steps.length)setStep(n);};
  /* 説明のあとのクイズは、説明と同じ順だと答えを順番で覚えてしまうのでシャッフルする */
  const endActions=[
    {label:"この単語でクイズ ▶",onClick:()=>onRun({mode:"quiz",list:shuffle(list),sec:cfg.sec,dir:cfg.dir}),primary:true},
    {label:"もう一度はじめから",onClick:()=>onRun({mode:"explain",list})},
  ];
  useKeys(end
    ?{Escape:onBack,Enter:endActions[0].onClick,ArrowLeft:prev,PageUp:prev,Backspace:prev}
    :{" ":next,ArrowRight:next,PageDown:next,Enter:next,ArrowLeft:prev,PageUp:prev,Backspace:prev,
      ArrowDown:nextWord,ArrowUp:prevWord,Escape:onBack,s:()=>speak(w.word),
      e:()=>{if(at("example"))speak(w.example);},w:()=>{if(w.why)setWhy(true);},l:()=>setDrawer(true),
      "1":()=>jump(0),"2":()=>jump(1),"3":()=>jump(2),"4":()=>jump(3),"5":()=>jump(4),"6":()=>jump(5)});
  if(end)return <EndScreen title="語源で解く" list={list} actions={endActions} onBack={onBack} onPrev={prev} detour={run.detour}/>;

  const big=key==="word"||key==="roots"||key==="image";
  const others=meaningsOf(w).slice(0,3);
  const q=processQ(w);
  const stepper=steps.map((s,k)=>(
    <button key={s} onClick={()=>jump(k)} className="press" aria-label={(k+1)+" "+STEP_LABEL[s]+"へ"} aria-current={k===st?"step":undefined}
      style={{minHeight:52,padding:"0 16px",fontSize:18,fontWeight:700,borderRadius:999,cursor:"pointer",whiteSpace:"nowrap",
        border:"2px solid "+(k<=st?C.text:C.line),background:k===st?C.text:"transparent",color:k===st?C.bg:k<st?C.text:C.sub}}>
      <span className="num" style={{opacity:.7,marginRight:6}}>{k+1}</span>{STEP_LABEL[s]}
    </button>
  ));
  return (
    <Frame title="語源で解く" pos={(i+1)+" / "+list.length+" 語"} progress={(i+(st+1)/steps.length)/list.length}
      onBack={onBack} detour={run.detour} onPrev={i>0||st>0?prev:null} onNext={next}
      nextLabel={st<steps.length-1?"次へ ▶":i<list.length-1?"次の単語 ▶":"おわり ▶"}
      center={<>{stepper}{list.length>1&&<SmallBtn onClick={()=>setDrawer(true)} label="単語の一覧（キー: L）">一覧</SmallBtn>}</>}>
      <Fit scale={A.z} onClick={next} onSwipe={d=>d>0?next():prev()} label="押すと次へ進む">
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:24,padding:"26px 60px 30px",textAlign:"center"}}>
          <div className="num" style={{fontSize:20,fontWeight:700,color:C.sub}}>{noLabel(w)}</div>
          <div style={{display:"flex",alignItems:"center",gap:24,marginTop:-8}}>
            <BigWord w={w} colored={st>=1} size={big?136:key==="meaning"?108:key==="more"?64:84}/>
            <SpeakBtn text={w.word}/>
          </div>
          {key!=="more"&&<div style={{fontSize:24,color:C.sub,marginTop:-10}}>
            <span className="en">{w.pronunciation}</span>{w.partOfSpeech&&<span>　{w.partOfSpeech}</span>}
          </div>}
          {at("roots")&&<BigRoots w={w} size={key==="roots"?1:key==="image"?0.85:key==="more"?0.5:0.68}/>}
          {key==="roots"&&<div className="fadeIn" style={{zoom:1.2}} onClick={stop}><Pictogram C={C} word={w} onTapRoot={A.openRoot}/></div>}
          {key==="roots"&&q&&<div className="riseIn" style={{fontSize:38,fontWeight:700,lineHeight:1.5,maxWidth:1150,animationDelay:".25s"}}>→ {q}</div>}
          {key==="image"&&<div className="riseIn" style={{fontSize:40,lineHeight:1.6,maxWidth:1150}}>{imageHidden(w)}</div>}
          {at("meaning")&&<div className="riseIn" style={{fontSize:key==="meaning"?92:key==="more"?44:60,fontWeight:700,lineHeight:1.25}}>{w.meaning}</div>}
          {key==="meaning"&&others.length>0&&<div style={{fontSize:26,color:C.sub}}>ほかの意味：{others.join(" ／ ")}</div>}
          {key==="meaning"&&(w.hook||imageryOf(w))&&<div className="fadeIn" style={{fontSize:30,lineHeight:1.6,maxWidth:1150,color:C.text,
            borderLeft:"5px solid "+C.root,padding:"6px 0 6px 22px",textAlign:"left"}}>{w.hook||imageryOf(w)}</div>}
          {at("meaning")&&w.why&&key!=="more"&&<SmallBtn onClick={()=>setWhy(true)} label="なぜこの意味？（キー: W）">なぜこの意味？（W）</SmallBtn>}
          {key==="example"&&<div className="riseIn" style={{display:"flex",flexDirection:"column",gap:26,maxWidth:1250}}>

          </div>}

/* ============================================================
   ② クラスクイズ
   ============================================================ */
function QuizScreen({run,onBack,onRun}){
  const A=useApp();const {C,cfg}=A;
  const list=run.list,sec=run.sec||0,dir=run.dir==="ja"?"ja":"en";
  const p0=run.pos||{};
  const [i,setI]=useState(Math.min(p0.i||0,list.length-1));
  const [phase,setPhase]=useState(p0.phase==="answer"?"answer":"ask");
  const [hint,setHint]=useState(false);
  const [left,setLeft]=useState(sec);
  const [paused,setPaused]=useState(false);
  const [marks,setMarks]=useState(()=>new Set(run.marks||[]));
  const [end,setEnd]=useState(!!p0.done);
  const w=list[i];
  useEffect(()=>{A.savePos(run,{i,phase,done:end});},[i,phase,end]);
  const askSpeak=ni=>{if(dir==="en"&&cfg.autoSpeak)speak(list[ni].word);};
  useEffect(()=>{if(phase==="ask"&&!end)askSpeak(i);},[]);
  const goto=(ni,ph)=>{setI(ni);setPhase(ph);setHint(false);setLeft(sec);setPaused(false);setEnd(false);if(ph==="ask")askSpeak(ni);};
  const reveal=()=>{setPhase("answer");if(cfg.autoSpeak)speak(w.word);};
  const next=()=>{
    if(phase==="ask")reveal();
    else if(i<list.length-1)goto(i+1,"ask");
    else{stopSpeak();setEnd(true);}
  };
  const prev=()=>{
    if(end){setEnd(false);return;}
    if(i>0)goto(i-1,"answer");
    else if(phase==="answer")goto(0,"ask");
  };
  const toggleMark=()=>setMarks(m=>{const n=new Set(m);n.has(w.id)?n.delete(w.id):n.add(w.id);run.marks=[...n];return n;});
  /* 考える時間のカウントダウン。重ねた画面（コラムなど）を開いている間は止める */
  const running=!end&&phase==="ask"&&!paused&&!A.busy&&sec>0;
  useEffect(()=>{
    if(!running)return;
    if(left<=0){if(cfg.sound)tone([[660,0,.18],[880,.16,.32]],.12);reveal();return;}
    const t=setTimeout(()=>{
      const nl=left-1;
      if(cfg.sound&&nl>0&&nl<=3)tone([[1000,0,.07]],.05);
      setLeft(nl);
    },1000);
    return ()=>clearTimeout(t);
  },[left,running]);
  const marked=list.filter(x=>marks.has(x.id));
  const endActions=marked.length
    ?[{label:"★の"+marked.length+"語をもう一度",onClick:()=>onRun({mode:"quiz",list:shuffle(marked),sec,dir}),primary:true},
      {label:"★の語を語源で解く",onClick:()=>onRun({mode:"explain",list:marked})},
      {label:"全部シャッフルしてもう一度",onClick:()=>onRun({mode:"quiz",list:shuffle(list),sec,dir})}]
    :[{label:"シャッフルしてもう一度",onClick:()=>onRun({mode:"quiz",list:shuffle(list),sec,dir}),primary:true},
      {label:dir==="en"?"日本語→英語でもう一度":"英語→日本語でもう一度",onClick:()=>onRun({mode:"quiz",list:shuffle(list),sec,dir:dir==="en"?"ja":"en"})},
      {label:"この単語を語源で解く",onClick:()=>onRun({mode:"explain",list})}];
  useKeys(end
    ?{Escape:onBack,Enter:endActions[0].onClick,ArrowLeft:prev,PageUp:prev,Backspace:prev}
    :{" ":next,ArrowRight:next,PageDown:next,Enter:next,ArrowLeft:prev,PageUp:prev,Backspace:prev,Escape:onBack,
      s:()=>speak(w.word),h:()=>setHint(x=>!x),p:()=>{if(sec)setPaused(x=>!x);},m:toggleMark});
  if(end)return <EndScreen title="クラスクイズ" fanfare dir={dir} list={list} marks={marks} actions={endActions} onBack={onBack} onPrev={prev} detour={run.detour}/>;

  const mk=marks.has(w.id);
  const ask=phase==="ask";
  const center=<>
    {ask&&<SmallBtn onClick={()=>setHint(x=>!x)} active={hint} label="ヒント（キー: H）">ヒント（H）</SmallBtn>}
    {ask&&sec>0&&<SmallBtn onClick={()=>setPaused(x=>!x)} active={paused} label="一時停止（キー: P）">{paused?"再開（P）":"一時停止（P）"}</SmallBtn>}
    <SmallBtn onClick={toggleMark} active={mk} label="あとで復習に印をつける（キー: M）">★ あとで復習（M）</SmallBtn>
  </>;
  return (
    <Frame title={"クラスクイズ　"+(dir==="en"?"英語 → 日本語":"日本語 → 英語")} pos={(i+1)+" / "+list.length+" 問"}
      progress={(i+(ask?0:1))/list.length} onBack={onBack} detour={run.detour} onPrev={i>0||!ask?prev:null} onNext={next}
      nextLabel={ask?"答え ▶":i<list.length-1?"次の問題 ▶":"おわり ▶"} center={center}>
      <Fit scale={A.z} onClick={next} onSwipe={d=>d>0?next():prev()} label={ask?"押すと答えを出す":"押すと次の問題へ"}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:28,padding:"28px 60px 30px",textAlign:"center"}}>
          <div className="num" style={{fontSize:20,fontWeight:700,color:C.sub}}>{noLabel(w)}{mk&&<b style={{color:C.root,marginLeft:10}}>★</b>}</div>
          {dir==="en"
            ?<div style={{display:"flex",alignItems:"center",gap:24,marginTop:-8}}>
               <BigWord w={w} colored={!ask} size={ask?150:120}/>
               <SpeakBtn text={w.word}/>
             </div>
            :<div style={{marginTop:-8}}>
               <div style={{fontSize:ask?96:60,fontWeight:700,lineHeight:1.25}}>{w.meaning}</div>
               {w.partOfSpeech&&<div style={{fontSize:24,color:C.sub,marginTop:8}}>{w.partOfSpeech}</div>}
             </div>}
          {ask
            ?<>
               {sec>0
                 ?<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
                    <div className="num" style={{fontSize:128,fontWeight:700,lineHeight:1,color:left<=3?C.root:C.text}}>{left}</div>
                    <div style={{width:640,height:12,borderRadius:6,background:C.line,overflow:"hidden"}} aria-hidden="true">
                      <div key={i} style={{height:"100%",background:left<=3?C.root:C.text,transformOrigin:"left",
                        animation:"shrink "+sec+"s linear forwards",animationPlayState:running?"running":"paused"}}/>
                    </div>
                  </div>
                 :null}
               <div style={{fontSize:sec>0?28:36,color:C.sub}}>
                 {paused?"一時停止中（P で再開）":dir==="en"?"意味は？　語源から考えてみよう":"英語で言うと？　語源から考えてみよう"}</div>
               {hint&&<div className="fadeIn"><BigRoots w={w} size={0.8}/></div>}
             </>
            :<>
               {dir==="en"
                 ?<div className="riseIn" style={{fontSize:96,fontWeight:700,lineHeight:1.25}}>{w.meaning}</div>
                 :<div className="riseIn" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:24}}><BigWord w={w} colored size={136}/><SpeakBtn text={w.word}/></div>
                    <div className="en" style={{fontSize:26,color:C.sub}}>{w.pronunciation}</div>
                  </div>}
               <div className="fadeIn"><BigRoots w={w} size={0.75}/></div>
               {(w.hook||imageryOf(w))&&<div className="fadeIn" style={{fontSize:28,lineHeight:1.6,maxWidth:1150,
                 borderLeft:"5px solid "+C.root,padding:"6px 0 6px 22px",textAlign:"left"}}>{w.hook||imageryOf(w)}</div>}
               {meaningsOf(w).length>0&&<div style={{fontSize:24,color:C.sub}}>ほかの意味：{meaningsOf(w).slice(0,3).join(" ／ ")}</div>}
             </>}
        </div>
      </Fit>
    </Frame>
  );
}

/* ============================================================
   ③ 語根まとめ
   ============================================================ */
function RootsBoard({run,onBack}){
  const A=useApp();const {C}=A;
  const index=useMemo(()=>buildRootIndex(run.list).filter(x=>x.type==="root"||x.words.length>=2),[run.list]);
  const p0=run.pos||{};
  const [sel,setSel]=useState(p0.sel||null);
  const [hide,setHide]=useState(!!p0.hide);
  const [open,setOpen]=useState({});
  const [q,setQ]=useState("");
  useEffect(()=>{A.savePos(run,{sel,hide});},[sel,hide]);
  useEffect(()=>{setOpen({});},[sel,hide]);
  const shownIdx=index.filter(x=>!q||x.morph.includes(q.toLowerCase())||x.gloss.includes(q));
  const cur=sel?index.find(x=>x.morph===sel):null;
  const at=cur?index.indexOf(cur):-1;
  const move=d=>{const n=at+d;if(n>=0&&n<index.length)setSel(index[n].morph);};
  const zr=clamp(A.z,0.8,1.4);
  const heads=cur?cur.words:[];
  const entAll=cur?rootEntry(cur.morph):null;
  const outsideAll=entAll?entAll.words.filter(w=>!heads.some(h=>h.id===w.id)):[];
  /* 範囲の中の単語が少ないときは、ほかの範囲の単語も足してクイズにする */
  const quizList=heads.length>=4?heads:[...heads,...outsideAll].slice(0,10);
  const quiz=()=>{if(quizList.length>=2)A.pushRun({mode:"quiz",list:shuffle(quizList),sec:A.cfg.sec,dir:A.cfg.dir});};
  useKeys(cur
    ?{Escape:()=>setSel(null),ArrowRight:()=>move(1),PageDown:()=>move(1),ArrowLeft:()=>move(-1),PageUp:()=>move(-1),
      h:()=>setHide(x=>!x),q:quiz}
    :{Escape:onBack});
  const ids=run.list.map(w=>w.id);
  const rangeLabel=!run.list.length?"":run.list[0].lesson?partName(run.list[0].part):"No."+Math.min(...ids)+" 〜 "+Math.max(...ids);

  if(!cur)return (
    <Frame title="語根まとめ" pos={index.length+" 個の語根"} onBack={onBack} detour={run.detour}>
      <div className="scrolly" style={{flex:1}}>
        <div style={{zoom:zr,padding:"26px 48px 40px",maxWidth:1500,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:20,flexWrap:"wrap",marginBottom:22}}>
            <div style={{fontSize:22,color:C.sub}}>{rangeLabel}（{run.list.length}語）に出てくる語根。押すと、その語根の単語をまとめて見せます</div>
            <div style={{flex:1}}/>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="語根や意味でしぼる（例: port, 運ぶ）" aria-label="語根をしぼりこむ"
              style={{width:420,minHeight:56,fontSize:20,padding:"0 18px",borderRadius:12,border:"2px solid "+C.line,background:C.bg,color:C.text}}/>
          </div>
          {!shownIdx.length&&<div style={{fontSize:22,color:C.sub}}>{index.length?"見つかりませんでした。":"この範囲には、2語以上で使われる語根がありません。最初の画面で範囲を広げてみてください。"}</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:14}}>
            {shownIdx.map(x=>{
              const g=pictoFor(x.morph,x.gloss,x.type);
              return (
                <button key={x.morph} onClick={()=>setSel(x.morph)} className="press"
                  style={{minHeight:100,textAlign:"left",padding:"14px 18px",borderRadius:14,border:"1px solid "+C.line,
                    background:"transparent",color:C.text,cursor:"pointer",display:"flex",alignItems:"center",gap:14}}>
                  {g&&<span style={{flexShrink:0,color:C.text}}><P size={52}>{g.g}</P></span>}
                  <span style={{minWidth:0}}>
                    <span className="en" style={{display:"block",fontSize:32,fontWeight:700,color:typeColor(x.type,C)}}>{x.morph}</span>
                    <span style={{display:"block",fontSize:18,color:C.sub,marginTop:2}}>{x.gloss}</span>
                    <span className="num" style={{display:"block",fontSize:15,color:C.sub,marginTop:2}}>単語 {x.words.length}{x.related.length?"・関連語 "+x.related.length:""}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </Frame>
  );

  const note=rootNote(cur.morph);
  const g=pictoFor(cur.morph,cur.gloss,cur.type);
  const outside=outsideAll.slice(0,8);
  /* 1行（英語を押すと発音、意味を押すと説明へ。「意味をかくす」のときは押すと意味が出る） */
  const row=(w,k,size)=>{
    const id=w.id||("r:"+w.word);
    const vis=!hide||open[id];
    const target=w.id?w:findWord(w.word);
    return (
      <div key={id} style={{display:"flex",alignItems:"baseline",gap:20,minHeight:64,padding:"8px 2px",borderBottom:"1px solid "+C.line}}>
        <button onClick={()=>speak(w.word)} className="press" aria-label={w.word+" の発音を聞く"}
          style={{border:"none",background:"transparent",color:C.text,cursor:"pointer",padding:0,textAlign:"left",minWidth:"42%"}}>
          <span className="en" style={{fontSize:size,fontWeight:700}}>{w.id?<ColoredWord C={C} word={w.word} parts={parseRoots(w)}/>:w.word}</span>
        </button>
        {vis&&!target&&<span style={{fontSize:size*0.78}}>{w.meaning}</span>}
        {vis&&target
          ?<button onClick={()=>A.jumpWord(target)} className="press" aria-label={w.word+" の説明を開く"}
             style={{border:"none",background:"transparent",color:C.text,cursor:"pointer",padding:0,textAlign:"left",
               fontSize:size*0.78,textDecoration:"underline",textDecorationColor:C.line,textUnderlineOffset:6}}>{w.meaning} ›</button>
          :!vis&&<button onClick={()=>setOpen(o=>({...o,[id]:true}))} className="press" aria-label={w.word+" の意味を出す"}
             style={{border:"2px dashed "+C.line,background:"transparent",color:C.sub,cursor:"pointer",borderRadius:10,
               padding:"4px 22px",fontSize:size*0.62,minHeight:48}}>？ 押すと意味</button>}
      </div>
    );
  };
  return (
    <Frame title="語根まとめ" pos={(at+1)+" / "+index.length+" 語根"} progress={(at+1)/index.length}
      onBack={()=>setSel(null)} backLabel="語根の一覧" onPrev={at>0?()=>move(-1):null} onNext={at<index.length-1?()=>move(1):null} nextLabel="次の語根 ▶"
      center={<>
        <SmallBtn onClick={()=>setHide(x=>!x)} active={hide} label="意味をかくす・出す（キー: H）">{hide?"意味を出す（H）":"意味をかくす（H）"}</SmallBtn>
        {quizList.length>=2&&<SmallBtn onClick={quiz} label="この語根の単語でクイズ（キー: Q）">この単語でクイズ（Q）</SmallBtn>}
      </>}>
      <div className="scrolly" style={{flex:1}}>
        <div style={{zoom:zr,padding:"26px 48px 40px",display:"grid",gridTemplateColumns:"minmax(0,5fr) minmax(0,6fr)",gap:48,maxWidth:1600,margin:"0 auto"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:28}}>
              {g&&<div style={{width:150,height:150,border:"1px solid "+C.line,borderRadius:18,display:"flex",alignItems:"center",
                justifyContent:"center",color:C.text,flexShrink:0}}><P size={110}>{g.g}</P></div>}
              <div>
                <div className="en" style={{fontSize:88,fontWeight:700,color:typeColor(cur.type,C),lineHeight:1}}>{cur.morph}</div>
                <div style={{fontSize:36,fontWeight:700,marginTop:10}}>{cur.gloss}</div>
              </div>
            </div>
            {note&&<div style={{marginTop:28}}>
              <div style={{fontSize:30,fontWeight:700,lineHeight:1.5}}>{note.title}</div>
              <NoteBody text={note.body} size={23}/>
            </div>}
          </div>
          <div>
            <Heading>この範囲の単語（{heads.length}語）</Heading>
            {heads.map((w,k)=>row(w,k,38))}
            {cur.related.length>0&&<div style={{marginTop:26}}>
              <Heading>関連語</Heading>
              {cur.related.slice(0,6).map((r,k)=>row({word:r.word,meaning:r.meaning},k,28))}
            </div>}
            {outside.length>0&&<div style={{marginTop:26}}>
              <Heading>ほかの範囲にもある単語</Heading>
              {outside.map((w,k)=>row(w,k,28))}
            </div>}
          </div>
        </div>
      </div>
    </Frame>
  );
}

/* 四択の選択肢。まちがいの選択肢は、なるべく同じ品詞・同じ範囲の単語から選ぶ */
function liveChoices(w,dir,pool){
  const key=x=>String(dir==="en"?x.meaning:x.word||"").trim();
  const ans=key(w);
  const pos=String(w.partOfSpeech||"").slice(0,2);
  const seen=new Set([ans]),wrong=[];
  const take=list=>{for(const x of list){if(wrong.length>=3)return;const k=key(x);if(!k||seen.has(k))continue;seen.add(k);wrong.push(k);}};
  const others=pool.filter(x=>x.id!==w.id);
  take(shuffle(others.filter(x=>String(x.partOfSpeech||"").slice(0,2)===pos)));
  take(shuffle(others));
  if(wrong.length<3)take(shuffle(RAW_WORDS.filter(x=>x.id!==w.id&&String(x.partOfSpeech||"").slice(0,2)===pos)));
  if(wrong.length<3)take(shuffle(RAW_WORDS.filter(x=>x.id!==w.id)));
  const choices=shuffle([ans,...wrong]);
  return {choices,correct:choices.indexOf(ans)};
}
function buildLive(list,dir){
  const leap=RAW_WORDS.filter(x=>!x.lesson&&x.id<=LEAP_MAX);
  return list.map(w=>{
    const near=list.length>=8?list:[...list,...leap.filter(x=>Math.abs(x.id-w.id)<=60)];
    return {w,prompt:dir==="en"?w.word:w.meaning,...liveChoices(w,dir,near)};
  });
}
function QRCode({text,size=360}){
  const svg=useMemo(()=>{
    try{
      const q=qrcode(0,"M");q.addData(text);q.make();
      return q.createSvgTag({cellSize:4,margin:2,scalable:true}).replace(/(width|height)="[^"]*"/g,'$1="100%"');
    }catch(e){return "";}
  },[text]);
  return <div aria-label={"参加用の QR コード："+text} role="img"
    style={{width:size,height:size,background:"#fff",padding:10,borderRadius:16,border:"1px solid #ddd",flexShrink:0}}
    dangerouslySetInnerHTML={{__html:svg}}/>;
}
function ChoiceTile({k,text,count,state,size=40}){
  /* state: "ask"（問題中）／"ok"（正解）／"ng"（不正解） */
  const {C}=useApp();
  const c=LIVE_COLORS[k];
  return (
    <div style={{background:c.bg,color:"#fff",borderRadius:16,minHeight:110,padding:"16px 24px",display:"flex",alignItems:"center",gap:18,
      opacity:state==="ng"?0.32:1,outline:state==="ok"?"8px solid "+C.text:"none",outlineOffset:5,textAlign:"left",position:"relative"}}>
      <span aria-hidden="true" style={{fontSize:size*0.9,lineHeight:1,flexShrink:0}}>{c.shape}</span>
      <span style={{fontSize:size,fontWeight:700,lineHeight:1.25,flex:1,minWidth:0,wordBreak:"break-word"}}>{text}</span>
      {count!=null&&<span className="num" style={{fontSize:size*0.9,fontWeight:700,flexShrink:0}}>{count}人</span>}
      {state==="ok"&&<span style={{position:"absolute",top:-18,right:18,fontSize:size*0.6,fontWeight:700,background:"#fff",color:c.bg,
        border:"3px solid "+c.bg,borderRadius:999,padding:"0 14px"}}>✓ 正解</span>}
    </div>
  );
}
function WordPeek({w,onClose}){
  const {C}=useApp();
  return (
    <Sheet onClose={onClose} width={1100} label={w.word+" の説明"}>
      <div style={{display:"flex",alignItems:"center",gap:20,paddingRight:150,flexWrap:"wrap"}}>
        <div className="en" style={{fontSize:72,fontWeight:700}}><ColoredWord C={C} word={w.word} parts={parseRoots(w)}/></div>
        <SpeakBtn text={w.word}/>
      </div>
      <div style={{fontSize:40,fontWeight:700,margin:"10px 0 22px"}}>{w.meaning}</div>
      <BigRoots w={w} size={0.75}/>
      {(w.hook||imageryOf(w))&&<div style={{fontSize:26,lineHeight:1.6,marginTop:22,borderLeft:"5px solid "+C.root,paddingLeft:20}}>{w.hook||imageryOf(w)}</div>}
      {w.example&&<div style={{marginTop:24}}><BigExample w={w} en={w.example} ja={w.exampleJa} size={30}/></div>}
    </Sheet>
  );
}
function LiveScreen({run,onBack}){
  const A=useApp();const {C,cfg}=A;
  const dur=(run.sec||20)*1000,dir=run.dir==="ja"?"ja":"en";
  const [qs,setQs]=useState(()=>buildLive(run.list,dir));
  const [code,setCode]=useState(newRoomCode);
  const [phase,setPhase]=useState("lobby");
  const [qi,setQi]=useState(0);
  const [left,setLeft]=useState(dur);
  const [conn,setConn]=useState("connecting");
  const [,bump]=useState(0);const rerender=()=>bump(x=>x+1);
  const players=useRef(new Map());   // pid → {name, key, score, last:{ok,g}}（key は本人だけが知っている合言葉。配らない）
  const answers=useRef(new Map());   // pid → {choice, t}（いまの問題）
  const kicked=useRef(new Set());
  const stats=useRef([]);            // 問題ごとの答えの分布
  const startAt=useRef(0);
  const S=useRef({phase:"lobby",qi:0,counts:null,qs,game:1});   // game：「もう一度」で増やす（問題の番号を回ごとに別にする）
  S.current.qs=qs;
  const out=useRef(null),resendT=useRef(null),tickT=useRef(-1);
  const joinUrl=new URL("class/join/?c="+code,document.baseURI).href;

  const ranked=()=>[...players.current.entries()].map(([pid,p])=>({pid,...p})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  const resMap=()=>{
    const res={};let rank=0,prev=null;
    ranked().forEach((p,k)=>{if(p.score!==prev){rank=k+1;prev=p.score;}const l=p.last||{ok:-1,g:0};res[p.pid]=[l.ok,l.g,p.score,rank];});
    return res;
  };
  const top5=()=>ranked().slice(0,5).map(p=>({name:p.name,score:p.score}));
  const payload=()=>{
    const st=S.current,q=st.qs[st.qi];
    const b={phase:st.phase,code,n:st.qi+1,total:st.qs.length,dir,players:players.current.size};
    if(q&&(st.phase==="question"||st.phase==="reveal"||st.phase==="rank"))
      Object.assign(b,{qid:st.game+":"+st.qi,prompt:q.prompt,pos:q.w.partOfSpeech||"",choices:q.choices});
    if(st.phase==="question")Object.assign(b,{endsIn:Math.max(0,dur-(Date.now()-startAt.current)),dur});
    if(st.phase==="reveal"||st.phase==="rank"||st.phase==="end"){b.res=resMap();if(q&&st.phase!=="end")b.correct=q.correct;}
    if(st.phase==="reveal")b.counts=st.counts;
    if(st.phase==="rank"||st.phase==="end")b.top=top5();
    return b;
  };
  const send=()=>{const ch=out.current;if(ch)ch.send({type:"broadcast",event:"state",payload:payload()}).catch(()=>{});};
  const resendSoon=()=>{clearTimeout(resendT.current);resendT.current=setTimeout(send,700);};   // 参加が重なったときはまとめて1回だけ送る

  useEffect(()=>{
    const sbc=liveClient();
    if(!sbc){setConn("error");return;}
    let alive=true,ok=0;
    const onSub=s=>{
      if(!alive)return;
      if(s==="SUBSCRIBED"){ok++;if(ok>=2){setConn("ok");send();}}
      else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")setConn("error");
    };
    const inCh=sbc.channel("roots-live-"+code+"-in",{config:{broadcast:{self:false}}})
      .on("broadcast",{event:"join"},({payload:p})=>{
        if(!p||typeof p.pid!=="string"||typeof p.key!=="string"||kicked.current.has(p.pid))return;
        let name=String(p.name||"").replace(/\s+/g," ").trim().slice(0,10)||"なまえなし";
        const pl=players.current.get(p.pid);
        if(pl){if(pl.key!==p.key)return;}          // 他人の pid を名のる参加は受けつけない
        else if(players.current.size>=LIVE_MAX)return;
        /* 同じ名前がいたら (2)(3)… をつけて見分けられるようにする */
        const taken=new Set([...players.current.entries()].filter(([id])=>id!==p.pid).map(([,x])=>x.name));
        if(taken.has(name)){let k=2;while(taken.has(name+"("+k+")"))k++;name=name+"("+k+")";}
        if(pl)pl.name=name;else players.current.set(p.pid,{name,key:p.key,score:0,last:null});
        rerender();resendSoon();
      })
      .on("broadcast",{event:"answer"},({payload:p})=>{
        const st=S.current;
        const pl=p&&players.current.get(p.pid);
        if(!pl||pl.key!==p.key||st.phase!=="question"||p.qid!==st.game+":"+st.qi||answers.current.has(p.pid))return;
        const c=Number(p.choice);
        if(!(c>=0&&c<=3))return;
        answers.current.set(p.pid,{choice:c,t:Date.now()-startAt.current});
        rerender();
      });
    /* 同じ参加コードの部屋がほかの教室で動いていないか確かめる。
       動いている部屋は "hostcheck" に "taken" と答えるので、答えが来たら別のコードに変える */
    const outCh=sbc.channel("roots-live-"+code,{config:{broadcast:{self:false}}})
      .on("broadcast",{event:"hostcheck"},()=>{if(alive&&checked.current)outCh.send({type:"broadcast",event:"taken",payload:{code}}).catch(()=>{});})
      .on("broadcast",{event:"taken"},()=>{if(alive&&!checked.current){alive=false;setConn("connecting");setCode(newRoomCode());}});
    const checked={current:false};
    inCh.subscribe(onSub);
    outCh.subscribe(s=>{
      if(s==="SUBSCRIBED"&&alive){
        outCh.send({type:"broadcast",event:"hostcheck",payload:{}}).catch(()=>{});
        setTimeout(()=>{if(alive){checked.current=true;onSub("SUBSCRIBED");}},1500);
      }else onSub(s);
    });
    out.current=outCh;
    return ()=>{
      const wasLive=checked.current;
      alive=false;clearTimeout(resendT.current);
      (wasLive?outCh.send({type:"broadcast",event:"state",payload:{phase:"closed",code}}):Promise.resolve()).catch(()=>{}).finally(()=>{
        sbc.removeChannel(inCh);sbc.removeChannel(outCh);
      });
    };
  },[code]);
  /* クイズの途中で、うっかりページを閉じたり再読み込みしたりしないように確かめる */
  useEffect(()=>{
    if(phase==="lobby"||phase==="end")return;
    const h=e=>{e.preventDefault();e.returnValue="";};
    window.addEventListener("beforeunload",h);
    return ()=>window.removeEventListener("beforeunload",h);
  },[phase]);

  const kick=pid=>{
    players.current.delete(pid);kicked.current.add(pid);rerender();
    if(out.current)out.current.send({type:"broadcast",event:"kick",payload:{pid}}).catch(()=>{});
  };
  const go=(ph,extra={})=>{S.current={...S.current,phase:ph,...extra};if(extra.qi!=null)setQi(extra.qi);setPhase(ph);send();};
  const startQ=i=>{answers.current=new Map();startAt.current=Date.now();tickT.current=-1;setLeft(dur);go("question",{qi:i,counts:null});};
  const reveal=()=>{
    const st=S.current,q=st.qs[st.qi];
    if(st.phase!=="question")return;
    const counts=[0,0,0,0];let okN=0;
    players.current.forEach((pl,pid)=>{
      const a=answers.current.get(pid);
      if(!a){pl.last={ok:-1,g:0};return;}
      counts[a.choice]++;
      const okk=a.choice===q.correct;
      const g=okk?Math.round(1000*(1-0.5*Math.min(1,a.t/dur))):0;   // 正解は 500〜1000 点。早いほど高い
      if(okk)okN++;
      pl.score+=g;pl.last={ok:okk?1:0,g};
    });
    stats.current[st.qi]={w:q.w,ok:okN,answered:answers.current.size,n:players.current.size};
    if(cfg.sound)tone([[660,0,.18],[880,.16,.32]],.12);
    go("reveal",{counts});
  };
  useEffect(()=>{
    if(phase!=="question")return;
    const iv=setInterval(()=>{
      const l=Math.max(0,dur-(Date.now()-startAt.current));
      setLeft(l);
      const sec=Math.ceil(l/1000);
      if(cfg.sound&&sec>0&&sec<=3&&tickT.current!==sec){tickT.current=sec;tone([[1000,0,.07]],.05);}
      const n=players.current.size;
      if(l<=0||(n>0&&answers.current.size>=n)){clearInterval(iv);reveal();}
    },200);
    return ()=>clearInterval(iv);
  },[phase,qi]);
  const next=()=>{
    if(phase==="lobby"){if(qs.length)startQ(0);}
    else if(phase==="question")reveal();
    else if(phase==="reveal")go("rank");
    else if(phase==="rank"){if(qi<qs.length-1)startQ(qi+1);else{if(cfg.sound)SFX.fanfare(true);go("end");}}
  };
  const again=()=>{
    players.current.forEach(p=>{p.score=0;p.last=null;});
    stats.current=[];
    const nq=buildLive(cfg.order==="random"?shuffle(run.list):run.list,dir);
    setQs(nq);S.current.qs=nq;setQi(0);go("lobby",{qi:0,qs:nq,game:S.current.game+1});
  };
  const quit=()=>{if(phase==="lobby"||phase==="end"||window.confirm("みんなで四択を終わりにしますか？（生徒の画面も終了します）"))onBack();};
  useKeys({" ":next,ArrowRight:next,PageDown:next,Enter:next,Escape:quit});

  const n=players.current.size;
  const q=qs[qi];
  const nextLabel=phase==="lobby"?"はじめる ▶":phase==="question"?"答えを出す ▶":phase==="reveal"?"ランキング ▶":phase==="rank"?(qi<qs.length-1?"次の問題 ▶":"結果発表 ▶"):"";
  const pos=phase==="lobby"||phase==="end"?"参加 "+n+"人":"第"+(qi+1)+"問 / "+qs.length+"　参加 "+n+"人";
  const connMsg=conn==="ok"?null:conn==="error"
    ?"通信につながりません。インターネットの接続を確かめて、最初の画面からやり直してください。"
    :"通信の準備をしています…";

  let body;
  if(phase==="lobby")body=(
    <div style={{display:"flex",alignItems:"center",gap:56,padding:"30px 60px",justifyContent:"center"}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
        <QRCode text={joinUrl} size={380}/>
        <div className="en" style={{fontSize:18,color:C.sub,maxWidth:420,textAlign:"center",wordBreak:"break-all"}}>{joinUrl}</div>
      </div>
      <div style={{maxWidth:760,minWidth:420}}>
        <div style={{fontSize:26,fontWeight:700,color:C.sub,whiteSpace:"nowrap"}}>スマホのカメラで QR コードを読み取ろう</div>
        <div style={{display:"flex",alignItems:"baseline",gap:18,marginTop:10}}>
          <span style={{fontSize:28,color:C.sub,whiteSpace:"nowrap"}}>参加コード</span>
          <span className="num" style={{fontSize:120,fontWeight:700,letterSpacing:"0.08em",lineHeight:1}}>{code}</span>
        </div>
        <div style={{fontSize:22,color:C.sub,marginTop:10,lineHeight:1.6}}>ニックネームを入れて参加してね（本名でなくてOK。上位5人は画面に名前が出ます）</div>
        <div style={{fontSize:30,fontWeight:700,marginTop:26}}>参加 {n}人</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:12,maxHeight:300,overflow:"hidden"}}>
          {[...players.current.entries()].map(([pid,p])=>(
            <span key={pid} className="fadeIn" style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:22,fontWeight:700,
              border:"2px solid "+C.line,borderRadius:999,padding:"4px 6px 4px 18px"}}>
              {p.name}
              <button onClick={e=>{stop(e);kick(pid);}} className="press" aria-label={p.name+" を外す"} title="この名前を外す"
                style={{width:48,height:48,borderRadius:"50%",border:"none",background:"transparent",color:C.sub,cursor:"pointer",fontSize:22}}>×</button>
            </span>
          ))}
          {!n&&<span style={{fontSize:22,color:C.sub}}>まだだれも参加していません</span>}
        </div>
        <div style={{fontSize:17,color:C.sub,marginTop:14}}>ふさわしくない名前は × で外せます。授業中はこのページを再読み込みしないでね（参加者と点数が消えます）。{qs.length}問・1問 {dur/1000}秒・{dir==="en"?"英語 → 日本語":"日本語 → 英語"}</div>
      </div>
    </div>
  );
  else if(phase==="question"||phase==="reveal")body=(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:26,padding:"26px 60px 30px",width:"100%"}}>
      {dir==="en"
        ?<div style={{display:"flex",alignItems:"center",gap:24}}><BigWord w={q.w} colored={phase==="reveal"} size={124}/><SpeakBtn text={q.w.word}/></div>
        :<div style={{textAlign:"center"}}><div style={{fontSize:84,fontWeight:700,lineHeight:1.25}}>{q.w.meaning}</div>
           {q.w.partOfSpeech&&<div style={{fontSize:24,color:C.sub}}>{q.w.partOfSpeech}</div>}</div>}
      {phase==="question"
        ?<div style={{display:"flex",alignItems:"center",gap:30}}>
           <div className="num" style={{fontSize:96,fontWeight:700,lineHeight:1,color:left<=3000?C.root:C.text,minWidth:130,textAlign:"center"}}>{Math.ceil(left/1000)}</div>
           <div style={{fontSize:34,fontWeight:700,color:C.sub}}>回答 <span className="num" style={{color:C.text}}>{answers.current.size}</span> / {n}人</div>
         </div>
        :<div style={{fontSize:34,fontWeight:700}}>正解 <span className="num">{stats.current[qi]?stats.current[qi].ok:0}</span> / {n}人
           {stats.current[qi]&&n>0&&<span style={{color:C.sub,fontWeight:400}}>（{Math.round(stats.current[qi].ok/n*100)}%）</span>}</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,width:"100%",maxWidth:1500}}>
        {q.choices.map((t,k)=><ChoiceTile key={k} k={k} text={t}
          count={phase==="reveal"&&S.current.counts?S.current.counts[k]:null}
          state={phase==="question"?"ask":k===q.correct?"ok":"ng"}/>)}
      </div>
      {phase==="reveal"&&<div className="fadeIn" style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
        {dir==="ja"&&<div style={{display:"flex",alignItems:"center",gap:20}}><BigWord w={q.w} colored size={84}/><SpeakBtn text={q.w.word}/></div>}
        <BigRoots w={q.w} size={0.7}/>
        {(q.w.hook||imageryOf(q.w))&&<div style={{fontSize:26,lineHeight:1.6,maxWidth:1300,borderLeft:"5px solid "+C.root,padding:"4px 0 4px 20px",textAlign:"left"}}>{q.w.hook||imageryOf(q.w)}</div>}
      </div>}
    </div>
  );
  else if(phase==="rank"||phase==="end"){
    const tops=ranked().slice(0,5);
    const hard=stats.current.filter(Boolean).filter(x=>x.n>0).sort((a,b)=>a.ok/a.n-b.ok/b.n).slice(0,5);
    body=(
      <div style={{display:"flex",gap:60,padding:"30px 60px",justifyContent:"center",alignItems:"flex-start",width:"100%"}}>
        <div style={{flex:"1 1 620px",maxWidth:820}}>
          <div style={{fontSize:phase==="end"?60:48,fontWeight:700,marginBottom:20}}>{phase==="end"?"結果発表！":"ランキング"}</div>
          {!tops.length&&<div style={{fontSize:26,color:C.sub}}>参加者がいません</div>}
          {tops.map((p,k)=>(
            <div key={p.pid} className="riseIn" style={{animationDelay:(phase==="end"?(4-k)*0.35:k*0.08)+"s",display:"flex",alignItems:"center",gap:24,
              padding:"14px 24px",marginBottom:12,borderRadius:16,border:"2px solid "+(k===0?C.root:C.line),background:k===0?C.fill:"transparent"}}>
              <span className="num" style={{fontSize:44,fontWeight:700,minWidth:110,whiteSpace:"nowrap",color:k===0?C.root:C.text}}>{k+1}位</span>
              <span style={{fontSize:40,fontWeight:700,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
              <span className="num" style={{fontSize:36,fontWeight:700}}>{p.score}点</span>
            </div>
          ))}
        </div>
        {phase==="end"&&hard.length>0&&<div style={{flex:"1 1 480px",maxWidth:620}}>
          <Heading>まちがいが多かった単語（押すと説明）</Heading>
          {hard.map(x=><WordRow key={x.w.id} en={x.w.word} w={x.w} meaning={x.w.meaning+"　正解 "+Math.round(x.ok/x.n*100)+"%"} size={30}/>)}
        </div>}
      </div>
    );
  }
  return (
    <Frame title={"みんなで四択　参加コード "+code} pos={pos} progress={phase==="lobby"?null:phase==="end"?1:(qi+(phase==="question"?0:1))/qs.length}
      onBack={quit} backLabel="やめる" onNext={phase==="end"?undefined:next} nextLabel={nextLabel}
      center={phase==="end"
        ?<><SmallBtn onClick={again}>同じ単語でもう一度（参加者はそのまま）</SmallBtn><SmallBtn onClick={onBack}>終わる</SmallBtn></>
        :connMsg&&<span style={{fontSize:18,fontWeight:700,color:conn==="error"?C.root:C.sub}}>{connMsg}</span>}>
      <Fit scale={A.z}>{body}</Fit>
    </Frame>
  );
}

/* ============================================================
   テスト用紙の印刷（問題と答えの2枚組。A4）
   ============================================================ */
function printSheet(list,dir,title){
  const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const roots=w=>parseRoots(w).map(r=>r.morph+(r.gloss?"（"+r.gloss+"）":"")).join(" ＋ ");
  const en=dir!=="ja";
  const qRows=list.map((w,k)=>"<tr><td class=n>"+(k+1)+"</td><td class='"+(en?"en":"ja")+"'>"+esc(en?w.word:w.meaning)+
    (en?"":"<span class=pos>"+esc(w.partOfSpeech||"")+"</span>")+"</td><td></td></tr>").join("");
  const aRows=list.map((w,k)=>"<tr><td class=n>"+(k+1)+"</td><td class=en>"+esc(w.word)+"</td><td class=ja>"+esc(w.meaning)+
    "</td><td class=r>"+esc(roots(w))+"</td><td class=no>"+esc(noLabel(w))+"</td></tr>").join("");
  const html="<!DOCTYPE html><html lang=ja><head><meta charset=UTF-8><title>"+esc(title)+"</title><style>"+
    "@page{size:A4;margin:14mm 14mm 16mm}"+
    "html,body{background:#fff;}body{margin:0;color:#000;font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;}"+
    ".bar{padding:12px 16px;background:#f2f2f2;display:flex;gap:12px;align-items:center;font-size:15px}"+

/* ============================================================
   最初の画面（モードと範囲をえらぶ）
   ============================================================ */
const sheetTitle=(cfg,list,dir)=>"Roots 単語テスト　"+(cfg.kind==="lesson"?partName(cfg.lesson):"No."+list[0].id+"〜"+list[list.length-1].id)+
  "（"+(dir==="en"?"英→日":"日→英")+"）";
function SetupScreen({onStart,onResume}){
  const A=useApp();const {C,cfg,set}=A;
  const list=wordsFor({...cfg,order:"seq"});
  const last=useMemo(()=>loadLast(),[]);
  const lo=Math.min(cfg.from,cfg.to),hi=Math.max(cfg.from,cfg.to),size=hi-lo+1;
  useKeys({Enter:()=>onStart()});
  const zs=clamp(A.z,0.8,1.4);
  const H=(n,t)=><div style={{fontSize:21,fontWeight:700,color:C.text,marginBottom:12}}><span className="num" style={{color:C.sub,marginRight:10}}>{n}</span>{t}</div>;
  const opt=(t,children)=><div><div style={{fontSize:18,fontWeight:700,color:C.sub,marginBottom:10}}>{t}</div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{children}</div></div>;
  const shift=d=>{
    const nlo=clamp(lo+d*size,1,LEAP_MAX);
    set({from:nlo,to:Math.min(LEAP_MAX,nlo+size-1)});
  };
  return (
    <div className="scrolly" style={{height:"100vh",background:C.bg,color:C.text}}>
      <div style={{zoom:zs,maxWidth:1180,margin:"0 auto",padding:"30px 48px 60px"}}>
        <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:44,fontWeight:700}}>Roots <span style={{color:C.sub,fontWeight:400}}>授業用</span></div>
            <div style={{fontSize:19,color:C.sub,marginTop:4}}>語源で覚える英単語 ― 教室のプロジェクター・電子黒板に映す画面</div>
          </div>
          <div style={{flex:1}}/>
          <Tools/>
        </div>

        {last&&<button onClick={onResume} className="press"
          style={{marginTop:24,width:"100%",textAlign:"left",padding:"16px 22px",borderRadius:14,cursor:"pointer",
            border:"2px solid "+C.text,background:C.fill,color:C.text,display:"flex",alignItems:"center",gap:16,minHeight:72}}>
          <span style={{fontSize:22,fontWeight:700}}>▶ 続きから</span>
          <span style={{fontSize:19,color:C.sub}}>{MODE_LABEL[last.mode]}{"　"}
            {last.mode==="roots"?(last.pos&&last.pos.sel?"語根 "+last.pos.sel:noLabel(last.list[0])+" から")
              :((last.pos&&last.pos.i||0)+1)+" / "+last.list.length+" 語目（"+last.list[Math.min(last.pos&&last.pos.i||0,last.list.length-1)].word+"）"}</span>
        </button>}

        <div style={{marginTop:30}}>
          {H(1,"何をする？")}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:16}}>
            {MODES.map(m=>{
              const on=cfg.mode===m.key;
              return (
                <button key={m.key} onClick={()=>set({mode:m.key})} className="press" aria-pressed={on}
                  style={{textAlign:"left",padding:"18px 22px",minHeight:120,borderRadius:16,cursor:"pointer",
                    border:"2px solid "+(on?C.text:C.line),background:on?C.fill:"transparent",color:C.text}}>
                  <div style={{fontSize:26,fontWeight:700}}>{on?"● ":""}{m.label}</div>
                  <div style={{fontSize:17,color:C.sub,marginTop:8,lineHeight:1.6}}>{m.note}</div>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{marginTop:32}}>
          {H(2,"どの単語？")}
          <div style={{display:"flex",gap:12,marginBottom:16}}>
            <Pill active={cfg.kind==="leap"} onClick={()=>set({kind:"leap"})}>LEAP の番号</Pill>
            {LESSONS.length>0&&<Pill active={cfg.kind==="lesson"} onClick={()=>set({kind:"lesson",lesson:cfg.lesson||LESSONS[0]})}>教科書</Pill>}
          </div>
          {cfg.kind==="leap"
            ?<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
               <NumBox label="No." value={cfg.from} min={1} max={LEAP_MAX} onChange={v=>set({from:v})}/>
               <span style={{fontSize:24,color:C.sub}}>〜</span>
               <NumBox label="" value={cfg.to} min={1} max={LEAP_MAX} onChange={v=>set({to:v})}/>
               <div style={{display:"flex",gap:8}}>
                 {[10,20,50].map(n=><Pill key={n} active={size===n} onClick={()=>set({from:lo,to:Math.min(LEAP_MAX,lo+n-1)})}>{n}語</Pill>)}
               </div>
               <div style={{display:"flex",gap:8}}>
                 <Pill onClick={()=>shift(-1)} disabled={lo<=1}>◀ 前の{size}語</Pill>
                 <Pill onClick={()=>shift(1)} disabled={hi>=LEAP_MAX}>次の{size}語 ▶</Pill>
               </div>
             </div>
            :<div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
               {LESSONS.map(l=><Pill key={l} active={cfg.lesson===l} onClick={()=>set({lesson:l})}>{partName(l)}</Pill>)}
             </div>}
          <div style={{marginTop:16,padding:"14px 18px",borderRadius:12,background:C.fill}}>
            {list.length
              ?<><span style={{fontSize:18,fontWeight:700}}>{list.length}語</span>
                 <span className="en" style={{fontSize:18,color:C.sub,marginLeft:12,lineHeight:1.8}}>
                   {list.slice(0,30).map(w=>w.word).join(", ")}{list.length>30?" ほか"+(list.length-30)+"語":""}</span></>
              :<span style={{fontSize:18,color:C.sub}}>この範囲に単語がありません</span>}
          </div>
        </div>

        <div style={{marginTop:32}}>
          {H(3,"出し方")}
          <div style={{display:"flex",gap:"20px 40px",flexWrap:"wrap"}}>
            {cfg.mode!=="roots"&&opt("順番",<>
              <Pill active={cfg.order==="seq"} onClick={()=>set({order:"seq"})}>番号順</Pill>
              <Pill active={cfg.order==="random"} onClick={()=>set({order:"random"})}>シャッフル</Pill></>)}
            {(cfg.mode==="quiz"||cfg.mode==="live")&&opt("向き",<>
              <Pill active={cfg.dir==="en"} onClick={()=>set({dir:"en"})}>英語 → 日本語</Pill>
              <Pill active={cfg.dir==="ja"} onClick={()=>set({dir:"ja"})}>日本語 → 英語</Pill></>)}
            {cfg.mode==="quiz"&&opt("考える時間",<>
              {[3,5,10,15].map(s=><Pill key={s} active={cfg.sec===s} onClick={()=>set({sec:s})}>{s}秒</Pill>)}
              <Pill active={!cfg.sec} onClick={()=>set({sec:0})}>なし</Pill></>)}
            {cfg.mode==="live"&&opt("答える時間",<>
              {[10,20,30].map(s=><Pill key={s} active={cfg.liveSec===s} onClick={()=>set({liveSec:s})}>{s}秒</Pill>)}</>)}
            {cfg.mode!=="roots"&&cfg.mode!=="live"&&opt("発音",<>
              <Pill active={cfg.autoSpeak} onClick={()=>set({autoSpeak:true})}>自動で流す</Pill>
              <Pill active={!cfg.autoSpeak} onClick={()=>set({autoSpeak:false})}>流さない</Pill></>)}
            {(cfg.mode==="quiz"||cfg.mode==="live")&&opt("効果音",<>
              <Pill active={cfg.sound} onClick={()=>set({sound:true})}>あり</Pill>
              <Pill active={!cfg.sound} onClick={()=>set({sound:false})}>なし</Pill></>)}
          </div>
        </div>

        <div style={{marginTop:32}}>
          {H(4,"テスト用紙を印刷（授業のあとの小テストに）")}
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <Pill disabled={!list.length} onClick={()=>printSheet(wordsFor(cfg),"en",sheetTitle(cfg,list,"en"))}>英語 → 日本語</Pill>
            <Pill disabled={!list.length} onClick={()=>printSheet(wordsFor(cfg),"ja",sheetTitle(cfg,list,"ja"))}>日本語 → 英語</Pill>
            <span style={{fontSize:17,color:C.sub}}>上の範囲・順番で、問題と答えの2枚を A4 で印刷します</span>
          </div>
        </div>

        <div style={{marginTop:36,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
          <BigBtn primary onClick={()=>onStart()} disabled={!list.length} style={{minWidth:300,minHeight:72,fontSize:26}}>はじめる（Enter）</BigBtn>
          <div style={{fontSize:17,color:C.sub,lineHeight:1.8}}>
            F で全画面 ／ B で画面を一時的に消す ／ / で単語検索 ／ ? でキー操作の一覧
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   全体のまとめ役
   ============================================================ */
function ClassApp(){
  const [cfg,setCfg]=useState(()=>({...DEFAULT_CLASS,...(lsGet(CLASS_KEY)||{})}));
  const [stack,setStack]=useState([]);   // 開いている画面の積み重ね（検索などで寄り道しても戻れる）
  const [ov,setOv]=useState(null);       // 重ねて開く画面
  const [fs,setFs]=useState(!!document.fullscreenElement);
  const vs=useViewportScale();
  const C=cfg.dark?DARK:LIGHT;
  useEffect(()=>{lsSet(CLASS_KEY,cfg);},[cfg]);
  useEffect(()=>{document.body.style.background=C.bg;document.body.style.color=C.text;},[C]);
  useEffect(()=>{
    const h=()=>setFs(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange",h);
    return ()=>document.removeEventListener("fullscreenchange",h);
  },[]);
  const set=useCallback(p=>setCfg(c=>({...c,...p})),[]);
  const run=stack[stack.length-1]||null;
  const newRun=r=>({pos:null,marks:[],detour:false,...r,key:Date.now()+"-"+Math.random()});
  const start=()=>{
    const list=wordsFor(cfg);
    if(!list.length)return;
    stopSpeak();
    setStack([newRun({mode:cfg.mode,list,sec:cfg.mode==="live"?cfg.liveSec:cfg.sec,dir:cfg.dir})]);
  };
  const resume=()=>{const l=loadLast();if(l){stopSpeak();setStack([newRun(l)]);}};
  const back=()=>{stopSpeak();setStack(s=>s.slice(0,-1));};
  const replaceTop=r=>{stopSpeak();setStack(s=>[...s.slice(0,-1),newRun({...r,detour:s.length>1})]);};
  const pushRun=r=>{stopSpeak();setOv(null);setStack(s=>[...s,newRun({...r,detour:true})]);};
  /* 位置は state ではなく run に直接書きこむ（あえて）。寄り道で画面がいったん消えても、
     戻ってきたときにこの値から元の場所を復元するため */
  const savePos=(r,pos)=>{
    r.pos=pos;
    if(!r.detour)lsSet(LAST_KEY,{mode:r.mode,ids:r.list.map(w=>w.id),words:r.list.map(w=>w.word),sec:r.sec,dir:r.dir,pos,at:Date.now()});
  };
  const toggleFS=()=>{
    try{
      if(document.fullscreenElement)document.exitFullscreen();
      else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
    }catch(e){}
  };
  const step=d=>setCfg(c=>{
    const k=SIZE_STEPS.reduce((b,v,j)=>Math.abs(v-c.scale)<Math.abs(SIZE_STEPS[b]-c.scale)?j:b,0);
    return {...c,scale:SIZE_STEPS[clamp(k+d,0,SIZE_STEPS.length-1)]};
  });
  /* みんなで四択の最中は、ほかの画面へ移ると部屋が閉じてしまうので、単語は重ねた画面でだけ見せる */
  const locked=!!run&&run.mode==="live";
  const A={C,cfg,set,z:vs*cfg.scale,fs,busy:!!ov,locked,
    openRoot:root=>setOv({t:"root",root}),openSearch:()=>setOv({t:"search"}),openHelp:()=>setOv({t:"help"}),
    jumpWord:w=>locked?setOv({t:"peek",w}):pushRun({mode:"explain",list:[w]}),
    pushRun:r=>{if(!locked)pushRun(r);},savePos,toggleFS,
    toggleDark:()=>set({dark:!cfg.dark}),bigger:()=>step(1),smaller:()=>step(-1)};
  useKeys({"/":A.openSearch,"?":A.openHelp,d:A.toggleDark,f:toggleFS,"+":A.bigger,"=":A.bigger,";":A.bigger,"-":A.smaller,
    b:()=>setOv({t:"black"}),".":()=>setOv({t:"black"})});
  const close=()=>setOv(null);
  const p=run&&{key:run.key,run,onBack:back,onRun:replaceTop};
  const screen=!run?<SetupScreen onStart={start} onResume={resume}/>
    :run.mode==="quiz"?<QuizScreen {...p}/>
    :run.mode==="roots"?<RootsBoard {...p}/>
    :run.mode==="live"?<LiveScreen {...p}/>
    :<ExplainScreen {...p}/>;
  return (
    <AppCtx.Provider value={A}>
      {screen}
      {ov&&ov.t==="root"&&<RootColumn key={ov.root.morph} root={ov.root} onClose={close}/>}
      {ov&&ov.t==="search"&&<SearchBox onClose={close}/>}
      {ov&&ov.t==="help"&&<HelpBox onClose={close}/>}
      {ov&&ov.t==="black"&&<Blackout onClose={close}/>}
      {ov&&ov.t==="peek"&&<WordPeek w={ov.w} onClose={close}/>}
    </AppCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<ClassApp/>);
document.getElementById("boot").style.display="none";
</script>

<script>
  /* 本体 index.html から「単語データと部品」の部分だけ取り出して、授業用の画面とつなげて動かす。
     変換（Babel）には時間がかかるので、一度変換した結果を保存して次から使う */
  (function(){
    var BABEL="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js";
    var STORE="roots-class-compiled";
    var boot=document.getElementById("boot"),msg=document.getElementById("bootMsg");
    function say(t){if(msg)msg.textContent=t;}
    function fail(t){boot.style.display="flex";boot.textContent=t;}
    window.onerror=function(m){fail("エラーが発生しました。ページを読み直してください。\n"+m);};
    if(!window.React||!window.ReactDOM){fail("React の読み込みに失敗しました。インターネットに接続して開き直してください。");return;}
    function run(code){var s=document.createElement("script");s.textContent=code;document.body.appendChild(s);}
    function loadBabel(){
      return new Promise(function(ok,ng){
        if(window.Babel)return ok();
        var s=document.createElement("script");s.src=BABEL;s.onload=ok;s.onerror=ng;document.head.appendChild(s);
      });
    }
    /* <script id="..."> の中身を取り出す（5MB あるので DOM にせず文字のまま切り出す） */
    function scriptBody(html,id){
      var i=html.indexOf('id="'+id+'"');
      if(i<0)return null;
      var s=html.indexOf(">",i)+1,e=html.indexOf("<\/script>",s);
      return e<0?null:html.slice(s,e);
    }
    say("単語データを読みこんでいます…");
    fetch("index.html",{cache:"no-cache"}).then(function(r){
      if(!r.ok)throw new Error("index.html "+r.status);
      return r.text();
    }).then(function(html){
      var full=scriptBody(html,"roots-app");
      var audio=scriptBody(html,"roots-audio-index");
      if(!full)throw new Error("roots-app が見つかりません");
      if(audio){
        var a=document.createElement("script");a.type="application/json";a.id="roots-audio-index";
        a.textContent=audio;document.body.appendChild(a);
      }
      var cut=full.indexOf("\nfunction App(){");
      if(cut<0)throw new Error("本体の形が変わりました（function App が見つかりません）");
      /* 前半の単語データ（RAW_WORDS・ROOT_NOTES）はふつうの JavaScript なので変換しないでそのまま動かす。
         変換するのは後半の部品（JSX）だけにして、はじめて開くときの待ち時間を短くする */
      var head=full.slice(0,cut);
      var split=head.indexOf("\nconst {useState");
      if(split<0)split=0;
      run(head.slice(0,split));
      var src=head.slice(split)+"\n"+document.getElementById("class-app").textContent;
      var h=0x811c9dc5;
      for(var i=0;i<src.length;i++){h^=src.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}
      var name="./__class/"+h.toString(16)+"-"+src.length+".js";
      var cacheP=window.caches?caches.open(STORE).catch(function(){return null;}):Promise.resolve(null);
      return cacheP.then(function(c){
        return (c?c.match(name).then(function(r){return r?r.text():null;}):Promise.resolve(null)).then(function(code){
          if(code){say("画面を準備しています…");return run(code);}
          say("画面を組み立てています…（最初の1回だけ時間がかかります）");
          return loadBabel().then(function(){
            return new Promise(function(ok){setTimeout(ok,30);});   // 表示を更新してから変換する
          }).then(function(){
            var out=Babel.transform(src,{compact:true,presets:[[Babel.availablePresets["react"],{runtime:"classic"}]]}).code;
            run(out);
            if(c)c.keys().then(function(ks){return Promise.all(ks.map(function(k){return c.delete(k);}));})
              .then(function(){return c.put(name,new Response(out,{headers:{"Content-Type":"text/javascript"}}));}).catch(function(){});
          });
        });
      });
    }).catch(function(e){
      fail("読み込みに失敗しました。インターネットに接続して開き直してください。\n"+(e&&e.message||e));
    });
  })();
</script>
