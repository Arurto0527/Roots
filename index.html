<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roots">
<meta name="description" content="語源から覚える英単語アプリ Roots">
<title>Roots — 語源で覚える英単語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#FFFFFF;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,"Hiragino Sans","Noto Sans JP",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
    overscroll-behavior-y:none;
  }
  input,button,textarea,select{font-family:inherit;}
  button{-webkit-appearance:none;appearance:none;}
  @media (prefers-color-scheme:dark){body{background:#121212;}}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
  .en{letter-spacing:-0.01em;}
  :focus-visible{outline:1.5px solid currentColor;outline-offset:2px;border-radius:4px;}
  b,strong{font-weight:700;}
  @keyframes hintOpen{from{opacity:0;max-height:0;}to{opacity:1;max-height:420px;}}
  .hintOpen{animation:hintOpen .18s ease-out both;overflow:hidden;}
  .press:active{opacity:.6;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{0%{opacity:0;transform:scale(.94);}60%{transform:scale(1.02);}100%{opacity:1;transform:scale(1);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes snackIn{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes snackInTop{from{opacity:0;transform:translate(-50%,-14px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}}
  .riseIn{animation:fadeIn .2s ease both;}
  .fadeIn{animation:fadeIn .24s ease both;}
  .popIn{animation:fadeIn .2s ease both;}
  .slideUp{animation:slideUp .26s cubic-bezier(.2,.7,.3,1) both;}
  .shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both;}
  .snackIn{animation:snackIn .26s cubic-bezier(.2,.7,.3,1) both;}
  .snackInTop{animation:snackInTop .26s cubic-bezier(.2,.7,.3,1) both;}
  @media (prefers-reduced-motion:reduce){
    .riseIn,.fadeIn,.popIn,.slideUp,.shake{animation:none !important;}
    .snackIn,.snackInTop{animation:none !important;}
    *{transition:none !important;}
  }
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--trackbg,#E0E0E0);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--thumb,#111111);margin-top:-9px;border:none;}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--trackbg,#E0E0E0);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--thumb,#111111);border:none;}
  #boot{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;color:#767A85;font-size:14px;line-height:1.8;white-space:pre-wrap;
  }
  .studyroot{height:100vh;height:calc(100dvh - env(safe-area-inset-top));max-height:100vh;max-height:calc(100dvh - env(safe-area-inset-top));}
  /* 画面が低いスマホ（iPhone SE・13 mini、Safari表示中など）では余白を詰める */
  @media (max-height:620px){ .askgap{margin-top:12px !important;} }
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .scrollx::-webkit-scrollbar{display:none;}
  .scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
</style>
</head>

  window.__ROOTS_BOOT_ERROR__ = function(msg){
    var b = document.getElementById("boot");
    if(!b){ b = document.createElement("div"); b.id = "boot"; document.body.appendChild(b); }
    b.style.display = "flex";
    b.textContent = msg;
  };
  window.onerror = function(message){
    window.__ROOTS_BOOT_ERROR__("エラーが発生しました。ページを再読み込みしてください。\n" + message);
  };
</script>

const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}};

/* ============================================================

   ・roots.localAt … この端末で最後に保存した時刻。クラウドと比べて新しい方を使う
   ・roots.owner   … この端末のデータが誰のものか（別の人がログインしたら消す）
   ・roots.outbox.v1 … まだ送れていない学習ログ
   ============================================================ */
const SUPABASE_URL="https://jidcvzmfjmlxwlazaixz.supabase.co";
const SUPABASE_KEY="sb_publishable_Vjo96oWVhIjWKFGIN6OMKA_keM8C011";
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"roots.auth"}}):null;
const SYNC_KEYS={words:KEY.words,stats:KEY.stats,badges:KEY.badges,settings:KEY.settings};
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():
  "10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);

const Cloud={
  user:null,profile:null,pushTimer:null,visibleSince:null,active:0,sessionId:null,sessionStart:null,

  /* ログイン直後：クラウドのデータがこの端末より新しければ、localStorage に書き込む */
  async pull(user){
    Cloud.user=user;
    const owner=lsGet("roots.owner");
    if(owner&&owner!==user.id){
      Object.values(KEY).forEach(lsDel);Object.values(LEGACY).forEach(lsDel);
      lsDel("roots.localAt");lsDel("roots.outbox.v1");lsDel("roots.listRecall");
    }
    lsSet("roots.owner",user.id);
    try{
      const [{data:prof},{data:row,error}]=await withTimeout(Promise.all([
        sb.from("profiles").select("student_code,role").eq("user_id",user.id).maybeSingle(),
        sb.from("progress").select("*").eq("user_id",user.id).maybeSingle(),
      ]),8000);
      Cloud.profile=prof||null;
      if(error)return;
      const localAt=lsGet("roots.localAt")||0;
      const remoteAt=row?Date.parse(row.updated_at):0;
      if(row&&remoteAt>localAt){
        Object.entries(SYNC_KEYS).forEach(([col,k])=>{if(row[col]!=null)lsSet(k,row[col]);else lsDel(k);});
        lsSet("roots.localAt",remoteAt);
      }else if(localAt>remoteAt||(!row&&lsGet(KEY.settings))){
        Cloud.push();
      }
    }catch(e){/* オフライン：この端末のデータで続ける */}
  },

  /* 保存したら少し待ってからクラウドへ送る */
  markDirty(){
    lsSet("roots.localAt",Date.now());
    clearTimeout(Cloud.pushTimer);
    Cloud.pushTimer=setTimeout(Cloud.push,2000);
  },
  async push(){
    clearTimeout(Cloud.pushTimer);Cloud.pushTimer=null;
    if(!sb||!Cloud.user)return;
    const at=lsGet("roots.localAt")||Date.now();
    const row={user_id:Cloud.user.id,updated_at:new Date(at).toISOString()};
    Object.entries(SYNC_KEYS).forEach(([col,k])=>{row[col]=lsGet(k);});
    try{await sb.from("progress").upsert(row);}catch(e){}
  },

  /* 1回答ごとの記録（取り消しできるよう、送るのは少しあと） */
  log(entry){
    const box=lsGet("roots.outbox.v1")||[];
    box.push({id:uuid(),word_id:String(entry.id),mode:entry.format,grade:entry.grade,
      correct:entry.grade>=2,first_try:!!entry.firstTry,hint_used:!!entry.hint,
      answered_at:new Date(entry.at).toISOString()});
    lsSet("roots.outbox.v1",box);
  },
  unlog(){
    const box=lsGet("roots.outbox.v1")||[];
    box.pop();lsSet("roots.outbox.v1",box);
  },

  /* 使った時間：画面が表示されている間だけ数える */
  startVisible(){
    const now=Date.now();
    if(!Cloud.sessionId||now-(Cloud.lastSeen||0)>30*60000){
      Cloud.sessionId=uuid();Cloud.sessionStart=now;Cloud.active=0;
    }
    Cloud.visibleSince=now;
  },
  stopVisible(){
    if(Cloud.visibleSince){Cloud.active+=Date.now()-Cloud.visibleSince;Cloud.visibleSince=null;}
    Cloud.lastSeen=Date.now();
  },

  async flush(){
    if(!sb||!Cloud.user||!navigator.onLine)return;
    const box=lsGet("roots.outbox.v1")||[];
    if(box.length){
      try{
        const {error}=await sb.from("study_logs").upsert(box,{onConflict:"id",ignoreDuplicates:true});
        if(!error){
          const sent=new Set(box.map(x=>x.id));
          lsSet("roots.outbox.v1",(lsGet("roots.outbox.v1")||[]).filter(x=>!sent.has(x.id)));
        }
      }catch(e){}
    }
    if(Cloud.sessionId){
      const now=Date.now();
      const act=Cloud.active+(Cloud.visibleSince?now-Cloud.visibleSince:0);
      try{
        await sb.from("study_sessions").upsert({id:Cloud.sessionId,
          started_at:new Date(Cloud.sessionStart).toISOString(),
          ended_at:new Date(Cloud.visibleSince?now:(Cloud.lastSeen||now)).toISOString(),
          active_seconds:Math.round(act/1000)});
      }catch(e){}
    }
    if(Cloud.pushTimer)Cloud.push();
  },

  async signOut(){
    Cloud.stopVisible();
    await Cloud.flush();
    try{await sb.auth.signOut();}catch(e){}
    Cloud.user=null;Cloud.profile=null;Cloud.sessionId=null;
    location.reload();
  },
};

const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

const DAY=86400000;
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const todayKey=()=>dayKey(Date.now());
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const addDays=(t,n)=>startOfDay(t)+Math.round(n)*DAY;
const daysBetween=(a,b)=>Math.round((startOfDay(b)-startOfDay(a))/DAY);

/* 習得の定義：SM-2 の間隔が21日以上まで伸びた語。「3回正解」より実態に近い */
const MASTER_INTERVAL=21;
const isMastered=w=>w.manualPass===true||w.interval>=MASTER_INTERVAL;
const isWeak=w=>w.lapses>0||w.incorrectCount>0;
const isNew=w=>w.reps===0&&!w.manualPass;
const isLearning=w=>!isNew(w)&&!isMastered(w);
const isDue=(w,now)=>!w.manualPass&&w.due!=null&&w.due<=now;
const stageOf=w=>w.manualPass?"pass":isMastered(w)?"mastered":isNew(w)?"new":"learning";
const getLevel=c=>{let l=LEVELS[0];for(const lv of LEVELS)if(c>=lv.min)l=lv;return l;};
const nextLevel=c=>LEVELS.find(lv=>lv.min>c)||null;
const getMessage=r=>pick(r>=1?MESSAGES.perfect:r>=0.7?MESSAGES.high:r>=0.4?MESSAGES.normal:MESSAGES.low);

   grade: 0=知らなかった 1=あいまい 2=思い出せた 3=完璧
   ============================================================ */
const GRADES=[

function nextInterval(w,grade){
  let {ef,interval,reps}=w;
  if(grade===0)  return {ef:Math.max(1.3,ef-0.2), interval:0,  reps:0,      lapse:true};
  if(grade===1)  return {ef:Math.max(1.3,ef-0.15),interval:1,  reps:reps+1, lapse:false};
  if(grade===2){
    const next = reps===0?1 : reps===1?Math.max(3,Math.round(interval*ef*0.8)) : Math.round(Math.max(interval,1)*ef);
    return {ef, interval:clamp(next,1,365), reps:reps+1, lapse:false};
  }
  const base = reps===0?4 : Math.round(Math.max(interval,1)*ef*1.3);
  return {ef:Math.min(2.8,ef+0.1), interval:clamp(base,4,365), reps:reps+1, lapse:false};
}

/* 1語ぶんの学習状態を更新する。
   同じ日に何度正解しても correctCount は1日1回しか増えない（連打で「習得」にならない） */
function applyGrade(w,grade,now){
  const r=nextInterval(w,grade);
  const day=dayKey(now);
  const sameDay=w.lastGradedDay===day;
  const correct=grade>=2;
  return {
    ...w,
    ef:r.ef, interval:r.interval, reps:r.reps,
    lapses:w.lapses+(r.lapse?1:0),
    due: r.interval===0 ? addDays(now,1) : addDays(now,r.interval),
    correctCount: (correct&&!sameDay)?w.correctCount+1:w.correctCount,
    incorrectCount: (!correct&&!sameDay)?w.incorrectCount+1:w.incorrectCount,
    lastStudiedDate: now,
    lastGradedDay: day,
    manualPass: grade===0?false:w.manualPass,
    manualPassDate: grade===0?null:w.manualPassDate,
  };
}

/* 出題優先度。期限超過・苦手・あと一歩の語を上に持ってくる */
function priority(w,now){
  const over = w.due!=null ? (now-w.due)/DAY : 0;
  const stale = w.lastStudiedDate ? (now-w.lastStudiedDate)/DAY : 5;
  return 10*Math.max(0,over) + 6*w.lapses + 3*Math.min(stale,14) + (w.reps>0&&w.interval<7?4:0) + (w.manualPass?-20:0);
}

/* 例文から見出し語（活用形を含む）を抜いて空所をつくる */
function clozeOf(w){
  const base=(w.word||"").toLowerCase();
  if(!base||/\s/.test(base)) return null;
  const stem=base.replace(/e$/,"");
  const pat="\\b("+esc(base)+"|"+esc(stem)+"(?:e?s|e?d|ing|ed|d|es|ies|ied)?)\\b";
  for(const [en,ja] of [[w.example,w.exampleJa],[w.example2,w.exampleJa2]]){
    if(!en) continue;
    const m=en.match(new RegExp(pat,"i"));
    if(m&&m.index!=null) return {pre:en.slice(0,m.index),answer:m[0],post:en.slice(m.index+m[0].length),en,ja};
  }
  return null;
}

/* ============================================================
   出題形式の選択
   ① 単語 英→日  ② 単語 日→英  ③ 用例 英→日  ④ 用例 日→英
   どれも「カードをめくって自己採点」の1形式。方向だけが変わる。
   ============================================================ */
function availableFormats(w,settings){
  const f=(settings&&settings.formats)||DEFAULT_SETTINGS.formats;
  const out=[];
  if(f.w_en_ja!==false) out.push("w_en_ja");
  if(f.w_ja_en!==false) out.push("w_ja_en");
  if(f.s_en_ja!==false&&w.example) out.push("s_en_ja");
  if(f.s_ja_en!==false&&clozeOf(w)) out.push("s_ja_en");
  return out.length?out:["w_en_ja"];
}
function chooseFormat(w,settings){
  const av=availableFormats(w,settings);
  /* はじめて出る語は必ず「英→日」。まず語の姿を見せる */
  if(w.reps===0) return av.includes("w_en_ja")?"w_en_ja":av[0];
  /* 2回目までは単語だけ。用例は語をある程度覚えてから出す */
  if(w.reps<=1){
    const easy=av.filter(x=>x[0]==="w");
    if(easy.length) return pick(easy);
  }
  return pick(av);
}

/* ============================================================
   語源の分解
   etymologyConclusion から「op（向かい合って）＋ pos（置く）」の部分を拾って
   チップに変える。データ側に roots があればそちらを優先する。
   ============================================================ */
const rootCache={};
function parseRoots(word){
  if(rootCache[word.id]) return rootCache[word.id];
  let out=[];
  if(Array.isArray(word.roots)&&word.roots.length){
    out=word.roots.map(r=>({morph:r.morph,gloss:r.gloss||""}));
  }else{
    const src=String(word.etymologyConclusion||word.etymologyProcess||"");
    const head=src.split(/→/)[0];
    out=head.split(/[+＋]/).map(s=>s.trim()).filter(Boolean).map(seg=>{
      const m=seg.match(/^([^（(]+)[（(]([^）)]*)[）)]/);
      if(m) return {morph:m[1].trim(),gloss:m[2].trim()};
      return {morph:seg.replace(/[（(].*$/,"").trim(),gloss:""};
    }).filter(r=>r.morph&&r.morph.length<=14&&!/[ぁ-んァ-ヶ一-龠]/.test(r.morph));
  }
  rootCache[word.id]=out;
  return out;
}
function imageryOf(word){
  const src=String(word.etymologyConclusion||"");
  const i=src.indexOf("→");
  return i>=0?src.slice(i+1).replace(/^\s*/,""):src;
}
function processTail(word){
  const src=String(word.etymologyProcess||"");
  const i=src.indexOf("→");
  return i>=0?src.slice(i+1).trim():src;
}
/* 同じ語根が別の綴りで書かれていることがある。
   表示はデータのまま（agree なら a＋gree のほうが字面に対応して分かりやすい）にしつつ、
   色と語根マップの集約だけは代表形にそろえる。 */
const ROOT_ALIAS={posit:"pos",gree:"grat",grac:"grat",a:"ad",mend:"mand",gard:"ward",plane:"plain",
  habil:"abil",hab:"abil",capt:"chief",cide:"cis",plaud:"plaus",her:"hes",circ:"search",ess:"sent"};
const canonRoot=m=>{const k=String(m||"").toLowerCase();return ROOT_ALIAS[k]||k;};

function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
/* 語根コラムを引く。ROOT_ALIAS で統合した代表形で探す */
const rootNote=m=>ROOT_NOTES[canonRoot(m)]||null;

const PREFIXES=new Set(["a","ab","abs","ac","ad","af","ag","al","an","ap","ar","as","at","ambi","ana","ante","anti","auto",
  "bene","bi","circum","co","col","com","con","contra","cor","counter","de","di","dia","dis","dif","dys","e","ef","em","en",
  "epi","ex","extra","fore","hyper","hypo","il","im","in","inter","intra","intro","ir","juxta","mal","mis","mono","multi",
  "non","ob","oc","of","op","out","over","para","per","peri","poly","post","pre","pro","pur","re","red","retro","se","semi",
  "sub","suc","suf","sup","sur","sus","sym","syn","tele","trans","tri","un","under","uni","up","with"]);
const SUFFIXES=new Set(["ion","ation","tion","sion","ition","ment","ful","able","ible","ate","ry","ous","ive","ative",
  "al","ty","ity","ness","er","or","ist","ing","ed","ic","ical","y","ly","ure","age","ize","ise","ify","fy","ian","ique",
  "ary","ory","ence","ance","ency","ancy","ent","ant","ism","ish","ee","ess","en","ile","oire","ite","ar","less","ward","hood","ship","dom","ic","ics","ial","ual","ular"]);
/* 語源パーツの種類を決める。データの並び順（先頭＝接頭辞候補、末尾＝接尾辞候補）も手がかりにする */
function morphType(morph,index,count){
  const k=String(morph||"").toLowerCase();
  if(count!=null&&count>1){
    if(index===0&&PREFIXES.has(k)) return "prefix";
    if(index===count-1&&index>0&&SUFFIXES.has(k)) return "suffix";
    return "root";
  }
  if(PREFIXES.has(k)) return "prefix";
  if(SUFFIXES.has(k)) return "suffix";
  return "root";
}
const TYPE_LABEL={prefix:"接頭",root:"語根",suffix:"接尾"};
const typeColor=(t,C)=>t==="prefix"?C.pre:t==="suffix"?C.suf:C.root;
function rootColor(morph,C,index,count){
  return {fg:typeColor(morphType(morph,index,count),C),bg:"transparent"};
}

/* 文法的な接尾辞は「語根マップ」に出しても意味がないので外す */
const SUFFIX_STOP=new Set(["ion","ation","tion","ment","ful","able","ible","ate","ry","ous","ive",
  "al","ty","ity","ness","er","or","ist","ing","ed","ic","y","t","s","ly",
  "ure","age","ize","ise","ian","ique","cle","ary","ence","ance","ism","ish","ative","ee","ess"]);

/* 「pro（前へ）＋ pos（置く）→ …」形式の文字列を語根の配列に分解する共通処理 */
function splitMorphs(text){
  const head=String(text||"").split(/→/)[0];
  return head.split(/[+＋]/).map(seg=>{
    const m=seg.trim().match(/^([^（(]+)[（(]([^）)]*)[）)]/);
    if(!m) return null;
    const morph=m[1].trim();
    if(!morph||morph.length>14||/[ぁ-んァ-ヶ一-龠]/.test(morph)) return null;
    return {morph,gloss:m[2].trim()};
  }).filter(Boolean);
}

/* 語根インデックス：同じ語根を持つ語を横断で集める（語根マップ画面で使う）。
   見出し語だけでなく、関連語の成り立ち説明に出てくる語根もすべて拾う。 */
function buildRootIndex(words,{withAffixes=false}={}){
  const map={};
  const touch=(r,i,n)=>{
    const k=canonRoot(r.morph);
    if(!map[k]) map[k]={morph:k,glosses:[],words:[],related:[],tally:{prefix:0,root:0,suffix:0}};
    if(r.gloss&&!map[k].glosses.includes(r.gloss)) map[k].glosses.push(r.gloss);
    map[k].tally[morphType(r.morph,i,n)]++;
    return map[k];
  };
  words.forEach(w=>{
    const ps=parseRoots(w);
    ps.forEach((r,i)=>{ touch(r,i,ps.length).words.push(w); });
    (w.relatedWords||[]).forEach(rw=>{
      if(rw.synonym) return;
      const ms=splitMorphs(rw.breakdown);
      ms.forEach((r,i)=>{
        const e=touch(r,i,ms.length);
        if(!e.related.some(x=>x.word===rw.word)&&!e.words.some(x=>x.word===rw.word)) e.related.push(rw);
      });
    });
  });
  return Object.values(map)
    .map(x=>{
      const t=x.tally;
      const type=t.prefix>=t.root&&t.prefix>=t.suffix?"prefix":t.suffix>t.root?"suffix":"root";
      return {...x,type,gloss:x.glosses.slice(0,2).join("／"),count:x.words.length+x.related.length};
    })
    .filter(x=>x.count>=2&&(withAffixes||!SUFFIX_STOP.has(x.morph)))
    .sort((a,b)=>b.count-a.count||a.morph.localeCompare(b.morph));
}

/* ============================================================
   AUDIO
   ============================================================ */
let voiceCache=null;
/* 発音はアメリカ英語／イギリス英語から選ぶ。端末にある声の中から、その発音で一番自然な声を自動で選ぶ */
const ACCENTS={
  us:{label:"アメリカ英語",lang:"en-US",
    good:/^(samantha|ava|allison|susan|zoe|evan|nathan|joelle|noelle|tom|google us english|microsoft (aria|jenny|guy|ana|christopher|eric|michelle|roger|steffan))/i},
  uk:{label:"イギリス英語",lang:"en-GB",
    good:/^(daniel|kate|serena|oliver|jamie|stephanie|arthur|martha|google uk english|microsoft (sonia|ryan|libby|maisie|thomas|hazel|george|susan))/i},
};
const VOICE_KEY="roots.voiceAccent.v1";
const getAccent=()=>{
  const v=lsGet(VOICE_KEY);
  if(v==="us"||v==="uk") return v;
  /* 前の版で保存した声の名前から引き継ぐ */
  const old=lsGet("roots.voiceName.v1");
  return typeof old==="string"&&/UK/.test(old)?"uk":"us";
};
function setAccent(acc){
  lsSet(VOICE_KEY,acc);
  voiceCache=null;
}
function listVoices(){
  try{return (window.speechSynthesis&&window.speechSynthesis.getVoices())||[];}catch(e){return [];}
}
/* 音声一覧は後から届くことがある。届いたらキャッシュを捨てて選び直す */
try{
  if(window.speechSynthesis&&window.speechSynthesis.addEventListener)
    window.speechSynthesis.addEventListener("voiceschanged",()=>{voiceCache=null;});
}catch(e){}
/* 効果音用のおもしろ音声（macOS）は教材に向かないので必ず外す */
const NOVELTY_VOICE=/^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|deranged|hysterical|pipe organ)\b/i;
function voiceScore(v,acc){
  const a=ACCENTS[acc];
  const lang=String(v.lang||"").replace("_","-").toLowerCase();
  if(lang!==a.lang.toLowerCase()) return -1;
  if(NOVELTY_VOICE.test(v.name)) return -1;
  let sc=10;
  if(/natural|neural/i.test(v.name)) sc+=60;   /* Edge などの高品質音声 */
  if(/premium/i.test(v.name)) sc+=50;          /* macOS / iOS の高品質音声 */
  if(/enhanced/i.test(v.name)) sc+=45;
  if(a.good.test(v.name)) sc+=30;
  if(/^google/i.test(v.name)) sc+=25;
  if(/compact|eloquence/i.test(v.name)) sc-=20;
  return sc;
}
/* 選んだ発音の声を返す。その発音の声が端末にないときは null */
function voiceFor(acc){
  const vs=listVoices();
  let best=null,bs=-1;
  vs.forEach(v=>{const sc=voiceScore(v,acc);if(sc>bs){bs=sc;best=v;}});
  return best;
}
function bestVoice(){
  try{
    if(voiceCache) return voiceCache;
    const acc=getAccent();
    const vs=listVoices();
    voiceCache=voiceFor(acc)||voiceFor(acc==="uk"?"us":"uk")
      ||vs.find(v=>/^en/i.test(v.lang))||null;
    return voiceCache;
  }catch(e){return null;}
}
/* 音声は audio/us/, audio/uk/ に1本ずつ置いてある（図書館方式）。
   ファイル名は英文から作った短い番号（ハッシュ）。ここには「どの番号があるか」の一覧だけ持つ */
let audioIndex=null, clipPlayer=null;
function clipHash(t){
  let h=0x811c9dc5;
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}
  return h.toString(16).padStart(8,"0");
}
function clipUrl(acc,t){
  if(audioIndex===null){
    try{
      const el=document.getElementById("roots-audio-index");
      const raw=el?JSON.parse(el.textContent):{};
      audioIndex={};
      for(const k in raw)audioIndex[k]=new Set(raw[k]);
    }catch(e){audioIndex={};}
  }
  const h=clipHash(t);
  return audioIndex[acc]&&audioIndex[acc].has(h)?"audio/"+acc+"/"+h+".m4a":null;
}
const hasAnyClips=acc=>{clipUrl(acc,"");return !!(audioIndex[acc]&&audioIndex[acc].size);};
const hasClip=t=>!!clipUrl(getAccent(),String(t||"").trim());
/* 収録音声がない文（あとから追加した語など）だけ、端末の声で読み上げる */
const RATE_WORD=0.82, RATE_SENTENCE=0.9;
function speakDevice(t,rate){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  const v=bestVoice();
  u.lang=v?v.lang:ACCENTS[getAccent()].lang;
  if(v)u.voice=v;
  u.rate=rate??(t.split(/\s+/).length<=3?RATE_WORD:RATE_SENTENCE);
  u.pitch=1;u.volume=1;
  window.speechSynthesis.speak(u);
}
function speak(text,{rate,enabled=true}={}){
  try{
    if(!enabled)return;
    const t=String(text||"").trim();
    if(!t)return;
    stopSpeak();
    const url=clipUrl(getAccent(),t);
    if(url){
      clipPlayer=new Audio(url);
      const p=clipPlayer.play();
      if(p&&p.catch)p.catch(()=>speakDevice(t,rate));
      return;
    }
    speakDevice(t,rate);
  }catch(e){}
}
function stopSpeak(){
  try{if(clipPlayer){clipPlayer.pause();clipPlayer=null;}}catch(e){}
  try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
}

let audioCtx=null;
function tone(seq,vol=0.14){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume();
    seq.forEach(([f,at,dur],i)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type="sine";osc.frequency.value=f;
      const t=audioCtx.currentTime+at;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(vol,t+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(t);osc.stop(t+dur+0.02);
    });
  }catch(e){}
}
const SFX={

/* ============================================================
   セッション構築
   ============================================================ */
function buildPool(words,cfg,settings,now){
  const goal=Math.max(1,cfg.count||settings.dailyGoal||10);
  const active=words.filter(w=>!w.manualPass);
  if(cfg.mode==="weak"){
    return active.filter(isWeak).sort((a,b)=>priority(b,now)-priority(a,now)).slice(0,goal);
  }
  if(cfg.mode==="range"){
    const inR=words.filter(w=>w.id>=cfg.rangeStart&&w.id<=cfg.rangeEnd&&!w.manualPass);
    const due=inR.filter(w=>isDue(w,now)).sort((a,b)=>priority(b,now)-priority(a,now));
    const fresh=inR.filter(isNew);
    const rest=inR.filter(w=>!isDue(w,now)&&!isNew(w)).sort((a,b)=>priority(b,now)-priority(a,now));
    const picked=[...due,...fresh,...rest].slice(0,goal);
    /* 出す順：番号順か、バラバラか */
    return cfg.order==="seq"?[...picked].sort((a,b)=>a.id-b.id):shuffle(picked);
  }
  /* おまかせ：期限が来た語を優先し、余った枠を新出で埋める */
  const due=active.filter(w=>isDue(w,now)).sort((a,b)=>priority(b,now)-priority(a,now));
  const reviewCap=Math.min(due.length,Math.max(goal-Math.min(cfg.newPerSession??5,goal),Math.ceil(goal*0.4)));
  const chosenDue=due.slice(0,reviewCap);
  const room=goal-chosenDue.length;
  const fresh=active.filter(isNew).slice(0,Math.max(0,room));
  let out=[...chosenDue,...fresh];
  if(out.length<goal){
    const ids=new Set(out.map(w=>w.id));
    const filler=active.filter(w=>!ids.has(w.id)).sort((a,b)=>priority(b,now)-priority(a,now)).slice(0,goal-out.length);
    out=[...out,...filler];
  }
  /* 新出と復習をばらけさせる。同じ種類が固まると集中が切れる */
  return interleave(out);
}
function interleave(list){
  const fresh=list.filter(isNew), old=list.filter(w=>!isNew(w));
  const out=[];const a=shuffle(old),b=shuffle(fresh);
  const total=a.length+b.length;
  for(let i=0;i<total;i++){
    const wantFresh=b.length&&(!a.length||(i%3===2));
    out.push(wantFresh?b.shift():a.shift());
  }
  return out.filter(Boolean);
}
function makeQueue(pool,settings){
  return pool.map(w=>({id:w.id,format:chooseFormat(w,settings),firstTry:true,lapse:0,seen:0}));
}
/* 誤答した語は列の最後ではなく「数語あと」に戻す。
   直後に出すと短期記憶で答えられてしまい、定着しない（expanding retrieval）。
   戻すときは必ず「英→日」に落として、まず意味を確かめさせる。 */
/* まちがえた語は、5語進んだところでもう一度出す。「覚えた」を押すまで何度でも戻ってくる */
const RETRY_GAP=5;
function reinsert(queue,item){
  const gap=Math.min(queue.length, RETRY_GAP);
  const next={...item,lapse:item.lapse+1,firstTry:false,seen:item.seen+1,
    format:item.lapse>=1?"w_en_ja":item.format};
  const q=[...queue];
  q.splice(gap,0,next);
  return q;
}
/* 発音ごとに、この端末で使う声を返す。voiceschanged で更新する */
function useAccentVoices(){
  const pick=()=>({us:voiceFor("us"),uk:voiceFor("uk")});
  const [vs,setVs]=useState(pick);
  useEffect(()=>{
    const ss=window.speechSynthesis;
    if(!ss||!ss.addEventListener)return;
    const h=()=>setVs(pick());
    ss.addEventListener("voiceschanged",h);
    h();
    return ()=>ss.removeEventListener("voiceschanged",h);
  },[]);
  return vs;
}

/* 答え（意味）を見せたときの読み上げ。単語帳と学習画面で共通。設定で 英単語／例文1文目／なし */

function FitBox({dep,minScale=0.72,maxScale=1,children,style}){
  const outer=useRef(null), inner=useRef(null);
  const [scale,setScale]=useState(1);
  useLayoutEffect(()=>{
    if(!outer.current||!inner.current)return;
    let raf=0, cancelled=false;
    let lo=minScale, hi=maxScale, best=minScale, cur=maxScale, iter=0;
    const apply=v=>{
      if(!inner.current)return;
      inner.current.style.transform="scale("+v+")";
      inner.current.style.width=(100/v)+"%";
    };
    const step=()=>{
      if(cancelled||!outer.current||!inner.current)return;
      const avail=outer.current.clientHeight;
      const need=inner.current.scrollHeight*cur;
      if(need<=avail+0.5){best=cur;lo=cur;}else{hi=cur;}
      iter++;
      if(iter>=8||hi-lo<0.015||best===maxScale){setScale(best);apply(best);return;}
      cur=(lo+hi)/2;
      apply(cur);
      raf=requestAnimationFrame(step);
    };
    apply(maxScale);
    raf=requestAnimationFrame(step);
    return ()=>{cancelled=true;cancelAnimationFrame(raf);};
  },[dep,minScale,maxScale]);
  return (
    <div ref={outer} style={{flex:1,minHeight:0,overflowY:scale<=minScale?"auto":"hidden",...style}}>
      <div ref={inner} style={{transformOrigin:"top left",transform:"scale("+scale+")",width:(100/scale)+"%"}}>
        {children}
      </div>
    </div>
  );
}

/* 語の全情報を1画面ぶんにまとめたもの。学習の答え合わせ面と単語詳細で共用する。
   スクロールさせない前提なので、行間と字送りを詰めてある。 */
/* 見出し語を語源パーツごとに色分けする。パーツの綴りが語の中に見つからない部分は黒のまま */
function ColoredWord({C,word,parts,colored=true}){
  const text=String(word||"");
  if(!colored||!parts.length) return <>{text}</>;
  const low=text.toLowerCase();
  const out=[];let pos=0;
  parts.forEach((p,i)=>{
    const m=String(p.morph||"").toLowerCase();
    if(!m) return;
    /* 綴りが語中で少し変わる語（agree の a＋gree など）も拾えるよう、末尾を削りながら探す */
    let found=-1,len=m.length;
    for(let L=m.length;L>=Math.min(2,m.length);L--){
      const k=low.indexOf(m.slice(0,L),pos);
      if(k>=0&&(i>0||k===0)&&k-pos<=2){found=k;len=L;break;}
    }
    if(found<0) return;
    if(found>pos) out.push(<span key={"g"+i}>{text.slice(pos,found)}</span>);
    out.push(<span key={i} style={{color:typeColor(morphType(p.morph,i,parts.length),C)}}>{text.slice(found,found+len)}</span>);
    pos=found+len;
  });
  if(pos<text.length) out.push(<span key="tail">{text.slice(pos)}</span>);
  return <>{out}</>;
}

/* 本文中のパーツ名を、その色＋太字で目立たせる */
function HighlightParts({C,text,parts}){
  const src=String(text||"");
  const names=parts.map((p,i)=>({m:String(p.morph||""),t:morphType(p.morph,i,parts.length)})).filter(x=>x.m.length>=2);
  if(!names.length) return <>{src}</>;
  const re=new RegExp("("+names.map(x=>esc(x.m)).sort((a,b)=>b.length-a.length).join("|")+")(?=（|\\()","g");
  return <>{src.split(re).map((seg,i)=>{
    const hit=names.find(x=>x.m===seg);
    return hit&&i%2===1?<span key={i} className="en" style={{color:typeColor(hit.t,C),fontWeight:700}}>{seg}</span>:<span key={i}>{seg}</span>;
  })}</>;
}

const EMPTY_FOCUS=new Set();

/* 関連語の成り立ち説明。
   「pro（前へ）＋ pos（置く）→ 案を相手の前に差し出して置く」の
   語根の部分だけを、その語根の色で塗る。どこが共通しているのかが字の単位で分かる。 */
function Breakdown({C,text,size=11,lineHeight=1.55,focus}){
  const src=String(text||"");
  const cut=src.indexOf("→");
  const head=cut>=0?src.slice(0,cut):src;
  const tail=cut>=0?src.slice(cut):"";
  const segs=head.split(/([+＋])/);
  return (
    <span style={{fontSize:size,color:C.sub,lineHeight}}>
      {segs.map((seg,i)=>{
        if(seg==="+"||seg==="＋")
          return <span key={i} style={{color:C.faint}}>{seg}</span>;
        const m=seg.match(/^(\s*)([^（(]+?)(\s*[（(][^）)]*[）)])([\s\S]*)$/);
        if(!m) return <span key={i}>{seg}</span>;
        const morph=m[2].trim();
        if(!morph||/[ぁ-んァ-ヶ一-龠]/.test(morph)||morph.length>14)
          return <span key={i}>{seg}</span>;
        /* focus が渡されているときは、見出し語と共通する語根だけを塗る。
           全部塗ると「どこが共通なのか」がかえって読み取れなくなる。 */
        if(focus&&!focus.has(canonRoot(morph)))
          return <span key={i}>{seg}</span>;
        const col=focus?{fg:C.root}:rootColor(morph,C);
        return (
          <span key={i}>
            {m[1]}
            <span className="en" style={{color:col.fg,fontWeight:700}}>{m[2].trim()}</span>
            {m[3]}{m[4]}
          </span>
        );
      })}
      <span>{tail}</span>
    </span>
  );
}

/* 語根チップ。同じ語根はアプリ全体で同じ色になる */
function RootChips({C,word,size="md",onTapRoot,isGlossHidden,onRevealGloss}){

      {parts.map((r,i)=>{
        const col=rootColor(r.morph,C,i,parts.length);

          <span style={{display:"inline-flex",flexDirection:"column",alignItems:"center",position:"relative",
            border:"1px solid "+C.line,color:col.fg,borderRadius:4,padding:s.p,lineHeight:1.25}}>

            {r.gloss&&(isGlossHidden&&isGlossHidden(i)
              ?<span role="button" tabIndex={0} aria-label="語源の意味を見る"
                 onClick={e=>{e.stopPropagation();onRevealGloss&&onRevealGloss(i);}}

                 style={{fontSize:s.f-3.5,marginTop:1,whiteSpace:"nowrap",color:"transparent",background:C.line,
                   borderRadius:4,cursor:"pointer",userSelect:"none"}}>{r.gloss}</span>
              :<span style={{fontSize:s.f-3.5,opacity:.92,marginTop:1,whiteSpace:"nowrap"}}>{r.gloss}</span>)}
            {hasNote&&<span aria-hidden="true" style={{position:"absolute",top:3,right:4,width:5,height:5,
              borderRadius:"50%",background:col.fg,opacity:.75}}/>}

        return (
          <React.Fragment key={i}>

                 style={{border:"none",background:"transparent",padding:0,cursor:"pointer",display:"inline-flex"}}>{inner}</button>
              :inner}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function ExampleLine({C,en,ja,word,meaning,size=13.5,index,speakOn=true}){

  const parts=en.split(new RegExp("("+esc2(word)+"\\w*)","gi"));

/* ============================================================
   モーダル / シート / スナックバー
   ============================================================ */
function Overlay({C,children,onClose,align="flex-end",z=100}){
  useEffect(()=>{
    const h=e=>{if(e.key==="Escape")onClose&&onClose();};
    window.addEventListener("keydown",h);
    const prev=document.body.style.overflow;document.body.style.overflow="hidden";
    return ()=>{window.removeEventListener("keydown",h);document.body.style.overflow=prev;};
  },[onClose]);
  return (
    <div onClick={onClose} className="fadeIn" role="dialog" aria-modal="true"
      style={{position:"fixed",inset:0,background:C.overlay,zIndex:z,display:"flex",
        alignItems:align,justifyContent:"center",padding:align==="center"?20:0}}>
      <div onClick={e=>e.stopPropagation()}>{children}</div>
    </div>
  );
}

function Modal({C,title,body,actions,onClose}){
  return (
    <Overlay C={C} onClose={onClose} align="center" z={140}>
      <div className="popIn" style={{background:C.card,borderRadius:4,width:"min(360px,90vw)",
        padding:"24px 22px 18px"}}>
        <div style={{fontSize:16.5,fontWeight:700,color:C.text,marginBottom:10}}>{title}</div>
        {body&&<div style={{fontSize:13.5,color:C.sub,lineHeight:1.85,marginBottom:20}}>{body}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {actions.map((a,i)=>(
            <Btn key={i} C={C} variant={a.variant||(i===0?"primary":"ghost")} style={{minHeight:48}}
              onClick={a.onClick}>{a.label}</Btn>
          ))}
        </div>
      </div>
    </Overlay>
  );
}

function Snackbar({C,text,actionLabel,onAction,onClose,bottom=16,place="bottom"}){
  useEffect(()=>{
    const t=setTimeout(()=>onClose&&onClose(),5200);
    return ()=>clearTimeout(t);
  },[onClose,text]);
  const pos=place==="top"
    ?{top:"calc(10px + env(safe-area-inset-top))"}
    :{bottom:"calc("+bottom+"px + env(safe-area-inset-bottom))"};
  return (
    <div className={place==="top"?"snackInTop":"snackIn"} role="status"

        width:"min(400px,calc(100% - 24px))",background:C.text,color:C.bg,
        borderRadius:4,padding:"12px 12px 12px 16px",display:"flex",alignItems:"center",gap:12,
        border:"1px solid "+C.line}}>
      <span style={{flex:1,fontSize:13,lineHeight:1.5}}>{text}</span>

        <button onClick={onAction} style={{background:"transparent",border:"none",color:C.bg,

}

/* ============================================================
   SCREEN: ONBOARDING（3ステップ。出題形式は全部オンで始める）
   ============================================================ */
function OnboardingScreen({C,onDone}){
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [goal,setGoal]=useState(10);
  const [reminderEnabled,setReminderEnabled]=useState(false);
  const [reminderTime,setReminderTime]=useState("21:00");
  const STEPS=[
    {t:"呼び名を教えてください",s:"ホーム画面の表示に使います。あとから変えられます。"},
    {t:"1回に何語やりますか",s:"毎日続けられる量にしてください。週末にまとめてやるより、毎日少しのほうが残ります。"},
    {t:"復習の時間を決めますか",s:"決めた時刻に、開いているタブへ通知を出します。"},
  ];
  const HEAD=STEPS[step];
  const last=step===STEPS.length-1;
  const finish=()=>onDone({name:name.trim()||"あなた",dailyGoal:goal,reminderEnabled,reminderTime});
  return (
    <div className="riseIn" style={{flex:1,display:"flex",flexDirection:"column",padding:"clamp(24px, 6vh, 48px) 20px 32px",minHeight:"100vh"}}>
      <div style={{display:"flex",gap:6,marginBottom:36}}>
        {STEPS.map((_,i)=><div key={i} style={{flex:1,height:3,borderRadius:4,background:i<=step?C.accent:C.border}}/>)}
      </div>
      <div key={step} className="riseIn">
        <div style={{fontSize:20,fontWeight:700,color:C.text,marginBottom:8}}>{HEAD.t}</div>
        <div style={{fontSize:13,color:C.sub,marginBottom:28,lineHeight:1.85}}>{HEAD.s}</div>

        {step===0&&(
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="なまえ" aria-label="なまえ"
            autoFocus onKeyDown={e=>{if(e.key==="Enter")setStep(1);}}
            style={{width:"100%",height:52,borderRadius:4,border:"1px solid "+C.border,background:C.card,
              color:C.text,fontSize:16,padding:"0 16px"}}/>
        )}

        {step===1&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[5,10,20,30].map(n=>(
                <button key={n} onClick={()=>setGoal(n)} className="num"
                  style={{minHeight:64,borderRadius:4,cursor:"pointer",
                    border:"1px solid "+(goal===n?C.accent:C.border),
                    background:goal===n?C.accentSoft:C.card,color:goal===n?C.accent:C.text,
                    fontSize:18,fontWeight:700}}>{n}<span style={{fontSize:12,fontWeight:400,marginLeft:3}}>語</span></button>
              ))}
            </div>
            <div style={{fontSize:12,color:C.faint,lineHeight:1.8,marginTop:16}}>
              目安：10語なら3〜5分。まちがえた語はその回のうちに数語あとでもう一度出ます。
            </div>
          </div>
        )}

        {step===2&&(
          <div>
            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:16,
              display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div>
                <div style={{fontSize:14.5,fontWeight:700,color:C.text}}>復習リマインド</div>
                <div style={{fontSize:12,color:C.sub,marginTop:2}}>毎日この時刻に知らせます</div>
              </div>
              <Toggle on={reminderEnabled} onChange={setReminderEnabled} C={C} label="復習リマインド"/>
            </div>
            {reminderEnabled&&(
              <div className="riseIn">
                <input type="time" value={reminderTime} onChange={e=>setReminderTime(e.target.value)}
                  aria-label="リマインド時刻" className="num"
                  style={{width:"100%",height:52,borderRadius:4,border:"1px solid "+C.border,background:C.card,
                    color:C.text,fontSize:17,padding:"0 16px"}}/>
              </div>
            )}
          </div>
        )}
      </div>
      <div style={{flex:1,minHeight:32}}/>
      <Btn C={C} onClick={()=>last?finish():setStep(step+1)}>{last?"はじめる":"次へ"}</Btn>
      {step>0&&<Btn C={C} variant="quiet" style={{marginTop:10,minHeight:46}} onClick={()=>setStep(step-1)}>戻る</Btn>}
    </div>
  );
}

  const mastered=words.filter(isMastered).length;

  const rest=words.length-mastered-learning;

  const newCount=words.filter(isNew).length;
  const weak=words.filter(isWeak).length;
  const level=getLevel(mastered);
  const nl=nextLevel(mastered);
  const todayDone=(stats.history&&stats.history[todayKey()])||null;
  const card={background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:16};
  const freshInPool=pool.filter(isNew).length;

  return (
    <div style={{flex:1,padding:"18px 20px 96px",display:"flex",flexDirection:"column"}} className="riseIn">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",

      </div>

      {resumeInfo&&(
        <div style={{padding:"16px 0",borderBottom:"1px solid "+C.line}}>
          <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:3}}>前回の学習が途中です</div>
          <div style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:12}}>残り {resumeInfo.left}語 ／ {resumeInfo.ago}</div>

        <div style={{display:"flex",alignItems:"baseline",gap:4,marginTop:6}}>

          <span style={{display:"inline-flex",transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}><Icon.chevron size={18}/></span>
        </button>

        {open&&(
          <div className="riseIn" style={{marginTop:6,paddingTop:16,borderTop:"1px solid "+C.line}}>
            <Seg C={C} style={{marginBottom:16}}
              options={[["auto","おまかせ"],["range","範囲から"],["weak","苦手だけ"]]}
              value={cfg.mode} onPick={v=>setCfg({mode:v})}/>
            {cfg.mode==="auto"&&(

              </div>

            <div style={{marginTop:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
                <span style={{fontSize:12.5,color:C.sub}}>この回の語数</span>

              </div>

          <span style={{fontSize:14,color:C.sub}}>全体の進み</span>
          <span className="num" style={{fontSize:18,fontWeight:700,color:C.text}}>{pct}%</span>
        </div>
        <StackBar C={C} mastered={mastered} learning={learning} total={words.length}/>
        <StackLegend C={C} mastered={mastered} learning={learning} rest={rest}/>
      </button>
    </div>
  );
}

function RangeBlock({C,words,start,end,chip,onSet}){
  const inRange=words.filter(w=>w.id>=start&&w.id<=end);
  const m=inRange.filter(isMastered).length;
  const l=inRange.filter(isLearning).length;
  const first=inRange[0],last=inRange[inRange.length-1];
  const partRange=part=>{
    const ids=RAW_WORDS.filter(w=>w.part===part).map(w=>w.id);
    return ids.length?{s:Math.min(...ids),e:Math.max(...ids)}:{s:MIN_ID,e:MAX_ID};
  };
  return (
    <div>
      <div className="scrollx" style={{display:"flex",gap:8,marginBottom:12,paddingBottom:2}}>
        {PART_LIST.map(p=>(
          <Chip key={p} C={C} active={chip===p}
            onClick={()=>{const r=partRange(p);onSet({rangeStart:r.s,rangeEnd:r.e,chip:p});}}>Part {p}</Chip>
        ))}
        <Chip C={C} active={chip==="all"} onClick={()=>onSet({rangeStart:MIN_ID,rangeEnd:MAX_ID,chip:"all"})}>すべて</Chip>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:12}}>
        <Stepper C={C} value={start} label="開始"
          onChange={v=>onSet({rangeStart:v,rangeEnd:Math.max(v,end),chip:null})}/>
        <span style={{color:C.faint,marginTop:18}}>–</span>
        <Stepper C={C} value={end} label="終了"
          onChange={v=>onSet({rangeEnd:v,rangeStart:Math.min(v,start),chip:null})}/>
      </div>
      <div style={{background:C.raise,border:"1px solid "+C.border,borderRadius:4,padding:"10px 12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:10,marginBottom:7}}>
          <span className="en" style={{fontSize:12.5,color:C.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {first?first.word:"—"} … {last?last.word:"—"}
          </span>
          <span className="num" style={{fontSize:12.5,color:C.text,fontWeight:700,flexShrink:0}}>{inRange.length}語</span>
        </div>
        <StackBar C={C} mastered={m} learning={l} total={inRange.length} h={6}/>
      </div>
    </div>
  );
}

/* 例文中の見出し語を色付きで見せる */
function SentenceEn({C,text,word,size=19}){
  const parts=String(text).split(new RegExp("("+esc(word)+"\\w*)","gi"));
  return (
    <span className="en" style={{fontSize:size,lineHeight:1.7,color:C.text}}>
      {parts.map((p,i)=>p.toLowerCase().startsWith(String(word).toLowerCase())
        ?<span key={i} style={{color:C.root,fontWeight:700}}>{p}</span>:<span key={i}>{p}</span>)}
    </span>
  );
}

function SpeakDot({C,text,size=56}){
  return (
    <span role="button" aria-label="発音を聞く" className="press" onClick={e=>{e.stopPropagation();speak(text,{enabled:true});}}
      style={{width:size,height:size,borderRadius:4,border:"1px solid "+C.line,flexShrink:0,
        background:"transparent",color:C.text,cursor:"pointer",display:"inline-flex",
        alignItems:"center",justifyContent:"center"}}><Icon.speaker size={Math.round(size*0.43)}/></span>
  );
}

      {f==="w_ja_en"&&(

const CORE=["head","meaning","tree","imagery"];
function RevealFace({C,item,onTapRoot,timedOut}){
  const w=item.word;
  const [page,setPage]=useState(0);
  const pager=useRef(null);
  useEffect(()=>{setPage(0);if(pager.current)pager.current.scrollLeft=0;},[w.id]);
  const pages=[
    {name:"答え",only:CORE},
    {name:"語源",only:["etymBody","rootBtns","memo"]},
    {name:"例文",only:["examples"]},
  ];
  const goPage=i=>{const el=pager.current;if(el)el.scrollTo({left:el.clientWidth*i,behavior:"smooth"});};
  return (
    <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
      {timedOut&&(
        <div style={{border:"1px solid "+C.line,color:C.text,borderRadius:4,padding:"7px 12px",
          fontSize:13,fontWeight:700,marginBottom:8,flexShrink:0,textAlign:"center"}}>時間切れ</div>
      )}
      <div style={{flex:1,minHeight:0,background:C.bg,border:"1px solid "+C.line,borderRadius:4,
        display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div ref={pager} onScroll={e=>{const el=e.currentTarget;setPage(Math.round(el.scrollLeft/el.clientWidth));}}
          style={{flex:1,minHeight:0,display:"flex",overflowX:"auto",scrollSnapType:"x mandatory",scrollbarWidth:"none"}}>
          {pages.map((p,i)=>(
            <div key={i} style={{flex:"0 0 100%",scrollSnapAlign:"start",overflowY:"auto",padding:16,boxSizing:"border-box"}}>
              {i>0&&<div style={{fontSize:15,color:C.sub,marginBottom:4}}>{p.name}</div>}
              <WordDetail C={C} word={w} onTapRoot={onTapRoot} only={p.only} head={i===0} big xl/>
            </div>
          ))}
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:6,padding:"6px 0 8px",flexShrink:0}}>
          {pages.map((p,i)=>(
            <button key={i} onClick={()=>goPage(i)} style={{minHeight:32,padding:"0 10px",borderRadius:16,cursor:"pointer",
              fontSize:13,border:"1px solid "+(page===i?C.text:C.line),background:page===i?C.text:"transparent",
              color:page===i?C.bg:C.sub}}>{p.name}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN: RESULT
   ============================================================ */
function ResultScreen({C,log,newBadges,stats,earned,message,words,onReplay,onHome,onReviewWrong,onOpenWord}){
  /* 同じ語を複数回やり直したぶんは1語として数える */
  const uniq=useMemo(()=>{
    const m=new Map();
    log.forEach(x=>{
      const cur=m.get(x.id);
      if(!cur) m.set(x.id,{id:x.id,firstTry:x.firstTry,grade:x.grade,tries:1,format:x.format});
      else m.set(x.id,{...cur,grade:x.grade,tries:cur.tries+1});
    });
    return [...m.values()];
  },[log]);
  const total=uniq.length;
  const first=uniq.filter(x=>x.firstTry&&x.grade>=2&&x.tries===1).length;
  const pct=total?Math.round(first/total*100):0;
  const wrong=uniq.filter(x=>x.tries>1||x.grade===0);
  const byFormat={};
  log.forEach(x=>{
    if(!byFormat[x.format])byFormat[x.format]={n:0,ok:0};
    byFormat[x.format].n++; if(x.grade>=2)byFormat[x.format].ok++;
  });
  /* 次にいつ会うかを見せる。SRSが効いていることが目に見える */
  const schedule=useMemo(()=>{
    const buckets={};
    uniq.forEach(x=>{
      const w=words.find(y=>y.id===x.id);
      if(!w||w.due==null)return;
      const d=Math.max(0,daysBetween(Date.now(),w.due));
      const k=d<=1?"明日":d<=3?"2〜3日後":d<=7?"1週間以内":d<=21?"3週間以内":"1か月以上先";
      buckets[k]=(buckets[k]||0)+1;
    });
    return ["明日","2〜3日後","1週間以内","3週間以内","1か月以上先"].filter(k=>buckets[k]).map(k=>[k,buckets[k]]);
  },[uniq,words]);

  const Col=({label,value,color})=>(
    <div style={{flex:1,textAlign:"center",padding:"0 4px"}}>
      <div className="num" style={{fontSize:20,fontWeight:700,color:color||C.text}}>{value}</div>
      <div style={{fontSize:11,color:C.faint,marginTop:4}}>{label}</div>
    </div>
  );
  return (
    <div className="riseIn" style={{flex:1,padding:"clamp(16px, 3.5vh, 26px) 20px 24px",display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      <div style={{textAlign:"center",marginBottom:6}}>
        <div style={{fontSize:12,color:C.faint,fontWeight:700,marginBottom:8}}>一発正解率</div>
        <div className="num popIn" style={{fontSize:"clamp(48px, 16vw, 64px)",fontWeight:700,color:C.text,lineHeight:1}}>
          {pct}<span style={{fontSize:24}}>%</span></div>
      </div>

      <div style={{display:"flex",margin:"20px 0 16px",borderTop:"1px solid "+C.line,borderBottom:"1px solid "+C.line,padding:"16px 0"}}>
        <Col label="一発で正解" value={first} color={C.ok}/>
        <div style={{width:1,background:C.line}}/>
        <Col label="つまずいた" value={total-first} color={total-first?C.warn:undefined}/>
        <div style={{width:1,background:C.line}}/>
        <Col label="この回の語数" value={total}/>
      </div>

      {/* 形式別の内訳 */}
      {Object.keys(byFormat).length>1&&(
        <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:22}}>
          {Object.keys(byFormat).map(k=>{
            const m=FORMAT_META[k],b=byFormat[k];
            if(!m)return null;
            return (
              <span key={k} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:11.5,color:C.sub,
                border:"1px solid "+C.border,borderRadius:4,padding:"6px 11px"}}>
                {m.short}<b className="num" style={{color:C.text}}>{b.ok}/{b.n}</b>
              </span>
            );
          })}
        </div>
      )}

      <div style={{fontSize:13.5,color:C.sub,textAlign:"center",lineHeight:1.85,marginBottom:18}}>{message}</div>

      {/* 次の復習予定 */}
      {schedule.length>0&&(
        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:18,marginBottom:14}}>
          <div style={{fontSize:11.5,color:C.faint,fontWeight:700,marginBottom:14}}>次にこの語と会う日</div>
          {schedule.map(([k,v])=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:12,marginBottom:9}}>
              <span style={{fontSize:12,color:C.sub,width:88,flexShrink:0}}>{k}</span>
              <div style={{flex:1}}><Bar C={C} pct={v/total*100} h={6} color={C.accent}/></div>
              <span className="num" style={{fontSize:12,color:C.text,fontWeight:700,width:26,textAlign:"right"}}>{v}</span>
            </div>
          ))}
        </div>
      )}

      {/* つまずいた語 */}
      {wrong.length>0&&(
        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:18,marginBottom:14}}>
          <div style={{fontSize:11.5,color:C.bad,fontWeight:700,marginBottom:12}}>つまずいた語（{wrong.length}）</div>
          {wrong.slice(0,6).map(x=>{
            const w=words.find(y=>y.id===x.id);if(!w)return null;
            return (
              <button key={x.id} onClick={()=>onOpenWord(w)}
                style={{width:"100%",textAlign:"left",background:"transparent",border:"none",cursor:"pointer",
                  padding:"9px 0",borderTop:"1px solid "+C.line,display:"flex",gap:10,alignItems:"baseline"}}>
                <span className="en" style={{fontSize:14,fontWeight:700,color:C.text}}>{w.word}</span>
                <span style={{fontSize:12,color:C.sub,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{w.meaning}</span>
              </button>
            );
          })}
          <Btn C={C} variant="ghost" style={{marginTop:14,minHeight:46,fontSize:13.5}} onClick={onReviewWrong}>
            <Icon.repeat size={17}/>この{wrong.length}語だけもう一度
          </Btn>
        </div>
      )}

      {newBadges.length>0&&(
        <div className="popIn" style={{background:C.accentSoft,borderRadius:4,padding:16,marginBottom:14}}>
          <div style={{fontSize:11.5,color:C.accent,fontWeight:700,marginBottom:12}}>バッジを獲得しました</div>
          {newBadges.map(id=>{
            const b=BADGES.find(x=>x.id===id);const S=BadgeSymbol[id];
            return (
              <div key={id} style={{display:"flex",alignItems:"center",gap:12,marginTop:8}}>
                <span style={{color:C.accent}}><S size={22}/></span>
                <span style={{fontSize:14,fontWeight:700,color:C.text}}>{b.label}</span>
                <span style={{fontSize:12,color:C.sub}}>{b.desc}</span>
              </div>
            );
          })}
        </div>
      )}

      <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:14,marginBottom:16,
        display:"flex",alignItems:"center",gap:8,color:stats.streak>0?C.warn:C.faint}}>
        <Icon.flame size={18}/>
        <span className="num" style={{fontSize:16,fontWeight:700}}>{stats.streak}</span>
        <span style={{fontSize:12,color:C.faint}}>日連続</span>
        <span style={{flex:1}}/>
        <span className="num" style={{fontSize:12,color:C.faint}}>のべ {stats.totalDays}日</span>
      </div>

      <div style={{flex:1,minHeight:12}}/>
      <Btn C={C} onClick={onHome}>ホームへ</Btn>
      <Btn C={C} variant="quiet" style={{marginTop:8,minHeight:46}} onClick={onReplay}>続けてもう1セット</Btn>
    </div>
  );
}

/* ============================================================
   SCREEN: LIST（単語帳）
   ============================================================ */
function ListScreen({C,words,onTogglePass,onOpen,settings}){
  const [part,setPart]=useState(PART_LIST[0]);
  const [filter,setFilter]=useState("all");
  const [q,setQ]=useState("");
  const [sort,setSort]=useState("id");
  const [hideMeaning,setHideMeaningState]=useState(!!settings.hideMeaningInList);
  /* 隠しているあいだにタップして見せた部分。「id:m」＝意味、「id:g番号」＝語源の意味 */
  const [shown,setShown]=useState(()=>new Set());
  const setHideMeaning=v=>{setHideMeaningState(v);setShown(new Set());};
  const reveal=key=>setShown(p=>{const n=new Set(p);n.add(key);return n;});
  /* 意味を見せると、語源の意味もまとめて見せ、設定に応じて単語か例文1文目を読み上げる */
  const revealMeaning=w=>{
    setShown(p=>{const n=new Set(p);n.add(w.id+":m");parseRoots(w).forEach((_,i)=>n.add(w.id+":g"+i));return n;});
    speakReveal(w,settings);
  };
  /* 意味を見たあとの○×の記録。{id:true(○)/false(×)}。○の単語は次から隠さない */
  const [recall,setRecallState]=useState(()=>lsGet("roots.listRecall")||{});
  const setRecall=(id,ok)=>setRecallState(p=>{const n={...p,[id]:ok};lsSet("roots.listRecall",n);return n;});
  const resetRecall=()=>{setRecallState({});lsDel("roots.listRecall");setShown(new Set());};
  const hasKnown=Object.values(recall).some(v=>v);
  const hidden=key=>hideMeaning&&!shown.has(key)&&!recall[key.split(":")[0]];
  const now=Date.now();

  const rows=useMemo(()=>{
    const query=q.trim().normalize("NFKC");
    const numberMatch=query.match(/^(?:no\.?\s*|#\s*)?(\d+)$/i);
    let r=words.filter(w=>{
      if(query){
        const s=query.toLowerCase();
        if(numberMatch){
          if(w.id!==Number(numberMatch[1]))return false;
        }else if(!(w.word.toLowerCase().includes(s)||w.meaning.includes(query)||
            parseRoots(w).some(x=>x.morph.toLowerCase().includes(s)))) return false;
      }else if(w.part!==part) return false;
      if(filter==="mastered")return isMastered(w);
      if(filter==="learning")return isLearning(w);
      if(filter==="new")return isNew(w);
      if(filter==="weak")return isWeak(w);
      if(filter==="due")return isDue(w,now);
      if(filter==="pass")return w.manualPass;
      return true;
    });
    if(sort==="weak")r=[...r].sort((a,b)=>b.incorrectCount+b.lapses-(a.incorrectCount+a.lapses));
    else if(sort==="due")r=[...r].sort((a,b)=>(a.due||Infinity)-(b.due||Infinity));
    else if(sort==="alpha")r=[...r].sort((a,b)=>a.word.localeCompare(b.word));
    else r=[...r].sort((a,b)=>a.id-b.id);
    return r;
  },[words,part,filter,q,sort,now]);

  return (
    <div style={{flex:1,paddingBottom:100}} className="riseIn">
      <div style={{padding:"22px 20px 0"}}>
        <SectionTitle C={C} right={<span className="num" style={{fontSize:12.5,color:C.faint}}>{rows.length}語</span>}>単語帳</SectionTitle>

        <div style={{position:"relative",marginBottom:14}}>
          <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.faint}}><Icon.search size={18}/></span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="番号・単語・意味・語根で探す" aria-label="単語を検索"
            style={{width:"100%",height:46,borderRadius:4,border:"1px solid "+C.border,background:C.card,
              color:C.text,fontSize:14,padding:"0 40px 0 38px"}}/>
          {q&&<button onClick={()=>setQ("")} aria-label="検索を消す"
            style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",width:34,height:34,
              borderRadius:4,border:"none",background:"transparent",color:C.faint,cursor:"pointer"}}><Icon.close size={18}/></button>}
        </div>

        {!q&&PART_LIST.length>1&&(()=>{
          const ids=RAW_WORDS.filter(w=>w.part===part).map(w=>w.id);
          return (
          <div style={{position:"relative",marginBottom:12}}>
            <select value={part} onChange={e=>setPart(+e.target.value)} aria-label="Part を選ぶ"
              style={{width:"100%",height:46,borderRadius:4,border:"1px solid "+C.line,background:C.bg,
                color:C.text,fontSize:15,fontWeight:700,padding:"0 40px 0 14px",appearance:"none",WebkitAppearance:"none",cursor:"pointer"}}>
              {PART_LIST.map(p=>{
                const r=RAW_WORDS.filter(w=>w.part===p).map(w=>w.id);
                return <option key={p} value={p}>Part {p}（{Math.min(...r)}〜{Math.max(...r)}）</option>;
              })}
            </select>
            <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:C.sub,pointerEvents:"none",display:"flex"}}>
              <Icon.chevron size={20}/></span>
          </div>);
        })()}

        <div className="scrollx" style={{display:"flex",gap:8,paddingBottom:4,marginBottom:6}}>
          {[["all","すべて"],["due","復習どき"],["weak","苦手"],["learning","学習中"],["mastered","習得"],["new","未着手"],["pass","既知"]].map(([v,l])=>(
            <Chip key={v} C={C} active={filter===v} onClick={()=>setFilter(v)} small>{l}</Chip>
          ))}
        </div>
        <div className="scrollx" style={{display:"flex",gap:8,paddingBottom:4,alignItems:"center"}}>
          <span style={{fontSize:11,color:C.faint,flexShrink:0}}>並び</span>
          {[["id","番号"],["alpha","ABC"],["due","期限"],["weak","苦手順"]].map(([v,l])=>(
            <Chip key={v} C={C} active={sort===v} onClick={()=>setSort(v)} small>{l}</Chip>
          ))}
          <span style={{width:8,flexShrink:0}}/>
          <Chip C={C} active={hideMeaning} onClick={()=>setHideMeaning(!hideMeaning)} small>
            {hideMeaning?"意味を隠し中":"意味を隠す"}
          </Chip>
          {hideMeaning&&hasKnown&&<Chip C={C} onClick={resetRecall} small>全部隠す</Chip>}
        </div>
      </div>

      <div style={{padding:"10px 20px 0"}}>
        {rows.length===0&&<Empty C={C} title="この条件に合う単語はありません" note="検索語や絞り込みを変えてみてください"/>}
        {rows.map(w=>{
          const st=stageOf(w);
          const c={pass:C.faint,mastered:C.ok,learning:C.accent,new:C.border}[st];
          const due=w.due?daysBetween(now,w.due):null;
          return (
            <div key={w.id} onClick={()=>onOpen(w)} role="button" tabIndex={0}
              onKeyDown={e=>{if(e.key==="Enter")onOpen(w);}}
              style={{display:"flex",gap:12,alignItems:"center",padding:"12px 0",
                borderBottom:"1px solid "+C.line,cursor:"pointer"}}>
              <div style={{width:3,alignSelf:"stretch",minHeight:38,borderRadius:4,background:isWeak(w)?C.bad:c,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div className="num" style={{fontSize:12,color:C.sub,marginBottom:3}}>No. {w.id}</div>
                <div className="en" style={{fontSize:14.5,fontWeight:700,color:C.text,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{w.word}</div>
                {(()=>{const h=hidden(w.id+":m");const bad=!h&&recall[w.id]===false;
                  const ms=w.meanings||["|"+w.meaning];const nums="①②③④⑤⑥⑦⑧⑨⑩";return (
                <div role={h?"button":undefined} aria-label={h?"意味を見る":undefined}
                  onClick={h?(e=>{e.stopPropagation();revealMeaning(w);}):undefined}
                  style={{fontSize:12,color:h?"transparent":C.sub,marginTop:3,lineHeight:1.6,
                  background:h?C.line:"transparent",
                  borderRadius:4,userSelect:h?"none":"auto",cursor:h?"pointer":"inherit"}}>
                  {ms.map((m,i)=>{const [pos,text]=m.split("|");const showPos=pos&&(i===0||ms[i-1].split("|")[0]!==pos);
                    return (
                    <div key={i} style={{display:"flex",gap:4,alignItems:"baseline"}}>
                      {pos?<span style={{fontSize:10,width:18,textAlign:"center",flexShrink:0,lineHeight:1.4,borderRadius:3,
                        border:"1px solid "+(showPos&&!h?C.border:"transparent")}}>{showPos?pos:""}</span>:null}
                      <span style={bad?{background:"rgba(239,68,68,.35)",borderRadius:2,padding:"0 2px",
                        boxDecorationBreak:"clone",WebkitBoxDecorationBreak:"clone"}:undefined}>
                        {ms.length>1?nums[i]:""}{text}</span>
                    </div>);})}
                </div>);})()}
                {hideMeaning&&shown.has(w.id+":m")&&recall[w.id]===undefined&&(
                  <div style={{display:"flex",gap:8,marginTop:6}} onClick={e=>e.stopPropagation()}>
                    {[[true,"○","覚えていた",C.ok],[false,"×","覚えていなかった",C.bad]].map(([ok,mark,label,col])=>(
                      <button key={mark} aria-label={label} onClick={()=>setRecall(w.id,ok)}
                        style={{minWidth:56,minHeight:40,borderRadius:4,cursor:"pointer",fontSize:18,fontWeight:700,
                          border:"1px solid "+col,background:"transparent",color:col}}>{mark}</button>
                    ))}
                  </div>)}
                <div style={{marginTop:5}}><RootChips C={C} word={w} size="sm"
                  isGlossHidden={i=>hidden(w.id+":g"+i)} onRevealGloss={i=>reveal(w.id+":g"+i)}/></div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                <span className="num" style={{fontSize:11,color:due!=null&&due<=0?C.warn:C.faint}}>
                  {w.manualPass?"既知":due==null?"未":due<=0?"復習どき":due+"日後"}
                </span>
                <button onClick={e=>{e.stopPropagation();onTogglePass(w.id);}}
                  aria-label={w.manualPass?"既知を解除":"既知にする"}
                  style={{minHeight:34,padding:"0 10px",borderRadius:4,cursor:"pointer",fontSize:11,
                    border:"1px solid "+(w.manualPass?C.accent:C.border),
                    background:w.manualPass?C.accentSoft:"transparent",
                    color:w.manualPass?C.accent:C.sub}}>{w.manualPass?"解除":"既知"}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN: ROOTS（語根マップ）
   ============================================================ */
function RootsScreen({C,words,onOpenRoot}){
  const [q,setQ]=useState("");
  const [kind,setKind]=useState(()=>{try{return localStorage.getItem("roots.rootsKind")||"all";}catch(e){return "all";}});
  const pickKind=k=>{setKind(k);try{localStorage.setItem("roots.rootsKind",k);}catch(e){}};
  const index=useMemo(()=>buildRootIndex(words,{withAffixes:true}),[words]);
  const counts=useMemo(()=>({all:index.length,
    prefix:index.filter(e=>e.type==="prefix").length,
    root:index.filter(e=>e.type==="root").length,
    suffix:index.filter(e=>e.type==="suffix").length}),[index]);
  const rows=useMemo(()=>index.filter(e=>{
    if(kind!=="all"&&e.type!==kind)return false;
    if(!q)return true;
    const s=q.toLowerCase();
    return e.morph.toLowerCase().includes(s)||(e.gloss||"").includes(q);
  }),[index,q,kind]);
  const TABS=[["all","使われている順",C.text],["prefix","接頭語",C.pre],["root","語根",C.root],["suffix","接尾語",C.suf]];
  return (
    <div style={{flex:1,padding:"22px 20px 100px"}} className="riseIn">
      <SectionTitle C={C} right={<span className="num" style={{fontSize:12.5,color:C.faint}}>{index.length}種</span>}>語根マップ</SectionTitle>
      <div style={{fontSize:12.5,color:C.sub,lineHeight:1.85,marginBottom:14}}>
        2語以上に共通して出てくるパーツです。<span style={{color:C.pre,fontWeight:700}}>接頭語</span>・<span style={{color:C.root,fontWeight:700}}>語根</span>・<span style={{color:C.suf,fontWeight:700}}>接尾語</span>で色分けしています。
      </div>
      <div role="tablist" style={{display:"flex",borderBottom:"1px solid "+C.line,marginBottom:14}}>
        {TABS.map(([k,l,col])=>{
          const on=kind===k;
          return (
            <button key={k} role="tab" aria-selected={on} onClick={()=>pickKind(k)}
              style={{flex:k==="all"?1.6:1,minHeight:48,background:"transparent",border:"none",cursor:"pointer",
                borderBottom:"2px solid "+(on?col:"transparent"),marginBottom:-1,padding:"0 2px",
                color:on?col:C.faint,fontSize:13,fontWeight:on?700:400,whiteSpace:"nowrap"}}>
              {l}<span className="num" style={{fontSize:11.5,marginLeft:3}}>{counts[k]}</span>
            </button>
          );
        })}
      </div>
      <div style={{position:"relative",marginBottom:16}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.faint}}><Icon.search size={18}/></span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="語根・意味で探す" aria-label="語根を検索"
          style={{width:"100%",height:46,borderRadius:4,border:"1px solid "+C.border,background:C.card,
            color:C.text,fontSize:14,padding:"0 14px 0 38px"}}/>
      </div>
      {rows.length===0&&<Empty C={C} title="該当する語根がありません" note="語数が増えると語根も増えていきます"/>}
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {rows.map(e=>{
          const col={fg:typeColor(e.type,C)};
          return (
            <button key={e.morph} onClick={()=>onOpenRoot(e)}
              style={{background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:"13px 14px",
                cursor:"pointer",display:"flex",alignItems:"center",gap:13,textAlign:"left",width:"100%"}}>
              <span style={{color:col.fg,borderLeft:"3px solid "+col.fg,padding:"2px 0 2px 10px",flexShrink:0,
                minWidth:72,display:"flex",flexDirection:"column"}}>
                <span className="en" style={{fontSize:15,fontWeight:700}}>{e.morph}</span>
                <span style={{fontSize:10.5,color:C.sub}}>{TYPE_LABEL[e.type]}</span>
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontSize:13.5,fontWeight:700,color:C.text}}>{e.gloss||"—"}</span>
                  {rootNote(e.morph)&&(
                    <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:10,fontWeight:700,
                      color:C.warn,background:C.warnSoft,borderRadius:4,padding:"2px 6px",flexShrink:0}}>
                      <Icon.book size={11}/>コラム
                    </span>
                  )}
                </div>
                <div className="en" style={{fontSize:11.5,color:C.sub,marginTop:3,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {[...e.words.map(w=>w.word),...e.related.map(r=>r.word)].slice(0,5).join(" ・ ")}
                </div>
              </div>
              <span className="num" style={{fontSize:12.5,color:C.faint,flexShrink:0}}>{e.count}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN: STATS（記録）
   ============================================================ */
function StatsScreen({C,words,stats,earned}){
  const now=Date.now();
  const hist=stats.history||{};
  /* 直近12週のヒートマップ */
  const weeks=12;
  const cells=useMemo(()=>{
    const end=startOfDay(now);
    const startDow=new Date(end).getDay();
    const first=end-((weeks-1)*7+startDow)*DAY;
    const out=[];
    for(let i=0;i<weeks*7;i++){
      const t=first+i*DAY;
      if(t>end+DAY)break;
      const k=dayKey(t);
      out.push({t,k,v:(hist[k]&&hist[k].count)||0});
    }
    return out;
  },[hist,now]);
  const maxV=Math.max(1,...cells.map(c=>c.v));

  /* これから7日間の復習予定 */
  const forecast=useMemo(()=>{
    const out=[];
    for(let d=0;d<7;d++){
      const day=addDays(now,d);
      const n=words.filter(w=>!w.manualPass&&w.due!=null&&startOfDay(w.due)===day).length;
      out.push({d,day,n});
    }
    const overdue=words.filter(w=>isDue(w,now)&&startOfDay(w.due)<startOfDay(now)).length;
    if(overdue)out[0]={...out[0],n:out[0].n+overdue};
    return out;
  },[words,now]);
  const maxF=Math.max(1,...forecast.map(f=>f.n));

  const mastered=words.filter(isMastered).length;
  const learning=words.filter(isLearning).length;
  const acc=stats.totalAnswers?Math.round(stats.totalFirstTry/stats.totalAnswers*100):null;
  const avgEf=words.filter(w=>w.reps>0);
  const ef=avgEf.length?(avgEf.reduce((s,w)=>s+w.ef,0)/avgEf.length).toFixed(2):"—";

  const card={background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:18,marginBottom:14};
  const KPI=({label,value,unit,color})=>(
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:11,color:C.faint,marginBottom:5}}>{label}</div>
      <div style={{display:"flex",alignItems:"baseline",gap:3}}>
        <span className="num" style={{fontSize:22,fontWeight:700,color:color||C.text}}>{value}</span>
        {unit&&<span style={{fontSize:11.5,color:C.faint}}>{unit}</span>}
      </div>
    </div>
  );
  const DOW=["日","月","火","水","木","金","土"];

  return (
    <div style={{flex:1,padding:"22px 20px 100px"}} className="riseIn">
      <SectionTitle C={C}>記録</SectionTitle>

      <div style={{...card,display:"flex",gap:10}}>
        <KPI label="連続日数" value={stats.streak} unit="日" color={stats.streak>0?C.warn:C.text}/>
        <KPI label="のべ学習日" value={stats.totalDays} unit="日"/>
        <KPI label="一発正解率" value={acc==null?"—":acc} unit={acc==null?"":"%"} color={C.ok}/>
      </div>

      <div style={card}>
        <div style={{fontSize:12,color:C.faint,fontWeight:700,marginBottom:14}}>学習の記録（直近12週）</div>
        <div className="scrollx" style={{paddingBottom:4}}>
          <div style={{display:"grid",gridTemplateRows:"repeat(7, 12px)",gridAutoFlow:"column",gap:3}}>
            {cells.map(c=>{
              const r=c.v/maxV;
              const bg=c.v===0?C.line:r<0.34?(C.isDark?"#1E3A2C":"#CDEBDC"):r<0.67?(C.isDark?"#2C7A57":"#7FCFAA"):C.ok;
              return <div key={c.k} title={c.k+" "+c.v+"語"} style={{width:12,height:12,borderRadius:4,background:bg}}/>;
            })}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,marginTop:12,justifyContent:"flex-end"}}>
          <span style={{fontSize:10.5,color:C.faint}}>少</span>
          {[C.line,C.isDark?"#1E3A2C":"#CDEBDC",C.isDark?"#2C7A57":"#7FCFAA",C.ok].map((b,i)=>
            <span key={i} style={{width:10,height:10,borderRadius:4,background:b}}/>)}
          <span style={{fontSize:10.5,color:C.faint}}>多</span>
        </div>
      </div>

      <div style={card}>
        <div style={{fontSize:12,color:C.faint,fontWeight:700,marginBottom:16}}>これからの復習予定</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:8,height:96}}>
          {forecast.map(f=>(
            <div key={f.d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <span className="num" style={{fontSize:11,color:f.n?C.text:C.faint,fontWeight:700}}>{f.n||""}</span>
              <div style={{width:"100%",height:Math.max(3,f.n/maxF*58),borderRadius:4,
                background:f.d===0?C.warn:C.accent,opacity:f.n?1:.18,transition:"height .3s"}}/>
              <span style={{fontSize:10,color:C.faint}}>{f.d===0?"今日":DOW[new Date(f.day).getDay()]}</span>
            </div>
