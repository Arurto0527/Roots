      <div style={{position:"relative",marginBottom:16}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:C.faint}}><Icon.search size={18}/></span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="語根・意味で探す" aria-label="語根を検索"
          style={{width:"100%",height:46,borderRadius:4,border:"1px solid "+C.border,background:C.card,
            color:C.text,fontSize:14,padding:"0 14px 0 38px"}}/>
      </div>
      {rows.length===0&&<Empty C={C} title="該当する語根がありません" note="語数が増えると語根も増えていきます"/>}
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {rows.map(e=>{
          const col={fg:typeColor(e.type,C)};
          return (
            <button key={e.morph} data-tour="roots-item" onClick={()=>onOpenRoot(e)}
              style={{background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:"13px 14px",

              <span style={{color:col.fg,borderLeft:"3px solid "+col.fg,padding:"2px 0 2px 10px",flexShrink:0,
                minWidth:72,display:"flex",flexDirection:"column"}}>
                <span className="en" style={{fontSize:15,fontWeight:700}}>{e.morph}</span>
                <span style={{fontSize:10.5,color:C.sub}}>{TYPE_LABEL[e.type]}</span>
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontSize:13.5,fontWeight:700,color:C.text}}>{e.gloss||"—"}</span>
                  {rootNote(e.morph)&&(
                    <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:10,fontWeight:700,
                      color:C.warn,background:C.warnSoft,borderRadius:4,padding:"2px 6px",flexShrink:0}}>
                      <Icon.book size={11}/>コラム
                    </span>
                  )}

                <div className="en" style={{fontSize:11.5,color:C.sub,marginTop:3,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>

              <span className="num" style={{fontSize:12.5,color:C.faint,flexShrink:0}}>{e.count}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN: STATS（記録）
   ============================================================ */
function StatsScreen({C,words,stats,earned}){
  const now=Date.now();
  const hist=stats.history||{};
  /* 直近12週のヒートマップ */
  const weeks=12;
  const cells=useMemo(()=>{
    const end=startOfDay(now);
    const startDow=new Date(end).getDay();
    const first=end-((weeks-1)*7+startDow)*DAY;
    const out=[];
    for(let i=0;i<weeks*7;i++){
      const t=first+i*DAY;
      if(t>end+DAY)break;
      const k=dayKey(t);
      out.push({t,k,v:(hist[k]&&hist[k].count)||0});
    }
    return out;
  },[hist,now]);
  const maxV=Math.max(1,...cells.map(c=>c.v));

  /* これから7日間の復習予定 */
  const forecast=useMemo(()=>{
    const out=[];
    for(let d=0;d<7;d++){
      const day=addDays(now,d);
      const n=words.filter(w=>!w.manualPass&&w.due!=null&&startOfDay(w.due)===day).length;
      out.push({d,day,n});
    }
    const overdue=words.filter(w=>isDue(w,now)&&startOfDay(w.due)<startOfDay(now)).length;
    if(overdue)out[0]={...out[0],n:out[0].n+overdue};
    return out;
  },[words,now]);
  const maxF=Math.max(1,...forecast.map(f=>f.n));

  const mastered=words.filter(isMastered).length;
  const learning=words.filter(isLearning).length;
  const acc=stats.totalAnswers?Math.round(stats.totalFirstTry/stats.totalAnswers*100):null;
  const avgEf=words.filter(w=>w.reps>0);
  const ef=avgEf.length?(avgEf.reduce((s,w)=>s+w.ef,0)/avgEf.length).toFixed(2):"—";

  const card={background:C.card,border:"1px solid "+C.border,borderRadius:4,padding:18,marginBottom:14};
  const KPI=({label,value,unit,color})=>(
    <div style={{flex:1,minWidth:0}}>

/* ============================================================
   ADMIN（管理者だけ：下のメニューの「記録」が「管理」になる）
   ・クラス … 全体の様子と、声かけが必要な人
   ・生徒   … 一人ずつの学習の様子
   ・単語   … クラス全体でまちがいが多い単語
   データは Supabase から読むだけ。RLS で管理者にだけ全員分が見える
   ============================================================ */
const ADMIN_DAYS=28;      /* 何日前までの記録を読むか */
const AWAY_DAYS=3;        /* この日数以上あいたら「声かけ」 */
const LOW_RATE=0.6;       /* 今週の正答率がこれ未満なら「声かけ」 */

/* Supabase は1回に1000件までしか返さないので、分けて全部読む */
async function sbFetchAll(make){
  const out=[];const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await make().range(from,from+step-1);
    if(error)throw error;
    out.push(...(data||[]));
    if(!data||data.length<step)return out;
  }
}

/* ID を「頭の英字」と「番号（数）」に分ける。H001 と H0001 は同じ番号とみなす */
const idParts=c=>{const x=String(c||"").toUpperCase().match(/^([A-Z]+)0*(\d+)$/);return x?{pre:x[1],num:+x[2]}:null;};
const idFormat=(pre,num)=>pre+String(num).padStart(pre==="U"?3:4,"0");
const SLOT_MAX=1000;   /* 枠を並べるのはこの数まで */

/* 検索のことば → {match: 判定する関数, slots: 並べる番号の枠 or null}
   ・カンマ（、）で区切ると複数：「H001, H003, H005」「U1-20, U35」
   ・「U20-40」「H0001-0100」「U020〜U040」は番号の範囲。英字なしの「20-40」も使える
   ・英字が決まっている番号・範囲は、使っていない番号も「未使用」の枠として並べる
   ・それ以外はIDかメールの一部 */
function idQuery(q,groupPre){
  const terms=q.toUpperCase().replace(/[〜～~ー－]/g,"-").split(/[,、，\s]+/).map(t=>t.trim()).filter(Boolean);
  if(!terms.length)return {match:()=>true,slots:null};
  const tests=[];const slots=[];let slotOk=true;
  terms.forEach(t=>{
    const m=t.match(/^([A-Z]?)(\d+)(?:-([A-Z]?)(\d+))?$/);
    if(m){
      const pre=m[1]||m[3]||groupPre||"";
      const a=+m[2],b=m[4]!=null?+m[4]:a;const lo=Math.min(a,b),hi=Math.max(a,b);
      /* 英字も範囲もない「20」だけは、番号の一部として検索する */
      if(!m[1]&&m[4]==null&&!groupPre){const s=t.toLowerCase();
        tests.push(p=>(p.student_code||"").toLowerCase().includes(s));slotOk=false;return;}
      tests.push(p=>{const x=idParts(p.student_code);return !!x&&(!pre||x.pre===pre)&&x.num>=lo&&x.num<=hi;});
      if(pre&&slots.length+(hi-lo+1)<=SLOT_MAX){for(let n=lo;n<=hi;n++)slots.push(idFormat(pre,n));}
      else slotOk=false;
      return;
    }
    const s=t.toLowerCase();slotOk=false;
    tests.push(p=>(p.student_code||"").toLowerCase().includes(s)||(p.email||"").toLowerCase().includes(s));
  });
  return {match:p=>tests.some(f=>f(p)),slots:slotOk&&slots.length?[...new Set(slots)]:null};
}

/* IDの頭の部分でグループに分ける（UNIV-01 → UNIV、S012 → S）。未設定は "" */
const idGroup=code=>{
  if(!code)return "";
  const m=code.match(/^(.+?)[-_\s.]/);
  if(m)return m[1].toUpperCase();
  const k=code.match(/^[^0-9]+/);
  return (k?k[0]:code).toUpperCase();
};

function adminBuild(profiles,progress,logs,sessions){
  const now=Date.now();const today=startOfDay(now);
  const weekFrom=today-6*DAY;
  const prog=new Map(progress.map(r=>[r.user_id,r]));
  const byId=new Map(RAW_WORDS.map(w=>[String(w.id),w]));
  const students=profiles.filter(p=>p.role!=="admin");
  const ids=new Set(students.map(s=>s.user_id));
  const dayIdx=t=>daysBetween(t,now);   /* 0=今日 */

  const per=new Map(students.map(s=>[s.user_id,{
    days:Array(14).fill(0),mins:Array(14).fill(0),week:0,weekOk:0,weekHint:0,weekSec:0,
    all:0,allOk:0,lastLog:0}]));
  const wordStat=new Map();   /* 単語ごと：{n,ok,users:Set(まちがえた人)} */
  const classDays=Array.from({length:14},()=>new Set());

  logs.forEach(l=>{
    const s=per.get(l.user_id);if(!s)return;
    const t=Date.parse(l.answered_at);const d=dayIdx(t);
    s.all++;if(l.correct)s.allOk++;
    if(t>s.lastLog)s.lastLog=t;
    if(d<14){s.days[d]++;classDays[d].add(l.user_id);}
    if(t>=weekFrom){s.week++;if(l.correct)s.weekOk++;if(l.hint_used)s.weekHint++;}
    const w=wordStat.get(l.word_id)||{n:0,ok:0,users:new Set(),tried:new Set()};
    w.n++;if(l.correct)w.ok++;else w.users.add(l.user_id);w.tried.add(l.user_id);
    wordStat.set(l.word_id,w);
  });
  sessions.forEach(x=>{
    const s=per.get(x.user_id);if(!s)return;
    const t=Date.parse(x.started_at);const d=dayIdx(t);
    if(d<14)s.mins[d]+=x.active_seconds/60;
    if(t>=weekFrom)s.weekSec+=x.active_seconds;
  });

  const rows=students.map(p=>{
    const s=per.get(p.user_id);const pr=prog.get(p.user_id);
    const ws=Array.isArray(pr&&pr.words)?pr.words:[];
    const studied=ws.filter(w=>w.reps>0||w.lapses>0||w.correctCount>0||w.incorrectCount>0);
    const weak=ws.filter(w=>(w.lapses||0)+(w.incorrectCount||0)>0).map(w=>{
      const raw=byId.get(String(w.id));
      return {id:w.id,word:(raw&&raw.word)||w.w||String(w.id),meaning:raw?raw.meaning:"",
        miss:(w.incorrectCount||0)+(w.lapses||0),ok:w.correctCount||0};
    }).sort((a,b)=>b.miss-a.miss||a.ok-b.ok);
    const lastAt=s.lastLog||(pr&&studied.length?Date.parse(pr.updated_at):0)||null;
    const away=lastAt?dayIdx(lastAt):null;
    const weekRate=s.week?s.weekOk/s.week:null;
    const reasons=[];
    if(!studied.length&&!s.all)reasons.push("まだ始めていない");
    else if(away!=null&&away>=AWAY_DAYS)reasons.push(away+"日学習していない");
    if(weekRate!=null&&s.week>=10&&weekRate<LOW_RATE)reasons.push("今週の正答率が"+Math.round(weekRate*100)+"%");
    const code=(p.student_code||"").trim();
    return {id:p.user_id,code,label:code||"ID未設定",email:p.email||"",group:idGroup(code),lastAt,away,
      studied:studied.length,mastered:ws.filter(isMastered).length,
      due:ws.filter(w=>isDue(w,now)).length,
      week:s.week,weekRate,weekMin:Math.round(s.weekSec/60),
      hintRate:s.week?s.weekHint/s.week:null,
      days:s.days,mins:s.mins,activeDays:s.days.slice(0,7).filter(n=>n>0).length,
      weak,reasons};
  });

  const hard=[...wordStat.entries()].map(([id,w])=>{
    const raw=byId.get(String(id));
    return {id,word:raw?raw.word:id,meaning:raw?raw.meaning:"",n:w.n,rate:w.ok/w.n,
      wrongUsers:[...w.users].filter(u=>ids.has(u)).length,tried:w.tried.size};
  }).filter(w=>w.n>=3&&w.rate<1).sort((a,b)=>b.wrongUsers-a.wrongUsers||a.rate-b.rate);

  const weekAns=rows.reduce((a,r)=>a+r.week,0);
  const weekOk=rows.reduce((a,r)=>a+(r.weekRate||0)*r.week,0);
  return {rows,hard,
    summary:{n:rows.length,
      today:rows.filter(r=>r.away===0).length,
      week:rows.filter(r=>r.week>0).length,
      weekAns,weekRate:weekAns?weekOk/weekAns:null,
      weekMin:rows.reduce((a,r)=>a+r.weekMin,0),
      classDays:classDays.map(s=>s.size)}};
}

  );
}

  },[raw]);
  /* 絞り込んだ人だけで、クラス・生徒・単語のすべてを計算し直す */
  const data=useMemo(()=>{

    const ps=raw.p.filter(x=>{

  const fmtLast=t=>{

    const d=daysBetween(t,Date.now());const x=new Date(t);const md=(x.getMonth()+1)+"/"+x.getDate();
    return d===0?"今日":d===1?"昨日（"+md+"）":d+"日前（"+md+"）";
  };
  const pct=r=>r==null?"—":Math.round(r*100)+"%";

  const exportCsv=()=>{
    const head=["ID","メール","最後の学習","今週の回答数","今週の正答率","今週の学習時間(分)","今週学習した日数",
      "学習した語数","習得した語数","復習待ちの語数","苦手な語数","苦手な単語(上位5)"];
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const lines=[head.map(q).join(",")].concat(data.rows.map(r=>[
      r.code,r.email,r.lastAt?new Date(r.lastAt).toLocaleDateString("ja-JP"):"",r.week,
      r.weekRate==null?"":Math.round(r.weekRate*100),r.weekMin,r.activeDays,
      r.studied,r.mastered,r.due,r.weak.length,r.weak.slice(0,5).map(w=>w.word).join(" / ")].map(q).join(",")));

      {err&&<div style={{...box,fontSize:14,lineHeight:1.7}}>読み込めませんでした：{err}<br/>通信を確認して「更新」を押してください</div>}
      {!data&&!err&&<div style={{color:C.sub,fontSize:16}}>読み込み中…</div>}

      {data&&(<>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="ID・メールで検索（例：H1-100 / U001, U003）"
          type="search" autoCapitalize="off" autoCorrect="off" spellCheck={false}

            border:"1px solid "+C.border,background:C.bg,color:C.text,boxSizing:"border-box"}}/>

            <button key={"g"+k} onClick={()=>setGroup(k)}

/* ID の形：大学生 U＋3けた、高校生 H＋4けた、それ以外 O＋4けた */
const ID_RE=/^(U\d{3}|H\d{4}|O\d{4})$/;
const ID_KIND={U:"大学生",H:"高校生",O:"その他"};

/* ID番号：先生や配った人から伝えられた番号を自分で入力する。管理画面ではこのIDで分けて見る */
function StudentIdBox({C}){
  const [val,setVal]=useState((Cloud.profile&&Cloud.profile.student_code)||"");
  const [msg,setMsg]=useState(null);
  const [busy,setBusy]=useState(false);
  const saved=(Cloud.profile&&Cloud.profile.student_code)||"";
  const changed=val.trim().toUpperCase()!==saved;
  const save=async()=>{
    const code=val.trim().toUpperCase();
    if(code&&!ID_RE.test(code)){setMsg({bad:true,text:"大学生は U＋数字3けた（例：U001）、高校生は H＋数字4けた（例：H0001）、それ以外は O＋数字4けた（例：O0001）で入力してください"});return;}
    setBusy(true);setMsg(null);
    try{
      const {data,error}=await withTimeout(sb.rpc("set_student_code",{code}),8000);
      if(error)throw error;
      if(data==="format"){setMsg({bad:true,text:"IDの形がちがいます（例：U001・H0001・O0001）"});setBusy(false);return;}
      if(data==="taken"){setMsg({bad:true,text:"このIDはほかの人が使っています。IDを確認してください"});setBusy(false);return;}
      Cloud.profile={...(Cloud.profile||{}),student_code:code||null};
      setVal(code);setMsg({text:code?"IDを保存しました":"IDを消しました"});
    }catch(e){setMsg({bad:true,text:"保存できませんでした。通信を確認してもう一度押してください"});}
    setBusy(false);
  };
  return (
    <div data-tour="settings-id" style={{marginTop:14}}>
      <div style={{fontSize:13.5,fontWeight:700,color:C.text,marginBottom:4}}>ID番号</div>
      <div style={{fontSize:12,color:C.sub,lineHeight:1.7,marginBottom:8}}>伝えられたIDを入力してください。大学生は U001、高校生は H0001、それ以外は O0001 の形です。1つのIDは1人しか使えません</div>
      <div style={{display:"flex",gap:8}}>
        <input value={val} onChange={e=>setVal(e.target.value)} placeholder="未設定" maxLength={5}
          autoCapitalize="characters" autoCorrect="off" spellCheck={false}
          style={{flex:1,minWidth:0,minHeight:56,padding:"0 14px",fontSize:16,borderRadius:4,
            border:"1px solid "+C.border,background:C.bg,color:C.text}}/>
        <button onClick={save} disabled={busy||!changed}
          style={{minHeight:56,padding:"0 18px",borderRadius:4,border:"none",fontSize:16,fontWeight:700,
            background:C.text,color:C.bg,cursor:"pointer",opacity:busy||!changed?.4:1}}>保存</button>
      </div>
      {msg&&<div style={{fontSize:12.5,color:msg.bad?C.bad:C.sub,marginTop:8}}>{msg.text}</div>}
    </div>
  );
}

  const rowBtn={...box,width:"100%",textAlign:"left",cursor:"pointer",display:"flex",

        {notice&&<div style={{fontSize:12,color:notice.bad?C.bad:C.ok,marginTop:12,lineHeight:1.7}}>{notice.text}</div>}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [screen,setScreen]=useState("loading");
  const [tour,setTour]=useState(null);   /* 吹き出し案内の何番目か（null＝出していない） */
  /* 次のステップへ。そのステップの画面（デモ以外）を開く */
  const tourNext=useCallback(()=>{
    setTour(t=>{
      if(t==null)return null;
      if(t>=TUTORIAL_STEPS.length-1){lsSet(TUTORIAL_KEY,true);return null;}
      const nx=TUTORIAL_STEPS[t+1];
      if(nx.screen!=="study")setScreen(nx.screen);
      return t+1;
    });
  },[]);
  const [words,setWords]=useState(INITIAL_WORDS);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [stats,setStats]=useState(DEFAULT_STATS);
  const [earned,setEarned]=useState([]);
  const [sysDark,setSysDark]=useState(false);
  const [sheetWord,setSheetWord]=useState(null);
  const [rootEntry,setRootEntry]=useState(null);
  const [modal,setModal]=useState(null);
  const [snack,setSnack]=useState(null);
  const [notice,setNotice]=useState(null);
  const [resumeInfo,setResumeInfo]=useState(null);
  const [canUndo,setCanUndo]=useState(false);
  const [prevScreen,setPrevScreen]=useState("settings");

  const [cfg,setCfgState]=useState(()=>({mode:"auto",rangeStart:MIN_ID,rangeEnd:Math.min(MAX_ID,MIN_ID+9),chip:null,count:null,
    order:(()=>{try{return localStorage.getItem("roots.rangeOrder")==="shuffle"?"shuffle":"seq";}catch(e){return "seq";}})()}));
  const setCfg=u=>{
    if(u.order){try{localStorage.setItem("roots.rangeOrder",u.order);}catch(e){}}
    setCfgState(p=>({...p,...u}));
  };

  /* --- セッション --- */
  const [queue,setQueue]=useState([]);
  const [log,setLog]=useState([]);
  const [sessionTotal,setSessionTotal]=useState(0);
  const [ui,setUi]=useState({key:null,phase:"ask",hint:false,timeLeft:null,timedOut:false});
  const setU=u=>setUi(p=>({...p,...u}));
  const [newBadges,setNewBadges]=useState([]);
  const [resultMsg,setResultMsg]=useState("");
  const undoRef=useRef(null);
  const tick=useRef(null);
  const hintTimer=useRef(null);

  const dark = settings.theme==="dark" || (settings.theme!=="light"&&sysDark);
  const C = dark?DARK:LIGHT;

  /* ---------- 起動時ロード（旧バージョンからの引き継ぎつき） ---------- */
  useEffect(()=>{
    let saved=lsGet(KEY.words);
    let legacy=false;
    if(!saved){ const old=lsGet(LEGACY.words); if(Array.isArray(old)){saved=old;legacy=true;} }
    if(Array.isArray(saved)){
      const find=savedLookup(saved);
      setWords(INITIAL_WORDS.map(w=>{
        const s=find(w);
        if(!s) return w;
        if(legacy){
          /* 旧データには間隔がない。正解回数から控えめに間隔を復元する */
          const cc=s.correctCount||0;
          const iv=cc>=3?10:cc===2?4:cc===1?1:0;
          return {...w,correctCount:cc,incorrectCount:s.incorrectCount||0,
            lastStudiedDate:s.lastStudiedDate??null,reps:cc,interval:iv,
            due:iv?addDays(Date.now(),1):null,
            manualPass:s.manualPass===true,manualPassDate:s.manualPassDate??null};
        }
        const {id:_id,w:_w,word:_word,...st}=s;
        return {...w,...st,part:w.part,...(w.roots?{roots:w.roots}:{})};
      }));
    }
    const st=lsGet(KEY.stats)||lsGet(LEGACY.stats);
    if(st)setStats({...DEFAULT_STATS,...st,history:st.history||{}});
    const bd=lsGet(KEY.badges)||lsGet(LEGACY.badges);
    if(Array.isArray(bd))setEarned(bd.filter(id=>BADGES.some(b=>b.id===id)));
    const se=lsGet(KEY.settings)||lsGet(LEGACY.settings);
    if(se){
      setSettings({...DEFAULT_SETTINGS,...se,formats:{...DEFAULT_SETTINGS.formats,...(se.formats||{})}});
      setScreen("home");
      /* すでに使っている人にも、まだ見ていなければ1回だけ出す */
      if(lsGet(TUTORIAL_KEY)!==true)setTour(0);
    }else setScreen("auth");

    /* 保存係（Service Worker）が新しい版を見つけたら知らせる。
       画面はいま開いているものを壊さず、押したときだけ開き直す */
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.addEventListener){
        navigator.serviceWorker.addEventListener("message",ev=>{
          if(ev&&ev.data&&ev.data.type==="update-ready")
            setSnack({text:"新しい版があります",action:"更新",onAction:()=>location.reload()});
        });
      }
    }catch(e){}

    const sv=lsGet(KEY.session);
    if(sv&&sv.layout!==WORDS_LAYOUT) lsDel(KEY.session);
    else if(sv&&Array.isArray(sv.queue)&&sv.queue.length){
      const mins=Math.round((Date.now()-(sv.at||Date.now()))/60000);
      setResumeInfo({left:sv.queue.length,ago:mins<1?"たった今":mins<60?mins+"分前":Math.round(mins/60)+"時間前",data:sv});
    }
    try{window.speechSynthesis&&window.speechSynthesis.getVoices();}catch(e){}
  },[]);

  /* ---------- テーマ ---------- */
  useEffect(()=>{
    if(!window.matchMedia)return;
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    setSysDark(mq.matches);
    const h=e=>setSysDark(e.matches);
    if(mq.addEventListener)mq.addEventListener("change",h); else if(mq.addListener)mq.addListener(h);
    return ()=>{if(mq.removeEventListener)mq.removeEventListener("change",h);else if(mq.removeListener)mq.removeListener(h);};
  },[]);
  useEffect(()=>{
    document.body.style.background=C.bg;
    document.body.style.color=C.text;
    document.body.style.fontSize=FONT_SIZES[settings.fontSize]+"px";
    const m=document.getElementById("themeColorMeta");
    if(m)m.setAttribute("content",C.bg);
    const b=document.getElementById("boot");
    if(b)b.style.display="none";
  },[C,settings.fontSize]);

  /* ---------- 保存 ---------- */
  const persist=useCallback((w,s,st,b)=>{
    const ok=lsSet(KEY.words,w.map(({id,word,ef,interval,reps,lapses,due,correctCount,incorrectCount,
      lastStudiedDate,lastGradedDay,manualPass,manualPassDate})=>
      ({id,w:word,ef,interval,reps,lapses,due,correctCount,incorrectCount,lastStudiedDate,lastGradedDay,manualPass,manualPassDate})));
    lsSet(KEY.settings,s);lsSet(KEY.stats,st);lsSet(KEY.badges,b);
    Cloud.markDirty();
    if(!ok)setNotice({bad:true,text:"保存に失敗しました。ブラウザの空き容量を確認してください。"});
  },[]);

  /* ---------- 出題プール ---------- */
  const pool=useMemo(()=>buildPool(words,cfg,settings,Date.now()),[words,cfg,settings]);

  /* ---------- 出題の準備 ---------- */
  const prepareItem=useCallback((qi,ws)=>{
    const w=ws.find(x=>x.id===qi.id);
    if(!w)return null;
    let format=qi.format,cloze=null;
    if(format==="s_ja_en"){
      cloze=clozeOf(w);
      if(!cloze)format="w_ja_en";
    }
    if(format==="s_en_ja"&&!w.example)format="w_en_ja";
    return {word:w,format,cloze,firstTry:qi.firstTry,lapse:qi.lapse,seen:qi.seen};
  },[]);

  const item=useMemo(()=>{
    if(!queue.length)return null;
    return prepareItem(queue[0],words);
  },[queue,words,prepareItem]);

  /* 新しい問題に移るたびに出題面の状態をリセットする */
  const resetForItem=useCallback((it,key)=>{
    if(!it)return;
    setU({key,phase:"ask",hint:false,timedOut:false,
      timeLeft:settings.timerEnabled?settings.timerSeconds:null});
  },[settings.timerEnabled,settings.timerSeconds]);

  const itemKey=item?item.word.id+"-"+item.seen:null;
  /* 出題が切り替わった直後の1フレームだけ ui が前の問題のままになるので、鍵が合うまでは初期状態を使う */
  const uiSafe=useMemo(()=>ui.key===itemKey?ui:({key:itemKey,phase:"ask",hint:false,timedOut:false,
    timeLeft:settings.timerEnabled?settings.timerSeconds:null}),
    [ui,itemKey,settings.timerEnabled,settings.timerSeconds]);
  useEffect(()=>{
    if(screen!=="study"||!item)return;
    resetForItem(item,itemKey);
    if(settings.autoSpeak&&item.format==="w_en_ja")speak(item.word.word,{enabled:true});
    if(settings.autoSpeak&&item.format==="s_en_ja")speak(item.word.example,{enabled:true});
  },[itemKey,screen]);

  /* ---------- 制限時間 ---------- */
  useEffect(()=>{
    clearInterval(tick.current);
    if(screen!=="study"||uiSafe.phase!=="ask"||!settings.timerEnabled||!item)return;
    tick.current=setInterval(()=>{
      setUi(p=>{
        if(p.phase!=="ask")return p;
        const t=(p.timeLeft==null?settings.timerSeconds:p.timeLeft)-1;
        if(t<=0){
          return {...p,timeLeft:0,phase:"reveal",timedOut:true};
        }
        return {...p,timeLeft:t};
      });
    },1000);
    return ()=>clearInterval(tick.current);
  },[screen,uiSafe.phase,settings.timerEnabled,settings.timerSeconds,itemKey]);
  /* 時間切れで答えが出たときも読み上げる */
  useEffect(()=>{
    if(screen==="study"&&item&&uiSafe.phase==="reveal"&&uiSafe.timedOut) speakReveal(item.word,settings);
  },[uiSafe.timedOut,itemKey]);

  /* ---------- キーボード操作 ---------- */
  useEffect(()=>{
    if(screen!=="study"||!item)return;
    const h=e=>{
      if(e.target&&/input|textarea/i.test(e.target.tagName))return;
      if(uiSafe.phase==="ask"){
        if(e.key===" "||e.key==="Enter"){e.preventDefault();doFlip();}
        if(e.key==="h")doHint();
      }else{
        if(e.key==="1")doGrade(0);
        else if(e.key==="2"||e.key===" "||e.key==="Enter"){e.preventDefault();doGrade(2);}
      }
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  });

  /* ---------- 出題面の操作 ---------- */
  const doFlip=useCallback(()=>{
    if(!item||uiSafe.phase!=="ask")return;
    clearInterval(tick.current);
    setU({phase:"reveal",timeLeft:null});
    speakReveal(item.word,settings);
  },[item,uiSafe.phase,settings]);

  const doHint=useCallback(()=>{
    if(!item||uiSafe.hint)return;
    setU({hint:true});
    setStats(s=>({...s,rootsSeen:(s.rootsSeen||0)+parseRoots(item.word).length}));
  },[item,uiSafe.hint,uiSafe.phase]);

  /* ---------- 採点して次へ ---------- */
  const doGrade=useCallback(grade=>{
    if(!item)return;
    clearInterval(tick.current);clearTimeout(hintTimer.current);
    const now=Date.now();
    undoRef.current={words,queue,log,stats};
    SFX[grade>=2?"correct":"wrong"](settings.soundEnabled!==false);
    haptic(grade>=2?10:[8,36,8]);
    const nw=words.map(w=>w.id===item.word.id?applyGrade(w,grade,now):w);
    const entry={id:item.word.id,format:item.format,firstTry:queue[0].firstTry,grade,at:now};
    Cloud.log({...entry,hint:uiSafe.hint});
    const nl=[...log,entry];
    const rest=queue.slice(1);
    const nq=grade===0?reinsert(rest,queue[0]):rest;
    setWords(nw);setLog(nl);setQueue(nq);
    saveSession(nq,nl,now);
    setCanUndo(true);
    if(!nq.length)finish(nw,nl,now);
  },[item,words,queue,log,stats,settings.soundEnabled,uiSafe.hint]);

  const doUndo=useCallback(()=>{
    const s=undoRef.current;
    if(!s)return;
    setWords(s.words);setQueue(s.queue);setLog(s.log);setStats(s.stats);
    Cloud.unlog();
    undoRef.current=null;setCanUndo(false);setSnack(null);
    if(screen==="result")setScreen("study");
  },[screen]);

  const saveSession=useCallback((q,l,at)=>{
    if(!q.length){lsDel(KEY.session);return;}
    lsSet(KEY.session,{queue:q,log:l,at:at||Date.now(),total:sessionTotal,layout:WORDS_LAYOUT});
  },[sessionTotal]);

  /* ---------- セッション終了 ---------- */
  const finish=useCallback((finalWords,finalLog,now)=>{
    lsDel(KEY.session);
    setTimeout(()=>Cloud.flush(),2500);
    const today=todayKey();
    const mastered=finalWords.filter(isMastered).length;
    const overcome=finalWords.filter(w=>w.incorrectCount>0&&w.correctCount>=w.incorrectCount).length;
    const first=finalLog.filter(x=>x.firstTry&&x.grade>=2).length;
    let st={...stats,masteredCount:mastered,overcomeCount:overcome,
      totalAnswers:(stats.totalAnswers||0)+finalLog.length,
      totalFirstTry:(stats.totalFirstTry||0)+first};
    const hist={...(st.history||{})};
    const prev=hist[today]||{count:0,correct:0};
    hist[today]={count:prev.count+finalLog.length,correct:prev.correct+first};
    st.history=hist;
    if(st.lastStudyDate!==today){
      const y=dayKey(Date.now()-DAY);
      st={...st,streak:st.lastStudyDate===y?st.streak+1:1,totalDays:st.totalDays+1,lastStudyDate:today};
    }
    const fresh=BADGES.filter(b=>!earned.includes(b.id)&&b.cond(st)).map(b=>b.id);
    const all=[...earned,...fresh];
    setWords(finalWords);setStats(st);setEarned(all);setNewBadges(fresh);
    setResultMsg(getMessage(finalLog.length?first/finalLog.length:0));
    persist(finalWords,settings,st,all);
    stopSpeak();clearInterval(tick.current);
    SFX.fanfare(settings.soundEnabled!==false);
    setSnack(null);
    setScreen("result");
  },[stats,earned,settings,persist]);

  /* ---------- 開始・中断・復帰 ---------- */
  const startSession=useCallback((customPool)=>{
    const p=customPool||pool;
    if(!p||!p.length){
      setModal({title:"出せる語がありません",
        body:"この条件に当てはまる語がありません。範囲を広げるか、モードを「おまかせ」に戻してください。",
        actions:[{label:"閉じる",onClick:()=>setModal(null)}]});
      return;
    }
    const q=makeQueue(p,settings);
    setQueue(q);setLog([]);setSessionTotal(q.length);setNewBadges([]);
    undoRef.current=null;setCanUndo(false);setSnack(null);
    saveSession(q,[],Date.now());
    setScreen("study");
  },[pool,settings,saveSession]);

  const replayWrong=useCallback(()=>{
    const ids=[...new Set(log.filter(x=>x.grade===0).map(x=>x.id))];
    const p=words.filter(w=>ids.includes(w.id));
    if(p.length)startSession(p);
  },[log,words,startSession]);

  const exitSession=useCallback(()=>{
    setModal({title:"学習を中断しますか",
      body:"ここまでの記録は保存されます。ホームから「続きから」で再開できます。",
      actions:[
        {label:"中断してホームへ",variant:"primary",onClick:()=>{
          clearInterval(tick.current);clearTimeout(hintTimer.current);stopSpeak();
          const st={...stats,masteredCount:words.filter(isMastered).length};
          setStats(st);persist(words,settings,st,earned);
          if(queue.length){
            saveSession(queue,log,Date.now());
            setResumeInfo({left:queue.length,ago:"たった今",data:{queue,log,at:Date.now()}});
          }
          setQueue([]);setLog([]);setModal(null);setSnack(null);setScreen("home");
        }},
        {label:"学習を続ける",onClick:()=>setModal(null)},
      ]});
  },[words,stats,settings,earned,persist,queue,log,saveSession]);

  const doResume=useCallback(()=>{
    const d=resumeInfo&&resumeInfo.data;
    if(!d)return;
    setQueue(d.queue);setLog(d.log||[]);setSessionTotal(d.total||d.queue.length+(d.log||[]).length);
    setResumeInfo(null);setNewBadges([]);undoRef.current=null;
    setScreen("study");
  },[resumeInfo]);
  const discardResume=useCallback(()=>{lsDel(KEY.session);setResumeInfo(null);},[]);

  /* ---------- 単語操作 ---------- */
  const toggleManualPass=useCallback(id=>{
    const now=Date.now();
    const nw=words.map(w=>w.id!==id?w:{...w,manualPass:!w.manualPass,manualPassDate:!w.manualPass?now:null});
    const st={...stats,masteredCount:nw.filter(isMastered).length};
    setWords(nw);setStats(st);persist(nw,settings,st,earned);
    const w=nw.find(x=>x.id===id);
    setSnack({text:"「"+w.word+"」を"+(w.manualPass?"既知にしました":"出題に戻しました"),action:null});
    if(sheetWord&&sheetWord.id===id)setSheetWord(w);
  },[words,stats,settings,earned,persist,sheetWord]);

  const changeSettings=useCallback(u=>{
    setSettings(p=>{
      const s={...p,...u};
      persist(words,s,stats,earned);
      return s;
    });
  },[words,stats,earned,persist]);

  const resetAll=useCallback(()=>{
    setModal({title:"学習データを削除しますか",
      body:"正解回数・復習の間隔・バッジ・連続日数がすべて消えます。この操作は取り消せません。先に「書き出す」でバックアップを取ることをおすすめします。",
      actions:[
        {label:"すべて削除する",variant:"danger",onClick:()=>{
          Object.values(KEY).forEach(lsDel);Object.values(LEGACY).forEach(lsDel);
          Cloud.markDirty();
          setWords(INITIAL_WORDS);setSettings(DEFAULT_SETTINGS);setStats(DEFAULT_STATS);setEarned([]);
          setQueue([]);setLog([]);setResumeInfo(null);setModal(null);setScreen("onboarding");
        }},
        {label:"やめる",onClick:()=>setModal(null)},
      ]});
  },[]);

  const finishOnboarding=useCallback(v=>{
    const s={...DEFAULT_SETTINGS,...v};
    setSettings(s);persist(words,s,stats,earned);
    if(s.reminderEnabled)requestNotify();
    setScreen("home");
    if(lsGet(TUTORIAL_KEY)!==true)setTour(0);
  },[words,stats,earned,persist]);

  /* ---------- 書き出し・読み込み ---------- */
  const doExport=useCallback(async()=>{
    const payload={app:"Roots",version:2,exportedAt:new Date().toISOString(),
      settings,stats,earned,
      words:words.map(({id,word,ef,interval,reps,lapses,due,correctCount,incorrectCount,
        lastStudiedDate,lastGradedDay,manualPass,manualPassDate})=>
        ({id,word,ef,interval,reps,lapses,due,correctCount,incorrectCount,lastStudiedDate,lastGradedDay,manualPass,manualPassDate}))};
    const text=JSON.stringify(payload,null,2);
    const filename="roots-backup-"+todayKey()+".json";
    /* 公開版（claude.ai のページ）ではビューア越しに保存する。
       ページが自前で起こすダウンロードは通らないため。単体ファイルで開いたときは下の通常処理。 */
    if(window.claude&&typeof window.claude.use==="function"){
      try{
        const dl=await window.claude.use("downloads");
        if(dl){
          await dl.save({filename,data:text});
          setNotice({text:"書き出しました。"});
          return;
        }
      }catch(e){
        const code=e&&e.code;
        setNotice({bad:code!=="declined",
          text:code==="declined"?"保存を取りやめました。"
            :code==="rate_limited"?"少し待ってから、もう一度お試しください。"
            :"書き出しに失敗しました。"});
        return;
      }
    }
    try{
      const blob=new Blob([text],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download=filename;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      setNotice({text:"書き出しました。ダウンロードフォルダを確認してください。"});
    }catch(e){
      try{navigator.clipboard.writeText(text);setNotice({text:"ダウンロードできない環境のため、クリップボードにコピーしました。"});}
      catch(e2){setNotice({bad:true,text:"書き出しに失敗しました。"});}
    }
  },[settings,stats,earned,words]);

  const doImport=useCallback(file=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(String(r.result));
        if(!d||!Array.isArray(d.words))throw new Error("形式が違います");
        setModal({title:"データを読み込みますか",
          body:"いまの学習データは上書きされます。書き出し日時："+(d.exportedAt?new Date(d.exportedAt).toLocaleString("ja-JP"):"不明"),
          actions:[
            {label:"読み込む",variant:"primary",onClick:()=>{
              const find=savedLookup(d.words);
              const nw=INITIAL_WORDS.map(w=>{
                const s=find(w);
                return s?{...w,ef:s.ef??2.5,interval:s.interval??0,reps:s.reps??0,lapses:s.lapses??0,
                  due:s.due??null,correctCount:s.correctCount??0,incorrectCount:s.incorrectCount??0,
                  lastStudiedDate:s.lastStudiedDate??null,lastGradedDay:s.lastGradedDay??null,
                  manualPass:s.manualPass===true,manualPassDate:s.manualPassDate??null}:w;
              });
              const ns=d.settings?{...DEFAULT_SETTINGS,...d.settings,
                formats:{...DEFAULT_SETTINGS.formats,...(d.settings.formats||{})}}:settings;
              const nst=d.stats?{...DEFAULT_STATS,...d.stats,history:d.stats.history||{}}:stats;
              const nb=Array.isArray(d.earned)?d.earned.filter(id=>BADGES.some(b=>b.id===id)):earned;
              setWords(nw);setSettings(ns);setStats(nst);setEarned(nb);
              persist(nw,ns,nst,nb);
              setModal(null);setNotice({text:"読み込みました。"});
            }},
            {label:"やめる",onClick:()=>setModal(null)},
          ]});
      }catch(e){setNotice({bad:true,text:"読み込めませんでした。Roots で書き出した JSON ファイルを選んでください。"});}
    };
    r.readAsText(file);
  },[settings,stats,earned,persist]);

  /* ---------- リマインド ---------- */
  const requestNotify=useCallback(()=>{
    try{
      if(!("Notification" in window))return;
      if(Notification.permission==="default")Notification.requestPermission();
    }catch(e){}
  },[]);
  useEffect(()=>{
    if(!settings.reminderEnabled)return;
    requestNotify();
    let lastFired=null;
    const id=setInterval(()=>{
      try{
        const d=new Date();
        const hhmm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
        if(hhmm!==(settings.reminderTime||"21:00"))return;
        const k=todayKey();
        if(lastFired===k)return;
        lastFired=k;
        const due=words.filter(w=>isDue(w,Date.now())).length;
        if("Notification" in window&&Notification.permission==="granted"){
          new Notification("Roots — 今日の復習",{body:due?"復習どきの語が "+due+" 語あります。":"今日の学習をしましょう！"});
        }
      }catch(e){}
    },20000);
    return ()=>clearInterval(id);
  },[settings.reminderEnabled,settings.reminderTime,words,requestNotify]);

  /* 離脱時に取りこぼさないよう保存する */
  useEffect(()=>{
    const h=()=>{if(queue.length)saveSession(queue,log,Date.now());};
    window.addEventListener("beforeunload",h);
    document.addEventListener("visibilitychange",h);
    return ()=>{window.removeEventListener("beforeunload",h);document.removeEventListener("visibilitychange",h);};
  },[queue,log,saveSession]);

  /* クラウドへ学習ログ・使った時間を送る */
  useEffect(()=>{
    if(document.visibilityState==="visible")Cloud.startVisible();
    const vis=()=>{
      if(document.visibilityState==="visible")Cloud.startVisible();
      else{Cloud.stopVisible();Cloud.flush();}
    };
    const online=()=>Cloud.flush();
    const hide=()=>{Cloud.stopVisible();Cloud.flush();};
    window.addEventListener("pagehide",hide);
    document.addEventListener("visibilitychange",vis);
    window.addEventListener("online",online);
    const id=setInterval(()=>Cloud.flush(),20000);
    return ()=>{document.removeEventListener("visibilitychange",vis);window.removeEventListener("online",online);window.removeEventListener("pagehide",hide);clearInterval(id);};
  },[]);

  /* ---------- レンダリング ---------- */
  const shell={width:"100%",maxWidth:430,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column",
    paddingTop:"env(safe-area-inset-top)",paddingLeft:"env(safe-area-inset-left)",paddingRight:"env(safe-area-inset-right)",
    background:C.bg,color:C.text,fontSize:FONT_SIZES[settings.fontSize]+"px",position:"relative"};
  const withNav=["home","list","roots","stats","settings","admin"].includes(screen);
  const nav=id=>{setPrevScreen(screen);setScreen(id);};
  const openRootFromChip=r=>{
    const key=canonRoot(r.morph);
    const idx=buildRootIndex(words,{withAffixes:true});
    const e=idx.find(x=>canonRoot(x.morph)===key);
    /* 索引に無い語根（1語しか持たない語根）でも、コラムがあれば開けるようにする */
    if(e)setRootEntry(e);
    else setRootEntry({morph:key,gloss:r.gloss||"",words:words.filter(w=>
      parseRoots(w).some(x=>canonRoot(x.morph)===key)),related:[],count:1});
  };

  if(screen==="loading")return <div style={shell}/>;

  return (
    <div style={shell}>
      {screen==="auth"&&<AuthScreen C={C} onStart={()=>setScreen("onboarding")}/>}
      {screen==="onboarding"&&<OnboardingScreen C={C} onDone={finishOnboarding}/>}

      {screen==="home"&&(
        <HomeScreen C={C} settings={settings} stats={stats} words={words}
          cfg={cfg} setCfg={setCfg} pool={pool} onStart={()=>startSession()} onNav={nav}
          resumeInfo={resumeInfo} onResume={doResume} onDiscardResume={discardResume}/>
      )}

      {screen==="study"&&item&&(
        <StudyScreen C={C} item={item} ui={uiSafe} settings={settings}
          progress={{done:log.filter(x=>x.grade>0).length,total:sessionTotal}}
          handlers={{onFlip:doFlip,onHint:doHint,onHideHint:()=>setU({hint:false}),onGrade:doGrade,onExit:exitSession,
            onTapRoot:openRootFromChip,canUndo:canUndo,onUndo:doUndo}}/>
      )}

      {screen==="result"&&(
        <ResultScreen C={C} log={log} newBadges={newBadges} stats={stats} earned={earned}
          message={resultMsg} words={words} onReplay={()=>startSession()}
          onHome={()=>{setQueue([]);setLog([]);setScreen("home");}}
          onReviewWrong={replayWrong} onOpenWord={setSheetWord}/>
      )}

      {screen==="list"&&(
        <ListScreen C={C} words={words} settings={settings} onTogglePass={toggleManualPass} onOpen={setSheetWord}/>
      )}
      {screen==="roots"&&<RootsScreen C={C} words={words} onOpenRoot={setRootEntry}/>}
      {screen==="stats"&&<StatsScreen C={C} words={words} stats={stats} earned={earned}/>}
      {screen==="settings"&&(
        <SettingsScreen C={C} settings={settings} stats={stats} words={words} earned={earned}
          onChange={changeSettings} onReset={resetAll} onTutorial={()=>nav("tutorial")}
          onReplayTour={()=>{lsSet(TUTORIAL_KEY,false);setScreen("home");window.scrollTo(0,0);setTour(0);}}
          onExport={doExport} onImport={doImport} notice={notice}/>
      )}
      {screen==="admin"&&<AdminScreen C={C}/>}
      {screen==="tutorial"&&<TutorialScreen C={C} onBack={()=>setScreen(prevScreen==="tutorial"?"settings":prevScreen)}/>}

      {withNav&&<BottomNav C={C} screen={screen} onNav={nav}/>}

      {tour!=null&&(
        <TutorialOverlay C={C} steps={TUTORIAL_STEPS} index={Math.min(tour,TUTORIAL_STEPS.length-1)}
          onNext={tourNext}
          onSkip={()=>{lsSet(TUTORIAL_KEY,true);setTour(null);}}>
          {TUTORIAL_STEPS[tour]&&TUTORIAL_STEPS[tour].screen==="study"&&
            <TutorialDemoStudy C={C} settings={settings} face={TUTORIAL_STEPS[tour].face}/>}
        </TutorialOverlay>
      )}

      {sheetWord&&(
        <WordSheet C={C} word={words.find(w=>w.id===sheetWord.id)||sheetWord} onClose={()=>setSheetWord(null)}
          onTogglePass={toggleManualPass} onTapRoot={openRootFromChip}/>
      )}
      {rootEntry&&(
        <RootSheet C={C} entry={rootEntry} onClose={()=>setRootEntry(null)}
          onOpenWord={w=>{setRootEntry(null);setSheetWord(w);}}/>
      )}
      {modal&&<Modal C={C} title={modal.title} body={modal.body} actions={modal.actions} onClose={()=>setModal(null)}/>}
      {snack&&(
        <Snackbar C={C} text={snack.text} actionLabel={snack.action}
          onAction={snack.onAction||doUndo} onClose={()=>setSnack(null)}
          place={screen==="study"?"top":"bottom"} bottom={withNav?76:16}/>
      )}
    </div>
  );
}

/* ============================================================
   LOGIN（メールに届く6桁のコードでログイン）
   ============================================================ */
function LoginScreen({C,onSignedIn}){
  const [step,setStep]=useState("email");
  const [email,setEmail]=useState("");
  const [code,setCode]=useState("");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);
  const inputStyle={width:"100%",height:52,borderRadius:4,border:"1px solid "+C.border,background:C.card,
    color:C.text,fontSize:16,padding:"0 16px"};
  const addr=email.trim().toLowerCase();

  const sendCode=async()=>{
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)){setMsg({bad:true,text:"メールアドレスを正しく入力してください。"});return;}
    setBusy(true);setMsg(null);
    const {error}=await sb.auth.signInWithOtp({email:addr,options:{shouldCreateUser:true}});
    setBusy(false);
    if(error){
      const t=String(error.message||"");
      setMsg({bad:true,text:/database error|saving new user|名簿/i.test(t)
        ?"ログインできませんでした。時間をおいてもう一度試してください。"
        :/rate|seconds|too many/i.test(t)
        ?"少し時間をおいてから、もう一度送ってください。"
        :"コードを送れませんでした。インターネットの接続を確認してください。"});
      return;
    }
    setStep("code");setMsg({text:addr+" にコードを送りました。"});
  };
  const verify=async()=>{
    const token=code.replace(/\D/g,"");
    if(token.length<6){setMsg({bad:true,text:"メールに書かれた数字をすべて入力してください。"});return;}
    setBusy(true);setMsg(null);
    const {data,error}=await sb.auth.verifyOtp({email:addr,token,type:"email"});
    if(error||!data.session){
      setBusy(false);
      setMsg({bad:true,text:"コードがちがうか、期限が切れています。もう一度ためしてください。"});
      return;
    }
    await onSignedIn(data.session.user);
  };

  return (
    <div className="riseIn" style={{flex:1,display:"flex",flexDirection:"column",padding:"0 20px 40px",
      justifyContent:"center",alignItems:"center",minHeight:"100vh"}}>
      <div style={{color:C.accent,marginBottom:20}}><Icon.root size={44}/></div>
      <div className="en" style={{fontSize:38,fontWeight:700,color:C.text,letterSpacing:"-0.03em"}}>Roots</div>
      <div style={{fontSize:14,color:C.sub,marginTop:12,textAlign:"center",lineHeight:1.9}}>
        {step==="email"?"登録したメールアドレスでログインしてください。":"メールに届いた数字を入力してください。"}
      </div>
      <div style={{height:32}}/>
      <div style={{width:"100%",maxWidth:340}}>
        {step==="email"?(<>
          <input type="email" inputMode="email" autoComplete="email" value={email} placeholder="メールアドレス"
            aria-label="メールアドレス" onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!busy)sendCode();}} style={inputStyle}/>
          <Btn C={C} style={{marginTop:12}} disabled={busy} onClick={sendCode}>{busy?"送信中…":"コードを送る"}</Btn>
        </>):(<>
          <input type="text" inputMode="numeric" autoComplete="one-time-code" value={code} placeholder="123456"
            aria-label="確認コード" maxLength={10} onChange={e=>setCode(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!busy)verify();}}
            style={{...inputStyle,fontSize:24,letterSpacing:"0.3em",textAlign:"center"}}/>
          <Btn C={C} style={{marginTop:12}} disabled={busy} onClick={verify}>{busy?"確認中…":"ログイン"}</Btn>
          <Btn C={C} variant="quiet" style={{marginTop:4}} disabled={busy}
            onClick={()=>{setStep("email");setCode("");setMsg(null);}}>メールアドレスを入れ直す</Btn>
        </>)}
        {msg&&<div style={{fontSize:13,color:msg.bad?C.bad:C.sub,marginTop:14,lineHeight:1.8,textAlign:"center"}}>{msg.text}</div>}
        <p style={{fontSize:11.5,color:C.faint,textAlign:"center",marginTop:16,lineHeight:1.8}}>
          メールが届かないときは、迷惑メールのフォルダも見てください。
        </p>
      </div>
    </div>
  );
}

/* ログインしているか確かめてから App を出す */
function Gate(){
  const [state,setState]=useState("loading");
  const [uid,setUid]=useState(null);
  const theme=(lsGet(KEY.settings)||{}).theme;
  const sysDark=!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  const C=(theme==="dark"||(theme!=="light"&&sysDark))?DARK:LIGHT;

  const enter=async user=>{
    await Cloud.pull(user);
    setUid(user.id);setState("app");
  };
  useEffect(()=>{
    if(!sb){
      window.__ROOTS_BOOT_ERROR__("ログインの部品を読み込めませんでした。インターネットに接続して開き直してください。");
      return;
    }
    sb.auth.getSession().then(({data})=>{
      const s=data&&data.session;
      if(s)enter(s.user); else setState("login");
    }).catch(()=>setState("login"));
  },[]);
  useEffect(()=>{
    document.body.style.background=C.bg;
    if(state!=="loading"){const b=document.getElementById("boot");if(b)b.style.display="none";}
  },[state]);

  if(state==="app")return <App key={uid}/>;
  if(state==="login")return (
    <div style={{width:"100%",maxWidth:430,margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column",
      background:C.bg,color:C.text}}>
      <LoginScreen C={C} onSignedIn={enter}/>
    </div>
  );
  return <div/>;
}

const rootEl=document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<Gate/>);
const bootEl=document.getElementById("boot");
if(bootEl)bootEl.style.display="none";
</script>
<script>
  /* 一度聞いた音声やアプリ本体をスマホに保存しておく係（Service Worker）を呼ぶ */
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
  }
</script>
